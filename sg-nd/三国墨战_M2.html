<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241d17">
<title>三国墨战 · 中原篇</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--paper:#efe4cb;--paper2:#e4d6b6;--paper3:#f6eedc;--ink:#2a2622;--ink2:#5a4e40;--seal:#a8321f;--gold:#c9a24a;--green:#3f6e4a;--desk:#1f1914;
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
button{font-family:var(--serif);font-size:14px;color:var(--ink);background:var(--paper3);border:1px solid var(--ink2);border-radius:6px;padding:7px 12px;cursor:pointer;line-height:1.2}
button:hover:not(:disabled){background:#fff8e8}button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.red{background:var(--seal);color:#f6eedc;border-color:#6a1a10}button.red:hover:not(:disabled){background:#bb3a24}
button.ink{background:var(--ink);color:#efe4cb;border-color:#000}
button.sm{padding:4px 8px;font-size:12.5px}
.screen{display:none;position:fixed;inset:0}
.seal{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--seal);color:#f6eedc;font-weight:700;border-radius:3px;font-size:18px;flex:none}
/* 标题 */
#title{overflow:auto;background:radial-gradient(ellipse at 50% 30%,#efe4cb 0%,#d9c9a4 70%,#b8a47c 100%)}
#title .wrap{max-width:1080px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;align-items:center}
#title h1{font-size:64px;letter-spacing:14px;margin:8px 0 0;font-weight:900;color:var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.08)}
#title .sub{letter-spacing:4px;color:var(--ink2);margin:6px 0 4px}
#title .stamp{display:inline-block;background:var(--seal);color:#f6eedc;padding:4px 10px;font-weight:700;letter-spacing:3px;border-radius:3px;margin:10px 0 18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;width:100%}
.fcard{background:rgba(246,238,220,.9);border:1px solid var(--ink2);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative}
.fcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.18);background:#fffaf0}
.fcard .top{display:flex;gap:10px;align-items:center}.fcard img{width:56px;height:70px;border-radius:4px}
.fcard h3{margin:0;font-size:20px}.fcard p{margin:0;font-size:13px;line-height:1.55;color:var(--ink2)}
.fcard .stats{font-size:12.5px;color:var(--ink)}.stars{color:var(--seal);letter-spacing:1px}
.tbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
/* 游戏 */
#game{display:none;flex-direction:column}
#top{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:#241d17;color:#efe4cb;border-bottom:2px solid #000;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:5}
#top .tinfo{display:flex;flex-direction:column;line-height:1.15}#top .tinfo b{font-size:15px}#top .tinfo span{font-size:12px;color:#cdbf9f}
#top .res{display:flex;gap:12px;font-size:13.5px;white-space:nowrap}#endBtn{white-space:nowrap}#top .res b{color:#f3d27a;font-weight:700}#top .res i{font-style:normal;font-size:11.5px;margin-left:2px}
.pos{color:#8fd08f}.neg{color:#ff8f7a}
#top .spacer{flex:1}#top nav{display:flex;gap:6px}#top nav button,#menuBtn{background:#3a3027;color:#efe4cb;border-color:#5a4a3a}
#menuBtn{display:none}
#main{flex:1;display:flex;min-height:0;position:relative}
#mapbox{flex:1;position:relative;min-width:0;overflow:hidden}
#map{display:block;touch-action:none;cursor:grab}
#zoomCtl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}#zoomCtl button{width:38px;height:38px;padding:0;font-size:18px;background:rgba(246,238,220,.92)}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4}
#toast div{background:rgba(42,38,34,.9);color:#f6eedc;padding:7px 14px;border-radius:6px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#busy{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(168,50,31,.95);color:#f6eedc;padding:8px 18px;border-radius:20px;font-size:14px;display:none;z-index:40;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#side{width:360px;flex:none;background:var(--paper);border-left:2px solid #000;display:flex;flex-direction:column;min-height:0;box-shadow:-3px 0 10px rgba(0,0,0,.25)}
#sideHandle{display:none}
#sideBody{flex:1;overflow:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ph h3{margin:0;font-size:19px}.ph small{color:var(--ink2);font-size:12.5px}.ph .x{margin-left:auto;padding:3px 9px}
.sec{margin:12px 0 6px;font-weight:700;font-size:14px;border-bottom:1px solid rgba(90,78,64,.35);padding-bottom:3px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-weight:400;color:var(--ink2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:13.5px}.kv b{font-weight:700}
.bar{height:7px;background:rgba(90,78,64,.2);border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper2);border:1px solid rgba(90,78,64,.4);border-radius:12px;padding:3px 8px;font-size:12.5px}
.chip .u{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;background:var(--ink);color:#efe4cb;border-radius:3px;font-size:11px;font-weight:700}
.gchip{display:inline-flex;align-items:center;gap:6px;background:var(--paper3);border:1px solid rgba(90,78,64,.45);border-radius:6px;padding:3px 7px 3px 3px;font-size:13px;cursor:pointer}
.gchip img{width:26px;height:32px;border-radius:3px}.gchip small{color:var(--ink2);font-size:11px}
.gchip:hover{background:#fff8e8}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.acts button{padding:8px 4px}
.seg{display:inline-flex;border:1px solid var(--ink2);border-radius:6px;overflow:hidden}.seg button{border:none;border-radius:0;padding:5px 12px;background:var(--paper3)}.seg button.on{background:var(--ink);color:#efe4cb}
.blds{display:flex;flex-wrap:wrap;gap:5px}.blds span{font-size:12px;background:var(--paper2);padding:2px 7px;border-radius:4px}
.log{font-size:12.5px;line-height:1.6;color:var(--ink2)}.log div{border-bottom:1px dotted rgba(90,78,64,.25);padding:2px 0}.log b{color:var(--ink);font-weight:400}
.todo{font-size:13px;line-height:1.7}.todo a{color:var(--seal);cursor:pointer;text-decoration:underline}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}
.armyrow{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid rgba(90,78,64,.3);border-radius:6px;margin-bottom:5px;cursor:pointer;background:var(--paper3)}
.armyrow:hover{background:#fff8e8}
.hint{font-size:12.5px;color:var(--ink2);background:rgba(168,50,31,.07);border-left:3px solid var(--seal);padding:6px 8px;margin-top:8px;line-height:1.5}
/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(10,8,6,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.mbox{background:var(--paper);width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative}
.mbox:before,.mbox:after{content:'';position:absolute;left:-8px;right:-8px;height:12px;background:linear-gradient(#6a4428,#3a2414);border-radius:6px}.mbox:before{top:-8px}.mbox:after{bottom:-8px}
.mbox .mh{padding:16px 18px 6px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
.mbox .mc{padding:4px 18px 10px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
.mbox .mf{padding:10px 18px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mbox .mf button{min-width:88px;padding:9px 14px}
.mbox.wide{max-width:760px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:5px 4px;border-bottom:1px solid rgba(90,78,64,.25);text-align:left;white-space:nowrap}table.t th{font-weight:700;color:var(--ink2);font-size:12px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(90,78,64,.22)}
.stepper{display:inline-flex;align-items:center;gap:4px}.stepper button{width:32px;height:30px;padding:0}.stepper b{min-width:54px;text-align:center}
.report .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.report .side{background:var(--paper3);border:1px solid rgba(90,78,64,.35);border-radius:6px;padding:8px;display:flex;gap:8px}
.report .side img{width:48px;height:60px;border-radius:3px}
.report .lines p{margin:4px 0;text-indent:2em}
.stampbig{position:absolute;right:22px;top:14px;border:3px solid var(--seal);color:var(--seal);font-weight:900;font-size:26px;padding:2px 10px;transform:rotate(-12deg);border-radius:6px;opacity:.85}
.ev{display:flex;gap:14px;align-items:flex-start}.ev img{width:120px;height:150px;border-radius:4px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.statbars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.statbars .bar{margin:0;height:9px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;color:#f6eedc}
.b-war{background:#a8321f}.b-peace{background:#7a7064}.b-truce{background:#b8862a}.b-ally{background:#3f6e4a}
textarea{width:100%;min-height:90px;font-family:monospace;font-size:11px;background:var(--paper3);border:1px solid var(--ink2);border-radius:4px;padding:6px}
select{font-family:var(--serif);font-size:14px;padding:6px;background:var(--paper3);border:1px solid var(--ink2);border-radius:4px}
/* 手机竖屏：底部抽屉 */
@media (max-width:899px){
  #top{height:auto;min-height:48px;padding:5px 8px;gap:8px;flex-wrap:nowrap}
  #top nav{display:none}#menuBtn{display:inline-block;padding:6px 10px}
  #top .res{gap:8px;font-size:12.5px}.hide-s{display:none}
  #top .tinfo b{display:none}#top .tinfo span{white-space:nowrap;font-size:12px;color:#efe4cb}#endBtn{padding:7px 10px;white-space:nowrap;font-size:13px}#top .res i{display:none}
  #side{position:absolute;left:0;right:0;bottom:0;width:auto;height:46vh;border-left:none;border-top:2px solid #000;border-radius:12px 12px 0 0;transition:height .2s;z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
  #side.collapsed{height:44px}
  #sideHandle{display:flex;height:22px;align-items:center;justify-content:center;flex:none;cursor:pointer}#sideHandle span{width:44px;height:5px;border-radius:3px;background:var(--ink2);opacity:.6}
  #side.collapsed #sideBody{overflow:hidden}
  #sideBody{padding:4px 12px 16px}
  #zoomCtl{bottom:auto;top:10px}
  .acts{grid-template-columns:repeat(3,1fr)}
  #title h1{font-size:46px;letter-spacing:8px}
  .mbox .mc{padding:4px 14px 10px}.ev img{width:90px;height:112px}
}
/* 手机横屏：右侧窄栏 */
@media (max-height:520px) and (orientation:landscape){
  #top{height:42px}#top nav{display:none}#menuBtn{display:inline-block}.hide-s{display:none}
  #side{position:static;width:300px;height:auto;border-radius:0;border-top:none;border-left:2px solid #000}#side.collapsed{height:auto}#sideHandle{display:none}
  .mbox{max-height:94vh}
}

 ['lb','lbei','peace',10],['lb','ys','peace',30],['lb','yshao','war',-60],
 ['lbei','ys','war',-40],['lbei','yshao','peace',30],['ys','yshao','war',-70],
];
const SEASONS=['春','夏','秋','冬'];

// ================= 三国墨战 · 核心规则 =================
const rnd=Math.random,R=(a,b)=>a+rnd()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(rnd()*a.length)];
const sumT=t=>Object.values(t).reduce((s,n)=>s+n,0);
const CN='〇一二三四五六七八九十';
function cnNum(n){if(n<=10)return n===1?'元':CN[n];if(n<20)return '十'+(n%10?CN[n%10]:'');return CN[Math.floor(n/10)]+'十'+(n%10?CN[n%10]:'')}
function eraName(y){if(y<196)return '兴平'+cnNum(y-193)+'年';return '建安'+cnNum(y-195)+'年'}
function fmtN(n){n=Math.round(n);if(n>=10000)return (n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'万';if(n>=1000)return (n/1000).toFixed(1).replace(/\.0$/,'')+'千';return ''+n}
// 事件钩子（界面层替换；测试时自动处理）
const HOOK={
  report:async(r)=>{},captives:async(list,fid)=>{list.forEach(c=>aiCaptive(c,fid))},proposal:async(p)=>false,event:async(e)=>{},
  log:(t)=>{},anim:async(aid,from,to)=>{},busy:(t)=>{},choice:async(e,opts)=>0,
};
let S=null;
const ADJ={};EDGES.forEach(([a,b,r])=>{(ADJ[a]=ADJ[a]||[]).push({to:b,river:!!r});(ADJ[b]=ADJ[b]||[]).push({to:a,river:!!r})});
const nb=id=>(ADJ[id]||[]).map(e=>e.to);
const isRiver=(a,b)=>(ADJ[a]||[]).some(e=>e.to===b&&e.river);

// ---------- 建立新局 ----------
function newState(player){
  const s={ver:1,year:194,season:0,turn:0,player,fac:{},cities:{},armies:{},gens:{},rel:{},flags:{emperor:null,zgl:{},items:{}},log:[],nextArmy:1,captives:[],over:false};
  FACTIONS.forEach(f=>{s.fac[f.id]={id:f.id,name:f.name,ch:f.ch,color:f.color,major:!!f.major,leader:f.leader,gold:f.gold,grain:f.grain,alive:true,emperor:false,claim:false}});
  CITIES.forEach(c=>{const[x,y]=geo(c.lon,c.lat);s.cities[c.id]={id:c.id,name:c.name,x,y,owner:c.owner,pop:c.pop,mx:c.owner==='hl'?80:62+Math.round(R(-6,6)),tax:1,b:{...c.b},build:null,gar:{...c.gar},gov:null,recruited:0,searched:false,cap:c.cap,pass:!!c.pass}});
  GD.forEach(g=>{s.gens[g.id]={id:g.id,name:g.name,f:g.f,loc:g.f==='free'?null:{t:'c',id:g.city},home:g.city,s:[...g.s],born:g.born,die:g.die,traits:[...g.traits],items:[...g.items],loy:g.loy,appear:g.appear,role:g.role,moved:false,dead:false}});
  FACTIONS.forEach(a=>FACTIONS.forEach(b=>{if(a.id<b.id)s.rel[a.id+'|'+b.id]={st:(a.major&&b.major)?'peace':'war',v:0,t:0}}));
  REL_INIT.forEach(([a,b,st,v])=>{const k=a<b?a+'|'+b:b+'|'+a;s.rel[k]={st,v,t:0}});
  // 太守：各城政治最高者
  Object.values(s.cities).forEach(c=>{const gs=Object.values(s.gens).filter(g=>g.loc&&g.loc.id===c.id&&g.f===c.owner);if(gs.length)c.gov=gs.sort((a,b)=>b.s[3]-a.s[3])[0].id});
  return s;
}
function startGame(player){S=newState(player);S.log=[];addLog(`${eraName(S.year)}${SEASONS[S.season]}，天下大乱，群雄并起。`);return S}

// ---------- 查询 ----------
const F=id=>S.fac[id];const CITY=id=>S.cities[id];const GEN=id=>S.gens[id];const ARMY=id=>S.armies[id];
const isMajor=f=>S.fac[f]&&S.fac[f].major;
function rel(a,b){if(a===b)return{st:'self',v:100,t:0};const k=a<b?a+'|'+b:b+'|'+a;return S.rel[k]||(S.rel[k]={st:'war',v:0,t:0})}
function attackStatus(a,b){if(a===b)return 'no';if(!isMajor(b)||!isMajor(a))return 'ok';const r=rel(a,b);if(r.st==='war')return 'ok';if(r.st==='peace')return 'declare';return 'no'}
const friendly=(a,b)=>a===b||rel(a,b).st==='ally';
function citiesOf(f){return Object.values(S.cities).filter(c=>c.owner===f)}
function armiesOf(f){return Object.values(S.armies).filter(a=>a.f===f)}
function gensOf(f){return Object.values(S.gens).filter(g=>g.f===f&&!g.dead)}
function gensInCity(cid,f){return Object.values(S.gens).filter(g=>!g.dead&&g.loc&&g.loc.t==='c'&&g.loc.id===cid&&(!f||g.f===f))}
function armiesAt(cid){return Object.values(S.armies).filter(a=>a.at===cid)}
function besiegers(cid){return armiesAt(cid).filter(a=>a.siege)}
function gs(g){ // 有效五维（含宝物）
  if(typeof g==='string')g=S.gens[g];const s=[...g.s];g.items.forEach(i=>{const e=ITEMS[i]&&ITEMS[i].eff||{};if(e.t)s[0]+=e.t;if(e.w)s[1]+=e.w;if(e.z)s[2]+=e.z;if(e.p)s[3]+=e.p;if(e.m)s[4]+=e.m});return s.map(v=>Math.min(v,110))}
const hasT=(g,t)=>(typeof g==='string'?S.gens[g]:g).traits.includes(t);
function age(g){return S.year-g.born}
function leaderGen(f){const L=S.fac[f].leader;return L?S.gens[L]:null}
function armyCap(a){const L=S.gens[a.gens[0]];if(!L)return 3000;return 3000+gs(L)[0]*100+(hasT(L,'统帅')?3000:0)}
function armyMP(a){let mp=1;const t=a.troops;const tot=sumT(t);const cav=(t.qi||0)+(t.hb||0)+(t.bz||0);if(tot>0&&cav>=tot*0.999)mp++;if(a.gens.some(id=>{const g=S.gens[id];return g.items.includes('chitu')||g.items.includes('dilu')}))mp++;return Math.min(mp,3)}
function unitPow(t){return (UNITS[t].atk+UNITS[t].def)/2}
function troopPow(tr){return Object.entries(tr).reduce((s,[t,n])=>s+n/1000*unitPow(t),0)}
function sidePow(tr,gens){const T=gens.length?Math.max(...gens.map(id=>gs(id)[0])):40;const W=gens.length?Math.max(...gens.map(id=>gs(id)[1])):40;return troopPow(tr)*(0.7+T/200)*(1+Math.max(0,W-70)/300)}
function cityDefenders(cid){const c=S.cities[cid];const tr={...c.gar};const gens=gensInCity(cid,c.owner).map(g=>g.id);armiesAt(cid).filter(a=>!a.siege&&a.f===c.owner).forEach(a=>{for(const[t,n]of Object.entries(a.troops))tr[t]=(tr[t]||0)+n;gens.push(...a.gens)});return{tr,gens}}
function cityDefPow(cid){const c=S.cities[cid];const d=cityDefenders(cid);return sidePow(d.tr,d.gens)*(1+0.16*c.b.wall)+ (c.pass?2:0)}
function armyPow(a){return sidePow(a.troops,a.gens)*(0.6+a.morale/250)}
function facPow(f){let p=0;citiesOf(f).forEach(c=>p+=troopPow(c.gar));armiesOf(f).forEach(a=>p+=troopPow(a.troops));return p}
function facTroops(f){let n=0;citiesOf(f).forEach(c=>n+=sumT(c.gar));armiesOf(f).forEach(a=>n+=sumT(a.troops));return n}
function addLog(t){S.log.unshift({y:S.year,s:S.season,t});if(S.log.length>120)S.log.length=120;HOOK.log(t)}
function unitAvail(f,c,t){const u=UNITS[t];if(u.f&&u.f!==f)return false;for(const[k,v]of Object.entries(u.req))if((c.b[k]||0)<v)return false;return true}

// ---------- 经济 ----------
const TAXG=[0.7,1,1.35],TAXM=[12,0,-18];
function govBonus(c){const g=c.gov&&S.gens[c.gov];if(!g||g.dead||!g.loc||g.loc.id!==c.id||g.f!==c.owner)return 1;const s=gs(g);return 1+(s[3]-50)/250+(hasT(g,'治世')?0.15:0)}
function cityGold(c){if(c.pass)return 0;return c.pop*1.5*(1+0.25*c.b.market)*TAXG[c.tax]*(0.5+c.mx/200)*govBonus(c)}
function cityGrain(c,season){if(c.pass)return 0;return c.pop*1.35*(1+0.25*c.b.farm)*(season===2?3.5:1)*(0.6+c.mx/250)*govBonus(c)}
function upkeep(f){let g=0,gr=0;const add=(tr,mult)=>{for(const[t,n]of Object.entries(tr)){g+=n/1000*3;gr+=n/1000*UNITS[t].up*mult}};
  citiesOf(f).forEach(c=>add(c.gar,1));armiesOf(f).forEach(a=>{const c=S.cities[a.at];add(a.troops,(c.owner===f&&!a.siege)?1:1.3)});return{g,gr}}
function facIncome(f,season=S.season){let g=0,gr=0;citiesOf(f).forEach(c=>{g+=cityGold(c);gr+=cityGrain(c,season)});if(S.fac[f].emperor)g+=100;const u=upkeep(f);return{g:g-u.g,gr:gr-u.gr,gg:g,ggr:gr,ug:u.g,ugr:u.gr}}

// ---------- 内政行动 ----------
function canBuild(c,k){const lv=c.b[k]||0;return !c.pass&&!c.build&&lv<5&&S.fac[c.owner].gold>=BUILD_COST[lv+1]}
function doBuild(c,k){const lv=c.b[k]||0;if(!canBuild(c,k))return false;S.fac[c.owner].gold-=BUILD_COST[lv+1];c.build={k,left:BUILD_TIME[lv+1]};return true}
function recruitCap(c){return c.pass?0:Math.max(0,1000+1000*c.b.barracks-c.recruited)}
function doRecruit(c,t,n){const f=c.owner;n=Math.floor(n/100)*100;if(n<=0||!unitAvail(f,c,t))return false;if(besiegers(c.id).length)return false;n=Math.min(n,recruitCap(c));const cost=UNITS[t].cost*n/1000;if(S.fac[f].gold<cost||n<=0)return false;
  S.fac[f].gold-=cost;c.gar[t]=(c.gar[t]||0)+n;c.recruited+=n;c.pop=Math.max(1,c.pop-n/10000*0.8);c.mx=Math.max(0,c.mx-n/1000*1.5);return true}
function doRelief(c){const f=S.fac[c.owner];if(f.grain<200)return false;f.grain-=200;c.mx=Math.min(100,c.mx+10);return true}
function setGov(c,gid){c.gov=gid}
function doReward(gid){const g=S.gens[gid];const f=S.fac[g.f];if(f.gold<100)return false;f.gold-=100;g.loy=Math.min(100,g.loy+10);return true}
function doTransfer(gid,cid){const g=S.gens[gid];if(g.moved||!g.loc||g.loc.t!=='c')return false;g.loc={t:'c',id:cid};g.moved=true;return true}
// 搜索
function doSearch(cid,gid){const c=S.cities[cid];const g=S.gens[gid];if(c.searched||!g)return{msg:'本回合已搜索'};c.searched=true;const f=c.owner;const s=gs(g);
  const cands=Object.values(S.gens).filter(x=>x.f==='free'&&!x.dead&&x.home===cid&&x.appear<=S.year&&!x.loc);
  let p=0.3+(s[2]+s[4]-120)/220+(hasT(g,'伯乐')?0.25:0);
  const res={found:null,joined:false,msg:'',item:null,gold:0};
  if(cands.length&&rnd()<p+0.15){const x=pick(cands);res.found=x.id;const L=leaderGen(f);const Ls=L?gs(L):[50,50,50,50,50];
    if(x.id==='zhugeliang'){S.flags.zgl[f]=(S.flags.zgl[f]||0)+1;const v=S.flags.zgl[f];if(v>=3&&(Ls[4]>=90||f==='lbei')){join(x,f,cid,80);res.joined=true;res.msg=`三顾茅庐，诸葛亮感其诚意，出山相助！`}else{res.msg=`${g.name}往隆中拜访，诸葛亮${v<3?'外出未归（第'+cnNum(v).replace('元','一')+'次）':'婉言谢绝'}。`}return res}
    if(x.id==='zhaoyun'&&f==='lbei'){join(x,f,cid,95);res.joined=true;res.msg='赵云与刘备重逢，誓死追随！';return res}
    let jp=0.45+(Ls[4]-60)/100+(L&&hasT(L,'仁德')?0.1:0)+(L&&hasT(L,'枭雄')?0.05:0);if(S.fac[f].emperor)jp+=0.1;
    if(rnd()<jp){join(x,f,cid,70);res.joined=true;res.msg=`${g.name}寻得${x.name}，${x.name}愿效犬马之劳！`}else res.msg=`${g.name}寻得${x.name}，然其不愿出仕。`;return res}
  const it=HIDDEN_ITEMS.find(h=>h.city===cid&&h.year<=S.year&&!S.flags.items[h.item]);
  if(it&&rnd()<p){S.flags.items[it.item]=1;g.items.push(it.item);res.item=it.item;res.msg=`${g.name}于${c.name}寻得宝物【${ITEMS[it.item].name}】！`;return res}
  if(rnd()<0.35){const n=Math.round(R(40,160));S.fac[f].gold+=n;res.gold=n;res.msg=`${g.name}访得乡绅资助，得金 ${n}。`;return res}
  res.msg=`${g.name}遍访${c.name}，一无所获。`;return res}
function join(x,f,cid,loy){x.f=f;x.loc={t:'c',id:cid};x.loy=loy;x.moved=true;addLog(`${x.name} 加入${S.fac[f].name}军。`)}

// ---------- 军团 ----------
function formArmy(cid,gids,troops){const c=S.cities[cid];if(!gids.length)return null;const tot=sumT(troops);if(tot<=0)return null;
  for(const[t,n]of Object.entries(troops)){if((c.gar[t]||0)<n)return null}
  const id='a'+(S.nextArmy++);const a={id,f:c.owner,at:cid,siege:false,siegeT:0,gens:[...gids],troops:{},morale:90,mp:0,from:cid};
  for(const[t,n]of Object.entries(troops)){if(n<=0)continue;c.gar[t]-=n;if(c.gar[t]<=0)delete c.gar[t];a.troops[t]=n}
  gids.forEach(g=>{S.gens[g].loc={t:'a',id};if(c.gov===g)c.gov=null});a.mp=armyMP(a);S.armies[id]=a;return a}
function disbandArmy(aid,toCity){const a=S.armies[aid];if(!a)return;const cid=toCity||a.at;const c=S.cities[cid];
  if(c&&c.owner===a.f){for(const[t,n]of Object.entries(a.troops))c.gar[t]=(c.gar[t]||0)+n;a.gens.forEach(g=>{S.gens[g].loc={t:'c',id:cid}})}
  else{a.gens.forEach(g=>{const gg=S.gens[g];const home=nearestOwnCity(a.f,a.at);if(home)gg.loc={t:'c',id:home};else freeGen(gg,a.at)})}
  delete S.armies[aid]}
function armyTake(aid,troops){const a=S.armies[aid];const c=S.cities[a.at];if(c.owner!==a.f)return false;let tot=sumT(a.troops)+sumT(troops);if(tot>armyCap(a))return false;
  for(const[t,n]of Object.entries(troops)){if((c.gar[t]||0)<n)return false}for(const[t,n]of Object.entries(troops)){if(n<=0)continue;c.gar[t]-=n;if(c.gar[t]<=0)delete c.gar[t];a.troops[t]=(a.troops[t]||0)+n}return true}
function armyDrop(aid,troops){const a=S.armies[aid];const c=S.cities[a.at];if(c.owner!==a.f)return false;for(const[t,n]of Object.entries(troops)){const m=Math.min(n,a.troops[t]||0);if(m<=0)continue;a.troops[t]-=m;if(a.troops[t]<=0)delete a.troops[t];c.gar[t]=(c.gar[t]||0)+m}if(sumT(a.troops)<=0)disbandArmy(aid);return true}
function freeGen(g,cid){g.f='free';g.loc=null;g.home=cid||g.home;g.appear=Math.min(g.appear||S.year,S.year);g.loy=0}
function nearestOwnCity(f,from){const seen={[from]:1};let q=[from];while(q.length){const nq=[];for(const id of q){if(S.cities[id].owner===f&&id!==from)return id;for(const n of nb(id))if(!seen[n]){seen[n]=1;nq.push(n)}}q=nq}const any=citiesOf(f)[0];return any?any.id:null}
function reachable(aid){ // 可到达节点：{id: 'move'|'attack'|'field'}
  const a=S.armies[aid];const out={};if(!a||a.mp<=0||a.siege)return out;
  const walk=(id,mp)=>{for(const n of nb(id)){const c=S.cities[n];if(friendly(a.f,c.owner)){const bs=besiegers(n).filter(b=>attackStatus(a.f,b.f)!=='no');if(bs.length&&c.owner===a.f){out[n]=out[n]||'move'}else if(!out[n])out[n]='move';if(mp>1&&!bs.length)walk(n,mp-1)}else{if(attackStatus(a.f,c.owner)!=='no'&&!out[n])out[n]='attack'}}};
  walk(a.at,a.mp);delete out[a.at];
  // 本城被围：可出击
  const here=besiegers(a.at).filter(b=>b.f!==a.f&&attackStatus(a.f,b.f)!=='no');if(here.length)out[a.at]='field';
  return out}
function moveArmy(aid,to){const a=S.armies[aid];const r=reachable(aid);if(r[to]!=='move')return false;const path=pathTo(a,to);a.mp-=path;a.from=a.at;a.at=to;return true}
function pathTo(a,to){if(nb(a.at).includes(to))return 1;return 2}

// ---------- 战斗 ----------
function mkSide(f,tr,gens,morale){const G=gens.filter(id=>S.gens[id]&&!S.gens[id].dead);const st=G.map(gs);const best=(i)=>G.length?G.reduce((b,id,k)=>st[k][i]>gs(b)[i]?id:b,G[0]):null;
  const T=G.length?Math.max(...st.map(s=>s[0])):35,W=G.length?Math.max(...st.map(s=>s[1])):35,Z=G.length?Math.max(...st.map(s=>s[2])):35,M=G.length?Math.max(...st.map(s=>s[4])):35;
  return{f,tr:{...tr},gens:G,T,W,Z,M,lead:best(0),champ:best(1),sage:best(2),init:sumT(tr),morale:clamp((morale??80)+(M-60)/6+(G.some(id=>hasT(id,'统帅'))?6:0),30,100),loss:{},cav:G.some(id=>hasT(id,'骑将')),brave:G.some(id=>hasT(id,'勇将'))}}
const gName=id=>id?S.gens[id].name:'无名小将';
function share(tr,roles){const tot=sumT(tr)||1;let n=0;for(const[t,v]of Object.entries(tr))if(roles.includes(UNITS[t].role))n+=v;return n/tot}
function dealCas(side,cas){const tot=sumT(side.tr);if(tot<=0)return 0;cas=Math.min(cas,tot);let wsum=0;const w={};for(const[t,n]of Object.entries(side.tr)){w[t]=n*(UNITS[t].role==='ranged'?0.6:1);wsum+=w[t]}
  let dealt=0;for(const[t,n]of Object.entries(side.tr)){const c=Math.min(n,Math.round(cas*w[t]/wsum));side.tr[t]-=c;side.loss[t]=(side.loss[t]||0)+c;dealt+=c}return dealt}
function battle(A,D,o={}){ // A 进攻方 D 防守方
  const a=mkSide(A.f,A.tr,A.gens,A.morale),d=mkSide(D.f,D.tr,D.gens,D.morale);const rep=[];const ev={duel:null,plot:[]};
  const wall=o.siege?(o.wall||0):0;const facN=f=>S.fac[f].name;
  rep.push(`${facN(a.f)}军${a.lead?'（主将 '+gName(a.lead)+'）':''} ${fmtN(a.init)} 对阵 ${facN(d.f)}军${d.lead?'（主将 '+gName(d.lead)+'）':''} ${fmtN(d.init)}${o.siege?'，据城而守（城防'+cnNum(wall).replace('元','一')+'级）':''}。`);
  if(o.river)rep.push('大军涉水而进，阵脚未稳。');
  // 单挑
  if(a.champ&&d.champ&&rnd()<0.3+(gs(a.champ)[1]+gs(d.champ)[1]-150)/160){
    const wa=gs(a.champ)[1]+(hasT(a.champ,'勇将')?4:0),wd=gs(d.champ)[1]+(hasT(d.champ,'勇将')?4:0);const sa=wa+R(0,26),sd=wd+R(0,26);const diff=sa-sd;
    const rounds=pick(['二十余合','三十合','五十余合','百合']);let line=`${gName(a.champ)} 与 ${gName(d.champ)} 阵前单挑，大战${rounds}，`;
    if(Math.abs(diff)<6){line+='不分胜负，各自收兵。';}else{const win=diff>0?a:d,lose=diff>0?d:a;const wg=diff>0?a.champ:d.champ,lg=diff>0?d.champ:a.champ;
      lose.morale-=12+Math.abs(diff)/2;win.morale=Math.min(100,win.morale+8);
      if(Math.abs(diff)>16&&rnd()<0.28){line+=`${gName(wg)} 斩 ${gName(lg)} 于马下！`;ev.duel={win:wg,lose:lg,killed:true};lose.gens=lose.gens.filter(x=>x!==lg);}
      else{line+=`${gName(lg)} 力怯败走，${facN(lose.f)}军士气大挫。`;ev.duel={win:wg,lose:lg,killed:false}}}
    rep.push(line);if(!ev.duel)ev.duel={draw:true,a:a.champ,d:d.champ}}
  // 计策
  for(const[s,e]of[[a,d],[d,a]]){if(!s.sage)continue;const z=gs(s.sage)[2];let p=(z-68)/60+(hasT(s.sage,'神算')?0.15:0);if(p<=0||rnd()>p)continue;
    const ez=e.sage?gs(e.sage)[2]:0;if(ez>z-8&&rnd()<(ez-60)/70+(e.sage&&hasT(e.sage,'神算')?0.2:0)){rep.push(`${gName(s.sage)} 欲施奇计，被 ${gName(e.sage)} 识破。`);continue}
    const kind=o.siege&&s===a?pick(['掘地道','火攻城门','声东击西']):o.siege?pick(['夜袭敌营','火烧粮草']):pick(['火攻','伏兵','夜袭','诱敌深入']);const cas=dealCas(e,sumT(e.tr)*R(0.06,0.11));e.morale-=10;rep.push(`${gName(s.sage)} 献计「${kind}」，${facN(e.f)}军折损 ${fmtN(cas)}，阵脚大乱！`);ev.plot.push(s.sage)}
  // 交战
  const K=58;let rounds=0,routed=null;a.luck=R(0.74,1.26);d.luck=R(0.74,1.26);
  const dmg=(s,e,isAtt)=>{let D0=0;for(const[t,n]of Object.entries(s.tr)){const u=UNITS[t];let m=1;if(u.role==='spear')m*=1+0.6*share(e.tr,['cav']);if(u.role==='cav'){m*=1+0.5*share(e.tr,['ranged']);if(s.cav)m*=1.15;if(o.siege&&isAtt)m*=0.6}if(u.role==='ranged'&&o.siege&&!isAtt)m*=1.35;D0+=n/1000*u.atk*m}
    return D0*(0.7+s.T/200)*(0.55+s.morale/220)*(s.brave?1.05:1)*s.luck*R(0.85,1.15)*(o.river&&isAtt?0.85:1)};
  const avgDef=s=>{const tot=sumT(s.tr)||1;let d0=0;for(const[t,n]of Object.entries(s.tr))d0+=n*UNITS[t].def;return d0/tot};
  for(rounds=0;rounds<5;rounds++){const da=dmg(a,d,true),dd=dmg(d,a,false);const wm=1+0.42*wall;
    const ca=dealCas(d,da*K/avgDef(d)/wm),cd=dealCas(a,dd*K/avgDef(a)*(1+0.1*wall));
    const ta=sumT(a.tr)||1,td=sumT(d.tr)||1;a.morale-=cd/(ta+cd)*110;d.morale-=ca/(td+ca)*110*(o.siege?0.7:1);
    if(a.morale<25||ta<a.init*0.15){routed='A';break}if(d.morale<25||td<d.init*0.15){routed='D';break}}
  let win;const ra=sumT(a.tr),rd=sumT(d.tr);
  if(routed==='A')win='D';else if(routed==='D')win='A';else if(o.siege)win=(ra*a.morale>rd*d.morale*(1.05+0.1*wall))?'A':'D';else win=(ra*a.morale>=rd*d.morale)?'A':'D';
  const W1=win==='A'?a:d,L1=win==='A'?d:a;

  if(win==='A')rep.push(o.siege?`${facN(a.f)}军攻破城池！守军${routed?'溃散':'力竭'}，${o.cityName||''}陷落。`:`${facN(d.f)}军${routed?'溃不成军':'不支败退'}，${facN(a.f)}军乘胜追击，斩获 ${fmtN(pur)}。`);
  else rep.push(o.siege?`${facN(d.f)}军凭城死守，${facN(a.f)}军久攻不下，${routed?'溃败而还':'只得退兵'}。`:`${facN(a.f)}军${routed?'溃败':'攻势受挫'}，${facN(d.f)}军追杀 ${fmtN(pur)}。`);
  const loss=s=>sumT(s.loss);rep.push(`战损：${facN(a.f)}军 ${fmtN(loss(a))}　${facN(d.f)}军 ${fmtN(loss(d))}`);
  // 败方武将命运
  const fate={killed:[],captured:[],fled:[]};if(ev.duel&&ev.duel.killed)fate.killed.push(ev.duel.lose);
  L1.gens.forEach(id=>{const r=rnd();const capP=o.siege&&win==='A'?0.4:(routed?0.18:0.1);if(r<0.03)fate.killed.push(id);else if(r<0.03+capP)fate.captured.push(id);else fate.fled.push(id)});
  W1.gens.forEach(id=>{if(rnd()<0.008)fate.killed.push(id)});

// 把战斗结果写回（sources: [{kind:'army',id}|{kind:'gar',id}]）
function applyLoss(sources,side){const tot={};sources.forEach(s=>{const tr=s.kind==='army'?S.armies[s.id].troops:S.cities[s.id].gar;for(const[t,n]of Object.entries(tr))tot[t]=(tot[t]||0)+n});
  sources.forEach(s=>{const tr=s.kind==='army'?S.armies[s.id].troops:S.cities[s.id].gar;for(const t of Object.keys(tr)){const l=side.loss[t]||0;if(!l)continue;const cut=Math.round(l*tr[t]/(tot[t]||1));tr[t]=Math.max(0,tr[t]-cut);if(tr[t]<=0)delete tr[t]}})}
function killGen(id,how){const g=S.gens[id];if(!g||g.dead)return;g.dead=true;const f=g.f;const where=g.loc;g.loc=null;
  if(where&&where.t==='a'&&S.armies[where.id]){const a=S.armies[where.id];a.gens=a.gens.filter(x=>x!==id);if(!a.gens.length)disbandArmy(a.id,a.at)}
  Object.values(S.cities).forEach(c=>{if(c.gov===id)c.gov=null});addLog(`${g.name} ${how||'阵亡'}。`);
  if(S.fac[f]&&S.fac[f].leader===id)succeed(f)}
function succeed(f){const F0=S.fac[f];const cand=gensOf(f).filter(g=>!g.dead);if(!cand.length){F0.leader=null;if(F0.major){addLog(`${F0.name}军群龙无首，土崩瓦解。`);citiesOf(f).forEach(c=>{c.owner='rebel'});eliminate(f)}return}
  const sur=(F0.name||'')[0];const fam=cand.filter(g=>g.name[0]===sur&&!['zhouyu'].includes(g.id));const pool=fam.length?fam:cand;const nx=pool.sort((a,b)=>(gs(b)[4]+gs(b)[0])-(gs(a)[4]+gs(a)[0]))[0];F0.leader=nx.id;F0.name=nx.name;F0.ch=nx.name[0];nx.loy=100;addLog(`${nx.name} 继承基业，号令${F0.ch}军。`)}
function eliminate(f){const F0=S.fac[f];if(!F0.alive)return;F0.alive=false;armiesOf(f).forEach(a=>{a.gens.forEach(g=>freeGen(S.gens[g],a.at));delete S.armies[a.id]});gensOf(f).forEach(g=>freeGen(g,g.loc&&g.loc.t==='c'?g.loc.id:g.home));addLog(`${F0.name}势力覆灭！`)}
function removeGenFromArmy(id){const g=S.gens[id];if(g.loc&&g.loc.t==='a'){const a=S.armies[g.loc.id];if(a){a.gens=a.gens.filter(x=>x!==id);if(!a.gens.length)disbandArmy(a.id,a.at)}}}
function capture(id,byF,city){const g=S.gens[id];if(!g||g.dead)return;removeGenFromArmy(id);Object.values(S.cities).forEach(c=>{if(c.gov===id)c.gov=null});g.loc=null;g.captive=byF;S.captives.push({id,by:byF,city})}
function flee(id){const g=S.gens[id];if(!g||g.dead)return;if(g.loc&&g.loc.t==='a')return;const from=g.loc&&g.loc.id;const to=from&&nearestOwnCity(g.f,from);if(to&&to!==from)g.loc={t:'c',id:to};else if(!to)freeGen(g,from)}
function persuadeP(id,byF){const g=S.gens[id];const L=leaderGen(byF);const Ls=L?gs(L):[50,50,50,50,50];let p=0.3+(Ls[4]-70)/100+(60-g.loy)/120+(L&&hasT(L,'枭雄')?0.15:0)+(L&&hasT(L,'仁德')?0.08:0)+(S.fac[byF].emperor?0.1:0);if(hasT(g,'忠义'))p-=0.8;if(S.fac[g.f]&&S.fac[g.f].leader===id)p-=0.55;if(!S.fac[g.f]||!S.fac[g.f].alive)p+=0.3;return clamp(p,0.02,0.95)}
function resolveCaptive(c,choice){const g=S.gens[c.id];g.captive=null;S.captives=S.captives.filter(x=>x!==c);const by=c.by;
  if(choice==='persuade'){if(rnd()<persuadeP(c.id,by)){const old=g.f;const wasLeader=S.fac[old]&&S.fac[old].leader===c.id;g.f=by;g.loy=55+Math.round(R(0,15));const cc=c.city&&S.cities[c.city]&&S.cities[c.city].owner===by?c.city:(nearestOwnCity(by,c.city||g.home)||(citiesOf(by)[0]||{}).id);if(cc)g.loc={t:'c',id:cc};else freeGen(g,g.home);addLog(`${g.name} 归降${S.fac[by].name}军。`);if(wasLeader)succeed(old);return 'ok'}
    else{addLog(`${g.name} 宁死不降。`);choice='release'}}
  if(choice==='kill'){g.dead=true;addLog(`${S.fac[by].name}军斩 ${g.name}。`);const f=g.f;if(S.fac[f]&&S.fac[f].leader===c.id)succeed(f);return 'kill'}

function aiCaptive(c,byF){const choice=persuadeP(c.id,byF)>0.2||rnd()<0.5?'persuade':(rnd()<0.3?'kill':'release');resolveCaptive(c,choice)}

async function attackCity(aids,cid,mode){if(!Array.isArray(aids))aids=[aids];aids=aids.filter(id=>S.armies[id]);if(!aids.length)return null;const a=S.armies[aids[0]];const c=S.cities[cid];const def=c.owner;

  const tr={},gens=[];let mor=0;aids.forEach(id=>{const x=S.armies[id];for(const[t,n]of Object.entries(x.troops))tr[t]=(tr[t]||0)+n;gens.push(...x.gens);mor+=x.morale});mor/=aids.length;
  const D=cityDefenders(cid);const dsrc=[{kind:'gar',id:cid},...armiesAt(cid).filter(x=>!x.siege&&x.f===def).map(x=>({kind:'army',id:x.id}))];
  const res=battle({f:a.f,tr,gens,morale:mor},{f:def,tr:D.tr,gens:D.gens,morale:c.mx*0.4+50},{siege:true,wall:c.b.wall,river,cityName:c.name});
  res.title=`${c.name}之战`;res.city=cid;
  applyLoss(aids.map(id=>({kind:'army',id})),res.a);applyLoss(dsrc,res.d);aids.forEach(id=>{const x=S.armies[id];if(x){x.morale=clamp(res.a.morale+(res.win==='A'?15:0),20,100);x.mp=0}});
  await postBattle(res,aids,dsrc.filter(s=>s.kind==='army').map(s=>s.id),'A');
  const alive=aids.filter(id=>S.armies[id]);
  if(res.win==='A'&&alive.length){captureCity(cid,a.f,alive[0]);alive.slice(1).forEach(id=>{const x=S.armies[id];x.at=cid;x.siege=false})}
  else alive.forEach(id=>{const x=S.armies[id];const from=froms[id];if(from===cid){retreat(id);return}x.at=from;x.siege=false;if(!friendly(x.f,S.cities[from].owner)){const h=nearestOwnCity(x.f,from);if(h)x.at=h;else disbandArmy(id)}});
  await HOOK.report(res);await flushCaptives();return res}
// 野战（攻击围城敌军 / 出城迎击）
async function attackArmy(srcAids,targetAid,garrisonCity){const t=S.armies[targetAid];if(!t)return null;const f=srcAids.length?S.armies[srcAids[0]].f:S.cities[garrisonCity].owner;
  const tr={},gens=[];const src=[];srcAids.forEach(id=>{const a=S.armies[id];for(const[k,n]of Object.entries(a.troops))tr[k]=(tr[k]||0)+n;gens.push(...a.gens);src.push({kind:'army',id})});
  if(garrisonCity){const c=S.cities[garrisonCity];for(const[k,n]of Object.entries(c.gar))tr[k]=(tr[k]||0)+n;gens.push(...gensInCity(garrisonCity,c.owner).map(g=>g.id));src.push({kind:'gar',id:garrisonCity})}
  if(attackStatus(f,t.f)==='declare')declareWar(f,t.f);

  res.title=`${S.cities[t.at].name}城外之战`;res.city=t.at;
  applyLoss(src,res.a);applyLoss([{kind:'army',id:targetAid}],res.d);srcAids.forEach(id=>{if(S.armies[id]){S.armies[id].mp=0;S.armies[id].morale=clamp(res.a.morale,20,100)}});if(S.armies[targetAid])S.armies[targetAid].morale=clamp(res.d.morale,20,100);

  const loser=res.win==='A'?[targetAid]:srcAids;loser.forEach(id=>{const x=S.armies[id];if(!x)return;if(x.siege){retreat(id)}else if(res.win==='D'&&!x.siege){/*出击失败 回城*/}});

function retreat(aid){const a=S.armies[aid];if(!a)return;a.siege=false;a.siegeT=0;const back=a.from&&S.cities[a.from]&&friendly(a.f,S.cities[a.from].owner)?a.from:nearestOwnCity(a.f,a.at);if(back&&back!==a.at){a.at=back}else if(!back||!friendly(a.f,S.cities[a.at].owner))disbandArmy(aid)}
async function postBattle(res,attAids,defAids,side,garrisonCity){

  [...attAids,...defAids].forEach(id=>{const a=S.armies[id];if(a&&sumT(a.troops)<200){addLog(`${gName(a.gens[0])} 所部溃散。`);disbandArmy(id,friendly(a.f,S.cities[a.at].owner)?a.at:null)}});
  const k=rel(attF,defF);k.v=Math.max(-100,k.v-6);
}
function captureCity(cid,f,aid){const c=S.cities[cid];const old=c.owner;c.owner=f;c.mx=Math.min(c.mx,32);c.build=null;c.tax=1;c.gov=null;c.recruited=0;
  const rem=sumT(c.gar);const a=S.armies[aid];if(a&&rem>0){const add=Math.round(rem*0.2);a.troops.dao=(a.troops.dao||0)+add}c.gar={};

  armiesAt(cid).filter(x=>x.f===old&&!x.siege).forEach(x=>{const to=nearestOwnCity(old,cid);if(to&&to!==cid)x.at=to;else{[...x.gens].forEach(g=>capture(g,f,cid));delete S.armies[x.id]}});

async function flushCaptives(){if(!S.captives.length)return;const mine=S.captives.filter(c=>c.by===S.player);const other=S.captives.filter(c=>c.by!==S.player);other.forEach(c=>aiCaptive(c,c.by));if(mine.length)await HOOK.captives(mine,S.player)}

// ---------- 外交 ----------
function declareWar(a,b){const r=rel(a,b);const was=r.st;r.st='war';r.v=Math.max(-100,r.v-40);r.t=0;if(was==='ally'||was==='truce'){Object.values(S.fac).forEach(f=>{if(f.major&&f.id!==a&&f.id!==b){const k=rel(a,f.id);k.v-=15}});addLog(`${S.fac[a].name}背弃盟约，对${S.fac[b].name}宣战！`)}else addLog(`${S.fac[a].name}对${S.fac[b].name}宣战！`)}
function giftP(a,b,gold){const L=leaderGen(a);return gold/12*(0.7+(L?gs(L)[4]:50)/200)}
function doGift(a,b,gold){if(S.fac[a].gold<gold)return false;S.fac[a].gold-=gold;const r=rel(a,b);const inc=Math.round(giftP(a,b,gold));r.v=Math.min(100,r.v+inc);return inc}
function allyP(a,b){const r=rel(a,b);if(r.st==='war')return 0;if(r.v<45)return 0.02;return clamp((r.v-40)/60+(commonEnemy(a,b)?0.15:0),0,0.9)}
function truceP(a,b){const r=rel(a,b);if(r.st!=='war')return 0;const ratio=(facPow(a)+1)/(facPow(b)+1);return clamp(0.2+r.v/200+(ratio-1)*0.25,0.03,0.9)}
function commonEnemy(a,b){return Object.values(S.fac).some(f=>f.major&&f.alive&&f.id!==a&&f.id!==b&&rel(a,f.id).st==='war'&&rel(b,f.id).st==='war')}
function doAlly(a,b,force){if(force||rnd()<allyP(a,b)){const r=rel(a,b);r.st='ally';r.v=Math.max(r.v,60);addLog(`${S.fac[a].name}与${S.fac[b].name}结为同盟。`);return true}return false}
function doTruce(a,b,force){if(force||rnd()<truceP(a,b)){const r=rel(a,b);r.st='truce';r.t=8;r.v=Math.max(r.v,0);addLog(`${S.fac[a].name}与${S.fac[b].name}罢兵停战。`);return true}return false}
function recruitMinorCost(m){return Math.round(250+facTroops(m)/15)}
function recruitMinorP(a,m){const ratio=(facPow(a)+1)/(facPow(m)+1);const L=leaderGen(a);let p=0.1+Math.min(0.45,ratio/25)+((L?gs(L)[4]:50)-70)/200+(L&&(hasT(L,'枭雄')||hasT(L,'名门'))?0.1:0)+(S.fac[a].emperor?0.15:0);
  const adj=citiesOf(m).some(c=>nb(c.id).some(n=>S.cities[n].owner===a));if(!adj)p-=0.2;return clamp(p,0.02,0.8)}
function doRecruitMinor(a,m){const cost=recruitMinorCost(m);if(S.fac[a].gold<cost)return null;S.fac[a].gold-=cost;if(rnd()<recruitMinorP(a,m)){citiesOf(m).forEach(c=>{c.owner=a;c.mx=Math.max(c.mx,45)});gensOf(m).forEach(g=>{g.f=a;g.loy=65});armiesOf(m).forEach(x=>x.f=a);S.fac[m].alive=false;addLog(`${S.fac[m].name}归附${S.fac[a].name}！`);return true}addLog(`${S.fac[m].name}拒绝了${S.fac[a].name}的招抚。`);return false}

// ---------- 回合结算 ----------
async function upkeepPhase(){
  // 围城
  for(const a of Object.values(S.armies)){if(!a.siege)continue;const c=S.cities[a.at];if(!c||friendly(a.f,c.owner)||attackStatus(a.f,c.owner)==='no'){a.siege=false;continue}
    a.siegeT++;for(const t of Object.keys(c.gar)){c.gar[t]=Math.floor(c.gar[t]*0.9);if(c.gar[t]<50)delete c.gar[t]}c.mx=Math.max(0,c.mx-8);
    const dp=cityDefPow(c.id),ap=armyPow(a);if(dp<ap*0.2||(a.siegeT>=3+Math.floor(c.b.wall/2)&&rnd()<0.35)){addLog(`${c.name}粮尽援绝，开城投降！`);captureCity(c.id,a.f,a.id);await flushCaptives()}}
  // 经济
  for(const f of Object.values(S.fac)){if(!f.alive)continue;const inc=facIncome(f.id);f.gold=Math.max(0,f.gold+inc.g);f.grain+=inc.gr;
    if(f.grain<0){f.grain=0;armiesOf(f.id).forEach(a=>{a.morale=Math.max(10,a.morale-15);for(const t in a.troops)a.troops[t]=Math.floor(a.troops[t]*0.93)});citiesOf(f.id).forEach(c=>{for(const t in c.gar)c.gar[t]=Math.floor(c.gar[t]*0.96);c.mx-=4});if(f.id===S.player)addLog('粮草断绝！士卒逃散，民心不稳。')}}
  // 城市
  for(const c of Object.values(S.cities)){
    if(c.build){c.build.left--;if(c.build.left<=0){c.b[c.build.k]++;if(c.owner===S.player)addLog(`${c.name}的${BUILDINGS[c.build.k].name}升至${c.b[c.build.k]}级。`);c.build=null}}
    if(c.pass){c.recruited=0;c.searched=false;continue}
    const L=leaderGen(c.owner);const gv=c.gov&&S.gens[c.gov];let target=58+TAXM[c.tax]+(gv&&gv.loc&&gv.loc.id===c.id?(gs(gv)[4]-50)/5:0)+(L&&hasT(L,'仁德')?8:0)+(sumT(c.gar)>=3000?4:0)-(besiegers(c.id).length?20:0);
    c.mx=clamp(c.mx+(target-c.mx)*0.25,0,100);c.pop=Math.min(90,c.pop*(1+0.004*(c.mx-40)/20+0.0008*c.b.farm));
    c.recruited=0;c.searched=false;
    if(c.mx<22&&isMajor(c.owner)&&!c.cap&&rnd()<0.15){const old=c.owner;addLog(`${c.name}民变！乱民据城自立。`);for(const t in c.gar)c.gar[t]=Math.floor(c.gar[t]*0.5);c.gar.dao=(c.gar.dao||0)+Math.round(c.pop*60);c.owner='rebel';c.mx=50;gensInCity(c.id,old).forEach(g=>flee(g.id));armiesAt(c.id).filter(a=>a.f===old&&!a.siege).forEach(a=>{const to=nearestOwnCity(old,c.id);if(to)a.at=to;else disbandArmy(a.id)})}}
  // 军团
  for(const a of Object.values(S.armies)){const c=S.cities[a.at];a.morale=Math.min(100,a.morale+(c&&c.owner===a.f?10:3));a.mp=armyMP(a)}
  Object.values(S.gens).forEach(g=>g.moved=false);
  // 外交计时
  for(const r of Object.values(S.rel)){if(r.st==='truce'){r.t--;if(r.t<=0)r.st='peace'}if(r.st==='ally')r.v=Math.min(100,r.v+1);if(r.st==='war')r.v=Math.max(-100,r.v-0.5)}
  // 时间推进
  S.season++;S.turn++;if(S.season>3){S.season=0;S.year++}
  // 寿终
  for(const g of Object.values(S.gens)){if(g.dead||g.f==='free'||g.f==='gone')continue;if(S.year>g.die&&rnd()<0.2)killGen(g.id,'病逝')}
  await runEvents();
}

    Object.values(S.fac).forEach(f=>{if(f.major&&f.alive&&f.id!=='ys'){const r=rel('ys',f.id);r.st='war';r.v=-90}});addLog('袁术于寿春僭号称帝，天下共讨之！');
    await HOOK.event({title:'袁术称帝',who:L.id,text:'袁术自恃玉玺在手，于寿春僭号称帝，建号仲氏。天下诸侯闻之，皆与袁术为敌！'})}}
  // 随机天灾人事
  if(rnd()<0.12){const cs=Object.values(S.cities).filter(c=>isMajor(c.owner)&&!c.pass);if(cs.length){const c=pick(cs);const f=S.fac[c.owner];const k=rnd();
    if(k<0.3){const lost=Math.round(f.grain*0.15);f.grain-=lost;c.mx-=8;addLog(`${c.name}蝗灾，损粮 ${lost}，民心浮动。`)}

}
async function fireEvent(e){if(e.type==='emperor'){const f=S.fac[e.f];Object.values(S.fac).forEach(x=>{if(x.major&&x.id!==e.f){rel(x.id,e.f).v-=12}});addLog(`${f.name}奉迎天子！`);

function checkEnd(){const mine=citiesOf(S.player).length;if(mine===0||!S.fac[S.player].alive)return 'lose';const others=Object.values(S.cities).filter(c=>c.owner!==S.player&&!friendly(S.player,c.owner)).length;if(others===0)return 'win';return null}

async function exportSave(){const json=JSON.stringify(S);try{if(typeof CompressionStream!=='undefined'){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const buf=await new Response(cs).arrayBuffer();let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return 'MZ1:'+btoa(bin)}}catch(e){}
  return 'MZ0:'+btoa(unescape(encodeURIComponent(json)))}
async function importSave(code){code=code.trim();let json;if(code.startsWith('MZ1:')){const bin=atob(code.slice(4));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));json=await new Response(ds).text()}
  else if(code.startsWith('MZ0:'))json=decodeURIComponent(escape(atob(code.slice(4))));else if(code.startsWith('{'))json=code;else throw new Error('存档码格式不对');
  const s=JSON.parse(json);if(!s||s.ver!==1||!s.cities)throw new Error('不是三国墨战的存档');S=s;return S}

// ================= 三国墨战 · AI =================
function hostileTo(f,other){return other!==f&&attackStatus(f,other)==='ok'}
function isFrontier(f,c){return nb(c.id).some(n=>{const o=S.cities[n].owner;return o!==f&&!friendly(f,o)&&attackStatus(f,o)!=='no'})||besiegers(c.id).some(b=>b.f!==f)}
function threatAt(f,c){let t=0;besiegers(c.id).forEach(b=>{if(b.f!==f)t+=armyPow(b)});nb(c.id).forEach(n=>{armiesAt(n).forEach(a=>{if(a.f!==f&&!friendly(f,a.f)&&isMajor(a.f)&&attackStatus(a.f,f)==='ok')t+=armyPow(a)*0.8})});return t}
function genFree(g){return g.loc&&g.loc.t==='c'&&!g.captive}

async function aiTurn(f){const Fa=S.fac[f];if(!Fa.alive)return;
  if(Fa.major){aiDiplomacy(f);aiEconomy(f);await aiMilitary(f);aiSearch(f)}else aiMinor(f);
  await flushCaptives()}

function aiEconomy(f){const Fa=S.fac[f];const cs=citiesOf(f);const up=upkeep(f);const reserve=150+40*cs.length;
  cs.forEach(c=>{if(c.pass)return;if(c.mx<40)c.tax=0;else if(Fa.gold<300&&c.mx>62)c.tax=2;else c.tax=1;
    const here=gensInCity(c.id,f);if(here.length){const best=here.sort((a,b)=>gs(b)[3]-gs(a)[3])[0];if(!c.gov||!S.gens[c.gov]||S.gens[c.gov].loc?.id!==c.id)c.gov=best.id}
    if(c.mx<30&&Fa.grain>600)doRelief(c)});
  // 建设
  cs.slice().sort(()=>rnd()-0.5).forEach(c=>{if(c.pass||c.build)return;const fr=isFrontier(f,c);let k;
    if(fr){if(c.b.wall<2)k='wall';else if(c.b.barracks<2)k='barracks';else if(c.b.stable<1)k='stable';else if(c.b.wall<3&&c.cap)k='wall';else if(c.b.barracks<3)k='barracks';else k=c.b.market<=c.b.farm?'market':'farm'}
    else{k=c.b.market<=c.b.farm?'market':'farm';if(c.b[k]>=4)k=c.b.barracks<2?'barracks':(c.b.stable<2?'stable':'wall')}
    const lv=c.b[k]||0;if(lv>=5)return;if(Fa.gold-BUILD_COST[lv+1]>reserve)doBuild(c,k)});
  // 募兵
  const yearGr=cs.reduce((s,c)=>s+cityGrain(c,0)*3+cityGrain(c,2),0);const maxT=yearGr/46*1000*0.92;if(facTroops(f)>=maxT||Fa.grain<up.gr*2)return;let room=maxT-facTroops(f);
  cs.slice().sort((a,b)=>threatAt(f,b)-threatAt(f,a)).forEach(c=>{if(c.pass&&sumT(c.gar)>4000)return;const fr=isFrontier(f,c);const target=fr?5000+c.pop*90:2500;let need=target-sumT(c.gar);
    const th=threatAt(f,c);if(th>cityDefPow(c.id)*0.8)need=Math.max(need,4000);
    let guard=6;while(need>0&&recruitCap(c)>0&&guard-->0){const opts=UNIT_ORDER.filter(t=>unitAvail(f,c,t));let t;const sp=opts.filter(t=>UNITS[t].f);
      const r=rnd();if(sp.length&&r<0.35)t=pick(sp);else if(opts.includes('qi')&&r<0.52)t='qi';else t=pick(['dao','qiang','qiang','gong','dao']);
      const n=Math.min(1000,need,recruitCap(c),Math.floor(room/100)*100);if(n<100)break;const cost=UNITS[t].cost*n/1000;if(Fa.gold-cost<reserve*0.5)break;if(!doRecruit(c,t,n))break;need-=n;room-=n}})}

async function aiMilitary(f){const Fa=S.fac[f];
  // 编组
  const cs=citiesOf(f);const maxArmies=Math.ceil(cs.length/2)+1;
  for(const c of cs){if(armiesOf(f).length>=maxArmies)break;if(!isFrontier(f,c))continue;const tot=sumT(c.gar);if(tot<5500)continue;
    const gens=gensInCity(c.id,f).filter(genFree).filter(g=>!g.moved);if(!gens.length)continue;
    gens.sort((a,b)=>(gs(b)[0]+gs(b)[1])-(gs(a)[0]+gs(a)[1]));const pickG=[gens[0].id];const sub=gens.slice(1).sort((a,b)=>Math.max(gs(b)[1],gs(b)[2])-Math.max(gs(a)[1],gs(a)[2]));sub.slice(0,gens.length>3?2:1).forEach(g=>pickG.push(g.id));
    if(gens.length===1&&c.cap&&S.fac[f].leader===gens[0].id&&cs.length>1)continue;
    const keep=Math.max(2000,tot*0.3);const frac=(tot-keep)/tot;const tr={};let cap=3000+gs(gens[0])[0]*100+(hasT(gens[0],'统帅')?3000:0);
    for(const[t,n]of Object.entries(c.gar)){const m=Math.floor(n*frac/100)*100;if(m>0)tr[t]=m}let s=sumT(tr);if(s>cap){const k=cap/s;for(const t in tr)tr[t]=Math.floor(tr[t]*k/100)*100}
    if(sumT(tr)>=3000)formArmy(c.id,pickG,tr)}
  // 合并同城闲置军团
  for(const c of cs){const here=armiesAt(c.id).filter(x=>x.f===f&&!x.siege);if(here.length<2)continue;here.sort((x,y)=>armyCap(y)-armyCap(x));const main=here[0];for(const o of here.slice(1)){if(sumT(main.troops)+sumT(o.troops)<=armyCap(main)&&main.gens.length+o.gens.length<=3){for(const[t,n]of Object.entries(o.troops))main.troops[t]=(main.troops[t]||0)+n;o.gens.forEach(g=>{S.gens[g].loc={t:'a',id:main.id};main.gens.push(g)});main.mp=Math.min(main.mp,o.mp);delete S.armies[o.id]}}}
  // 行动
  for(const a of armiesOf(f)){if(!S.armies[a.id])continue;
    if(a.siege){const c=S.cities[a.at];if(!c||friendly(f,c.owner)){a.siege=false;continue}const ratio=armyPow(a)/(cityDefPow(c.id)+0.1);
      const allies=besiegers(c.id).filter(b=>b.f===f).map(b=>b.id);const tot=allies.reduce((s,id)=>s+armyPow(S.armies[id]),0);const r2=tot/(cityDefPow(c.id)+0.1);if(r2>=1.18&&allies[0]===a.id)await attackCity(allies,c.id,'assault');else if(r2<0.45){retreat(a.id)}continue}
    if(a.mp<=0)continue;
    // 本城被围：出击
    const here=besiegers(a.at).filter(b=>b.f!==f&&attackStatus(f,b.f)!=='no');
    if(here.length&&S.cities[a.at].owner===f){const b=here[0];if(armyPow(a)+sidePow(S.cities[a.at].gar,[])*0.5>=armyPow(b)*0.95){await attackArmy([a.id],b.id,a.at);continue}}
    if(sumT(a.troops)<1500&&S.cities[a.at].owner===f){disbandArmy(a.id);continue}
    const opts=[];const my=armyPow(a);
    for(const n of nb(a.at)){const c=S.cities[n];
      if(friendly(f,c.owner)){const bs=besiegers(n).filter(b=>b.f!==f&&attackStatus(f,b.f)==='ok');bs.forEach(b=>{const r=my/(armyPow(b)+0.1);if(r>=0.95)opts.push({kind:'field',id:b.id,score:50+r*10})});continue}
      const st=attackStatus(f,c.owner);if(st!=='ok')continue;
      const dp=cityDefPow(n);const r=my/(dp+0.1);const val=c.pop+(c.cap?25:0)+(c.pass?15:0)+(S.flags.emperor===n?60:0)+(isMajor(c.owner)?10:0)+(c.owner===S.player?8:0);
      const co=nb(n).flatMap(m=>armiesAt(m)).filter(x=>x.f===f&&x.id!==a.id&&!x.siege&&x.mp>0);const coP=co.reduce((s,x)=>s+armyPow(x),0);const r2=(my+coP)/(dp+0.1);
      if(r>=1.2)opts.push({kind:'assault',id:n,score:val+r*8});else if(r2>=1.25&&co.length)opts.push({kind:'joint',id:n,with:co.map(x=>x.id),score:val+r2*6});else if(r>=0.9&&!c.pass)opts.push({kind:'siege',id:n,score:val*0.6+r*5})}
    if(opts.length){opts.sort((x,y)=>y.score-x.score);const o=opts[0];
      if(o.kind==='field'){await attackArmy([a.id],o.id,null)}else if(o.kind==='joint'){await attackCity([a.id,...o.with],o.id,'assault')}else await attackCity(a.id,o.id,o.kind);continue}
    // 无目标：向前线/受威胁城市移动
    const cur=S.cities[a.at];let best=null,bs=-1;
    for(const n of nb(a.at)){const c=S.cities[n];if(c.owner!==f)continue;let sc=isFrontier(f,c)?20:0;sc+=threatAt(f,c)/(cityDefPow(n)+1)*20;if(!isFrontier(f,cur)&&sc===0)sc=distFront(f,n)<distFront(f,a.at)?5:0;if(sc>bs){bs=sc;best=n}}
    if(best&&bs>(isFrontier(f,cur)?25:0)){await HOOK.anim(a.id,a.at,best);a.from=a.at;a.at=best;a.mp--}}
}
function distFront(f,id){const seen={[id]:0};let q=[id];let d=0;while(q.length&&d<8){const nq=[];for(const x of q){if(isFrontier(f,S.cities[x]))return d;for(const n of nb(x))if(seen[n]===undefined&&S.cities[n].owner===f){seen[n]=d+1;nq.push(n)}}q=nq;d++}return 9}

function aiDiplomacy(f){const me=facPow(f);const hasT=citiesOf(f).some(c=>nb(c.id).some(n=>{const o=S.cities[n].owner;return o!==f&&attackStatus(f,o)==='ok'}));
  for(const o of Object.values(S.fac)){if(!o.alive||o.id===f)continue;const r=rel(f,o.id);const adj=citiesOf(f).some(c=>nb(c.id).some(n=>S.cities[n].owner===o.id));
    if(o.major){const them=facPow(o.id);
      if(r.st==='war'&&adj&&me<them*0.65&&rnd()<0.18){if(o.id===S.player){S.pendingProps=(S.pendingProps||[]);S.pendingProps.push({type:'truce',from:f})}else if(rnd()<truceP(f,o.id)*1.2)doTruce(f,o.id,true)}
      else if(r.st==='peace'&&adj&&((me>them*1.7&&r.v<25&&rnd()<0.07)||(!hasT&&me>them*1.05&&rnd()<0.2))&&!(o.id===S.player&&S.turn<3)){declareWar(f,o.id)}
      else if(r.st==='ally'&&adj&&!hasT&&me>them*1.4&&S.turn>8&&rnd()<0.04){declareWar(f,o.id)}
      else if(r.st==='peace'&&r.v>=55&&commonEnemy(f,o.id)&&rnd()<0.12){if(o.id===S.player){S.pendingProps=(S.pendingProps||[]);S.pendingProps.push({type:'ally',from:f})}else doAlly(f,o.id)}
      if(r.st==='ally'&&S.fac[f].gold>1800&&rnd()<0.05)doGift(f,o.id,100)}
    else if(adj&&!['hl','rebel'].includes(o.id)){const cost=recruitMinorCost(o.id);if(S.fac[f].gold>cost+700&&me>facPow(o.id)*2.2&&rnd()<0.12)doRecruitMinor(f,o.id)}}}

function aiSearch(f){citiesOf(f).forEach(c=>{if(c.searched)return;const g=gensInCity(c.id,f).filter(genFree).sort((a,b)=>(gs(b)[2]+gs(b)[4])-(gs(a)[2]+gs(a)[4]))[0];if(!g)return;
  const has=Object.values(S.gens).some(x=>x.f==='free'&&!x.dead&&x.home===c.id&&x.appear<=S.year&&!x.loc);if(has||rnd()<0.15)doSearch(c.id,g.id)})}

function aiMinor(f){const Fa=S.fac[f];if(f==='rebel'||f==='hl'){Fa.gold+=30;}
  citiesOf(f).forEach(c=>{const target=Math.min(6000,c.pass?5000:c.pop*110);let need=target-sumT(c.gar);let guard=4;
    while(need>0&&guard-->0&&recruitCap(c)>0){const t=pick(['dao','qiang','gong']);const n=Math.min(1000,need,recruitCap(c));if(Fa.gold<UNITS[t].cost*n/1000+50)break;if(!doRecruit(c,t,n))break;need-=n}
    if(!c.build&&Fa.gold>500&&c.b.wall<4&&!c.pass)doBuild(c,'wall')})}
async function aiMinorSally(f){for(const c of citiesOf(f)){const bs=besiegers(c.id).filter(b=>b.f!==f);if(!bs.length)continue;const b=bs[0];const mine=sidePow(c.gar,gensInCity(c.id,f).map(g=>g.id));if(mine>=armyPow(b)*1.25)await attackArmy([],b.id,c.id)}}

// 回合流程
async function endTurn(){if(S.over)return;HOOK.busy('诸侯运筹中…');
  const majors=Object.values(S.fac).filter(x=>x.major&&x.alive&&x.id!==S.player).map(x=>x.id);
  for(const f of majors.sort(()=>rnd()-0.5)){HOOK.busy(`${S.fac[f].name}军行动中…`);await aiTurn(f);if(checkEnd()==='lose')break}
  for(const f of Object.values(S.fac).filter(x=>!x.major&&x.alive).map(x=>x.id)){aiMinor(f);await aiMinorSally(f)}
  await flushCaptives();
  // AI 外交提案
  if(S.pendingProps&&S.pendingProps.length){for(const p of S.pendingProps){if(!S.fac[p.from].alive)continue;const ok=await HOOK.proposal(p);if(ok){if(p.type==='truce')doTruce(p.from,S.player,true);else doAlly(p.from,S.player,true)}else addLog(`你拒绝了${S.fac[p.from].name}的${p.type==='truce'?'停战':'结盟'}提议。`)}S.pendingProps=[]}
  HOOK.busy('结算中…');await upkeepPhase();
  const end=checkEnd();if(end)S.over=end;HOOK.busy(null);return end}

function mxBar(v){const col=v>=60?'#3f6e4a':v>=35?'#b8862a':'#a8321f';return `<div class="bar"><i style="width:${v}%;background:${col}"></i></div>`}
function sideCity(c){const f=c.owner,mine=f===S.player,F0=S.fac[f];const gov=c.gov&&S.gens[c.gov];const gens=gensInCity(c.id).filter(g=>g.f===f);const r=rel(S.player,f);

  const bs=besiegers(c.id);if(bs.length)h+=`<div class="hint">⚔ 正被 ${bs.map(b=>S.fac[b.f].name+'军 '+gName(b.gens[0])).join('、')} 围困${mine?'，城中兵粮每季损耗一成！':''}</div>`;
  h+=`<div class="sec">驻军 <small>${fmtN(sumT(c.gar))}</small></div><div class="chips">${uchips(c.gar)}</div>`;

    <div class="acts"><button data-a="build" ${c.pass?'disabled':''}>建设</button><button data-a="recruit" ${recruitCap(c)<=0||bs.length?'disabled':''}>募兵</button><button data-a="form" ${!gens.filter(g=>!g.captive).length||sumT(c.gar)<100?'disabled':''}>编组军团</button>
    <button data-a="search" ${c.searched||!gens.length||c.pass?'disabled':''}>搜索人才</button><button data-a="relief" ${S.fac[f].grain<200||c.pass?'disabled':''}>赈济</button><button data-a="gov" ${!gens.length||c.pass?'disabled':''}>任命太守</button>
    ${bs.length?`<button class="red" data-a="sally" style="grid-column:span 3">出城迎击（驻军+城中军团）</button>`:''}</div>
    <div class="hint">募兵上限本季剩 ${recruitCap(c)} 人；赈济：粮 200 换民心 +10。</div>`}
  else{const adj=armiesOf(S.player).filter(a=>nb(a.at).includes(c.id)&&!a.siege);const st=attackStatus(S.player,f);
    h+=`<div class="hint">${st==='no'?`与${F0.name}${stName(r.st)}中，不可进攻。`:adj.length?`邻近有我军：${adj.map(a=>`<a data-a="goarmy" data-id="${a.id}" style="color:var(--seal);cursor:pointer;text-decoration:underline">${gName(a.gens[0])}</a>`).join('、')}，选中军团后点此城即可进攻。`:'需先派军团至相邻城池，方可进攻。'}${st==='declare'?`<br>注意：进攻将对${F0.name}宣战。`:''}</div>`}
  return h}
function stName(st){return {war:'交战',peace:'中立',truce:'停战',ally:'同盟',self:'本军'}[st]||st}
function armyRow(a){const L=S.gens[a.gens[0]];return `<div class="armyrow" data-a="goarmy" data-id="${a.id}">${seal(a.f,22)}<img src="${portrait(L,40)}" style="width:24px;height:30px;border-radius:3px"><div class="grow"><b>${gName(a.gens[0])}</b>军团 <small>${a.gens.length}将</small><br><small>${fmtN(sumT(a.troops))} · 士气 ${Math.round(a.morale)}${a.siege?' · 围城'+a.siegeT+'季':''}${a.f===S.player&&a.mp<=0?' · 已行动':''}</small></div></div>`}

  if(mine){const bes=besiegers(a.at).filter(b=>b.f!==a.f);

    else{h+=`<div class="acts"><button data-a="take" ${c.owner!==a.f?'disabled':''}>补充兵员</button><button data-a="drop" ${c.owner!==a.f?'disabled':''}>拨回驻军</button><button data-a="disband" ${c.owner!==a.f?'disabled':''}>解散入城</button>${bes.length&&a.mp>0?`<button class="red" data-a="fieldhere" style="grid-column:span 3">出城迎击围城之敌</button>`:''}</div>`;
      h+=`<div class="hint">${a.mp>0?'地图上<span style="color:#2a6e3c">绿圈</span>可行军，<span style="color:#a8321f">红圈</span>可进攻。点目标城池下令（电脑可直接右键）。':'本季已行动，下季恢复。'}</div>`}}
  return h}

async function onTap(sx,sy,right){if(!S||UI.modalOpen||UI.busy)return;const h=hitTest(sx,sy);const sel=UI.sel;
  const selA=sel&&sel.t==='army'?S.armies[sel.id]:null;
  if(selA&&selA.f===S.player&&!selA.siege){const reach=reachable(selA.id);
    let node=null;if(h&&h.type==='city')node=h.id;if(h&&h.type==='army'){const t=S.armies[h.id];if(t.f!==S.player&&t.siege&&(reach[t.at]||t.at===selA.at)){await fieldPrompt(selA,t);return}if(t.f!==S.player&&!t.siege&&reach[t.at]==='attack')node=t.at}
    if(node&&reach[node]){if(reach[node]==='move'){const from=selA.at;await animArmy(selA.id,from,node,380);moveArmy(selA.id,node);refreshAll();return}
      if(reach[node]==='attack'){await attackPrompt(selA,node);return}if(reach[node]==='field'){const t=besiegers(node).find(b=>b.f!==S.player);if(t)await fieldPrompt(selA,t);return}}
    if(right)return}
  if(!h){UI.sel=null}else if(h.type==='army'){UI.sel=(sel&&sel.t==='army'&&sel.id===h.id)?null:{t:'army',id:h.id}}else{UI.sel=(sel&&sel.t==='city'&&sel.id===h.id)?null:{t:'city',id:h.id}}
  refreshAll();if(!UI.sel&&window.innerWidth<900)$('#side').classList.add('collapsed');
  if(UI.sel&&window.innerWidth<900){$('#side').classList.remove('collapsed');const o=UI.sel.t==='city'?S.cities[UI.sel.id]:S.cities[S.armies[UI.sel.id].at];const[px,py]=w2s(o.x,o.y);if(py>MAP.h*0.45){MAP.cam.y+=(py-MAP.h*0.28)/MAP.cam.z;clampCam();mapDraw()}}}
function winWord(r){return r>=1.3?['必胜','#3f6e4a']:r>=1.12?['大优','#3f6e4a']:r>=1.0?['略优','#6a7a3a']:r>=0.9?['均势','#b8862a']:r>=0.8?['劣势','#a8521f']:['危险','#a8321f']}
async function attackPrompt(a,cid){const c=S.cities[cid];const st=attackStatus(a.f,c.owner);const D=cityDefenders(cid);
  const co=nb(cid).flatMap(n=>armiesAt(n)).filter(x=>x.f===S.player&&x.id!==a.id&&!x.siege&&x.mp>0);
  const calc=(ids)=>{const p=ids.reduce((s,id)=>s+armyPow(S.armies[id]),0);return p/(cityDefPow(cid)+0.1)};
  const body=`<div class="row" style="gap:12px"><div class="grow">${seal(c.owner,22)} <b>${c.name}</b>（${S.fac[c.owner].name}）<br><small>守军 ${fmtN(sumT(D.tr))} · 城墙 ${c.b.wall} 级 · 守将 ${D.gens.map(gName).join('、')||'无'}</small></div></div>
   ${st==='declare'?`<div class="hint">你与${S.fac[c.owner].name}目前${stName(rel(a.f,c.owner).st)}，进攻即宣战，其他诸侯亦会侧目。</div>`:''}
   ${co.length?`<div class="sec">联合出击</div>${co.map(x=>`<label class="lrow"><input type="checkbox" class="co" value="${x.id}" checked> ${gName(x.gens[0])}军团 ${fmtN(sumT(x.troops))}（${S.cities[x.at].name}）</label>`).join('')}`:''}
   <div class="sec">胜算</div><div id="odds"></div><div class="hint">强攻：一战定胜负，城墙越高越难。围城：大军驻于城下，每季守军减员一成，数季后可能开城投降（围城期间可随时强攻）。</div>`;
  const upd=m=>{const ids=[a.id,...[...m.querySelectorAll('.co:checked')].map(i=>i.value)];const r=calc(ids);const[w,col]=winWord(r);m.querySelector('#odds').innerHTML=`<b style="color:${col};font-size:18px">${w}</b>　<small>我军战力 ${Math.round(ids.reduce((s,id)=>s+armyPow(S.armies[id]),0)*10)} ： 守军 ${Math.round(cityDefPow(cid)*10)}</small>`};
  let ids=[a.id];const v=await modal(`进攻 ${c.name}`,body,[{label:'强攻',value:'assault',cls:'red',onClick:m=>{ids=[a.id,...[...m.querySelectorAll('.co:checked')].map(i=>i.value)];return 'assault'}},{label:'围城',value:'siege',onClick:m=>{ids=[a.id,...[...m.querySelectorAll('.co:checked')].map(i=>i.value)];return 'siege'}},{label:'取消',value:null}],{onOpen:m=>{upd(m);m.querySelectorAll('.co').forEach(i=>i.onchange=()=>upd(m))}});
  if(!v)return;UI.busy=true;await attackCity(ids,cid,v);UI.busy=false;if(S.armies[a.id])UI.sel={t:'army',id:a.id};else UI.sel={t:'city',id:cid};refreshAll();await afterAction()}
async function fieldPrompt(a,t){const r=armyPow(a)/(armyPow(t)+0.1);const[w,col]=winWord(r);
  const v=await modal(`迎击 ${S.fac[t.f].name}军`,`<p>${gName(t.gens[0])} 率 ${fmtN(sumT(t.troops))} 围攻 ${S.cities[t.at].name}，士气 ${Math.round(t.morale)}。</p><p>胜算：<b style="color:${col}">${w}</b></p><p class="hint">野战无城墙之利，胜则解围。</p>`,[{label:'出击',value:1,cls:'red'},{label:'取消',value:0}]);
  if(!v)return;UI.busy=true;await attackArmy([a.id],t.id,null);UI.busy=false;refreshAll();await afterAction()}
async function afterAction(){const e=checkEnd();if(e&&!S.over){S.over=e;await endScreen(e)}}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||!S)return;const a=el.dataset.a;const id=el.dataset.id;
  const c=UI.sel&&UI.sel.t==='city'?S.cities[UI.sel.id]:null;const ar=UI.sel&&UI.sel.t==='army'?S.armies[UI.sel.id]:null;

   case 'gen':if(el.closest('#modal')){closeModal();setTimeout(()=>genModal(S.gens[id]),30)}else genModal(S.gens[id]);break;
   case 'tax':c.tax=+el.dataset.v;refreshAll();break;

   case 'search':searchModal(c);break;

   case 'gov':govModal(c);break;
   case 'sally':{const t=besiegers(c.id).find(b=>b.f!==S.player);if(!t)break;const mine=armiesAt(c.id).filter(x=>x.f===S.player&&!x.siege).map(x=>x.id);UI.busy=true;await attackArmy(mine,t.id,c.id);UI.busy=false;refreshAll();await afterAction();break}
   case 'assault':{UI.busy=true;const al=besiegers(ar.at).filter(b=>b.f===S.player).map(b=>b.id);const cid=ar.at;await attackCity(al,cid,'assault');UI.busy=false;UI.sel=S.armies[ar.id]?{t:'army',id:ar.id}:{t:'city',id:cid};refreshAll();await afterAction();break}
   case 'unsiege':retreat(ar.id);toast('大军撤围');refreshAll();break;
   case 'fieldhere':{const t=besiegers(ar.at).find(b=>b.f!==S.player);if(t)await fieldPrompt(ar,t);break}
   case 'take':troopModal(ar,'take');break;case 'drop':troopModal(ar,'drop');break;
   case 'disband':disbandArmy(ar.id);UI.sel={t:'city',id:ar.at};toast('军团解散，兵马归入驻军');refreshAll();break;
  }});

function buildModal(c){const body=()=>`${c.build?`<div class="hint">正在营建 ${BUILDINGS[c.build.k].name}，尚需 ${c.build.left} 季。同一时间只能营建一处。</div>`:''}${Object.entries(BUILDINGS).map(([k,b])=>{const lv=c.b[k]||0;const cost=BUILD_COST[lv+1];return `<div class="lrow"><div class="grow"><b>${b.name}</b> <small>${lv} 级</small><br><small style="color:var(--ink2)">${b.desc}</small></div>${lv>=5?'<small>已满</small>':`<small>金 ${cost} · ${BUILD_TIME[lv+1]}季</small><button class="sm red" data-b="${k}" ${canBuild(c,k)?'':'disabled'}>营建</button>`}</div>`}).join('')}<div style="margin-top:8px;font-size:13px">现有金：${Math.round(S.fac[c.owner].gold)}</div>`;
  modal(`${c.name} · 建设`,body(),[{label:'关闭',value:0}],{onOpen:(m,close)=>{m.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(doBuild(c,b.dataset.b)){toast(`开始营建${BUILDINGS[b.dataset.b].name}`);close(1);refreshAll()}})}})}
function recruitModal(c){const f=c.owner;const opts=UNIT_ORDER.filter(t=>(!UNITS[t].f||UNITS[t].f===f));const amt={};opts.forEach(t=>amt[t]=1000);
  const row=t=>{const u=UNITS[t];const ok=unitAvail(f,c,t);const reqs=Object.entries(u.req).map(([k,v])=>BUILDINGS[k].name+v+'级').join('、');return `<div class="lrow"><span class="chip"><span class="u">${u.ch}</span></span><div class="grow"><b>${u.name.replace('　','')}</b>${u.f?' <small style="color:var(--seal)">特色</small>':''}<br><small style="color:var(--ink2)">攻${u.atk} 防${u.def} · 千人 金${u.cost} · 耗粮${u.up}/季${!ok?' · 需'+reqs:''}</small></div>${ok?`<div class="stepper"><button data-s="${t}" data-d="-500">−</button><b id="am_${t}">${amt[t]}</b><button data-s="${t}" data-d="500">+</button></div><button class="sm red" data-r="${t}">募</button>`:''}</div>`};
  const body=`<div style="font-size:13px" id="rinfo"></div>${opts.map(row).join('')}`;
  const info=m=>{m.querySelector('#rinfo').innerHTML=`本季尚可募 <b>${recruitCap(c)}</b> 人　现有金 <b>${Math.round(S.fac[f].gold)}</b>　民心 ${Math.round(c.mx)}（募兵会降低民心与人口）`};
  modal(`${c.name} · 募兵`,body,[{label:'完成',value:0,cls:'red'}],{onOpen:m=>{info(m);
    m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const t=b.dataset.s;amt[t]=clamp(amt[t]+(+b.dataset.d),500,Math.max(500,recruitCap(c)));m.querySelector('#am_'+t).textContent=amt[t]});
    m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const t=b.dataset.r;const n=Math.min(amt[t],recruitCap(c));if(doRecruit(c,t,n)){toast(`募得${UNITS[t].name.replace('　','')} ${n}`);info(m);refreshAll()}else toast('金钱或募兵额度不足')})}})}
function formModal(c){const f=c.owner;const gens=gensInCity(c.id,f).filter(g=>!g.captive).sort((a,b)=>gs(b)[0]-gs(a)[0]);const tr={};Object.entries(c.gar).forEach(([t,n])=>tr[t]=Math.floor(n*0.7/100)*100);
  let lead=gens[0]?gens[0].id:null;const subs=new Set();
  const cap=()=>{const L=S.gens[lead];return 3000+gs(L)[0]*100+(hasT(L,'统帅')?3000:0)};
  const body=`<div class="sec">主将 <small>决定兵力上限</small></div><select id="lead">${gens.map(g=>`<option value="${g.id}">${g.name}　统${gs(g)[0]} 武${gs(g)[1]} 智${gs(g)[2]}</option>`).join('')}</select>
   <div class="sec">副将 <small>至多两名</small></div><div id="subs">${gens.map(g=>`<label class="lrow" data-g="${g.id}"><input type="checkbox" value="${g.id}"> ${g.name}　<small>武${gs(g)[1]} 智${gs(g)[2]}${g.traits.length?' · '+g.traits.join('、'):''}</small></label>`).join('')}</div>

  $('#endBtn').onclick=doEndTurn;
  document.querySelectorAll('#tNav button').forEach(b=>b.onclick=()=>menu(b.dataset.m));
  $('#menuBtn').onclick=()=>modal('菜单',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[['fac','天下形势'],['gens','麾下武将'],['dip','外交'],['save','存档 / 读档'],['help','玩法说明']].map(([k,t])=>`<button data-mm="${k}" style="padding:12px">${t}</button>`).join('')}</div>`,[{label:'关闭',value:0}],{onOpen:(m,close)=>m.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{close(0);setTimeout(()=>menu(b.dataset.mm),30)})});
  $('#sideHandle').onclick=()=>$('#side').classList.toggle('collapsed');
  $('#zin').onclick=()=>zoomAt(MAP.w/2,MAP.h/2,1.3);$('#zout').onclick=()=>zoomAt(MAP.w/2,MAP.h/2,1/1.3);$('#zfit').onclick=()=>{mapFit();mapDraw()};
  $('#loadBtn').onclick=()=>saveModalTitle();
  document.addEventListener('keydown',e=>{if(!S||$('#game').style.display!=='flex')return;if(e.key==='Escape'){if(UI.modalOpen)closeModal();else{UI.sel=null;refreshAll()}}if(e.key==='Enter'&&!UI.modalOpen)doEndTurn()});
  if(window.innerWidth<900)$('#side').classList.add('collapsed')}
function menu(k){({fac:facModal,gens:gensModal,dip:dipModal,save:saveModal,help:helpModal})[k]()}
function saveModalTitle(){S=null;modal('读取存档',`<textarea id="sv_in" placeholder="粘贴存档码"></textarea><div class="row" style="margin-top:6px"><label style="border:1px solid var(--ink2);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--paper3)">打开存档文件<input type="file" id="sv_file" accept=".txt,.mzsave,.json" style="display:none"></label></div>`,
  [{label:'读取',cls:'red',keep:true,onClick:async m=>{try{await importSave(m.querySelector('#sv_in').value);m.__close(1);enterGame(false);toast('读档成功')}catch(e){toast('读档失败：'+e.message)}}},{label:'取消',value:0}],
  {onOpen:(m,close)=>{m.querySelector('#sv_file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{await importSave(r.result);close(1);enterGame(false);toast('读档成功')}catch(er){toast('读档失败：'+er.message)}};r.readAsText(f)}}})}
window.addEventListener('load',()=>{boot();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S&&UI.mapReady)mapDraw()})});
</script>
</body></html>
