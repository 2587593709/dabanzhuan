<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#241d17">
<title>三国墨战 · 会战</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>:root{--paper:#efe4ca;--paper2:#e4d6b4;--paper3:#f6eedb;--ink:#2b2621;--ink2:#5a4e40;--red:#a8321f;--gold:#b8862a;--blue:#4f6a8f;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#241d17;color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:1px solid var(--ink2);background:var(--paper3);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:14px;touch-action:manipulation}
button:active{transform:translateY(1px)}
button.red{background:var(--red);color:#f6eedb;border-color:#6e1e12;font-weight:700}
button:disabled{opacity:.4;cursor:default}
.seal{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--red);color:#f6eedb;font-weight:900;border-radius:3px;font-size:13px;flex:none}
.screen{position:fixed;inset:0;display:none}
/* ---------- 菜单 ---------- */
#menu{overflow-y:auto;background:radial-gradient(ellipse at 30% 20%,#f3e9d2 0%,#e4d6b4 55%,#c9b68e 100%)}
#menu::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 90%,rgba(60,55,45,.18),transparent 40%),radial-gradient(circle at 10% 80%,rgba(80,95,80,.14),transparent 35%)}
.mwrap{position:relative;max-width:560px;margin:0 auto;padding:calc(28px + var(--sat)) 16px calc(30px + var(--sab))}
h1{font-size:54px;font-weight:900;letter-spacing:10px;text-align:center;margin:6px 0 0;text-shadow:2px 2px 0 rgba(168,50,31,.18)}
.sub{text-align:center;letter-spacing:6px;color:var(--ink2);margin:4px 0 20px}
.card{background:rgba(246,238,219,.88);border:1px solid rgba(43,38,33,.45);border-radius:8px;padding:14px;margin:12px 0;box-shadow:0 2px 0 rgba(43,38,33,.12)}
.card.slim{padding:10px 14px}
.ctitle{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ctitle small{font-size:12px;font-weight:400;color:var(--ink2);margin-left:auto}
.intro{font-size:14px;line-height:1.75;margin:6px 0 10px;color:#3a322a}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row button{flex:1;min-width:120px;padding:10px}
button.fac{display:flex;align-items:center;justify-content:center;gap:8px;border-color:var(--c);font-weight:700}
.opt{display:flex;align-items:center;gap:8px;margin:7px 0}
.opt label{width:34px;font-size:13px;color:var(--ink2);flex:none}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{padding:5px 9px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button .seal{width:16px;height:16px;font-size:10px;margin-right:4px}
.foot{text-align:center;font-size:12px;color:var(--ink2)}
/* ---------- 战场 ---------- */
#battle{background:#2a241d;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hTop{position:absolute;left:calc(8px + var(--sal));top:calc(8px + var(--sat));display:flex;gap:8px;align-items:center;background:rgba(244,236,214,.92);border:1px solid rgba(43,38,33,.5);border-radius:6px;padding:6px 10px 6px 6px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#hTop .seal{width:40px;height:40px;font-size:26px;border-radius:4px}
.hrow{display:flex;align-items:center;gap:6px;font-size:14px}
.hrow b{font-weight:700;white-space:nowrap}
.bar2{display:flex;width:170px;height:7px;border:1px solid rgba(43,38,33,.4);background:#ccc}
.bar2 i{display:block;height:100%}
.hinfo{display:flex;gap:9px;font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap}
#hTitle{display:none;font-weight:700;color:var(--ink)}
#hMor{letter-spacing:-1px}
#plaque{position:absolute;right:calc(8px + var(--sar));top:calc(8px + var(--sat));background:rgba(244,236,214,.94);border:3px double rgba(43,38,33,.7);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#plT{writing-mode:vertical-rl;font-size:34px;font-weight:900;letter-spacing:6px;line-height:1}
.pseal{writing-mode:vertical-rl;background:var(--red);color:#f6eedb;font-size:12px;padding:5px 2px;border-radius:2px;font-weight:700;letter-spacing:1px}
#ctl{position:absolute;top:calc(8px + var(--sat));right:calc(76px + var(--sar));display:flex;gap:5px}
#ctl button{min-width:40px;height:34px;padding:0 9px;background:rgba(244,236,214,.94);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#ctl button.on{background:var(--ink);color:var(--paper)}
#mini{position:absolute;right:calc(8px + var(--sar));bottom:calc(128px + var(--sab));width:200px;height:133px;border:2px solid rgba(43,38,33,.75);background:#e8dbb9;box-shadow:0 2px 6px rgba(0,0,0,.3);touch-action:none}
#feed{position:absolute;left:calc(8px + var(--sal));top:calc(76px + var(--sat));width:290px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
#feed div{background:rgba(244,236,214,.9);border-left:4px solid var(--ink);padding:4px 9px;font-size:13px;border-radius:0 4px 4px 0;animation:fin .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#feed div.good{border-color:#3f6e4a}#feed div.bad{border-color:var(--red)}#feed div.big{font-weight:700;font-size:14px}
@keyframes fin{from{opacity:0;transform:translateX(-10px)}}
#banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0;transition:opacity .5s}
#banner.show{opacity:1}
#banner .bt{font-size:40px;font-weight:900;letter-spacing:8px;color:#f6eedb;text-shadow:0 0 12px rgba(0,0,0,.8),2px 2px 0 var(--red)}
#banner .bs{font-size:16px;color:#f6eedb;text-shadow:0 0 8px rgba(0,0,0,.9);margin-top:6px;max-width:80vw}
#deployBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(124px + var(--sab));background:rgba(244,236,214,.95);border:1px solid rgba(43,38,33,.6);border-radius:8px;padding:8px 10px;display:none;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(0,0,0,.35);max-width:94vw}
.dtxt{font-size:13px}
.dbtns{display:flex;gap:6px;flex:none}
#bStart{font-size:16px;padding:8px 18px}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#abil{display:flex;gap:10px;pointer-events:auto;min-height:56px;align-items:flex-end}
.ab{width:56px;height:56px;border-radius:50%;border:3px solid rgba(246,238,219,.85);color:#f6eedb;font-size:17px;font-weight:900;padding:0;box-shadow:0 0 0 2px rgba(43,38,33,.8),0 3px 8px rgba(0,0,0,.45);position:relative;letter-spacing:1px;line-height:1.05}
.ab small{position:absolute;right:-6px;top:-6px;font-size:10px;color:#f6eedb;background:rgba(43,38,33,.9);border-radius:8px;padding:0 4px;line-height:15px;font-weight:400;letter-spacing:0}.ab small:empty{display:none}
.ab.on{box-shadow:0 0 0 3px #f0c24a,0 3px 8px rgba(0,0,0,.45)}
.ab:disabled{opacity:.35}
#cardsWrap{display:flex;gap:6px;pointer-events:auto;max-width:100%;align-items:stretch}
.allcol{display:flex;flex-direction:column;gap:4px;flex:none}.allbtn{width:40px;flex:1;padding:0 2px;font-size:12px;font-weight:700;line-height:1.2;background:rgba(244,236,214,.95)}.allbtn.on{background:var(--ink);color:var(--paper)}
#cards{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px}
#cards::-webkit-scrollbar{display:none}
.uc{flex:none;width:62px;height:70px;background:rgba(244,236,214,.95);border:1px solid rgba(43,38,33,.55);border-radius:5px;display:flex;flex-direction:column;align-items:center;padding:3px 2px 3px;position:relative;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.25);user-select:none}
.uc.sel{border:2px solid var(--red);padding:2px 1px 2px;background:#fbf3de}
.uc .g{width:26px;height:26px;border-radius:50%;color:#f6eedb;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(43,38,33,.7)}
.uc .nm{font-size:11px;line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;max-width:58px;font-weight:600}
.uc .ct{font-size:10px;color:var(--ink2);line-height:1.1}
.uc .mb{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:rgba(43,38,33,.2)}
.uc .mb i{display:block;height:100%}
.uc.rout{background:#d6ccbc}.uc.rout::after{content:"溃";position:absolute;top:2px;right:3px;color:var(--red);font-weight:900;font-size:13px}
.uc.dead{opacity:.35;filter:grayscale(1)}
.uc .hd{position:absolute;top:2px;left:3px;font-size:9px;background:var(--ink);color:var(--paper);padding:0 2px;border-radius:2px}
#pausedTag{position:absolute;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);background:rgba(43,38,33,.85);color:#f6eedb;padding:4px 16px;border-radius:14px;font-size:14px;letter-spacing:4px;display:none;pointer-events:none}
/* ---------- 弹窗 ---------- */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,16,12,.55);z-index:20;padding:12px}
#modal.show{display:flex}
.mbox{background:var(--paper);border:1px solid var(--ink2);border-radius:8px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5);position:relative}
.mbox h2{margin:0 0 8px;font-size:22px;font-weight:900;letter-spacing:2px}
.mbox p{font-size:14px;line-height:1.75;margin:6px 0}
.mbox .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.mbox.hasStamp>h2,.mbox.hasStamp>p:first-of-type{padding-right:78px}
.stamp{position:absolute;right:18px;top:12px;width:66px;height:66px;border:4px solid var(--red);color:var(--red);font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;border-radius:6px;transform:rotate(-12deg);opacity:.85}
table.st{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.st td,table.st th{border-bottom:1px solid rgba(43,38,33,.2);padding:3px 4px;text-align:left}
table.st th{font-weight:700;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.help h3{font-size:15px;margin:10px 0 4px}
.help li{font-size:13px;line-height:1.7}
/* ---------- 单挑 ---------- */
#duel{position:fixed;inset:0;z-index:30;display:none;background:radial-gradient(ellipse at center,rgba(40,32,24,.88),rgba(10,8,6,.96));color:#f6eedb;align-items:center;justify-content:center;flex-direction:column}
#duel.show{display:flex}
.dtitle{font-size:44px;font-weight:900;letter-spacing:14px;color:#f6eedb;text-shadow:3px 3px 0 var(--red);margin-bottom:10px}
.dstage{display:flex;align-items:center;gap:26px;position:relative}
.dside{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.dside img{width:132px;height:165px;border:3px solid #d9c9a3;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.6);transition:transform .15s}
.dside .dn{font-size:22px;font-weight:900;letter-spacing:4px}
.dside .dw{font-size:12px;color:#d9c9a3}
.dhp{width:130px;height:8px;background:#3a3028;border:1px solid #d9c9a3}
.dhp i{display:block;height:100%;background:#c9442a;transition:width .2s}
.dvs{font-size:28px;font-weight:900;color:#d9c9a3}
.dround{font-size:18px;margin-top:16px;min-height:26px;letter-spacing:2px}
.dtext{font-size:16px;min-height:52px;margin-top:6px;text-align:center;max-width:86vw;line-height:1.6;color:#efe2c4}
.dres{font-size:64px;font-weight:900;color:var(--red);text-shadow:0 0 12px rgba(0,0,0,.8);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-10deg) scale(2);opacity:0;transition:all .35s;border:5px solid var(--red);padding:0 14px;border-radius:6px;background:rgba(246,238,219,.9)}
.dres.show{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}
.slash{position:absolute;left:50%;top:50%;width:220px;height:5px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translate(-50%,-50%) rotate(-30deg) scaleX(0);opacity:0}
.slash.go{animation:sl .28s}
@keyframes sl{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,-30deg)) scaleX(0)}60%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,-30deg)) scaleX(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r,-30deg)) scaleX(1.1)}}
#duel .dskip{margin-top:18px;background:transparent;color:#d9c9a3;border-color:#d9c9a3}
/* ---------- 窄屏（手机竖屏） ---------- */
@media (max-width:640px){
  #plaque{display:none}
  #ctl{right:calc(6px + var(--sar));top:calc(6px + var(--sat));gap:4px}
  #ctl button{min-width:34px;height:32px;padding:0 7px;font-size:13px}
  #hTop{top:calc(46px + var(--sat));left:calc(6px + var(--sal));padding:4px 8px 4px 4px;gap:6px}
  #hTop .seal{width:30px;height:30px;font-size:19px}
  .bar2{width:110px}
  .hrow{font-size:12px}
  .hinfo{gap:6px;font-size:11px}
  #hTitle{display:inline}
  #mini{width:120px;height:80px;top:calc(46px + var(--sat));bottom:auto;right:calc(6px + var(--sar))}
  #feed{top:calc(104px + var(--sat));width:62vw}
  #feed div{font-size:12px;padding:3px 7px}
  .ab{width:48px;height:48px;font-size:15px}
  #abil{gap:8px;min-height:48px}
  .uc{width:56px;height:64px}
  .uc .g{width:22px;height:22px;font-size:13px}
  #deployBar{flex-direction:column;gap:6px;bottom:calc(118px + var(--sab));width:92vw}
  .dtxt{font-size:12px;text-align:center}
  h1{font-size:44px}
  .dside{width:120px}.dside img{width:104px;height:130px}.dtitle{font-size:34px}
}
/* ---------- 手机横屏 ---------- */
@media (max-height:500px){
  #plaque{display:none}
  #hTop{padding:3px 8px 3px 3px}#hTop .seal{width:28px;height:28px;font-size:18px}
  #hTitle{display:inline}
  #ctl button{height:30px}
  #mini{width:130px;height:87px;bottom:auto;top:calc(44px + var(--sat))}
  #feed{top:calc(52px + var(--sat))}
  #bottom{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:8px}
  #abil{order:2;gap:6px;min-height:0;flex-wrap:wrap;justify-content:flex-end;max-width:46vw}
  .ab{width:42px;height:42px;font-size:13px}.ab small{display:none}
  #cardsWrap{order:1;flex:1;min-width:0}
  .uc{width:52px;height:58px}.uc .g{width:20px;height:20px;font-size:12px}.uc .nm{font-size:10px}
  #deployBar{bottom:calc(70px + var(--sab))}
  .dtitle{font-size:28px;margin-bottom:4px}.dside img{width:84px;height:105px}.dround{margin-top:6px}.dtext{min-height:40px;font-size:14px}
}
</style></head><body>
<div id="menu" class="screen"><div class="mwrap">
  <h1>三国墨战</h1><div class="sub">M1 · 水墨会战</div>
  <div class="card">
    <div class="ctitle"><span class="seal">史</span>濮阳之战<small>兴平元年 · 公元194年</small></div>
    <p class="intro" id="pyIntro"></p>
    <div class="row"><button class="fac" data-py="0" style="--c:#4f6a8f"><span class="seal" style="background:#4f6a8f">曹</span>执曹军（攻）</button><button class="fac" data-py="1" style="--c:#6e4a7a"><span class="seal" style="background:#6e4a7a">吕</span>执吕军（守）</button></div>
  </div>
  <div class="card">
    <div class="ctitle"><span class="seal">战</span>自定义会战</div>
    <div class="opt"><label>我方</label><div class="seg" id="cMe"></div></div>
    <div class="opt"><label>敌方</label><div class="seg" id="cFoe"></div></div>
    <div class="opt"><label>规模</label><div class="seg" id="cSize"></div></div>
    <div class="opt"><label>地形</label><div class="seg" id="cTer"></div></div>
    <div class="row"><button id="cGo" class="red">开　战</button><button id="cWatch">观战（AI 对 AI）</button></div>
  </div>
  <div class="card slim"><div class="opt"><label>难度</label><div class="seg" id="cDiff"></div></div>
    <div class="row"><button id="helpBtn">操作说明</button></div></div>
  <p class="foot">电脑、手机、平板均可游玩 · 横屏体验更佳</p>
</div></div>
<div id="battle" class="screen">
  <canvas id="cv"></canvas>
  <div id="hTop"><span class="seal" id="hSeal">曹</span><div class="hbars">
    <div class="hrow"><b id="hN0"></b><span class="bar2"><i id="hB0"></i><i id="hB1"></i></span><b id="hN1"></b></div>
    <div class="hinfo"><span id="hTitle"></span><span id="hMor"></span><span id="hHour"></span><span id="hWind"></span></div></div></div>
  <div id="plaque"><div id="plT"></div><span class="pseal" id="plEra"></span></div>
  <div id="ctl"><button id="bPause" title="暂停 (空格)">❚❚</button><button id="bSpeed" title="速度">×1</button><button id="bAuto" title="托管：由 AI 指挥我军">托管</button><button id="bMenu" title="菜单">☰</button></div>
  <canvas id="mini"></canvas>
  <div id="feed"></div>
  <div id="banner"></div>
  <div id="deployBar"><div class="dtxt">布阵阶段：选中部队后点地面调整位置，可拖出阵线</div><div class="dbtns"><button id="bAutoDeploy">自动布阵</button><button id="bStart" class="red">开　战</button></div></div>
  <div id="bottom"><div id="abil"></div><div id="cardsWrap"><div class="allcol"><button id="bAll" class="allbtn">全军</button><button id="bMulti" class="allbtn">多选</button></div><div id="cards"></div></div></div>
  <div id="pausedTag">暂　停</div>
</div>
<div id="modal"></div>
<script>// ================= 三国墨战 · 数据层（194 群雄割据 · 中原篇） =================
const LON0=111.4,LON1=119.9,LAT0=38.4,LAT1=31.0,WW=1600,WH=1200;
const geo=(lon,lat)=>[60+(lon-LON0)/(LON1-LON0)*(WW-120),60+(LAT0-lat)/(LAT0-LAT1)*(WH-120)];

// 势力：major=可玩大势力
const FACTIONS=[
 {id:'cao',name:'曹操',ch:'曹',color:'#4f6a8f',major:true,leader:'caocao',gold:1600,grain:3200,diff:3,desc:'据兖州残部，吕布袭取濮阳。四面受敌，然谋臣如雨、猛将如云。'},
 {id:'lb',name:'吕布',ch:'吕',color:'#6e4a7a',major:true,leader:'lvbu',gold:1300,grain:2400,diff:3,desc:'人中吕布，趁虚夺得兖州三城。兵锋最利，然根基浅薄、粮草不足。'},
 {id:'lbei',name:'刘备',ch:'刘',color:'#4f7d4f',major:true,leader:'liubei',gold:1200,grain:3600,diff:4,desc:'陶谦三让徐州，刘备初得基业。仁德服众，然兵微将寡，强敌环伺。'},
 {id:'ys',name:'袁术',ch:'术',color:'#a8742a',major:true,leader:'yuanshu',gold:2400,grain:4200,diff:2,desc:'据淮南富庶之地，四世三公。孙策寄身麾下，暗怀传国玉玺。'},
 {id:'yshao',name:'袁绍',ch:'绍',color:'#b89a3a',major:true,leader:'yuanshao',gold:2800,grain:5200,diff:1,desc:'雄踞河北，带甲十万，谋士如林。北方最强，然内有猜忌之患。'},

// ================= 地形生成（纯数据，无 DOM） =================
function mulberry(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(seed){ // 平滑值噪声
  const R=mulberry(seed);const P=new Float32Array(64*64);for(let i=0;i<P.length;i++)P[i]=R();
  const g=(x,y)=>P[((y&63)<<6)|(x&63)];const sm=t=>t*t*(3-2*t);
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi);const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf}}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l;t=t<0?0:t>1?1:t;const x=ax+t*dx-px,y=ay+t*dy-py;return Math.sqrt(x*x+y*y)}
function distPoly(px,py,pts){let m=1e9;for(let i=0;i<pts.length-1;i++){const d=distSeg(px,py,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);if(d<m)m=d}return m}

const TCS=16; // 地形格
function genTerrain(spec){
  const W=spec.W,H=spec.H,R=mulberry(spec.seed||7);const nz=vnoise((spec.seed||7)+11),nz2=vnoise((spec.seed||7)+23);
  const T={W,H,cs:TCS,gw:Math.ceil(W/TCS),gh:Math.ceil(H/TCS),hills:[],forests:[],trees:[],roads:[],river:null,camp:null,tents:[],fences:[],rocks:[]};
  const type=spec.type||'plain';
  const rr=(a,b)=>a+R()*(b-a);
  // ---- 山丘 ----
  if(type==='puyang'){
    T.hills.push({x:560,y:360,r:260,a:32},{x:900,y:1380,r:220,a:22},{x:2050,y:1300,r:260,a:26},{x:1950,y:300,r:200,a:18});
    T.forests.push({x:1080,y:1330,r:150},{x:1220,y:1420,r:120},{x:330,y:1420,r:140},{x:1900,y:260,r:130},{x:2120,y:420,r:90},{x:960,y:250,r:110});
    T.roads.push([[0,820],[400,810],[800,790],[1200,800],[1500,800],[1900,805],[2400,790]],[[1500,800],[1560,1100],[1500,1600]],[[800,790],[760,500],[700,0]]);
    T.camp={x:1520,y:800,rx:230,ry:250,side:1,gates:[Math.PI,0,Math.PI/2,-Math.PI/2]};
  }else{
    const nh={plain:3,hills:7,forest:4,river:3}[type]||3;
    for(let i=0;i<nh;i++)T.hills.push({x:rr(200,W-200),y:rr(150,H-150),r:rr(160,320),a:type==='hills'?rr(28,50):rr(12,26)});
    const nf={plain:4,hills:4,forest:11,river:4}[type]||4;
    for(let i=0;i<nf;i++){let x=rr(150,W-150),y=rr(120,H-120);if(Math.abs(x-W/2)<520&&type!=='forest'&&R()<0.6)x=x<W/2?x-500:x+500;
      x=Math.max(120,Math.min(W-120,x));const r=type==='forest'?rr(100,190):rr(80,150);T.forests.push({x,y,r});if(R()<0.6)T.forests.push({x:x+rr(-r,r),y:y+rr(-r,r),r:r*0.7})}
    T.roads.push([[0,H*0.5+rr(-200,200)],[W*0.3,H*0.5+rr(-150,150)],[W*0.6,H*0.5+rr(-150,150)],[W,H*0.5+rr(-200,200)]]);
    if(type==='river'){const x0=W*0.5+rr(-80,80);const pts=[];for(let i=0;i<=10;i++){pts.push([x0+Math.sin(i*0.9+R()*2)*90,-40+i*(H+80)/10])}T.river={pts,w:70}}
  }
  // ---- 格 ----
  const N=T.gw*T.gh;T.h=new Float32Array(N);T.forest=new Uint8Array(N);T.water=new Uint8Array(N);T.fort=new Int8Array(N).fill(-1);T.road=new Uint8Array(N);
  for(let gy=0;gy<T.gh;gy++)for(let gx=0;gx<T.gw;gx++){const x=(gx+0.5)*TCS,y=(gy+0.5)*TCS,i=gy*T.gw+gx;
    let h=0;for(const k of T.hills){const dx=x-k.x,dy=y-k.y;h+=k.a*Math.exp(-(dx*dx+dy*dy)/(k.r*k.r))}h+=(nz(x/180,y/180)-0.5)*6;T.h[i]=h;
    for(const f of T.forests){const dx=x-f.x,dy=y-f.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<f.r*(0.8+0.35*nz2(x/60,y/60))){T.forest[i]=1;break}}
    if(T.river){if(distPoly(x,y,T.river.pts)<T.river.w/2){T.water[i]=1;T.forest[i]=0}}
    for(const rd of T.roads)if(distPoly(x,y,rd)<14){T.road[i]=1;T.forest[i]=0}
    if(T.camp){const c=T.camp;const e=((x-c.x)/c.rx)**2+((y-c.y)/c.ry)**2;if(e<1)T.fort[i]=c.side;if(e<1.1)T.forest[i]=0}
  }
  // ---- 树（渲染用） ----
  for(const f of T.forests){const n=Math.round(f.r*f.r/900);for(let i=0;i<n;i++){const a=R()*6.283,d=Math.sqrt(R())*f.r;const x=f.x+Math.cos(a)*d,y=f.y+Math.sin(a)*d;if(tAt(T,T.forest,x,y))T.trees.push({x,y,s:0.8+R()*0.6,k:R()})}}
  T.trees.sort((a,b)=>a.y-b.y);
  // ---- 营寨 ----
  if(T.camp){const c=T.camp;const n=150;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let gate=false;for(const g of c.gates){let d=Math.abs(((a-g+Math.PI*3)%(Math.PI*2))-Math.PI);if(d<0.09)gate=true}
      if(!gate)T.fences.push({x:c.x+Math.cos(a)*c.rx,y:c.y+Math.sin(a)*c.ry,a})}
    for(let i=0;i<22;i++){const a=R()*6.283,d=Math.sqrt(R())*0.8;const x=c.x+Math.cos(a)*c.rx*d,y=c.y+Math.sin(a)*c.ry*d;if(Math.abs(y-800)<26)continue;T.tents.push({x,y,s:0.9+R()*0.4})}
    T.tents.sort((a,b)=>a.y-b.y)}
  // ---- 燃料（火攻格 32） ----
  T.fcs=32;T.fgw=Math.ceil(W/32);T.fgh=Math.ceil(H/32);T.fuel=new Float32Array(T.fgw*T.fgh);
  for(let gy=0;gy<T.fgh;gy++)for(let gx=0;gx<T.fgw;gx++){const x=(gx+0.5)*32,y=(gy+0.5)*32;let f=0;
    if(tAt(T,T.forest,x,y))f=2.4;else if(!tAt(T,T.water,x,y)&&!tAt(T,T.road,x,y)){const v=nz2(x/260+7,y/260+3);f=v>0.46?1:0}
    if(T.camp){const c=T.camp;const e=((x-c.x)/c.rx)**2+((y-c.y)/c.ry)**2;if(e<1)f=Math.max(f,0.9);for(const t of T.tents)if(Math.abs(t.x-x)<22&&Math.abs(t.y-y)<22)f=1.6}
    T.fuel[gy*T.fgw+gx]=f}
  // 草丛（渲染）
  T.grass=[];const ng=Math.round(W*H/2600);for(let i=0;i<ng;i++){const x=R()*W,y=R()*H;if(tAt(T,T.water,x,y)||tAt(T,T.road,x,y))continue;T.grass.push({x,y,s:0.6+R()*0.8,k:R()})}
  for(let i=0;i<40;i++){const x=R()*W,y=R()*H;if(!tAt(T,T.water,x,y))T.rocks.push({x,y,s:0.6+R()*0.9})}
  return T}
function tAt(T,arr,x,y){let gx=Math.floor(x/T.cs),gy=Math.floor(y/T.cs);if(gx<0||gy<0||gx>=T.gw||gy>=T.gh)return 0;return arr[gy*T.gw+gx]}
function hAt(T,x,y){let gx=Math.floor(x/T.cs),gy=Math.floor(y/T.cs);gx=gx<0?0:gx>=T.gw?T.gw-1:gx;gy=gy<0?0:gy>=T.gh?T.gh-1:gy;return T.h[gy*T.gw+gx]}
function fortAt(T,x,y){let gx=Math.floor(x/T.cs),gy=Math.floor(y/T.cs);if(gx<0||gy<0||gx>=T.gw||gy>=T.gh)return -1;return T.fort[gy*T.gw+gx]}

// ---------------- 建立战场 ----------------
function buildBattle(cfg){
  const T=genTerrain(cfg.map);
  B={cfg,T,W:T.W,H:T.H,t:0,tick:0,rng:mulberry(cfg.seed||12345),phase:'deploy',sides:[],units:[],sol:[],arrows:[],ev:[],nextU:1,nextS:1,
     duel:null,ask:null,result:null,headless:!!cfg.headless,log:[],duelLog:[],pairCD:{},
     hourLen:cfg.hourLen||150,hour0:cfg.hour==null?4:cfg.hour,tLimit:cfg.tLimit||1500};
  const wv=[[1,0],[0.707,0.707],[0,1],[-0.707,0.707],[-1,0],[-0.707,-0.707],[0,-1],[0.707,-0.707]][cfg.wind?cfg.wind.from:0];
  B.wind={from:cfg.wind?cfg.wind.from:0,str:cfg.wind?cfg.wind.str:0.3,x:-wv[0],y:-wv[1]};
  // 空间格
  B.gw=Math.ceil((B.W-2*GOX)/GC);B.gh=Math.ceil((B.H-2*GOY)/GC);B.head=new Int32Array(B.gw*B.gh);B.next=new Int32Array(8000);
  // 火
  const nf=T.fgw*T.fgh;B.fire={burn:new Float32Array(nf),st:new Uint8Array(nf),list:[],fuel:T.fuel.slice()};
  cfg.sides.forEach((sd,i)=>{const F=FACTIONS.find(f=>f.id===sd.fac);
    const side={i,fac:sd.fac,F,name:sd.name||F.name+'军',color:F.color,ch:F.ch,attack:!!sd.attack,deploy:sd.deploy,face:sd.face||0,ai:!!sd.ai,units:[],reinf:(sd.reinf||[]).map(r=>Object.assign({done:false},r)),cmd:null,boost:0,boostT:0,home:{x:Math.cos(sd.face||0)<0?1:-1},kills:0,morMod:sd.morMod||0,aiState:{}};
    B.sides.push(side);
    for(const d of sd.units)mkUnit(side,d,d.x,d.y,side.face);
  });
  B.sides.forEach(sd=>{sd.cmd=sd.units.find(u=>u.gs&&u.gs.id===sd.F.leader)||sd.units.find(u=>u.gs)||null;if(sd.cmd)sd.cmd.isCmd=true});
  rebuild();
  return B}

function mkUnit(side,d,x,y,ang){
  const T=Object.assign({},BT[d.t],d.ext||{});const gs=d.gen?gStat(d.gen):null;
  const u={id:B.nextU++,side:side.i,S:side,t:d.t,T,gs,label:T.label||BT_NAME(d.t),n0:T.n,n:0,sol:[],bySlot:[],cols:T.cols,sp:T.sp,spy:T.spy,
    x,y,ang,ord:null,run:false,hold:false,st:'ok',shock:0,mor:70,fat:0,kills:0,losses:0,fled:0,recent:[],rallies:0,routT:0,rallyT:-99,
    engaged:0,eng:0,cx:x,cy:y,moving:false,lag:0,lagN:0,cd:{volley:0,rally:0,duel:0},fireLeft:T.range?2:0,fireArrows:0,volleyN:0,volleyT:0,
    fireTgt:null,isCmd:false,genSol:null,fleeX:0,fleeY:0,foeU:null,inFire:0,boost:0,aiT:0,aiRole:null,chargeT:0,
    farE:0,_cols:1,_rows:1,_last:1,_sp:1,_fx:1,_fy:0,_sx:0,_sy:0,_n:0,aiHoldT:0,avgLag:0,engT:0,genDead:null,inFireL:0,boostT:0,base:0,bMA:0,bMD:0};
  u.base=T.mor+(gs?(gs.t-50)/4:0)+(side.morMod||0);if(u.base>100)u.base=100;
  u.bMA=gs?Math.max(0,(gs.w-60)/40):0;u.bMD=gs?Math.max(0,(gs.t-60)/40):0;
  const fx=Math.cos(ang),fy=Math.sin(ang);
  for(let k=0;k<T.n;k++){const s=mkSol(u,false);u.sol.push(s);u.bySlot.push(s);s.slot=k}
  u.n=T.n;
  if(gs){const s=mkSol(u,true);u.genSol=s;u.sol.push(s)}
  side.units.push(u);B.units.push(u);
  placeUnit(u,x,y,ang);
  return u}
function mkSol(u,gen){
  const T=u.T;const s={id:B.nextS++,u,x:u.x,y:u.y,px:u.x,py:u.y,vx:0,vy:0,hp:T.hp,gen,cd:rnd()*1.2,foe:null,slot:-1,
    jx:(rnd()-0.5)*2.4,jy:(rnd()-0.5)*2.4,face:1,ph:rnd()*6,atkT:9,chg:0,alive:true,rl:rnd()*T.rl||0,am:T.ammo||0,i:0,
    rad:T.role==='cav'?6:3.4,cav:T.role==='cav',fx:0,fy:0,lastHit:-9,MA:0,MD:0,cdB:0,tm:1,rx:0,ry:0,rf:0,spx:0,spy:0};
  if(gen){const g=u.gs;s.hp=8+g.w/7;s.MA=5+g.w/10;s.MD=5+g.t/20+g.w/25;s.rad=s.cav?6.6:4;s.cdB=0.95}
  return s}

// 阵形槽位
function slotLocal(u,k){const n=u.n||1;const cols=Math.max(1,Math.min(u.cols,n));const rows=Math.ceil(n/cols);const r=Math.floor(k/cols),c=k%cols;
  const rc=(r===rows-1)?n-r*cols:cols;const sp=u.hold?u.sp*0.85:u.sp;return [((rows-1)/2-r)*u.spy,(c-(rc-1)/2)*sp]}
function uDepth(u){const n=u.n||1;const cols=Math.max(1,Math.min(u.cols,n));return (Math.ceil(n/cols)-1)*u.spy}
function uWidth(u){const n=u.n||1;const cols=Math.max(1,Math.min(u.cols,n));return (cols-1)*u.sp}
function slotWorld(u,k){const [d,l]=slotLocal(u,k);const fx=Math.cos(u.ang),fy=Math.sin(u.ang);return [u.x+fx*d-fy*l,u.y+fy*d+fx*l]}
function genWorld(u){const fx=Math.cos(u.ang),fy=Math.sin(u.ang);const dep=uDepth(u)/2+(u.T.role==='cav'?u.spy*0.9:-u.spy*0.2);return [u.x+fx*dep,u.y+fy*dep]}
function prepSlots(u){const n=u.n||1;const c=Math.max(1,Math.min(u.cols,n));u._cols=c;u._rows=Math.ceil(n/c);u._last=n-(u._rows-1)*c;u._sp=u.hold?u.sp*0.85:u.sp;u._fx=Math.cos(u.ang);u._fy=Math.sin(u.ang)}
function reslot(u,ang){ // 按新朝向重新分配槽位，减少交叉
  const fx=Math.cos(ang),fy=Math.sin(ang);const arr=u.bySlot.slice(0,u.n);if(!arr.length)return;
  arr.sort((a,b)=>(b.x*fx+b.y*fy)-(a.x*fx+a.y*fy));const cols=Math.max(1,Math.min(u.cols,u.n));
  let k=0;for(let r=0;r*cols<arr.length;r++){const row=arr.slice(r*cols,r*cols+cols);row.sort((a,b)=>(a.x*-fy+a.y*fx)-(b.x*-fy+b.y*fx));for(const s of row){u.bySlot[k]=s;s.slot=k;k++}}}

// ---------------- 命令 API ----------------
function activeU(u){return u&&u.st==='ok'}
function oMove(u,x,y,ang,width,run){if(!activeU(u))return;x=clamp(x,20,B.W-20);y=clamp(y,20,B.H-20);

  const dx=x-u.x,dy=y-u.y,d=hyp(dx,dy);if(ang==null)ang=d>4?Math.atan2(dy,dx):u.ang;

function oAttack(u,tgt,run){if(!activeU(u)||!tgt||tgt.side===u.side)return;if(B.phase==='deploy')return;u.ord={k:'atk',tgt};u.run=!!run;u.hold=false;u.chargeT=run?B.t:0;

function oVolley(u){if(!activeU(u)||!u.T.range||u.cd.volley>0)return false;u.cd.volley=45;u.volleyT=B.t+14;for(const s of u.sol)if(s.alive&&!s.gen)s.rl=rnd()*0.4;return true}

function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}

// 布阵阶段：限制在部署区
function placeDeploy(u,x,y,ang){const z=B.sides[u.side].deploy;if(z){x=clamp(x,z.x0,z.x1);y=clamp(y,z.y0,z.y1)}reslot(u,ang);placeUnit(u,x,y,ang)}
function groupMove(units,x,y,run){ // 保持相对位置平移；朝向为群体中心→目标
  units=units.filter(activeU);if(!units.length)return;let gx=0,gy=0;units.forEach(u=>{gx+=u.cx;gy+=u.cy});gx/=units.length;gy/=units.length;
  if(units.length===1){oMove(units[0],x,y,null,null,run);return}

function lineMove(units,x0,y0,x1,y1,run){ // 拖拽阵线：线太短时自动分成多排

  let back=0;rows.forEach((row,ri)=>{const tot=row.reduce((s,u)=>s+minW(u),0);const scale=Math.max(1,(L-gap*(row.length-1))/tot);let pos=(L-(tot*scale+gap*(row.length-1)))/2;let dmax=0;
    row.forEach(u=>{const w=minW(u)*scale;const c=pos+w/2;pos+=w+gap;const cols=clamp(Math.round(w/u.sp)+1,Math.min(3,u.n),Math.max(3,u.T.cols*2));const dep=(Math.ceil(u.n/cols)-1)*u.spy;dmax=Math.max(dmax,dep);

// ---------------- 伤亡 ----------------
function kill(v,a,how){

  const k=v.slot;const last=u.bySlot[u.n-1];if(last&&last!==v){u.bySlot[k]=last;last.slot=k}u.bySlot.length=u.n-1;u.n--;

function endUnit(u){u.st=u.losses>=u.fled?'dead':'gone';u.ord=null;B.ev.push({k:'unitEnd',u})}
function genDown(u,how,a){const g=u.gs;const lord=g.role==='lord';let killed;
  if(how==='duelKill')killed=true;else if(how==='duelFlee'||how==='fled'||how==='escape')killed=false;else killed=rnd()<(lord?0.35:0.55);
  const idx=u.sol.indexOf(u.genSol);if(idx>=0)u.sol.splice(idx,1);

  const side=B.sides[u.side];const cmd=u.isCmd;
  if(how!=='fled'&&how!=='escape'){u.shock+=killed?30:20;for(const f of side.units)if(f!==u&&f.st==='ok')f.shock+=cmd?(killed?20:12):(killed?5:2);
    for(const e of B.units)if(e.side!==u.side&&e.st==='ok'){e.shock=Math.max(0,e.shock-(cmd?12:4))}}
  if(cmd)side.cmdLost=true;
  if(a&&a.u&&killed){a.u.kills++;}
  B.log.push({t:B.t,k:killed?'genKill':how==='fled'?'genFled':how==='escape'?'genEscape':'genWound',g:g.name,by:a&&a.gen?a.u.gs.name:(a&&a.u?a.u.label:''),side:u.side});

function strike(a,v){
  const ua=a.u,uv=v.u,Ta=ua.T,Tv=uv.T;

  if(tAt(T,T.water,v.x,v.y))MD-=3;if(tAt(T,T.water,a.x,a.y))MA-=1.5;

    if(braced){p-=0.15;a.vx*=0.2;a.vy*=0.2;if(rnd()<0.55+(Tv.AC||4)*0.03)hurt(a,1,v);ua.shock+=0.6*(100/ua.n0)}

// ---------------- 决斗 ----------------
function startDuel(ua,ub){ // 预先算出结果，UI 播放后 applyDuel

  const pa=clamp(0.5+(A.w-Bg.w)*0.025,0.1,0.9);const ma=hasTr(A,'勇将')?1.12:1,mb=hasTr(Bg,'勇将')?1.12:1;

    if(ha<=0){res={win:'b',how:rnd()<0.75?'kill':'flee'};break}if(hb<=0){res={win:'a',how:rnd()<0.75?'kill':'flee'};break}
    if(r%10===0){if(ha<32&&ha<hb&&rnd()<0.5){res={win:'b',how:'flee'};break}if(hb<32&&hb<ha&&rnd()<0.5){res={win:'a',how:'flee'};break}}}

function applyDuel(){const D=B.duel;if(!D)return;B.duel=null;const {a,b,res}=D;
  const key1=a.genSol.id+'_'+b.genSol.id,key2=b.genSol.id+'_'+a.genSol.id;B.pairCD[key1]=B.pairCD[key2]=B.t+60;
  B.duelLog.push({t:B.t,a:a.gs.name,b:b.gs.name,rounds:D.rounds,win:res.win?(res.win==='a'?a.gs.name:b.gs.name):null,how:res.how});

  for(const f of B.sides[L.side].units)if(f.st==='ok')f.shock+=8}

  for(const f of B.units){if(f===u||f.st!=='ok')continue;const d=hyp(f.cx-u.cx,f.cy-u.cy);if(f.side===u.side){if(d<240)f.shock+=5}else if(d<420)f.shock=Math.max(0,f.shock-4)}
  for(const s of u.sol)s.foe=null}
function rallyUnit(u,forced){u.st='ok';u.shock*=0.35;u.rallies++;u.rallyT=B.t;u.run=false;u.ord=null;u.x=u.cx;u.y=u.cy;
  let bd=1e9,ang=u.ang;for(const e of B.units){if(e.side===u.side||e.st!=='ok')continue;const d=hyp(e.cx-u.cx,e.cy-u.cy);if(d<bd){bd=d;ang=Math.atan2(e.cy-u.cy,e.cx-u.cx)}}

// ---------------- 远程 ----------------
function fireArrow(s,tu){

function moraleStep(dt){
  const str=[0,0];for(const u of B.units)if(u.st==='ok')str[u.side]+=u.n*(u.T.MA+u.T.MD)*(u.gs?1.1:1);
  for(const u of B.units){if(u.st!=='ok'&&u.st!=='rout')continue;

    const lf=u.losses/u.n0;const lossPen=50*Math.pow(lf,1.1);const recPen=Math.min(20,u.recent.length*Math.min(2,100/u.n0)*0.45);

function layoutArmy(units,zone,face){ // 自动布阵：步兵一线，弓兵其后，骑兵两翼，主将居后
  const dir=Math.cos(face)>=0?1:-1;const cy=(zone.y0+zone.y1)/2;const front=dir>0?zone.x1-40:zone.x0+40;
  const line=[],arch=[],cav=[],gen=[];
  for(const d of units){const T=Object.assign({},BT[d.t],d.ext||{});const r=d.t==='guard'?'gen':T.role==='ranged'?'arch':T.role==='cav'?'cav':'line';({line,arch,cav,gen})[r].push({d,T})}
  const w=o=>(Math.min(o.T.cols,o.T.n)-1)*o.T.sp;const dep=o=>(Math.ceil(o.T.n/o.T.cols)-1)*o.T.spy;
  const place=(arr,x,gap)=>{const tot=arr.reduce((s,o)=>s+w(o)+gap,0)-gap;let y=cy-tot/2;for(const o of arr){o.d.x=x-dir*dep(o)/2;o.d.y=y+w(o)/2;y+=w(o)+gap}return tot};

  const F=B.fire;if(F.list.length){x.fillStyle='rgba(230,110,40,.8)';for(const ci of F.list){x.fillRect((ci%T.fgw)*FCS*k,Math.floor(ci/T.fgw)*FCS*k,Math.max(1.5,FCS*k),Math.max(1.5,FCS*k))}}
  const [a0,b0]=s2w(0,0),[a1,b1]=s2w(R.vw,R.vh);x.strokeStyle='#a8321f';x.lineWidth=1.5;x.strokeRect(a0*k,b0*k,(a1-a0)*k,(b1-b0)*k)}

function launch(cfg,spectate){
  UI.last={cfg:deepCopy(cfg),spectate:!!spectate};
  const d=[-8,0,7][UI.diff];cfg.sides.forEach(s=>{if(s.ai&&!spectate)s.morMod=(s.morMod||0)+d});
  buildBattle(cfg);
  UI.player=spectate?-1:cfg.player;UI.view=UI.player<0?0:UI.player;UI.sel=[];UI.paused=false;UI.speed=1;UI.auto=false;UI.endShown=false;UI.cards.clear();$('#cards').innerHTML='';$('#feed').innerHTML='';
  show('battle');resizeRender();renderTerrain();
  const sd=B.sides[UI.view];const z=sd.deploy;R.cam.x=z?(z.x0+z.x1)/2+(sd.face===0?260:-260):B.W/2;R.cam.y=z?(z.y0+z.y1)/2:B.H/2;R.cam.z=clamp(R.vw<R.vh?Math.max(R.vw/700,R.vh/1500):Math.min(R.vw/1100,R.vh/760),0.3,1);if(R.vw<R.vh&&z){R.cam.x=(z.x0+z.x1)/2+(sd.face===0?160:-160)}clampCam();
  const mc=$('#mini');mc.width=Math.round(mc.clientWidth*R.dpr);mc.height=Math.round(mc.clientHeight*R.dpr);
  $('#plT').textContent=cfg.title;$('#plEra').textContent=(cfg.era||'')+(cfg.season?' · '+cfg.season:'');$('#hTitle').textContent=cfg.title;
  const me=B.sides[UI.view];$('#hSeal').textContent=me.ch;$('#hSeal').style.background=me.color;
  $('#bAuto').style.display=spectate?'none':'';$('#bAuto').classList.remove('on');
  buildCards();buildAbil();updHud(true);
  if(spectate){startBattle();$('#deployBar').style.display='none';addFeed('观战模式：双方均由 AI 指挥','big')}
  else{$('#deployBar').style.display='flex';
    modal(`<h2>${esc(cfg.title)}</h2><p>${esc(cfg.intro||'')}</p><p style="font-size:13px;color:#5a4e40">你执掌<b style="color:${me.color}">${esc(me.name)}</b>。${me.attack?'你是进攻方。':'你是防守方。'}${B.sides[UI.player].reinf.length?'<b>援军将在开战后赶到。</b>':''}${B.sides[1-UI.player].reinf.length?'<b>敌军援军将在开战后赶到，需速战！</b>':''}</p>
      <p style="font-size:13px">${UI.touch?'点选部队 → 点地面移动、点敌军进攻；单指拖动平移，双指缩放；长按后拖动可划出阵线。':'左键选择 / 框选，右键移动或进攻，右键拖动划出阵线；空格暂停。'}</p>`,[{t:'开始布阵',cls:'red'}])}
  UI.lastFrame=performance.now()}
function beginBattle(){if(B.phase!=='deploy')return;startBattle();buildAbil();$('#deployBar').style.display='none';showBanner(B.cfg.title,'两军交锋','',2200);addFeed('全军出击！','big')}
function autoDeployPlayer(){const sd=B.sides[UI.player];if(!sd||B.phase!=='deploy')return;const defs=sd.units.map(u=>({t:u.t,ext:Object.assign({},u.T===BT[u.t]?{}:{n:u.T.n,cols:u.T.cols}),u}));layoutArmy(defs,sd.deploy,sd.face);defs.forEach(d=>placeDeploy(d.u,d.x,d.y,sd.face))}

// ---------------- 卡片 ----------------
function buildCards(){const box=$('#cards');const sd=B.sides[UI.view];for(const u of sd.units){if(UI.cards.has(u))continue;const el=document.createElement('div');el.className='uc';
    el.innerHTML=`<div class="g" style="background:${sd.color}">${BT_CH(u.t)}</div><div class="nm">${esc(u.gs?u.gs.name:u.label)}</div><div class="ct"></div><div class="mb"><i></i></div>`;
    el.onclick=ev=>{if(UI.player<0)return;cardTap(u,ev)};box.appendChild(el);UI.cards.set(u,el)}}
let _lastCard={u:null,t:0};
function cardTap(u,ev){const now=performance.now();const dbl=_lastCard.u===u&&now-_lastCard.t<380;_lastCard={u,t:now};
  if(dbl){R.cam.x=u.cx;R.cam.y=u.cy;clampCam();return}
  if(u.st!=='ok'&&u.st!=='rout')return;
  if(ev.shiftKey||ev.ctrlKey||ev.metaKey||UI.multi){toggleSel(u)}else{if(UI.sel.length===1&&UI.sel[0]===u)setSel([]);else setSel([u])}}
function setSel(a){UI.sel=a.filter(u=>u.side===UI.player&&(u.st==='ok'||u.st==='rout'));buildAbil();updCards()}
function toggleSel(u){if(UI.sel.includes(u))setSel(UI.sel.filter(x=>x!==u));else setSel(UI.sel.concat([u]))}
function updCards(){for(const [u,el] of UI.cards){const sel=UI.sel.includes(u);el.classList.toggle('sel',sel);el.classList.toggle('rout',u.st==='rout');el.classList.toggle('dead',u.st==='dead'||u.st==='gone');
    el.querySelector('.ct').textContent=u.st==='dead'?'全军覆没':u.st==='gone'?'溃散':`${u.n}/${u.n0}`;
    const nm=el.querySelector('.nm');const nn=u.gs&&u.genSol&&u.genSol.alive?u.gs.name:u.label;if(nm.textContent!==nn)nm.textContent=nn;
    const mb=el.querySelector('.mb i');mb.style.width=clamp(u.mor,0,100)+'%';mb.style.background=u.mor>=50?'#3f6e4a':u.mor>=30?'#b8862a':'#a8321f';
    let hd=el.querySelector('.hd');const tag=u.hold?'守':u.run&&u.st==='ok'?'冲':u.fat>75?'疲':'';if(tag){if(!hd){hd=document.createElement('span');hd.className='hd';el.appendChild(hd)}hd.textContent=tag}else if(hd)hd.remove()}}

const ABIL=[
 {k:'charge',t:'冲锋',c:'#a8321f',key:'C',ok:us=>us.some(u=>u.st==='ok')&&B.phase==='battle',run:us=>{let n=0;us.forEach(u=>{if(oCharge(u))n++});if(!n)addFeed('前方没有可冲击的敌军')}},
 {k:'volley',t:'齐射',c:'#4f6a8f',key:'V',show:us=>us.some(u=>u.T.range),ok:us=>us.some(u=>u.T.range&&u.cd.volley<=0&&u.st==='ok')&&B.phase==='battle',cd:us=>Math.min(...us.filter(u=>u.T.range).map(u=>Math.max(0,u.cd.volley))),run:us=>{let n=0;us.forEach(u=>{if(oVolley(u))n++});if(n)addFeed('弓弩齐发！')}},
 {k:'hold',t:'固守',c:'#2b2621',key:'H',ok:us=>us.some(u=>u.st==='ok'),on:us=>us.length&&us.every(u=>u.hold),run:us=>{const on=!us.every(u=>u.hold);us.forEach(u=>oHold(u,on))}},
 {k:'fire',t:'火攻',c:'#c0622a',key:'F',show:us=>us.some(u=>u.T.range),ok:us=>us.some(u=>u.T.range&&u.fireLeft>0&&u.st==='ok')&&B.phase==='battle',cnt:us=>us.filter(u=>u.T.range).reduce((s,u)=>s+u.fireLeft,0),run:us=>{let n=0;us.forEach(u=>{if(oFire(u))n++});if(n)addFeed('换上火矢！风向：'+WIND_NAMES[B.wind.from]+'风','big')}},
 {k:'rally',t:'鼓舞',c:'#b8862a',key:'R',show:us=>us.some(u=>u.gs),ok:us=>us.some(u=>u.genSol&&u.genSol.alive&&u.cd.rally<=0)&&B.phase==='battle',cd:us=>Math.min(...us.filter(u=>u.genSol&&u.genSol.alive).map(u=>Math.max(0,u.cd.rally))),run:us=>{const u=us.find(u=>u.genSol&&u.genSol.alive&&u.cd.rally<=0);if(u)oRally(u)}},
 {k:'duel',t:'单挑',c:'#6e4a7a',key:'G',show:us=>us.some(u=>u.gs),ok:us=>B.phase==='battle'&&us.some(u=>duelCandidates(u).length>0),run:us=>{const u=us.find(u=>duelCandidates(u).length);if(!u)return;const r=oDuel(u);if(!r.ok)addFeed(r.why);else if(r.refused)addFeed(`敌将畏${u.gs.name}之勇，避而不战！`,'good big')}},
];
function buildAbil(){const box=$('#abil');const us=UI.sel;if(!us.length||UI.player<0||!B||B.phase==='deploy'){box.innerHTML='';return}
  box.innerHTML=ABIL.filter(a=>!a.show||a.show(us)).map(a=>`<button class="ab" data-k="${a.k}" style="background:${a.c}" title="${a.t} (${a.key})">${a.t.split('').join('<br>')}<small></small></button>`).join('');
  box.querySelectorAll('.ab').forEach(b=>b.onclick=()=>useAbil(b.dataset.k));updAbil()}
function useAbil(k){const a=ABIL.find(x=>x.k===k);const us=UI.sel.filter(u=>u.st==='ok');if(!a||!us.length||!a.ok(us))return;a.run(us);updAbil();updCards()}
function updAbil(){const us=UI.sel.filter(u=>u.st==='ok');document.querySelectorAll('#abil .ab').forEach(b=>{const a=ABIL.find(x=>x.k===b.dataset.k);b.disabled=!a.ok(us);b.classList.toggle('on',!!(a.on&&a.on(us)));
    const sm=b.querySelector('small');let t='';if(a.cd){const c=a.cd(us);if(c>0&&isFinite(c))t=Math.ceil(c)+'秒'}if(a.cnt)t='余'+a.cnt(us);sm.textContent=t})}

function updHud(force){
  const me=UI.view,op=1-me;const c0=sideCount(me),c1=sideCount(op);
  $('#hN0').textContent=B.sides[me].name+' '+c0.n.toLocaleString();$('#hN1').textContent=B.sides[op].name+' '+c1.n.toLocaleString();
  const pend=B.sides.map(sd=>sd.reinf.filter(r=>!r.done).reduce((s,r)=>s+r.units.reduce((a,d)=>a+Object.assign({},BT[d.t],d.ext||{}).n,0),0));
  const t0=c0.n+pend[me],t1=c1.n+pend[op];const tot=t0+t1||1;
  $('#hB0').style.cssText=`width:${t0/tot*100}%;background:${B.sides[me].color}`;$('#hB1').style.cssText=`width:${t1/tot*100}%;background:${B.sides[op].color}`;
  const us=B.sides[me].units.filter(u=>u.st==='ok');const am=us.length?us.reduce((s,u)=>s+u.mor*u.n,0)/Math.max(1,us.reduce((s,u)=>s+u.n,0)):0;const pips=Math.round(am/20);
  $('#hMor').textContent='士气 '+'■'.repeat(pips)+'□'.repeat(5-pips);

  buildCards();updCards();if(UI.sel.length)updAbil();

function addFeed(t,cls){const f=$('#feed');const d=document.createElement('div');if(cls)d.className=cls;d.textContent=t;f.prepend(d);while(f.children.length>(window.innerWidth<640?3:5))f.lastChild.remove();setTimeout(()=>{d.style.transition='opacity .6s';d.style.opacity='0';setTimeout(()=>d.remove(),700)},6500)}
let _banT=null;function showBanner(t,s,cls,ms){const b=$('#banner');b.innerHTML=`<div class="bt">${esc(t)}</div>${s?`<div class="bs">${esc(s)}</div>`:''}`;b.classList.add('show');clearTimeout(_banT);_banT=setTimeout(()=>b.classList.remove('show'),ms||2600)}
function uName(u){return (u.gs&&u.genSol&&u.genSol.alive?u.gs.name+'部':'')+(u.gs&&u.genSol&&u.genSol.alive?'':u.label)}

function processEvents(){
  const ev=B.ev;if(!ev.length)return;B.ev=[];
  for(const e of ev){switch(e.k){
    case 'dead':bakeDead(e.s,e.face);if(R.cam.z>0.4&&Math.random()<0.5)for(let i=0;i<3;i++)addPart({k:'ink',x:e.x,y:e.y-4,vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*30,r:0.8+Math.random()*1.2,life:0,max:0.8});break;
    case 'stick':bakeStick(e);break;
    case 'burnt':bakeBurnt(e.ci);break;
    case 'rout':{const mine=e.u.side===UI.view;addFeed(`${B.sides[e.u.side].ch}·${uName(e.u)} 溃逃！`,mine?'bad':'good');if(mine&&UI.sel.includes(e.u)){}break}
    case 'rally':if(e.u.side===UI.view)addFeed(`${uName(e.u)} 重整旗鼓`,'good');break;
    case 'gen':{const g=e.u.gs;const mine=e.u.side===UI.view;const by=e.by&&e.by.gen&&e.by.u&&e.by.u.gs?e.by.u.gs.name:null;
      if(e.how==='fled')break;addFeed(e.killed?`${by?by+' 斩 ':''}${B.sides[e.u.side].ch}将 ${g.name} ${by?'':'阵亡'}！`:e.how==='escape'?`${B.sides[e.u.side].ch}将 ${g.name} 部众尽没，单骑突围`:`${B.sides[e.u.side].ch}将 ${g.name} 负伤，退出战场`,(mine?'bad':'good')+' big');
      addPart({k:'ring',x:e.x,y:e.y,r:8,life:0,max:1.2});if(e.u.isCmd)showBanner(e.killed?`${g.name} 阵亡`:`${g.name} 负伤`,e.u.side===UI.view?'主将倒下，全军震动！':'敌军主将倒下！','',2600);break}
    case 'reinf':{const mine=e.side===UI.view;showBanner(mine?'援军已至':'敌援将至',e.msg,'',3200);addFeed(e.msg,(mine?'good':'bad')+' big');buildCards();break}
    case 'fire':addFeed('火起！火势顺'+WIND_NAMES[B.wind.from]+'风蔓延','big');break;
    case 'rallyCall':addFeed(`${e.u.gs.name}振臂高呼，三军奋勇！`,'good big');addPart({k:'gold',x:e.u.cx,y:e.u.cy,r:10,life:0,max:1.4});break;
    case 'duelRefuse':addFeed(e.player?`你避战不出，${B.sides[e.b.side].ch}军士气受挫`:`${e.b.gs.name} 避战不出，${B.sides[e.b.side].ch}军士气受挫`,e.b.side===UI.view?'bad':'good');break;
    case 'duel':showDuel(e.d);break;
    case 'duelAsk':askDuel(e.a,e.b);break;
    case 'unitEnd':break;
    case 'end':{const w=e.w;const t=UI.player<0?(w<0?'两军罢兵':B.sides[w].name+'胜'):w<0?'相持不下':w===UI.player?'大　捷':'兵　败';const sub=e.why==='time'?'时辰已尽，各自收兵':UI.player<0?'':w===UI.player?'敌军全线溃逃':w<0?'':'我军全线溃败';showBanner(t,sub,'',2400);setTimeout(showResult,2600);break}}}}

  $('#dText').textContent=lines[0];let li=1;
  const finish=()=>{if(done)return;done=true;const r=D.res;const W=r.win==='a'?A:r.win==='b'?Bg:null,L=r.win==='a'?Bg:r.win==='b'?A:null;

  const close=()=>{if(!d.classList.contains('show'))return;d.classList.remove('show');UI.duelOn=false;const r=D.res;applyDuel();
    const W=r.win==='a'?A:r.win==='b'?Bg:null,L=r.win==='a'?Bg:r.win==='b'?A:null;if(W){const side=r.win==='a'?D.a.side:D.b.side;addFeed(r.how==='kill'?`${W.name} 阵斩 ${L.name}！`:`${W.name} 击退 ${L.name}！`,(side===UI.view?'good':'bad')+' big')}else addFeed(`${A.name}与${Bg.name}不分胜负`)};

   [{t:'继续观看',fn:()=>{UI.endShown=true}},{t:'返回菜单',fn:()=>{show('menu');B=null}},{t:'再战一场',cls:'red',fn:()=>launch(deepCopy(UI.last.cfg),UI.last.spectate)}],{stamp})}

const INP={pts:new Map(),down:null,drag:null,pinch:null,lp:null,last:{t:0,x:0,y:0,btn:''},keys:{}};
function initInput(){
  const cv=$('#cv');
  cv.addEventListener('pointerdown',pDown);window.addEventListener('pointermove',pMove);window.addEventListener('pointerup',pUp);window.addEventListener('pointercancel',pUp);
  cv.addEventListener('contextmenu',e=>e.preventDefault());cv.addEventListener('wheel',wheel,{passive:false});
  window.addEventListener('keydown',keyDown);window.addEventListener('keyup',e=>{INP.keys[e.code]=false});
  const mc=$('#mini');const mini=e=>{if(!B)return;const r=mc.getBoundingClientRect();R.cam.x=(e.clientX-r.left)/r.width*B.W;R.cam.y=(e.clientY-r.top)/r.height*B.H;clampCam()};
  mc.addEventListener('pointerdown',e=>{e.stopPropagation();mc.setPointerCapture(e.pointerId);mc._d=true;mini(e)});mc.addEventListener('pointermove',e=>{if(mc._d)mini(e)});mc.addEventListener('pointerup',()=>mc._d=false);
  $('#bPause').onclick=()=>{if(B&&B.phase==='deploy')return;UI.paused=!UI.paused;updHud()};
  $('#bSpeed').onclick=()=>{const L=[1,2,3,0.5];UI.speed=L[(L.indexOf(UI.speed)+1)%L.length];updHud()};
  $('#bAuto').onclick=()=>{if(!B||UI.player<0)return;UI.auto=!UI.auto;const sd=B.sides[UI.player];sd.ai=UI.auto;if(UI.auto){sd.aiState={provoked:B.phase!=='deploy'&&(B.t>20||sd.units.some(u=>u.engaged>0))};for(const u of sd.units)u.aiT=0}$('#bAuto').classList.toggle('on',UI.auto);addFeed(UI.auto?'已托管：AI 代为指挥我军':'已取消托管')};
  $('#bMenu').onclick=()=>{if(B)pauseMenu()};
  $('#bStart').onclick=beginBattle;$('#bAutoDeploy').onclick=autoDeployPlayer;
  $('#bAll').onclick=()=>{if(!B||UI.player<0)return;const all=B.sides[UI.player].units.filter(u=>u.st==='ok');setSel(UI.sel.length===all.length?[]:all)};
  const bm=$('#bMulti');if(bm)bm.onclick=()=>{UI.multi=!UI.multi;bm.classList.toggle('on',UI.multi)}}
function ptr(e){return {x:e.clientX,y:e.clientY}}
function pDown(e){if(!B||UI.modal||UI.duelOn)return;const cv=$('#cv');try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=ptr(e);INP.pts.set(e.pointerId,{x:p.x,y:p.y});if(e.pointerType==='touch')UI.touch=true;
  if(INP.pts.size===2){clearTimeout(INP.lp);INP.drag=null;const a=[...INP.pts.values()];const d=hyp(a[0].x-a[1].x,a[0].y-a[1].y);const mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;INP.pinch={d0:d,z0:R.cam.z,w:s2w(mx,my),mx,my};INP.down=null;INP.gestureMulti=true;return}
  if(INP.pts.size>2)return;INP.gestureMulti=false;
  const kind=e.pointerType==='mouse'?(e.button===2?'right':e.button===1?'pan':'left'):'touch';
  INP.down={kind,x0:p.x,y0:p.y,x:p.x,y:p.y,t0:performance.now(),moved:false,shift:e.shiftKey||e.ctrlKey||e.metaKey,lp:false};
  if(kind==='touch'){clearTimeout(INP.lp);INP.lp=setTimeout(()=>{const d=INP.down;if(d&&!d.moved&&INP.pts.size===1){d.lp=true;if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
    INP.drag={k:UI.sel.length?'line':'box',x0:d.x0,y0:d.y0,x1:d.x,y1:d.y}}},380)}}
function pMove(e){if(!INP.pts.has(e.pointerId))return;const p=ptr(e);const prev=INP.pts.get(e.pointerId);INP.pts.set(e.pointerId,{x:p.x,y:p.y});
  if(INP.pinch&&INP.pts.size>=2){const a=[...INP.pts.values()];const d=hyp(a[0].x-a[1].x,a[0].y-a[1].y);const mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;const P=INP.pinch;
    R.cam.z=clamp(P.z0*d/(P.d0||1),0.2,3);R.cam.x=P.w[0]-(mx-R.vw/2)/R.cam.z;R.cam.y=P.w[1]-(my-R.vh/2)/R.cam.z;clampCam();return}
  const d=INP.down;if(!d)return;const dx=p.x-prev.x,dy=p.y-prev.y;d.x=p.x;d.y=p.y;
  if(!d.moved&&hyp(p.x-d.x0,p.y-d.y0)>(d.kind==='touch'?9:5)){d.moved=true;if(!d.lp)clearTimeout(INP.lp)}
  if(!d.moved)return;
  if(d.kind==='pan'||(d.kind==='touch'&&!d.lp)){R.cam.x-=dx/R.cam.z;R.cam.y-=dy/R.cam.z;clampCam();return}
  if(d.kind==='left'){if(!INP.drag)INP.drag={k:'box',x0:d.x0,y0:d.y0};INP.drag.x1=p.x;INP.drag.y1=p.y;return}
  if(d.kind==='right'){if(UI.sel.length){if(!INP.drag)INP.drag={k:'line',x0:d.x0,y0:d.y0};INP.drag.x1=p.x;INP.drag.y1=p.y}else{R.cam.x-=dx/R.cam.z;R.cam.y-=dy/R.cam.z;clampCam()}return}
  if(d.kind==='touch'&&d.lp&&INP.drag){INP.drag.x1=p.x;INP.drag.y1=p.y}}
function pUp(e){if(!INP.pts.has(e.pointerId))return;INP.pts.delete(e.pointerId);clearTimeout(INP.lp);
  if(INP.pinch){if(INP.pts.size<2)INP.pinch=null;INP.down=null;return}
  const d=INP.down;INP.down=null;if(!d||!B)return;const dr=INP.drag;INP.drag=null;
  if(INP.gestureMulti)return;
  if(dr&&dr.x1!=null){
    if(dr.k==='box'){const x0=Math.min(dr.x0,dr.x1),x1=Math.max(dr.x0,dr.x1),y0=Math.min(dr.y0,dr.y1),y1=Math.max(dr.y0,dr.y1);
      if(x1-x0>6||y1-y0>6){const got=B.units.filter(u=>u.side===UI.player&&u.st==='ok'&&(()=>{const [sx,sy]=w2s(u.cx,u.cy);return sx>=x0&&sx<=x1&&sy>=y0&&sy<=y1})());setSel(d.shift||UI.multi?[...new Set(UI.sel.concat(got))]:got)}}
    else if(dr.k==='line'&&UI.sel.length){const [a,b]=s2w(dr.x0,dr.y0),[c,f]=s2w(dr.x1,dr.y1);if(hyp(dr.x1-dr.x0,dr.y1-dr.y0)>14){lineMove(UI.sel,a,b,c,f,false);markDeployed()}else tap(d.x,d.y,d.kind==='touch'?'touch':'right',d.shift)}
    return}
  if(d.moved)return;
  tap(d.x0,d.y0,d.kind,d.shift)}
function hitUnit(sx,sy){for(let i=R.labels.length-1;i>=0;i--){const L=R.labels[i];if(sx>=L.x-3&&sx<=L.x+L.w+3&&sy>=L.y-3&&sy<=L.y+L.h+3)return L.u}
  if(B.phase==='deploy')rebuild();const [wx,wy]=s2w(sx,sy);const buf=[];const r=Math.max(9,16/R.cam.z);const n=solNear(wx,wy+6,r,buf);let best=null,bd=1e9;
  for(let i=0;i<n;i++){const s=buf[i];if(!s.alive)continue;const d=hyp(s.x-wx,s.y-6-wy);if(d<bd){bd=d;best=s}}
  const u=best&&best.u;return u&&(u.st==='ok'||u.st==='rout')?u:null}
function tap(sx,sy,kind,shift){if(UI.player<0){const u=hitUnit(sx,sy);if(u)unitInfo(u);return}
  const now=performance.now();const dbl=now-INP.last.t<340&&hyp(sx-INP.last.x,sy-INP.last.y)<28&&INP.last.btn===kind;INP.last={t:dbl?0:now,x:sx,y:sy,btn:kind};
  const u=hitUnit(sx,sy);const me=UI.player;const [wx,wy]=s2w(sx,sy);
  if(kind==='left'){
    if(u&&u.side===me){if(shift||UI.multi)toggleSel(u);else setSel([u]);return}
    if(u&&u.side!==me){if(UI.sel.length&&B.phase==='battle'){orderAttack(u,dbl)}else unitInfo(u);return}
    if(!UI.sel.length)return;if(B.phase==='deploy'){groupMove(UI.sel,wx,wy,false);markDeployed();return}setSel([]);return}
  if(kind==='right'){if(!UI.sel.length)return;if(u&&u.side!==me){if(B.phase==='battle')orderAttack(u,dbl);return}if(u&&u.side===me&&!dbl){toggleSel(u);return}groupMove(UI.sel,wx,wy,dbl);markDeployed();if(dbl&&B.phase==='battle')addFeed('跑步前进！');return}
  // touch
  if(u&&u.side===me){if(UI.multi)toggleSel(u);else if(UI.sel.length===1&&UI.sel[0]===u&&dbl){}else setSel([u]);return}
  if(u&&u.side!==me){if(UI.sel.length&&B.phase==='battle')orderAttack(u,dbl);else unitInfo(u);return}
  if(UI.sel.length){groupMove(UI.sel,wx,wy,dbl);markDeployed();addPart({k:'ring',x:wx,y:wy,r:4,life:0,max:0.5});if(dbl&&B.phase==='battle')addFeed('跑步前进！')}}
function markDeployed(){if(B.phase==='deploy')rebuild()}
function orderAttack(t,run){const us=UI.sel.filter(u=>u.st==='ok');us.forEach(u=>oAttack(u,t,run||u.run));addPart({k:'ring',x:t.cx,y:t.cy,r:6,life:0,max:0.6});
  const rng=us.filter(u=>u.T.range).length;if(us.length)addFeed(rng===us.length?`放箭：${uName(t)}`:`${run?'冲击':'进攻'}：${B.sides[t.side].ch}·${uName(t)}`)}
function unitInfo(u){const T=u.T;addFeed(`${B.sides[u.side].ch}·${u.gs?u.gs.name+' ':''}${u.label} ${u.n}人 · 士气${Math.round(u.mor)} · ${ROLE_NAME[T.role]} 攻${T.MA}防${T.MD}${u.gs?` · 武${u.gs.w}统${u.gs.t}`:''}`)}
function wheel(e){if(!B)return;e.preventDefault();const k=e.deltaY<0?1.12:1/1.12;const [wx,wy]=s2w(e.clientX,e.clientY);R.cam.z=clamp(R.cam.z*k,0.2,3);R.cam.x=wx-(e.clientX-R.vw/2)/R.cam.z;R.cam.y=wy-(e.clientY-R.vh/2)/R.cam.z;clampCam()}
function keyDown(e){if(!B||$('#battle').style.display==='none'||UI.modal)return;INP.keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();if(B.phase==='battle'){UI.paused=!UI.paused;updHud()}return}
  if(e.code==='Escape'){setSel([]);return}
  if(e.code==='KeyA'&&(e.ctrlKey||e.metaKey)){e.preventDefault();setSel(B.sides[UI.player]?B.sides[UI.player].units.filter(u=>u.st==='ok'):[]);return}
  if(e.ctrlKey||e.metaKey)return;
  const m={KeyC:'charge',KeyV:'volley',KeyH:'hold',KeyF:'fire',KeyR:'rally',KeyG:'duel'};if(m[e.code]){useAbil(m[e.code]);return}
  if(e.code==='Equal'||e.code==='NumpadAdd'){R.cam.z=clamp(R.cam.z*1.15,0.2,3);clampCam()}if(e.code==='Minus'||e.code==='NumpadSubtract'){R.cam.z=clamp(R.cam.z/1.15,0.2,3);clampCam()}}
function keyPan(dt){const k=INP.keys;const v=600*dt/R.cam.z;let dx=0,dy=0;if(k.KeyW||k.ArrowUp)dy-=v;if(k.KeyS||k.ArrowDown)dy+=v;if(k.KeyA||k.ArrowLeft)dx-=v;if(k.KeyD||k.ArrowRight)dx+=v;if(dx||dy){R.cam.x+=dx;R.cam.y+=dy;clampCam()}}

// ================= 主循环 =================
UI.acc=0;UI.miniT=0;
function frame(now){requestAnimationFrame(frame);
  if(!B||$('#battle').style.display==='none'||!R.terr){UI.lastFrame=now;return}
  let dt=(now-(UI.lastFrame||now))/1000;UI.lastFrame=now;if(dt>0.25)dt=0.25;
  keyPan(dt);
  const run=(B.phase==='battle'||B.phase==='end')&&!UI.paused&&!UI.modal&&!UI.duelOn&&!B.duel&&!B.ask;
  if(run){UI.acc+=dt*UI.speed;let n=0;while(UI.acc>=DT&&n<10){step();UI.acc-=DT;n++}if(n>=10)UI.acc=0}
  const alpha=run?clamp(UI.acc/DT,0,1):1;
  processEvents();spawnDust();
  const r0=performance.now();render(alpha,run?dt*UI.speed:dt*0.25);
  // 自适应清晰度：渲染过慢时降低像素比
  UI.rAvg=(UI.rAvg||0)*0.95+(performance.now()-r0)*0.05;UI.rChk=(UI.rChk||0)+dt;if(UI.rChk>2){UI.rChk=0;if(UI.rAvg>22&&R.dprCap>1){R.dprCap=Math.max(1,R.dprCap-0.5);onResize()}}
  UI.miniT-=dt;if(UI.miniT<=0){UI.miniT=0.2;drawMini($('#mini'))}
  UI.hudT-=dt;if(UI.hudT<=0){UI.hudT=0.25;updHud()}}
function onResize(){if(!B||!R.cv)return;resizeRender();const mc=$('#mini');mc.width=Math.round(mc.clientWidth*R.dpr);mc.height=Math.round(mc.clientHeight*R.dpr);clampCam()}
function boot(){UI.touch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
  if(!UI.touch)$('#bMulti').style.display='none';
  buildMenu();show('menu');initRender($('#cv'));initInput();window.addEventListener('resize',()=>setTimeout(onResize,60));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
  requestAnimationFrame(frame)}
boot();
</script>
