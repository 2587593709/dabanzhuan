    let hw=x<WX-950?540:x<WX-160?540-(x-(WX-950))/790*330:x<WX+60?210:210+Math.min(170,(x-WX-60)*0.45);hw+=(nz(x/260,31)-0.5)*70;
    const cy=H/2+(nz(x/520,47)-0.5)*260*clamp((WX-320-x)/600,0,1);top[gx]=cy-hw;bot[gx]=cy+hw}
  return {top,bot}}
function mkValley2(W,v,nz){const gw=Math.ceil(W/TCS);const top=new Float32Array(gw),bot=new Float32Array(gw); // 直谷：v={cy,hw,amp}
  for(let gx=0;gx<gw;gx++){const x=(gx+0.5)*TCS;const hw=(v.hw||260)+(nz(x/220,31)-0.5)*60;const cy=v.cy+(nz(x/600,47)-0.5)*(v.amp||220);top[gx]=cy-hw;bot[gx]=cy+hw}return {top,bot}}

// ================= 河流：深水不可涉，只能走桥梁与浅滩（渡口寻路） =================

// 陆地按河岸分成若干连通块，渡口把它们连起来。部队与士兵跨岸时先奔渡口，过渡口时收成纵队。

// 连通块之间的首个渡口（广度优先，缓存）
function rvRoute(T,a,b){const key=a*8192+b;const c0=T.rcache.get(key);if(c0!==undefined)return c0;

// 从 (x,y) 去 (tx,ty) 的下一个落脚点；同岸返回 null（直行）
function rvNext(x,y,tx,ty){const T=B.T;if(!T.comp)return null;let a=rvComp(T,x,y),b=rvComp(T,tx,ty);if(a===b||b===-1)return null;if(a===-1){a=rvNearComp(T,x,y);if(a===-1||a===b)return null}
  if(a<=-2){const G=T.xg[-2-a];let tb=b;if(b<=-2){const H=T.xg[-2-b];tb=null;for(const c of H.adj.keys()){if(G.adj.has(c)||[...G.adj.keys()].some(e=>rvRoute(T,e,c))){tb=c;break}}if(tb==null)return null}

function rvUnitWay(u,tx,ty){const T=B.T;if(!T.comp||u.T.naval)return null;const w=rvNext(u.x,u.y,tx,ty);const a=rvComp(T,u.x,u.y);let G=null;
  if(a<=-2)G=T.xg[-2-a];else if(w){for(const g of T.xg)if(hyp(g.cx-u.x,g.cy-u.y)<uDepth(u)/2+130&&hyp(g.cx-w[0],g.cy-w[1])<140){G=g;break}}
  if(G){u.xgi=G.id;if(u.colsX==null){const nc=clamp(Math.floor((G.wd-18)/u.sp)+1,2,u.cols);if(nc<u.cols){u.colsX=u.cols;u.cols=nc;reslot(u,u.ang)}}}

// 深水阻挡：退回上一位置或沿岸滑动；溃兵被逼入水者有溺死之虞

  if(!rvDeepAt(T,s.x,s.py)){s.y=s.py;s.vy*=-0.2}else if(!rvDeepAt(T,s.px,s.y)){s.x=s.px;s.vx*=-0.2}else{s.x=s.px;s.y=s.py;s.vx*=-0.3;s.vy*=-0.3}

function rvSnap(x,y){const T=B.T;if(!rvDeepAt(T,x,y))return [x,y];for(let r=1;r<40;r++)for(let k=0;k<12;k++){const a=k*Math.PI/6;const px=x+Math.cos(a)*r*8,py=y+Math.sin(a)*r*8;if(px>4&&py>4&&px<T.W-4&&py<T.H-4&&!rvDeepAt(T,px,py))return [px,py]}return [x,y]}

const FORMS={

// 阵位（前向 f、横向 l，单位：世界坐标）
function formSlots(units,k){const role=u=>u.t==='guard'||u.t==='flag'||u.cg?'gen':u.T.role==='ranged'?'rng':u.T.role==='cav'?'cav':'line';
  const G={gen:[],rng:[],cav:[],line:[]};for(const u of units)G[role(u)].push(u);
  const W=Math.max(60,...units.map(u=>uWidth(u)))+34,D=Math.max(30,...units.map(u=>uDepth(u)))+36;const P=[];const put=(u,f,l,a)=>P.push({u,f,l,a:a==null?0:a});
  if(k==='fengshi'){const M=G.cav.concat(G.line);let amax=0;M.forEach((u,i)=>{if(i===0){put(u,0,0);return}const a=Math.ceil(i/2),sd=i%2?1:-1;amax=a;put(u,-a*D*0.9,sd*a*W*0.62)});
    G.rng.forEach((u,i)=>put(u,-(1.4+Math.floor(i/2))*D,(i%2?1:-1)*(i<2&&G.rng.length===1?0:W*0.42)));G.gen.forEach((u,i)=>put(u,-(amax+1.6)*D,(i-(G.gen.length-1)/2)*W))}
  else if(k==='heyi'){const n=G.line.length;G.line.forEach((u,i)=>{const l=(i-(n-1)/2)*W;put(u,Math.abs(l)/(Math.max(1,n)*W/2)*D*1.5,l)});
    const half=(n+1)/2*W;G.cav.forEach((u,i)=>{const sd=i%2?1:-1;const a=Math.floor(i/2);put(u,D*(1.9+a*0.6),sd*(half+W*0.55+a*W*0.4))});
    G.rng.forEach((u,i)=>put(u,-D*1.05,(i-(G.rng.length-1)/2)*W));G.gen.forEach((u,i)=>put(u,-D*2.2,(i-(G.gen.length-1)/2)*W))}
  else if(k==='fangyuan'){const ring=G.line.concat(G.cav);const n=ring.length;const R=Math.max(D*1.3,n*W/(Math.PI*2)*1.05);ring.forEach((u,i)=>{const a=i/Math.max(1,n)*Math.PI*2;put(u,Math.cos(a)*R,Math.sin(a)*R,a)});
    const m=G.rng.length;G.rng.forEach((u,i)=>{const a=i/Math.max(1,m)*Math.PI*2+0.4;const r=m>1?R*0.45:0;put(u,Math.cos(a)*r,Math.sin(a)*r,a)});G.gen.forEach((u,i)=>put(u,(i-(G.gen.length-1)/2)*20,0))}

    const half=Math.max(n,m)/2*W;G.cav.forEach((u,i)=>{const sd=i%2?1:-1;put(u,-D*1.4-sd*half*0.28,sd*(half+W*0.6))});G.gen.forEach((u,i)=>put(u,-D*2.4,(i-(G.gen.length-1)/2)*W))}
  else{let f=0;const L=G.cav.concat(G.line,G.gen,G.rng);L.forEach(u=>{const d=uDepth(u)+34;put(u,-f-d/2,0);f+=d})}
  return P}

  let ex=0,ey=0,en=0;for(const e of B.units)if(e.side!==side&&(e.st==='ok')&&!e.isHero){ex+=e.cx;ey+=e.cy;en++}

  B={cfg,T,W:T.W,H:T.H,t:0,tick:0,rng:mulberry(cfg.seed||12345),phase:'deploy',sides:[],units:[],sol:[],arrows:[],ev:[],nextU:1,nextS:1,

  for(let i=0;i<sol.length;i++){const s=sol[i];if(!s.alive)continue;const u=s.u;if(u.isHero){heroSol(s,tick);continue}s.px=s.x;s.py=s.y;s.atkT+=DT;if(s.cd>0)s.cd-=DT;

      if(tick%10===s.id%10||(!s.fx&&!s.fy)){ // 逃离方向：远离最近敌人 + 回本阵
        const e=nearestEnemy(s,90,null);let fx=B.sides[u.side].home.x*1.0,fy=(s.y<H/2?-0.25:0.25);if(e){const dx=s.x-e.x,dy=s.y-e.y,d=hyp(dx,dy)||1;fx+=dx/d*1.4;fy+=dy/d*1.4}const l=hyp(fx,fy)||1;s.fx=fx/l;s.fy=fy/l}
      tx=s.x+s.fx*40;ty=s.y+s.fy*40;if(T.comp&&!Tu.naval&&tick%4===s.id%4){const hx=B.sides[u.side].home.x;const r=rvNext(s.x,s.y,hx<0?12:W-12,s.y);s.rvw=r}if(s.rvw&&T.comp){tx=s.rvw[0];ty=s.rvw[1]}if(SG){const hx=B.sides[u.side].home.x;if((hx<0&&zoneOf(s.x)>0)||(hx>0&&zoneOf(s.x)<2)){const r=siegeRoute(s,hx<0?SG.WX-400:SG.WX+400,s.y);tx=r[0];ty=r[1]}}spd=Tu.run*1.02*Math.max(0.85,fatMul(u))*terrMul(s);s.foe=null;
      if(s.x<-40||s.x>W+40||s.y<-40||s.y>H+40){if(s.gen){s.alive=false;genDown(u,'fled',null)}else kill(s,null,'fled');continue}
    }else{
      // 寻敌
      const front=s.gen||s.slot<u.cols||(Tu.reach>=10&&s.slot<u.cols*2)||s.cav&&s.slot<u.cols*2;const ranged=!!Tu.range&&!(u.ord&&u.ord.melee);
      let R=u.hold?(Tu.reach+7):ranged?14:front?(s.cav?44:30):(s.cav?20:12);
      if(u.ord&&u.ord.k==='move'&&!u.hold)R=Math.min(R,16);
      if((tick+s.id)%4===0&&(u.farE<R+60||s.foe)){
        if(s.foe&&(!s.foe.alive||s.foe.inDuel||(s.foe.x-s.x)**2+(s.foe.y-s.y)**2>(R+14)**2))s.foe=null;
        if(!s.foe||(tick+s.id)%12===0){const pref=u.ord&&u.ord.k==='atk'?u.ord.tgt:null;const e=nearestEnemy(s,R,pref);if(e)s.foe=e;}
      }
      let slotx,sloty;if(s.gen){const p=genWorld(u);slotx=p[0];sloty=p[1]}else{const k=s.slot,c0=u._cols,r=(k/c0)|0,c=k-r*c0;const rc=r===u._rows-1?u._last:c0;const d=(u._rows-1)*0.5*u.spy-r*u.spy,l=(c-(rc-1)*0.5)*u._sp;slotx=u.x+u._fx*d-u._fy*l+s.jx;sloty=u.y+u._fy*d+u._fx*l+s.jy}
      const f=s.foe;
      if(f&&f.alive){const dx=f.x-s.x,dy=f.y-s.y,d=hyp(dx,dy)||1;const reach=(s.gen?8:Tu.reach)+(f.cav?2:0)+(s.cav?2:0);
        const leash=hyp(slotx-s.x,sloty-s.y);
        if(leash>(s.cav?(s.chg||u.run?120:60):u.hold?22:(front?34:24))){s.foe=null;tx=slotx;ty=sloty}
        else{tx=f.x-dx/d*reach*0.85;ty=f.y-dy/d*reach*0.85;
          if(d<=reach+3){u.eng++;u.foeU=f.u;if(s.cd<=0){strike(s,f);s.cd=(s.gen?s.cdB:2.6)*(0.75+rnd()*0.5)}}
          s.face=dx>=0?1:-1}
        spd=(u.run||s.chg?Tu.run:Tu.walk*1.25);
        if(s.cav&&u.run&&d<60&&s.chg===0&&B.t-u.chargeT<6&&hyp(s.vx,s.vy)>Tu.run*0.55)s.chg=1;
      }else{s.foe=null;tx=slotx;ty=sloty;const dl=hyp(tx-s.x,ty-s.y);u.lag+=dl;u.lagN++;
        spd=(u.run?Tu.run:Tu.walk)*(dl>12?1.3:1);if(spd>Tu.run)spd=Tu.run;
        if(s.cav&&u.run&&u.ord&&u.ord.k==='atk'&&B.t-u.chargeT<8&&hyp(s.vx,s.vy)>Tu.run*0.6)s.chg=1;
        // 放箭
        if(ranged&&u.fireTgt&&s.am>0&&!s.gen&&!u.moving&&dl<14){const tg=u.fireTgt;if(tg.st!=='dead'&&tg.st!=='gone'&&tg.sol.length){s.rl-=DT;
            if(s.rl<=0){const dd=hyp(tg.cx-s.x,tg.cy-s.y);if(dd<Tu.range*fRng(u)+Math.max(0,hAt(T,s.x,s.y)-hAt(T,tg.cx,tg.cy))*1.5+20){for(let q=0;q<(Tu.shots||1)&&s.am>0;q++)fireArrow(s,tg);const vol=B.t<u.volleyT;s.rl=Tu.rl*(0.85+rnd()*0.3)*(vol?0.55:1)*(u.fon&&FORMS[u.fk].rl||1)}else s.rl=0.5}

      if((tick+s.id)%8===0||s.tm===undefined)s.tm=terrMul(s);spd*=fatMul(u)*s.tm;
      if(SG){const r=siegeRoute(s,tx,ty);tx=r[0];ty=r[1];const z=zoneOf(s.x);if(z===1&&u.side===SG.att)spd*=0.42;
        if(u.side===SG.att&&z===0&&!s.foe&&s.x>SG.WX-WT-12){const g=gateAt(s.y);if(g&&!g.broken&&tx>SG.WX-WT-10){g.hp-=DT*(Tu.AP?0.9:0.35);g.hitT=B.t;s.atkT=0;if(g.hp<=0)breakGate(g)}}}
    }
    // 转向与移动
    let dx=tx-s.x,dy=ty-s.y;const d=hyp(dx,dy);let dvx=0,dvy=0;
    if(d>0.6){const v=Math.min(spd,d*5);dvx=dx/d*v;dvy=dy/d*v}
    const k=Math.min(1,acc*DT);s.vx+=(dvx-s.vx)*k;s.vy+=(dvy-s.vy)*k;
    if(s.chg&&s.cav){s.vx+=(dvx-s.vx)*0.02}
    // 分离
    const x=s.x,y=s.y;if(((tick+s.id)&1)===0){let px=0,py=0;const rr=s.rad+6.6;const sside=u.side;const gx0=Math.max(0,((x-rr-GOX)/GC)|0),gx1=Math.min(gw-1,((x+rr-GOX)/GC)|0),gy0=Math.max(0,((y-rr-GOY)/GC)|0),gy1=Math.min(B.gh-1,((y+rr-GOY)/GC)|0);
    for(let yy=gy0;yy<=gy1;yy++){for(let xx=gx0;xx<=gx1;xx++){let j=head[yy*gw+xx];
      while(j>=0){const o=sol[j];if(o!==s&&o.alive){const ex=x-o.x,ey=y-o.y;const rs=s.rad+o.rad;const d2=ex*ex+ey*ey;if(d2<rs*rs){const dd=Math.sqrt(d2)||0.01;let w=(rs-dd)/rs;if(o.u.side!==sside)w*=1.6;if(o.cav&&!s.cav)w*=1.5;if(o.u.isHero)w*=o.inDuel?4:2.5;px+=ex/dd*w;py+=ey/dd*w}}j=next[j]}}}
      s.spx=px*38;s.spy=py*38}
    s.x+=(s.vx+s.spx)*DT;s.y+=(s.vy+s.spy)*DT;if(B.duels.length)fdRingPush(s);if(SG)siegeEnforce(s);if(B.T.valley||B.T.naval)terrEnforce(s);if(T.deep&&!Tu.naval)deepEnforce(s,u);if(!s.alive)continue;
    if(s.burn>0){s.burn-=DT;if((tick+s.id)%4===0){hurt(s,s.hp0>20?0.24:0.16,null);u.shock+=0.1*Math.min(3,100/u.n0)*(u.chain?1.4:1)}}
    if(Tu.fireship&&u.st==='ok'&&(tick+s.id)%3===0&&!s.gen){const e=nearestEnemy(s,s.rad+34,null);if(e&&e.u.T.naval){igniteShip(e,true);s.alive&&hurt(s,999,null)}}
    const mv=hyp(s.vx,s.vy);s.ph+=mv*DT*0.32;if(mv>3&&!s.foe)s.face=s.vx>=0?1:-1;

    if(B.fire.list.length&&inFire(s.x,s.y)){u.inFire++;u.shock+=14*DT/u.n0*(u.T.burn||1);if(rnd()<0.3*DT*(u.T.burn||1))hurt(s,1,null)}
  }}

function moraleStep(dt){
  const str=[0,0];for(const u of B.units)if(u.st==='ok')str[u.side]+=u.n*(u.T.MA+u.T.MD)*(u.gs?1.1:1);
  for(const u of B.units){if(u.st!=='ok'&&u.st!=='rout')continue;if(u.isHero)continue;
    // 体力
    const run=u.run&&(u.moving||u.T.role==='cav'),eng=u.engaged>0;let fr=eng?1.1:u.moving?(run?(u.T.role==='cav'?1.6:2.2):0.15):-2.6;if(fr>0&&u.fon&&FORMS[u.fk].fat)fr*=FORMS[u.fk].fat;if(u.st==='rout')fr=1.2;
    u.fat=clamp(u.fat+fr*dt,0,100);
    if(u.genSol&&u.genSol.alive&&!eng&&u.gs&&typeof genHP==='function'){const mh=genHP(u.gs);if(u.genSol.hp<mh)u.genSol.hp=Math.min(mh,u.genSol.hp+mh*0.012*dt)}
    while(u.recent.length&&B.t-u.recent[0]>8)u.recent.shift();
    const lf=u.losses/u.n0;const lossPen=50*Math.pow(lf,1.1)+(lf>0.5?(lf-0.5)*80:0);const recPen=Math.min(20,u.recent.length*Math.min(2,100/u.n0)*0.45);
    // 将领光环
    let aura=0;const sd=B.sides[u.side];
    if(u.genSol&&u.genSol.alive)aura=u.isCmd?12:8;
    const cg=cmdGen(sd);if(cg&&cg!==u&&hyp(cg.cx-u.cx,cg.cy-u.cy)<340)aura=Math.max(aura,10);
    if(aura<8)for(const f of sd.units)if(f!==u&&f.st==='ok'&&f.genSol&&f.genSol.alive&&hyp(f.cx-u.cx,f.cy-u.cy)<(f.isHero?170:200)){aura=Math.max(aura,f.isHero?(f.isCmd?10:7):5);if(aura>=7)break}
    const ratio=(str[u.side]+1)/(str[1-u.side]+1);const rb=clamp((ratio-1)*9,-10,8);
    const fp=u.fat>90?14:u.fat>75?7:0;
    if(u.boostT<B.t)u.boost=0;
    const M=u.base+aura+(u.hold?4:0)+rb+u.boost-lossPen-recPen-u.shock-fp+(u.fon?FORMS[u.fk].mor||0:0);
    u.mor=clamp(M,0,100);
    u.shock=Math.max(0,u.shock-(eng?1.1:3)*dt);if(u.shock>90)u.shock=90;
    if(u.st==='ok'){if(M<15&&B.t-u.rallyT>6)routUnit(u)}
    else if(u.st==='rout'&&B.tick%20===0){
      if(u.routT>10&&u.rallies<1&&lf<0.55&&!anyEnemyNear(u.side,u.cx,u.cy,200)){const M2=u.base+aura+rb-lossPen-recPen-u.shock*0.4-fp;if(M2>=28)rallyUnit(u)}}
  }}

function checkEnd(){if(B.result)return;if(B.story&&typeof storyDef==='function'){const d=storyDef();if(d&&d.customEnd){if(B.t>=B.tLimit&&!B.result){if(d.timeout)d.timeout(B,B.story);if(!B.result)finish(B.cfg.player>=0?B.cfg.player:0,'time')}return}}if(SG&&siegeCheckEnd())return;
  const lost=B.sides.map(sd=>!sd.units.some(u=>u.st==='ok'&&!u.isHero)&&!sd.reinf.some(r=>!r.done));
  if(lost[0]||lost[1]){if(B.T.naval&&B.sol.some(s=>s.alive&&s.burn>0)){if(!B.navEndT)B.navEndT=B.t+25;if(B.t<B.navEndT)return}finish(lost[0]&&lost[1]?-1:lost[0]?1:0,'rout');return}
  if(B.t>=B.tLimit){const s=sideStr();let w=B.cfg.limitWinner;if(w==null)w=s[0]>s[1]*1.25?0:s[1]>s[0]*1.25?1:-1;finish(w,'time')}}
function sideStr(){const r=[0,0];for(const u of B.units)if(u.st==='ok')r[u.side]+=u.n*(u.T.MA+u.T.MD);return r}
function finish(w,why){for(const D of B.duels||[])if(!D.done)fdEnd(D,{win:null,how:'draw'});B.result={winner:w,why,t:B.t};B.phase='end';B.ev.push({k:'end',w,why})}
function sideCount(i){let n=0,n0=0;for(const u of B.sides[i].units){if(u.isHero){if(u.st==='ok'&&u.genSol&&u.genSol.alive)n++;continue}n0+=u.n0+(u.gs?1:0);if(u.st!=='gone')n+=u.n+(u.genSol&&u.genSol.alive?1:0)}return {n,n0}}

function terrEnforce(s){const T=B.T;if(T.naval&&!s.u.T.naval)return;const v=valleyAt(T,s.x);const r=s.rad+2;

  for(const b of burning)for(const o of B.sol){if(o===b||!o.alive||o.burn>0||!o.u.T.naval)continue;const dx=o.x-b.x,dy=o.y-b.y,d=hyp(dx,dy);const chainF=o.u.chain&&b.u.chain&&o.u.side===b.u.side;

const STORY_DEF={};
function storyDef(){return B&&B.story?STORY_DEF[B.story.id]:null}
function sMsg(text,big,banner){B.ev.push({k:'story',text,big:!!big,banner:banner||null})}
function sHero(id){for(const u of B.units)if(u.gs&&u.gs.id===id&&(u.isHero?u.st==='ok':u.genSol&&u.genSol.alive))return u;return null}
function sGenAlive(id){const u=sHero(id);return !!u}
function sUnitOf(id){return B.units.find(u=>u.gs&&u.gs.id===id&&!u.isHero)||null}
function sInZone(x,y,z){return hyp(x-z.x,y-z.y)<z.r}
function sObj(i,st){const o=B.story.obj[i];if(o&&o.st!==st){o.st=st;B.story.dirty=true}}
function sFinish(win,why){const me=B.cfg.player>=0?B.cfg.player:0;finish(win?me:1-me,why||'story')}
function sGenDown(id){return B.log.some(l=>(l.k==='genKill'||l.k==='genWound'||l.k==='genCap'||l.k==='genEscape'||l.k==='genFled')&&l.g===id)}
function sGenDownByName(name){return B.log.some(l=>(l.k==='genKill'||l.k==='genWound'||l.k==='genCap')&&l.g===name)}
function sDetach(id,mul){const u=B.units.find(x=>x.gs&&x.gs.id===id&&!x.isHero);if(u&&typeof oHeroOut==='function'){const h=oHeroOut(u,true);if(h){const mine=u.side===B.cfg.player;const m=mul||(mine?B.cfg.heroMul:1)||1;if(m!==1){h.hp0*=m;h.genSol.hp*=m;h.genSol.hp0=h.hp0}if(mine&&B.cfg.heroMul>1){h.tk=0.65;h.storyHero=true}}return h}return null}
function storyInit(){const id=B.cfg.story;const def=STORY_DEF[B.cfg.script||id];if(!def)return;const L=HEROES.find(x=>x.id===id)||HIST.find(x=>x.id===id);B.story={id:B.cfg.script||id,t:0,flags:{},zones:[],obj:((L&&L.obj)||def.obj||[]).map(t=>({t,st:0})),dirty:true,kills0:0};try{def.init&&def.init(B,B.story)}catch(e){console.error(e)}}
function storyStep(){const def=storyDef();if(!def||B.phase!=='battle')return;const St=B.story;St.t=B.t;
  if(def.customEnd){for(const u of B.sides[B.cfg.player>=0?B.cfg.player:0].units){if(!u.storyHero||u.st!=='ok')continue;const s=u.genSol;if(s&&s.alive&&!s.inDuel&&B.t-s.lastHit>4&&s.hp<u.hp0)s.hp=Math.min(u.hp0,s.hp+u.hp0*0.004)}
    const a1=B.sides[1-(B.cfg.player>=0?B.cfg.player:0)].aiState;if(a1&&a1.init&&!St.cavGo){St.cavGo=1;a1.cavGo=B.t+(def.cavDelay||0)}}
  try{def.tick&&def.tick(B,St)}catch(e){console.error(e)}}
function storyHook(k,a,b){const def=storyDef();if(def&&def.on)try{def.on(k,a,b,B.story)}catch(e){console.error(e)}}
function storyStars(){const def=storyDef();if(!def||!def.stars)return null;try{return def.stars(B,B.story)}catch(e){return null}}

  for(const u of out.units){if(u.gof){if(u.men&&u.n0)gloss[u.gof]=Math.round(u.men*u.losses/u.n0);continue}if(!u.men)continue;const sd=sides[u.side];const l=Math.min(sd.tr[u.t]||0,Math.round(u.men*u.losses/u.n0));if(l>0){sd.tr[u.t]-=l;sd.loss[u.t]=(sd.loss[u.t]||0)+l}}
  const w=out.winner===0?'A':'D';const winSide=w==='A'?0:1,loseSide=1-winSide;
  sides.forEach((s,i)=>{s.morale=clamp(out.mor[i]+(i===winSide?10:0),20,100)});
  const fate={killed:[],captured:[],fled:[]};const siegeWin=meta.kind==='siege'&&w==='A';
  const seen=new Set();
  for(const u of out.units){if(!u.gen||seen.has(u.gen))continue;seen.add(u.gen);
    if(u.genDead==='killed'){fate.killed.push(u.gen);continue}
    if(u.genCap){fate.capBy=fate.capBy||[];fate.capBy.push([u.gen,u.side===0?D.f:A.f]);continue}
    if(u.side!==loseSide)continue;
    const gst=u.gst||u.st;const pCap=u.genDead?(siegeWin?0.5:0.32):(gst==='ok'?(siegeWin?0.3:0.05):(siegeWin?0.4:0.12));
    if(Math.random()<pCap)fate.captured.push(u.gen);else fate.fled.push(u.gen)}
  for(const id of (out.cfg.m2.extra[loseSide]||[])){if(seen.has(id))continue;if(Math.random()<(siegeWin?0.4:0.1))fate.captured.push(id);else fate.fled.push(id)}
  const FA=S.fac[A.f],FD=S.fac[D.f];const rep=[];const facN=f=>S.fac[f].name;
  rep.push(`${facN(A.f)}军 ${fmtN(sumT(A.tr))} 对阵 ${facN(D.f)}军 ${fmtN(sumT(D.tr))}，主公亲自临阵指挥。`);
  if(out.gateBroken)rep.push('冲车撞破城门，攻城之兵蜂拥而入。');
  for(const d of out.duels)rep.push(d.win?`${d.a} 与 ${d.b} 阵前单挑，斗了${d.rounds*5}余合，${d.win}${d.how==='kill'?'斩敌将于马下':d.how==='capture'?'生擒敌将':'得胜'}。`:`${d.a} 与 ${d.b} 单挑 ${d.rounds} 回合，不分胜负。`);
  const whyTxt={rout:'全线溃败',plaza:'城池陷落',time:'久战不下',noentry:'攻具尽毁，无力再攻',retreat:'下令撤退',quit:'收兵'}[out.why]||'';
  rep.push(w==='A'?(meta.kind==='siege'?`${facN(A.f)}军攻破城池，${facN(D.f)}军${whyTxt}。`:`${facN(D.f)}军${whyTxt||'败退'}，${facN(A.f)}军大胜。`):(meta.kind==='siege'?`${facN(A.f)}军${whyTxt||'攻城失利'}，${facN(D.f)}军守住城池。`:`${facN(A.f)}军${whyTxt||'败退'}，${facN(D.f)}军得胜。`));
  rep.push(`战损：${facN(A.f)}军 ${fmtN(sumT(sides[0].loss))}　${facN(D.f)}军 ${fmtN(sumT(sides[1].loss))}（战场历时 ${Math.floor(out.t/60)} 分 ${Math.floor(out.t%60)} 秒）`);
  const d0=out.duels.find(d=>d.win);const ev={duel:d0?{win:d0.winId,lose:d0.loseId,killed:d0.how==='kill',captured:d0.how==='capture'}:null,plot:[]};
  const sol={A:[],D:[]};for(const x of (out.sol||[])){const t=UNITS[x.t]&&!UNITS[x.t].hidden?x.t:(x.t==='guard'?'qinqi':x.t);sol[x.side===0?'A':'D'].push({k:x.k,t:UNITS[t]?t:'dao',men:x.men})}
  return {win:w,a:sides[0],d:sides[1],rep,ev,fate,routed:out.why==='rout'?(w==='A'?'D':'A'):null,pur:0,manual:true,gloss,sol}}

function buildAbil(){const box=$('#abil');const us=UI.sel;if(!us.length||UI.player<0||!B||B.phase==='deploy'){box.innerHTML='';return}
  box.innerHTML=ABIL.filter(a=>!a.show||a.show(us)).map(a=>{const t=a.label?a.label(us):a.t;const tip=a.tip?a.tip(us):a.k==='gsk'&&typeof BSK!=='undefined'?(Object.values(BSK).find(x=>x.n===t)||{}).d||'':'';return `<button class="ab" data-k="${a.k}" style="background:${a.c}" title="${t} (${a.key}) ${tip}">${t.split('').join('<br>')}<small></small></button>`}).join('');
  box.querySelectorAll('.ab').forEach(b=>b.onclick=()=>useAbil(b.dataset.k));updAbil()}
function useAbil(k){const a=ABIL.find(x=>x.k===k);const us=UI.sel.filter(u=>u.st==='ok');if(!a||!us.length||!a.ok(us))return;a.run(us);updAbil();updCards()}
function updAbil(){const us=UI.sel.filter(u=>u.st==='ok');document.querySelectorAll('#abil .ab').forEach(b=>{const a=ABIL.find(x=>x.k===b.dataset.k);b.disabled=!a.ok(us);b.classList.toggle('on',!!(a.on&&a.on(us)));
    const sm=b.querySelector('small');let t='';if(a.cd){const c=a.cd(us);if(c>0&&isFinite(c))t=Math.ceil(c)+'秒'}if(a.cnt)t='余'+a.cnt(us);sm.textContent=t})}

function updHud(force){
  const me=UI.view,op=1-me;const c0=sideCount(me),c1=sideCount(op);
  $('#hN0').textContent=B.sides[me].name+' '+c0.n.toLocaleString();$('#hN1').textContent=B.sides[op].name+' '+c1.n.toLocaleString();
  const pend=B.sides.map(sd=>sd.reinf.filter(r=>!r.done).reduce((s,r)=>s+r.units.reduce((a,d)=>a+Object.assign({},BT[d.t],d.ext||{}).n,0),0));
  const t0=c0.n+pend[me],t1=c1.n+pend[op];const tot=t0+t1||1;
  $('#hB0').style.cssText=`width:${t0/tot*100}%;background:${B.sides[me].color}`;$('#hB1').style.cssText=`width:${t1/tot*100}%;background:${B.sides[op].color}`;
  const us=B.sides[me].units.filter(u=>u.st==='ok');const am=us.length?us.reduce((s,u)=>s+u.mor*u.n,0)/Math.max(1,us.reduce((s,u)=>s+u.n,0)):0;const pips=Math.round(am/20);
  $('#hMor').textContent='士气 '+'■'.repeat(pips)+'□'.repeat(5-pips);
  $('#hHour').textContent='时辰 '+SHICHEN[curHour()]+'时';$('#hWind').textContent='风向 '+WIND_NAMES[B.wind.from]+(B.wind.str>0.55?'（劲）':'');
  buildCards();updCards();if(UI.sel.length)updAbil();if(typeof storyHud==='function')storyHud();
  $('#pausedTag').style.display=UI.paused&&B.phase==='battle'?'block':'none';
  $('#bPause').textContent=UI.paused?'▶':'❚❚';$('#bSpeed').textContent='×'+UI.speed}

function addFeed(t,cls){const f=$('#feed');const d=document.createElement('div');if(cls)d.className=cls;d.textContent=t;f.prepend(d);while(f.children.length>(window.innerWidth<640?3:5))f.lastChild.remove();setTimeout(()=>{d.style.transition='opacity .6s';d.style.opacity='0';setTimeout(()=>d.remove(),700)},6500)}
let _banT=null;function showBanner(t,s,cls,ms){const b=$('#banner');b.innerHTML=`<div class="bt">${esc(t)}</div>${s?`<div class="bs">${esc(s)}</div>`:''}`;b.classList.add('show');clearTimeout(_banT);_banT=setTimeout(()=>b.classList.remove('show'),ms||2600)}
function uName(u){if(u.isHero)return u.gs.name;return (u.gs&&u.genSol&&u.genSol.alive?u.gs.name+'部':'')+(u.gs&&u.genSol&&u.genSol.alive?'':u.label)}

function processEvents(){
  const ev=B.ev;if(!ev.length)return;B.ev=[];
  for(const e of ev){bsfx(e);switch(e.k){
    case 'dead':bakeDead(e.s,e.face);if(R.cam.z>0.4&&Math.random()<0.5)for(let i=0;i<3;i++)addPart({k:'ink',x:e.x,y:e.y-4,vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*30,r:0.8+Math.random()*1.2,life:0,max:0.8});break;
    case 'stick':bakeStick(e);break;
    case 'burnt':bakeBurnt(e.ci);break;
    case 'rout':{const mine=e.u.side===UI.view;addFeed(`${B.sides[e.u.side].ch}·${uName(e.u)} 溃逃！`,mine?'bad':'good');if(mine&&UI.sel.includes(e.u)){}break}
    case 'rally':if(e.u.side===UI.view)addFeed(`${uName(e.u)} 重整旗鼓`,'good');break;
    case 'gen':{const g=e.u.gs;const mine=e.u.side===UI.view;const by=e.by&&e.by.gen&&e.by.u&&e.by.u.gs?e.by.u.gs.name:null;
      if(e.how==='fled'||e.how==='duelKill'||e.how==='duelCap'||e.how==='duelFlee'){updCards();break}addFeed(e.killed?`${by?by+' 斩 ':''}${B.sides[e.u.side].ch}将 ${g.name} ${by?'':'阵亡'}！`:e.cap?`${B.sides[e.u.side].ch}将 ${g.name} 力竭被擒！`:e.how==='escape'?`${B.sides[e.u.side].ch}将 ${g.name} 部众尽没，单骑突围`:`${B.sides[e.u.side].ch}将 ${g.name} 负伤，退出战场`,(mine?'bad':'good')+' big');
      addPart({k:'ring',x:e.x,y:e.y,r:8,life:0,max:1.2});if(e.u.isCmd)showBanner(e.killed?`${g.name} 阵亡`:`${g.name} 负伤`,e.u.side===UI.view?'主将倒下，全军震动！':'敌军主将倒下！','',2600);break}
    case 'reinf':{const mine=e.side===UI.view;showBanner(mine?'援军已至':'敌援将至',e.msg,'',3200);addFeed(e.msg,(mine?'good':'bad')+' big');buildCards();break}
    case 'fire':addFeed('火起！火势顺'+WIND_NAMES[B.wind.from]+'风蔓延','big');break;
    case 'shipFire':{const mine=e.side===UI.view;if(!UI.shipFireN){UI.shipFireN=1;showBanner(mine?'战船起火':'敌船起火',mine?'火借风势，速速解锁散开！':'火借风势，敌船延烧！','',2600)}addFeed(mine?'我军战船起火！':'敌军战船起火！',(mine?'bad':'good')+' big');break}
    case 'unchain':if(e.u.side===UI.view)addFeed(`${uName(e.u)} 铁索已断，可以行动`,'good');break;
    case 'rallyCall':addFeed(`${e.u.gs.name}振臂高呼，三军奋勇！`,'good big');addPart({k:'gold',x:e.u.cx,y:e.u.cy,r:10,life:0,max:1.4});break;
    case 'duelRefuse':addFeed(e.player?`你避战不出，${B.sides[e.b.side].ch}军士气受挫`:`${e.b.gs.name} 避战不出，${B.sides[e.b.side].ch}军士气受挫`,e.b.side===UI.view?'bad':'good');break;
    case 'gsk':addFeed(e.msg,(e.u.side===UI.view?'good':'bad')+' big');break;
    case 'duelAsk':askDuel(e.a,e.b);break;
    case 'unitEnd':break;
    case 'form':if(!e.silent)break;if(e.side!==UI.view&&UI.player>=0)addFeed(`敌军结${FORMS[e.fk].n}阵`,'bad');else if(UI.player<0)addFeed(`${B.sides[e.side].name}结${FORMS[e.fk].n}阵`);break;
    case 'story':case 'flood':storyEvent(e);break;
    default:heroEvent(e);break;
    case 'gateBroken':{const mine=SG&&SG.att===UI.view;showBanner('城门已破',mine?'全军杀入城中！':'敌军破门而入，死守要道！','',2600);addFeed('城门被撞破！',(mine?'good':'bad')+' big');break}
    case 'ladder':{UI.ladN=(UI.ladN||0)+1;if(UI.ladN<=4){const mine=SG&&SG.att===UI.view;addFeed(mine?'云梯已架上城头，将士攀城！':'敌军架起云梯攀城！',mine?'good':'bad')}break}
    case 'ramDead':addFeed(e.u.side===UI.view?'我军冲车被焚毁！':'敌军冲车被焚毁！',e.u.side===UI.view?'bad':'good');break;
    case 'plaza':{const mine=SG&&SG.att===UI.view;addFeed(mine?'我军攻入城中要地，坚守片刻即可夺城！':'敌军冲入城中要地，速速夺回！',(mine?'good':'bad')+' big');break}
    case 'end':{const w=e.w;const t=UI.player<0?(w<0?'两军罢兵':B.sides[w].name+'胜'):w<0?'相持不下':w===UI.player?'大　捷':'兵　败';let sub=e.why==='time'?'时辰已尽，各自收兵':UI.player<0?'':w===UI.player?'敌军全线溃逃':w<0?'':'我军全线溃败';if(B.cfg.noDeploy)sub=w===UI.player?'目标达成':({hero:'主将倒下',cart:'车仗被截',cross:'敌军过桥',lord:'主公遇险',escape:'曹操逃脱',time:'时辰已尽'}[e.why]||'功败垂成');showBanner(t,sub,'',2400);setTimeout(showResult,2600);break}}}}

function modal(html,btns,opts={}){return new Promise(res=>{const m=$('#bmodal');m.innerHTML=`<div class="bbox${opts.stamp?' hasStamp':''}">${opts.stamp?`<div class="bstamp">${opts.stamp}</div>`:''}${html}<div class="bbtns">${btns.map((b,i)=>`<button data-i="${i}" class="${b.cls||''}">${b.t}</button>`).join('')}</div></div>`;m.classList.add('show');UI.modal=true;
  m.querySelectorAll('.bbtns button').forEach(b=>b.onclick=()=>{m.classList.remove('show');m.innerHTML='';UI.modal=false;const r=btns[+b.dataset.i];if(r.fn)r.fn();res(+b.dataset.i)})})}
function helpModal(){return modal(`<h2>操作说明</h2><div class="help">
<h3>电脑</h3><ul><li>左键点选部队，拖动框选；Shift / Ctrl 多选；Ctrl+A 全选</li><li>右键点地面移动，右键点敌军进攻；<b>右键拖动</b>划出阵线（宽度与朝向）</li><li>双击右键 = 跑步前进；滚轮缩放；WASD / 方向键 / 中键拖动平移</li><li>空格暂停（暂停中仍可下令）；C 冲锋 · V 齐射 · H 固守 · F 火攻 · R 鼓舞 · T 将技 · G 单挑 · Q 出阵 · B 归队 · Z/X 英雄技</li></ul>

function heroEvent(e){switch(e.k){
  case 'heroOut':{const mine=e.h.side===UI.view;addFeed(`${B.sides[e.h.side].ch}将 ${e.h.gs.name} 拍马出阵！`,(mine?'good':'bad'));addPart({k:'ring',x:e.h.cx,y:e.h.cy,r:6,life:0,max:0.8});buildCards();return true}
  case 'heroBack':{if(e.h.side===UI.view)addFeed(`${e.h.gs.name} 回归${e.u===e.h.parent?'本阵':e.u.label}`);if(UI.sel.includes(e.h)){setSel(UI.sel.filter(x=>x!==e.h).concat(e.u.side===UI.player?[e.u]:[]))}updCards();return true}
  case 'hsk':{addFeed(e.msg,(e.h.side===UI.view?'good':'bad')+' big');const s=e.h.genSol;if(s)addPart({k:'num',x:s.x,y:s.y-70,txt:HSK[e.k2].n,col:'#8a2a1a',sz:15,life:0,max:1.1});return true}
  case 'hfx':{if(e.t==='sweep'){addPart({k:'sweep',x:e.x,y:e.y,a0:Math.random()*6,life:0,max:0.45});addPart({k:'spark',x:e.x,y:e.y-10,a0:0,r:2,life:0,max:0.4})}
    else if(e.t==='roar')addPart({k:'roar',x:e.x,y:e.y,life:0,max:1});else if(e.t==='shield')addPart({k:'shield',x:e.x,y:e.y,life:0,max:0.9});else if(e.t==='wufu')addPart({k:'gold',x:e.x,y:e.y,r:8,life:0,max:1.2});else if(e.t==='dash')addPart({k:'ring',x:e.x,y:e.y,r:4,life:0,max:0.5});return true}
  case 'fdStart':{const D=e.D;const me=fdMine(D,UI.player);const nm=`${D.a.g.name} 与 ${D.b.g.name}`;
    if(me&&me.ctl==='me'){openFD(D);showBanner('阵前单挑',`${nm}两马相交！`,'',1800);if(UI.speed>1)UI.speed=1;UI.fdCam=D;fdZoom()}
    else{addFeed(`${nm} 阵前单挑！`,'big');UI.fdWatch.push(D);if(me)openFD(D)}
    return true}
  case 'fdFx':fdPartsFor(e);return true;
  case 'fdSk':{const s=e.P.s;addPart({k:'num',x:s.x,y:s.y-78,txt:fdSkName(e.sk),col:'#6a2a90',sz:16,life:0,max:1.1});return true}
  case 'fdBegin':return true;
  case 'fdEnd':{const D=e.D,r=e.res;const W=r.win?D[r.win]:null,L=r.win?D[r.win==='a'?'b':'a']:null;const good=W?W.side===UI.view:null;
    const t=!W?'不分胜负':r.how==='kill'?'阵　斩':r.how==='capture'?'生　擒':r.how==='retreat'?'退　走':'败　走';
    const sub=!W?`${D.a.g.name}与${D.b.g.name}斗了${e.rounds*5}余合，各自回阵`:r.how==='kill'?`${W.g.name}斩${L.g.name}于马下！`:r.how==='capture'?`${W.g.name}生擒${L.g.name}！`:r.how==='retreat'?`${L.g.name}不敌，拨马退走`:`${L.g.name}负伤败走`;
    const mineD=fdMine(D,UI.view);if(mineD||UI.fd&&UI.fd.D===D)showBanner(t,sub,'',2400);addFeed(sub,(W?(good?'good':'bad'):'')+' big');
    if(W&&(r.how==='kill'||r.how==='capture'))addPart({k:'ring',x:L.s.x,y:L.s.y,r:8,life:0,max:1.4});
    if(UI.fd&&UI.fd.D===D){fdResult(D,r,t);setTimeout(()=>{if(UI.fd&&UI.fd.D===D)closeFD()},2200)}
    UI.fdWatch=UI.fdWatch.filter(x=>x!==D);if(UI.fdCam===D)UI.fdCam=null;updCards();return true}}
  return false}

// ---------- 单挑面板 ----------
function fdEl(){let d=$('#fduel');if(!d){d=document.createElement('div');d.id='fduel';$('#battle').appendChild(d)}return d}
function openFD(D){const el=fdEl();const me=fdMine(D,UI.player)||D.a;const foe=me===D.a?D.b:D.a;const ctlMe=me.side===UI.player;
  const img=g=>{try{return typeof portrait==='function'?portrait(g.g||g,72):''}catch(e){return ''}};
  const side=(P,id,r)=>`<div class="fdp${r?' r':''}" id="${id}"><img src="${img(P.g)}" style="border-color:${B.sides[P.side].color}"><div class="fdi"><b>${esc(P.g.name)}<small>武${P.g.w}</small></b><div class="fdhp"><i></i><em></em></div><div class="fdq"></div><div class="fds"></div></div></div>`;
  const skb=me.sk.map((k,i)=>`<button class="fdk s" data-a="sk${i}" title="${esc((typeof DUEL_SK!=='undefined'&&DUEL_SK[k]?DUEL_SK[k].d:'')||'')}">${esc(fdSkName(k))}<small>${fdCost(k)}气</small></button>`).join('');
  el.innerHTML=`<div class="fdh">${side(me,'fdpA',false)}<div class="fdc"><div class="fdt">单挑</div><div class="fdtm"></div></div>${side(foe,'fdpB',true)}</div>
   ${ctlMe?`<div class="fdb">${['quick','heavy','guard','dodge'].map(k=>`<button class="fdk ${k}" data-a="${k}">${FD_ACT_TXT[k]}<small>${FD_HINT[k]}</small></button>`).join('')}${skb}</div>`:''}
   <div class="fdx">${ctlMe?`<button data-a="auto" class="fdauto">托付</button><button data-a="flee">退走</button>`:''}<button data-a="cam">镜头</button>${ctlMe?'':'<button data-a="close">关闭</button>'}</div><div class="fdres"></div>`;
  el.classList.add('show');fdMode();
  el.querySelectorAll('[data-a]').forEach(b=>{const fire=ev=>{ev.preventDefault();ev.stopPropagation();fdPress(b.dataset.a)};b.addEventListener('pointerdown',fire)});
  UI.fd={D,el,me,foe,ctlMe};fdMode();updFD()}
function fdMode(){const F=UI.fd;const el=$('#fduel');const on=!!(F&&F.ctlMe&&F.me.ctl==='me');$('#battle').classList.toggle('induel',on);if(el)el.classList.toggle('fdcompact',!on)}
function closeFD(){const el=$('#fduel');if(el){el.classList.remove('show');el.innerHTML=''}$('#battle').classList.remove('induel');UI.fd=null}
function fdPress(a){const F=UI.fd;if(!F)return;const D=F.D;
  if(a==='cam'){UI.fdCam=D.done?null:D;fdZoom();return}if(a==='close'){closeFD();return}
  if(!F.ctlMe||D.done)return;
  if(a==='auto'){fdInput(D,UI.player,'auto');fdMode();updFD(true);return}
  if(a==='flee'){if(F.me.ctl!=='me'&&D.ph==='fight'){}fdInput(D,UI.player,'flee');return}
  if(F.me.ctl!=='me'){F.me.ctl='me';fdMode()}
  let k=a;if(a==='sk0'||a==='sk1'){k=F.me.sk[+a[2]];if(!k)return;if(F.me.qi<fdCost(k)-1e-6){fdToast('气不足');return}}
  if(k==='dodge'&&F.me.cdd>0)return;
  fdInput(D,UI.player,k);const b=F.el.querySelector(`[data-a="${a}"]`);if(b){b.classList.remove('pr');void b.offsetWidth;b.classList.add('pr')}}
function fdToast(t){const F=UI.fd;if(!F)return;const r=F.el.querySelector('.fdres');r.textContent=t;r.className='fdres tip';clearTimeout(fdToast._t);fdToast._t=setTimeout(()=>{if(r.classList.contains('tip')){r.textContent='';r.className='fdres'}},900)}
function fdResult(D,r,t){const F=UI.fd;if(!F)return;const el=F.el.querySelector('.fdres');el.textContent=t.replace(/\s/g,'');el.className='fdres show';F.el.querySelectorAll('.fdk').forEach(b=>b.disabled=true)}
function fdActTxt(P,D){if(D.ph==='app')return '策马上前';if(P.stun>0)return '踉跄';const a=P.act;if(!a)return '';if(a.k==='heavy'&&a.hi<1)return '蓄力猛攻!';if(FD_ACT_TXT[a.k])return FD_ACT_TXT[a.k];return fdSkName(a.k)}
function updFD(force){const F=UI.fd;if(!F)return;const D=F.D,el=F.el;const t=D.ph==='fight'?Math.max(0,50-(D.t-D.t0)):50;
  const set=(id,P)=>{const box=el.querySelector('#'+id);if(!box)return;const i=box.querySelector('.fdhp i');const w=clamp(P.hp,0,100);i.style.width=w+'%';i.style.background=w>50?'#b8452c':w>25?'#c8862a':'#8a1e12';box.querySelector('.fdhp em').textContent=Math.max(0,Math.round(P.hp));
    const q=Math.floor(P.qi+1e-6);const qe=box.querySelector('.fdq');const qs='●'.repeat(q)+'○'.repeat(6-q);if(qe.textContent!==qs)qe.textContent=qs;
    const st=box.querySelector('.fds');const tx=fdActTxt(P,D);if(st.textContent!==tx)st.textContent=tx;st.className='fds'+(P.act&&(P.act.k==='heavy'||P.act.k==='huima')&&P.act.hi<1?' warn':P.stun>0?' stun':'')};
  set('fdpA',F.me);set('fdpB',F.foe);const tm=el.querySelector('.fdtm');const ts=D.ph==='fight'?Math.ceil(t)+'″':'';if(tm.textContent!==ts)tm.textContent=ts;
  if(F.ctlMe){const me=F.me;const busy=D.done||D.ph!=='fight';el.querySelectorAll('.fdk').forEach(b=>{const a=b.dataset.a;let dis=busy;if(a==='dodge')dis=dis||me.cdd>0;if(a==='sk0'||a==='sk1'){const k=me.sk[+a[2]];dis=dis||!k||me.qi<fdCost(k)-1e-6}b.classList.toggle('off',dis);b.classList.toggle('now',!!(me.act&&(me.act.k===a||(a[0]==='s'&&a[1]==='k'&&me.act.k===me.sk[+a[2]]))))});
    const au=el.querySelector('.fdauto');if(au){const on=me.ctl!=='me';if(au.classList.contains('on')!==on||force){au.classList.toggle('on',on);au.textContent=on?'亲自出招':'托付'}}}}
// 镜头：拉近并跟随
function fdZoom(){const D=UI.fdCam;if(!D)return;UI.fdZ=Math.max(R.cam.z,R.vw<R.vh?2.3:R.vh<500?1.6:2.2)}
function fdCamStep(dt){const D=UI.fdCam;if(!D){if(R3.prePitch!=null&&!(UI.fd&&!UI.fd.D.done))r3FdEnd();return}if(D.done){UI.fdCam=null;r3FdEnd();return}const k=Math.min(1,dt*4);
  UI.fdOffT=(UI.fdOffT||0)-dt;if(UI.fdOffT<=0){UI.fdOffT=0.4;const el=$('#fduel');let off=0;if(el&&el.classList.contains('show')){const r=el.getBoundingClientRect();off=Math.max(0,R.vh-r.top)/2}else{const bt=$('#bottom');if(bt){const r=bt.getBoundingClientRect();off=Math.max(0,R.vh-r.top)/2}}UI.fdOff=off}
  if(R3.on){r3FdCam(D,k);return}
  R.cam.x+=(D.cx-R.cam.x)*k;R.cam.y+=(D.cy-30+(UI.fdOff||0)/R.cam.z-R.cam.y)*k;if(UI.fdZ){R.cam.z+=(UI.fdZ-R.cam.z)*k;if(Math.abs(UI.fdZ-R.cam.z)<0.01)UI.fdZ=0}clampCam()}
// 观战小条（电脑之间的单挑）
function updWatch(){let el=$('#fdw');const L=UI.fdWatch.filter(D=>!D.done&&!(UI.fd&&UI.fd.D===D));
  if(!L.length){if(el)el.style.display='none';return}if(!el){el=document.createElement('div');el.id='fdw';$('#battle').appendChild(el);el.addEventListener('pointerdown',ev=>{const b=ev.target.closest('[data-d]');if(!b)return;ev.stopPropagation();const D=B.duels.find(x=>x.id===+b.dataset.d);if(D){UI.fdCam=D;fdZoom();openFD(D)}})}
  el.style.display='';const html=L.slice(0,2).map(D=>`<div class="fdwi" data-d="${D.id}"><b style="color:${B.sides[D.a.side].color}">${esc(D.a.g.name)}</b><span class="bar"><i style="width:${clamp(D.a.hp,0,100)}%"></i></span><em>单挑</em><span class="bar r"><i style="width:${clamp(D.b.hp,0,100)}%"></i></span><b style="color:${B.sides[D.b.side].color}">${esc(D.b.g.name)}</b><u>观战</u></div>`).join('');
  if(el._h!==html){el.innerHTML=html;el._h=html}}
function fdFrame(dt){fdCamStep(dt);if(UI.fd){if(UI.fd.D.done&&!B.duels.includes(UI.fd.D)){}updFD()}updWatch()}
function fdKey(e){const F=UI.fd;if(!F||!F.ctlMe||F.D.done)return false;const a=FD_KEYS[e.code];if(!a)return false;e.preventDefault();fdPress(a);return true}

// ---------- 会战音效 ----------
const HAS_SFX=()=>typeof SFX!=='undefined'&&SFX.ready();
function panOf(x){if(!R||!R.cam||!R.vw)return 0;const [sx]=w2s(x,0);return clamp((sx/R.vw)*2-1,-0.9,0.9)}
function bsfx(e){if(!HAS_SFX()||UI.fast)return;const me=UI.view;
  switch(e.k){
    case 'start':SFX.play('battle');SFX.music('battle');break;
    case 'rout':if(e.u.side===me||Math.random()<0.5)SFX.play('horn',{k:e.u.side===me?0.75:0.9,gain:0.6});break;
    case 'rally':case 'rallyCall':SFX.play('drumS');break;
    case 'gen':if(e.how!=='fled')SFX.play('gong',{k:e.killed?0.8:1});break;
    case 'reinf':SFX.play('horn');break;
    case 'fire':case 'shipFire':SFX.play('fire');break;
    case 'gsk':SFX.play('drum');break;
    case 'gateBroken':SFX.play('thud');SFX.play('drum');break;
    case 'end':SFX.music(null);SFX.play(UI.player<0?'gong':e.w===UI.player?'win':'lose');break;
    case 'heroOut':SFX.play('hoof',{pan:panOf(e.h.cx),gain:0.7});break;
    case 'hsk':{const k=e.k2;const p={pan:e.h.genSol?panOf(e.h.genSol.x):0};SFX.play(k==='hengsao'?'slash':k==='tuzhen'?'hoof':k==='huhou'?'roar':k==='tiegu'?'bell':k==='baibu'?'arrows':'roar',p);if(k==='wufu')SFX.play('drum');break}
    case 'fdStart':SFX.play('drum');SFX.play('horn',{k:1.1});break;
    case 'fdSk':SFX.play('whoosh');break;
    case 'fdFx':{const p={pan:panOf(e.x)};const t=e.t;if(t==='hit')SFX.play('clash',p);else if(t==='big'||t==='break'||t==='counter'){SFX.play('thud',p);SFX.play('slash',p)}else if(t==='intr'){SFX.play('clash',p);SFX.play('thud',p)}
      else if(t==='block'||t==='parry')SFX.play('clang',Object.assign({min:0.02,gain:t==='parry'?1:0.6},p));else if(t==='dodge'||t==='pdodge')SFX.play('whoosh',p);else if(t==='roar')SFX.play('roar',p);else if(t==='buff')SFX.play('bell',p);break}
    case 'fdEnd':SFX.play('gong',{k:e.res&&e.res.how==='kill'?0.8:1.1});break;
    case 'duelRefuse':SFX.play('drumS');break;
  }}
// 环境声：短兵相接与箭雨
UI.sfxT=0;UI.arrN=0;
function battleAmbient(dt){if(!HAS_SFX()||!B||B.phase!=='battle'||UI.paused||UI.fast)return;UI.sfxT-=dt;if(UI.sfxT>0)return;UI.sfxT=0.12;
  let eng=0,tot=0,vis=[];const [wx0,wy0]=s2w(0,0),[wx1,wy1]=s2w(R.vw,R.vh);
  for(const u of B.units){if(u.st!=='ok')continue;tot+=u.n;if(u.engaged>0){eng+=u.engaged;if(u.cx>wx0-100&&u.cx<wx1+100&&u.cy>wy0-100&&u.cy<wy1+100)vis.push(u)}}
  SFX.setIntensity(tot?Math.min(1,eng/tot*6):0);
  if(vis.length){const u=vis[(Math.random()*vis.length)|0];const p=Math.min(0.95,u.engaged/12)*(R.cam.z>0.5?1:0.5);if(Math.random()<p)SFX.play(Math.random()<0.25?'thud':'clash',{pan:panOf(u.cx),gain:clamp(R.cam.z,0.3,1)*0.7,min:0.06})}
  const na=B.arrows.length;if(na>UI.arrN+25)SFX.play('arrows',{gain:0.7});UI.arrN=na}

// ================= 历史战役 · 名将传：选关、目标、战报 =================
const STAR_KEY='mz_stars';
function starsGet(){try{return JSON.parse(localStorage.getItem(STAR_KEY)||'{}')||{}}catch(e){return {}}}
function starsSet(id,n){try{const o=starsGet();if(!(o[id]>=n)){o[id]=n;localStorage.setItem(STAR_KEY,JSON.stringify(o))}}catch(e){}}
const starStr=(n,m)=>'★'.repeat(n)+'☆'.repeat((m||3)-n);
const HIST_STAR_TXT=['获胜','折损不过四成','主将无恙且速胜'];
// 旧有四场名战也收入战役
const HIST_OLD=[
 {id:'puyang',name:'濮阳之战',year:194,era:'兴平元年',sub:'曹操夜袭吕布，濮阳城下大战',sides:['曹操','吕布'],desc:'吕布袭取兖州，曹操回军争濮阳。吕布骁骑纵横，曹操亲冒矢石，几为所擒。',build:p=>scenCfg(SCEN_PUYANG,p)},
 {id:'hulao',name:'虎牢关之战',year:190,era:'初平元年',sub:'雄关攻防，两山夹峙',sides:['关东联军','吕布'],desc:'关东诸侯会盟讨董，兵临虎牢。关城两山夹峙，一门当关——攻方以冲车撞门、云梯攀城。',build:p=>scenHulao(p)},
 {id:'hefei',name:'合肥之战',year:215,era:'建安二十年',sub:'逍遥津 · 张辽八百破十万',sides:['孙权','张辽'],desc:'孙权率十万众围合肥，张辽、李典、乐进据城死守。',build:p=>scenHefei(p)},
 {id:'chibi',name:'赤壁之战',year:208,era:'建安十三年',sub:'连环船 · 东南风 · 火船',sides:['孙刘联军','曹操'],desc:'曹操连舟为营，黄盖诈降，以火船乘东南风纵火，烧尽北船。',build:p=>scenChibi(p)},
];
function histList(){return HIST.concat(HIST_OLD).sort((a,b)=>a.year-b.year)}
function storyLevel(kind,id){return (kind==='hero'?HEROES:histList()).find(x=>x.id===id)}
// ---------- 选关界面 ----------
function openStoryMenu(kind){UI.embed=null;UI.storyKind=kind;const el=$('#smenu');const st=starsGet();const L=kind==='hero'?HEROES:histList();
  const tot=L.reduce((s,l)=>s+(st[l.id]||0),0);
  $('#smT').textContent=kind==='hero'?'名将传':'历史战役';$('#smSub').textContent=(kind==='hero'?'亲执一员名将，重演千古一战':'单场会战 · 依史布阵 · 可执任一方')+` · 已得 ${tot}/${L.length*3} ★`;
  $('#smList').innerHTML=L.map(l=>{const n=st[l.id]||0;const obj=l.obj?`<div class="sobjs">${(l.st||l.obj).slice(0,3).map((o,i)=>`<span>${'★'.repeat(i+1)} ${esc(o)}</span>`).join('')}</div>`:`<div class="sobjs">${HIST_STAR_TXT.map((o,i)=>`<span>${'★'.repeat(i+1)} ${o}</span>`).join('')}</div>`;
    const btns=kind==='hero'?`<button class="red" data-go="${l.id}" data-p="0">出　战</button>`:`<button class="red" data-go="${l.id}" data-p="0">执${esc(l.sides[0])}</button><button data-go="${l.id}" data-p="1">执${esc(l.sides[1])}</button>`;
    const seal=kind==='hero'?(portraitSeal(l.hero)):`<span class="seal">史</span>`;
    return `<div class="bcard slv"><div class="ctitle">${seal}<span class="sname">${esc(l.name)}</span><small>${esc(l.era||'')}${l.era?' · ':''}公元${l.year}年</small><b class="sstar${n?' got':''}">${starStr(n)}</b></div>
      <div class="ssub">${esc(l.sub)}</div><p class="intro">${esc(l.desc)}</p>${obj}<div class="row">${btns}</div></div>`}).join('');
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>launchStory(kind,b.dataset.go,+b.dataset.p));
  show('smenu');el.scrollTop=0}
function portraitSeal(id){try{const g=gStat(id);if(g&&typeof portrait==='function'){return `<img class="sport" src="${portrait(g.g,64)}">`}}catch(e){}return '<span class="seal">将</span>'}
function launchStory(kind,id,p){const L=storyLevel(kind,id);if(!L)return;let cfg;try{cfg=L.build(p)}catch(e){console.error(e);return}
  cfg.story=cfg.story||id;cfg.script=STORY_DEF[id]?id:null;cfg.storyKind=kind;
  const P=typeof titlePrefs==='function'?titlePrefs():{};const d=P.diff!=null?+P.diff:1;UI.diff=clamp(d,0,3);
  UI.story={kind,id,p};UI.embed=null;launch(cfg,false)}
function storyExit(){const k=UI.story?UI.story.kind:(UI.storyKind||'hist');UI.story=null;B=null;SG=null;if(typeof SFX!=='undefined')SFX.music('title');openStoryMenu(k)}
function storyBackTitle(){$('#smenu').style.display='none';const t=document.getElementById('title');if(t)t.style.display='block';else show('bmenu')}
// ---------- 战场 HUD：目标 ----------
function storyHud(){const el=$('#sobj');if(!el)return;if(!B||!B.cfg.story||!UI.story){el.style.display='none';return}
  const St=B.story;const L=storyLevel(UI.story.kind,UI.story.id);let h='';

  if(run){UI.acc+=dt*UI.speed;let n=0;const cap=UI.fast?70:10;while(UI.acc>=DT&&n<cap){step();UI.acc-=DT;n++;if(UI.fast)B.ev=B.ev.filter(e=>e.k!=='dead'&&e.k!=='stick')}if(n>=cap)UI.acc=0}
  const alpha=run?clamp(UI.acc/DT,0,1):1;
  processEvents();spawnDust();fdFrame(dt);battleAmbient(dt);
  const r0=performance.now();render(alpha,run?dt*UI.speed:dt*0.25);
  // 自适应清晰度：渲染过慢时降低像素比
  UI.rAvg=(UI.rAvg||0)*0.95+(performance.now()-r0)*0.05;UI.rChk=(UI.rChk||0)+dt;if(UI.rChk>2){UI.rChk=0;if(UI.rAvg>22&&R.dprCap>1){R.dprCap=Math.max(1,R.dprCap-0.5);onResize()}}
  UI.miniT-=dt;if(UI.miniT<=0){UI.miniT=0.2;drawMini($('#mini'))}
  UI.hudT-=dt;if(UI.hudT<=0){UI.hudT=0.25;updHud()}
  if(UI.fast&&B.result){UI.fast=false;UI.speed=1}}
function onResize(){if(!B||!R.cv)return;resizeRender();const mc=$('#mini');mc.width=Math.round(mc.clientWidth*R.dpr);mc.height=Math.round(mc.clientHeight*R.dpr);clampCam()}
function boot(){UI.touch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
  if(!UI.touch)$('#bMulti').style.display='none';
  $('#bBackM2').onclick=()=>{$('#bmenu').style.display='none';const t=document.getElementById('title');if(t)t.style.display='block'};
  const smb=$('#smBack');if(smb)smb.onclick=storyBackTitle;
  buildMenu();if(!EMBED)show('bmenu');initRender($('#cv'));initInput();window.addEventListener('resize',()=>setTimeout(onResize,60));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
  requestAnimationFrame(frame)}
boot();

return {fight:mzbFight,openMenu:mzbOpenMenu,openHist:()=>openStoryMenu("hist"),openHeroes:()=>openStoryMenu("hero"),_story:()=>({HIST,HEROES,STORY_DEF,launchStory,storyExit,starsGet}),_dbg:()=>({B,SG,UI,R,R3,camBtn,camRot,r3Toggle,r3Bench}),_duel:(a,b)=>startDuel(a,b),_gsk:u=>oGsk(u),_gskOK:u=>gskOK(u),_api:()=>({oHeroOut,oHeroBack,oAttack,oMove,oHsk,hskOK,startDuel,oDuel,fdInput,setSel,useAbil,answerDuel,genOf,duelCandidates})};
})();
