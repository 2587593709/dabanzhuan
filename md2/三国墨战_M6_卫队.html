<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241d17">
<title>三国墨战 · 天下篇</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--paper:#efe4cb;--paper2:#e4d6b6;--paper3:#f6eedc;--ink:#2a2622;--ink2:#5a4e40;--seal:#a8321f;--gold:#c9a24a;--green:#3f6e4a;--desk:#1f1914;
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
button{font-family:var(--serif);font-size:14px;color:var(--ink);background:var(--paper3);border:1px solid var(--ink2);border-radius:6px;padding:7px 12px;cursor:pointer;line-height:1.2}
button:hover:not(:disabled){background:#fff8e8}button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.red{background:var(--seal);color:#f6eedc;border-color:#6a1a10}button.red:hover:not(:disabled){background:#bb3a24}
button.ink{background:var(--ink);color:#efe4cb;border-color:#000}
button.sm{padding:4px 8px;font-size:12.5px}
.screen{display:none;position:fixed;inset:0}
.seal{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--seal);color:#f6eedc;font-weight:700;border-radius:3px;font-size:18px;flex:none}
/* 标题 */
#title{overflow:auto;background:radial-gradient(ellipse at 50% 30%,#efe4cb 0%,#d9c9a4 70%,#b8a47c 100%)}
#title .wrap{max-width:1080px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;align-items:center}
#title h1{font-size:64px;letter-spacing:14px;margin:8px 0 0;font-weight:900;color:var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.08)}
#title .sub{letter-spacing:4px;color:var(--ink2);margin:6px 0 4px}
#title .stamp{display:inline-block;background:var(--seal);color:#f6eedc;padding:4px 10px;font-weight:700;letter-spacing:3px;border-radius:3px;margin:10px 0 18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;width:100%}
.fcard{background:rgba(246,238,220,.9);border:1px solid var(--ink2);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative}
.fcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.18);background:#fffaf0}
.fcard .top{display:flex;gap:10px;align-items:center}.fcard img{width:56px;height:70px;border-radius:4px}
.fcard h3{margin:0;font-size:20px}.fcard p{margin:0;font-size:13px;line-height:1.55;color:var(--ink2)}
.fcard .stats{font-size:12.5px;color:var(--ink)}.stars{color:var(--seal);letter-spacing:1px}
.tbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
/* 游戏 */
#game{display:none;flex-direction:column}
#top{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:#241d17;color:#efe4cb;border-bottom:2px solid #000;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:5}
#top .tinfo{display:flex;flex-direction:column;line-height:1.15}#top .tinfo b{font-size:15px}#top .tinfo span{font-size:12px;color:#cdbf9f}
#top .res{display:flex;gap:12px;font-size:13.5px;white-space:nowrap}#endBtn{white-space:nowrap}#top .res b{color:#f3d27a;font-weight:700}#top .res i{font-style:normal;font-size:11.5px;margin-left:2px}
.pos{color:#8fd08f}.neg{color:#ff8f7a}
#top .spacer{flex:1}#top nav{display:flex;gap:6px}#top nav button,#menuBtn{background:#3a3027;color:#efe4cb;border-color:#5a4a3a}
#menuBtn{display:none}
#main{flex:1;display:flex;min-height:0;position:relative}
#mapbox{flex:1;position:relative;min-width:0;overflow:hidden}
#map{display:block;touch-action:none;cursor:grab}
#zoomCtl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}#zoomCtl button{width:38px;height:38px;padding:0;font-size:18px;background:rgba(246,238,220,.92)}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4}
#toast div{background:rgba(42,38,34,.9);color:#f6eedc;padding:7px 14px;border-radius:6px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#busy{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(168,50,31,.95);color:#f6eedc;padding:8px 18px;border-radius:20px;font-size:14px;display:none;z-index:40;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#side{width:360px;flex:none;background:var(--paper);border-left:2px solid #000;display:flex;flex-direction:column;min-height:0;box-shadow:-3px 0 10px rgba(0,0,0,.25)}
#sideHandle{display:none}
#sideBody{flex:1;overflow:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ph h3{margin:0;font-size:19px}.ph small{color:var(--ink2);font-size:12.5px}.ph .x{margin-left:auto;padding:3px 9px}
.sec{margin:12px 0 6px;font-weight:700;font-size:14px;border-bottom:1px solid rgba(90,78,64,.35);padding-bottom:3px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-weight:400;color:var(--ink2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:13.5px}.kv b{font-weight:700}
.bar{height:7px;background:rgba(90,78,64,.2);border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper2);border:1px solid rgba(90,78,64,.4);border-radius:12px;padding:3px 8px;font-size:12.5px}
.chip .u{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;background:var(--ink);color:#efe4cb;border-radius:3px;font-size:11px;font-weight:700}
.gchip{display:inline-flex;align-items:center;gap:6px;background:var(--paper3);border:1px solid rgba(90,78,64,.45);border-radius:6px;padding:3px 7px 3px 3px;font-size:13px;cursor:pointer}
.gchip img{width:26px;height:32px;border-radius:3px}.gchip small{color:var(--ink2);font-size:11px}
.gchip:hover{background:#fff8e8}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.acts button{padding:8px 4px}
.seg{display:inline-flex;border:1px solid var(--ink2);border-radius:6px;overflow:hidden}.seg button{border:none;border-radius:0;padding:5px 12px;background:var(--paper3)}.seg button.on{background:var(--ink);color:#efe4cb}
.blds{display:flex;flex-wrap:wrap;gap:5px}.blds span{font-size:12px;background:var(--paper2);padding:2px 7px;border-radius:4px}
.log{font-size:12.5px;line-height:1.6;color:var(--ink2)}.log div{border-bottom:1px dotted rgba(90,78,64,.25);padding:2px 0}.log b{color:var(--ink);font-weight:400}
.todo{font-size:13px;line-height:1.7}.todo a{color:var(--seal);cursor:pointer;text-decoration:underline}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}
.armyrow{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid rgba(90,78,64,.3);border-radius:6px;margin-bottom:5px;cursor:pointer;background:var(--paper3)}
.armyrow:hover{background:#fff8e8}
.hint{font-size:12.5px;color:var(--ink2);background:rgba(168,50,31,.07);border-left:3px solid var(--seal);padding:6px 8px;margin-top:8px;line-height:1.5}
/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(10,8,6,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.mbox{background:var(--paper);width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative}
.mbox:before,.mbox:after{content:'';position:absolute;left:-8px;right:-8px;height:12px;background:linear-gradient(#6a4428,#3a2414);border-radius:6px}.mbox:before{top:-8px}.mbox:after{bottom:-8px}
.mbox .mh{padding:16px 18px 6px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
.mbox .mc{padding:4px 18px 10px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
.mbox .mf{padding:10px 18px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mbox .mf button{min-width:88px;padding:9px 14px}
.mbox.wide{max-width:760px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:5px 4px;border-bottom:1px solid rgba(90,78,64,.25);text-align:left;white-space:nowrap}table.t th{font-weight:700;color:var(--ink2);font-size:12px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(90,78,64,.22)}
.stepper{display:inline-flex;align-items:center;gap:4px}.stepper button{width:32px;height:30px;padding:0}.stepper b{min-width:54px;text-align:center}
.report .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.report .side{background:var(--paper3);border:1px solid rgba(90,78,64,.35);border-radius:6px;padding:8px;display:flex;gap:8px}
.report .side img{width:48px;height:60px;border-radius:3px}
.report .lines p{margin:4px 0;text-indent:2em}
.stampbig{position:absolute;right:22px;top:14px;border:3px solid var(--seal);color:var(--seal);font-weight:900;font-size:26px;padding:2px 10px;transform:rotate(-12deg);border-radius:6px;opacity:.85}
.ev{display:flex;gap:14px;align-items:flex-start}.ev img{width:120px;height:150px;border-radius:4px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.statbars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.statbars .bar{margin:0;height:9px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;color:#f6eedc}
.b-war{background:#a8321f}.b-peace{background:#7a7064}.b-truce{background:#b8862a}.b-ally{background:#3f6e4a}
textarea{width:100%;min-height:90px;font-family:monospace;font-size:11px;background:var(--paper3);border:1px solid var(--ink2);border-radius:4px;padding:6px}
select{font-family:var(--serif);font-size:14px;padding:6px;background:var(--paper3);border:1px solid var(--ink2);border-radius:4px}
/* 手机竖屏：底部抽屉 */
@media (max-width:899px){
  #top{height:auto;min-height:48px;padding:5px 8px;gap:8px;flex-wrap:nowrap}
  #top nav{display:none}#menuBtn{display:inline-block;padding:6px 10px}
  #top .res{gap:8px;font-size:12.5px}.hide-s{display:none}
  #top .tinfo b{display:none}#top .tinfo span{white-space:nowrap;font-size:12px;color:#efe4cb}#endBtn{padding:7px 10px;white-space:nowrap;font-size:13px}#top .res i{display:none}
  #side{position:absolute;left:0;right:0;bottom:0;width:auto;height:46vh;border-left:none;border-top:2px solid #000;border-radius:12px 12px 0 0;transition:height .2s;z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
  #side.collapsed{height:44px}
  #sideHandle{display:flex;height:22px;align-items:center;justify-content:center;flex:none;cursor:pointer}#sideHandle span{width:44px;height:5px;border-radius:3px;background:var(--ink2);opacity:.6}
  #side.collapsed #sideBody{overflow:hidden}
  #sideBody{padding:4px 12px 16px}
  #zoomCtl{bottom:auto;top:10px}
  .acts{grid-template-columns:repeat(3,1fr)}
  #title h1{font-size:46px;letter-spacing:8px}
  .mbox .mc{padding:4px 14px 10px}.ev img{width:90px;height:112px}
}
/* 手机横屏：右侧窄栏 */
@media (max-height:520px) and (orientation:landscape){
  #top{height:42px}#top nav{display:none}#menuBtn{display:inline-block}.hide-s{display:none}
  #side{position:static;width:300px;height:auto;border-radius:0;border-top:none;border-left:2px solid #000}#side.collapsed{height:auto}#sideHandle{display:none}
  .mbox{max-height:94vh}
}
/* ===== 全国篇 ===== */
#tmap{width:100%;max-width:760px;border:1px solid var(--ink2);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);margin:0 0 16px;display:block}
#mini2{position:absolute;right:10px;top:10px;border:1px solid rgba(42,38,34,.8);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.35);background:#e8dcc1;touch-action:none;cursor:pointer;opacity:.95}
.fgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fcard p{font-size:12.5px}
@media (max-width:899px){#mini2{right:auto;left:8px;top:8px}}
@media (max-height:520px) and (orientation:landscape){#mini2{right:auto;left:8px;top:8px}}
.fcard.hot{box-shadow:0 0 0 3px var(--seal),0 4px 14px rgba(0,0,0,.2);background:#fffaf0}
#tmap{cursor:pointer}
.statbars .bar{position:relative}.statbars .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:rgba(168,50,31,.55);text-decoration:none}
/* ===== 单挑（回合制） ===== */
#dx{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(12,9,6,.78);padding:10px;font-family:var(--serif)}
#dx.show{display:flex}
#dx .dxbox{width:min(640px,100%);max-height:100%;overflow:auto;background:linear-gradient(#f3e9d2,#e6d7b5);border:2px solid #2a2622;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#dx .dxh{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;letter-spacing:4px;border-bottom:1px solid rgba(42,38,34,.3);padding-bottom:4px}
#dx .dxh small{font-size:13px;letter-spacing:0;color:var(--ink2);font-weight:400}
#dx .dxst{display:flex;align-items:center;justify-content:space-between;gap:6px}
#dx .dxs{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
#dx .dxp{position:relative}
#dx .dxp img{width:92px;height:115px;border:3px solid;border-radius:6px;background:#d8c9a3;display:block;transition:transform .12s}
#dx .dxp img.hit{animation:dxhit .45s}
@keyframes dxhit{0%{transform:translateX(0);filter:none}20%{transform:translateX(-9px);filter:brightness(1.6) sepia(1) hue-rotate(-40deg)}45%{transform:translateX(7px)}70%{transform:translateX(-4px)}100%{transform:translateX(0);filter:none}}
#dx .dxact{position:absolute;left:50%;top:-8px;transform:translate(-50%,-10px) scale(.6);opacity:0;background:#2a2622;color:#f6eedc;font-weight:700;font-size:15px;padding:3px 10px;border-radius:14px;white-space:nowrap;transition:all .25s}
#dx .dxact.show{opacity:1;transform:translate(-50%,-14px) scale(1)}
#dx .dxn{font-size:18px;font-weight:700}
#dx .dxw{font-size:12px;color:var(--ink2)}
#dx .dxhp{position:relative;width:100%;max-width:190px;height:14px;background:rgba(42,38,34,.18);border-radius:7px;overflow:hidden}
#dx .dxhp i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .4s}
#dx .dxhp b{position:absolute;right:6px;top:-1px;font-size:11px;color:#1d1a16}
#dx .dxqi{font-size:12px;display:flex;align-items:center;gap:3px}
#dx .dxqi i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #6a4a20;background:transparent}
#dx .dxqi i.on{background:#c9a24a}
#dx .dxqi em{font-style:normal;color:var(--seal);font-size:11px}
#dx .dxsk{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#dx .dxsk span{font-size:11px;border:1px solid var(--ink2);border-radius:10px;padding:1px 6px;background:rgba(255,255,255,.35)}
#dx .dxvs{font-size:26px;font-weight:900;color:var(--seal);flex:none}
#dx .dxlog{height:128px;overflow:auto;background:rgba(255,255,255,.35);border:1px solid rgba(42,38,34,.25);border-radius:6px;padding:6px 8px;font-size:13.5px;line-height:1.55}
#dx .dxlog .rd{color:var(--ink2);font-size:12px;text-align:center}
#dx .dxctl{display:flex;flex-direction:column;gap:6px}
#dx .dxb3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#dx .dxb3 button{color:#f6eedc;font-size:18px;font-weight:700;padding:10px 4px;border-color:#000}
#dx .dxb3 button small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:2px}
#dx .dxb2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
#dx .dxb2 button{font-size:14.5px;padding:7px 4px}
#dx .dxb2 button small{display:block;font-size:10.5px;color:var(--ink2);margin-top:2px}
#dx .dxres{text-align:center;font-size:22px;font-weight:700;color:var(--seal);letter-spacing:2px}
#dx .dxwait{text-align:center;color:var(--ink2);padding:18px}
@media (max-height:520px){#dx .dxp img{width:62px;height:78px}#dx .dxlog{height:74px}#dx .dxb3 button{padding:6px 4px;font-size:15px}}

/* ---------- 剧本与难度 ---------- */
.scentabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 8px}
.scentabs button{padding:6px 12px;font-size:14px;font-weight:700;background:rgba(246,238,220,.85);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.scentabs button small{font-size:11px;font-weight:400;color:var(--ink2)}
.scentabs button.on{background:var(--ink);color:var(--paper)}.scentabs button.on small{color:#d8c9a3}
.scendesc{max-width:760px;font-size:13.5px;line-height:1.7;color:var(--ink2);text-align:center;margin:2px 0 12px}
.diffrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;margin:0 0 12px;font-size:13px}
.diffrow b{margin-right:4px}.diffrow button{padding:4px 12px;font-size:13px}.diffrow button.on{background:var(--seal);color:#f6eedc;border-color:var(--seal)}
.diffrow small{width:100%;text-align:center;color:var(--ink2);font-size:12px}
@media (max-width:640px){.scentabs button{padding:5px 8px;font-size:13px}.scentabs{gap:4px}}

.aset{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;font-size:15px}.aset input[type=range]{width:100%}

.v3seg{display:inline-flex;gap:0;border:1px solid var(--ink2);border-radius:6px;overflow:hidden;justify-self:start}.v3seg button{border:none;border-radius:0;padding:5px 16px;background:var(--paper3);font-weight:700}.v3seg button.on{background:var(--ink);color:var(--paper)}.v3seg button:disabled{opacity:.4}

/* ===== 即时会战（M1 模块） ===== */
.mzb{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:#2b2621;box-sizing:border-box}.mzb *{box-sizing:border-box}
.mzb{--paper:#efe4ca;--paper2:#e4d6b4;--paper3:#f6eedb;--ink:#2b2621;--ink2:#5a4e40;--red:#a8321f;--gold:#b8862a;--blue:#4f6a8f;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
.mzb button{font-family:inherit;cursor:pointer;border:1px solid var(--ink2);background:var(--paper3);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:14px;touch-action:manipulation}
.mzb button:active{transform:translateY(1px)}
.mzb button.red{background:var(--red);color:#f6eedb;border-color:#6e1e12;font-weight:700}
.mzb button:disabled{opacity:.4;cursor:default}
.mzb .seal{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--red);color:#f6eedb;font-weight:900;border-radius:3px;font-size:13px;flex:none}
.mzb.screen{position:fixed;inset:0;display:none}
/* ---------- 菜单 ---------- */
#bmenu{overflow-y:auto;background:radial-gradient(ellipse at 30% 20%,#f3e9d2 0%,#e4d6b4 55%,#c9b68e 100%)}
#bmenu::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 90%,rgba(60,55,45,.18),transparent 40%),radial-gradient(circle at 10% 80%,rgba(80,95,80,.14),transparent 35%)}
.mzb .mwrap{position:relative;max-width:560px;margin:0 auto;padding:calc(28px + var(--sat)) 16px calc(30px + var(--sab))}
.mzb h1{font-size:54px;font-weight:900;letter-spacing:10px;text-align:center;margin:6px 0 0;text-shadow:2px 2px 0 rgba(168,50,31,.18)}

function cityDev(c,owner,cap){ // 按归属算建筑与驻军（剧本切换时重算）
  const F=FACTIONS.find(f=>f.id===owner);const r100=v=>Math.max(0,Math.round(v/100)*100);const fl=c.fl;const p=c.pop;const clamp0=(v,a,b)=>Math.max(a,Math.min(b,v));
  const b={wall:c.wall,farm:0,market:0,barracks:0,stable:0};
  if(!c.pass){b.farm=p>=45?3:p>=25?2:1;b.market=c.bar?0:p>=50?3:p>=30?2:1;b.barracks=cap?(c.bar?1:3):p>=35?2:1;
    let st=(c.lat>=34||c.lon<=107)?1:0;if(cap)st++;if(CAVF.includes(owner))st++;if(c.lat<28&&!c.loc.includes('xiang'))st=Math.min(st,1);b.stable=clamp0(st,0,3)}
  let tot,style;const major=F&&F.major;
  if(c.pass){tot=(c.ai?2500:3500)+(major?1500:0);style=major?GAR_STYLE[F.region]||GAR_STYLE['中原']:GAR_STYLE['豪强']}
  else{tot=(p*75+c.wall*500)*(cap?1.6:1)*(major?1:c.bar?1.25:0.75);style=major?GAR_STYLE[F.region]||GAR_STYLE['中原']:GAR_STYLE['豪强']}
  const g={};
  if(c.bar&&c.loc.length){const lu=c.loc[0];g[lu]=r100(tot*0.55);g.dao=r100(tot*0.25);g.gong=r100(tot*0.2);if(c.loc[1])g[c.loc[1]]=r100(tot*0.2)}
  else for(const[t,v]of Object.entries(style))g[t]=r100(tot*v);
  for(const t in g)if(!g[t])delete g[t];return {b,gar:g}}
(function finishCities(){

    const lc=fl.find(x=>x.startsWith('loc='));c.loc=lc?lc.slice(4).split('/'):[];const pv=fl.find(x=>x.startsWith('prov='));c.prov=pv?pv.slice(5):'化外';
    const d=cityDev(c,c.owner,c.cap);c.b=d.b;c.gar=d.gar;

function formArmy(cid,gids,troops,cpt){const c=S.cities[cid];const tot=sumT(troops);if(tot<=0)return null;if(!gids.length&&tot>NOGEN_CAP)return null;

function armyTake(aid,troops){const a=S.armies[aid];if(!inCity(a))return false;const c=S.cities[a.at];if(c.owner!==a.f)return false;let tot=sumT(a.troops)+sumT(troops);if(tot>armyCap(a))return false;
  for(const[t,n]of Object.entries(troops)){if((c.gar[t]||0)<n)return false}for(const[t,n]of Object.entries(troops)){if(n<=0)continue;c.gar[t]-=n;if(c.gar[t]<=0)delete c.gar[t];a.troops[t]=(a.troops[t]||0)+n}return true}
function armyDrop(aid,troops){const a=S.armies[aid];if(!inCity(a))return false;const c=S.cities[a.at];if(c.owner!==a.f)return false;for(const[t,n]of Object.entries(troops)){const m=Math.min(n,a.troops[t]||0);if(m<=0)continue;a.troops[t]-=m;if(a.troops[t]<=0)delete a.troops[t];c.gar[t]=(c.gar[t]||0)+m}if(sumT(a.troops)<=0)disbandArmy(aid);return true}
function freeGen(g,cid){g.f='free';g.loc=null;if(g.guard)g.guard.n=0;g.home=cid||g.home;g.appear=Math.min(g.appear||S.year,S.year);g.loy=0}
function nearestOwnCity(f,from){if(!from||!S.cities[from]){const any=citiesOf(f)[0];return any?any.id:null}const seen={[from]:1};let q=[from];while(q.length){const nq=[];for(const id of q){if(S.cities[id].owner===f&&id!==from)return id;for(const n of nb(id))if(!seen[n]){seen[n]=1;nq.push(n)}}q=nq}const any=citiesOf(f)[0];return any?any.id:null}
function liftSiege(a){if(!a)return;a.siege=null;a.siegeT=0}

// 败退：离敌而去，数格之内择地（己城可入）；无路可退则返回 false
function retreatField(aid,from,steps=3){const a=S.armies[aid];if(!a)return false;liftSiege(a);a.ambush=false;const ctx=ctxFor(a,{real:true});const s=aTile(a);

// 城破/易主时，城中旧主军团突围
function evictArmies(cid,old){const ci=GR.cityTile[cid];armiesAt(cid).filter(x=>x.f===old).forEach(x=>{x.at=null;if(!retreatField(x.id,ci,3)){const by=S.cities[cid].owner;[...x.gens].forEach(g=>capture(g,by,cid));delete S.armies[x.id]}})}

// ---------- 行军 ----------
// 沿路径行进：踏入敌控制区即止；渡大江或行船近敌水寨须先接战；途经伏兵可能中伏；只可止于可驻之格
async function marchArmy(aid,path,opt={}){const a=S.armies[aid];if(!a||!path||!path.length)return{moved:0};
  let ctx=ctxFor(a,{real:true});const cav=isCavArmy(a),sail=ctx.sail;let prev=aTile(a);let trail=[prev];let stop={k:-1,i:prev};let k=0,reason='done';let movedAny=false;const fought=new Set();
  if(a.siege)liftSiege(a);a.ambush=false;
  const commit=async()=>{setTile(a,prev);const c0=cityAtTile(prev);a.at=c0&&c0.owner===a.f?c0.id:null;if(trail.length>1){movedAny=true;await HOOK.animPath(aid,trail)}trail=[prev]};
  for(;k<path.length;k++){const i=path[k];if(ctx.blk.has(i)){reason=knows(a.f,ctx.occ.get(i)||{f:a.f})?'blk':'found';break}const c=stepCost(prev,i,cav,sail);if(c===Infinity){reason='blk';break}if(c>a.mp+1e-6){reason='mp';break}
    // 水上拦截：步军渡大江（十格内敌水寨）；舟师行船（三格内敌水寨）
    let fc=null;if(!opt.noFord){if(!sail&&(GR.fl[i]&FL_FORD)&&GR.ter[i]===T_RIVER&&!(GR.fl[prev]&FL_FORD))fc=fleetAt(a.f,i,10);else if(sail&&isWaterT(i))fc=fleetAt(a.f,i,3)}
    if(fc&&!fought.has(fc.id)){fought.add(fc.id);if(stop.i!==prev){reason='blk';break}await commit();const r=await fleetCheck(a,fc);if(!S.armies[aid])return{moved:1,reason:'dead'};if(r!=='ok'){reason='naval';break}ctx=ctxFor(a,{real:true})}
    a.mp-=c;prev=i;trail.push(i);if(stoppable(i,ctx))stop={k,i};
    {const ft=fortAt(i);if(ft&&ft.f!==a.f&&hostile(a.f,ft.f))destroyFort(ft,a.f)}
    // 伏兵
    const amb=Object.values(S.armies).find(e=>e.ambush&&hostile(e.f,a.f)&&tDist(aTile(e),i)<=1);
    if(amb&&stop.i===prev){k++;reason='ambush';await commit();await springAmbush(amb,a);if(!S.armies[aid])return{moved:true,reason:'ambush'};break}

  await commit();

  if(reason==='found'&&a.f===S.player)await HOOK.event({title:'遭遇敌军',who:null,text:'前方发现敌军拦路，大军就地停驻。'});
  return{moved:movedAny,reason}}
// 敌方水寨：r 格内战船五百以上之敌城（取最强者）
function fleetAt(f,i,r){let best=null,bp=0;for(const c of Object.values(S.cities)){if(!hostile(f,c.owner))continue;if(tDist(GR.cityTile[c.id],i)>r)continue;if(navalNeed(c.id)<500)continue;const p=navalPow(cityDefenders(c.id).tr,c.owner);if(p>bp){bp=p;best=c}}return best}

async function fleetCheck(a,c){const def=c.owner;
  if(sumT(shipTr(a.troops))<300){addLog(`${S.fac[a.f].name}军欲渡江，为${S.fac[def].name}水军所阻。`);a.morale=Math.max(20,a.morale-10);for(const t in a.troops)a.troops[t]=Math.floor(a.troops[t]*0.97);a.mp=0;
    if(a.f===S.player)await HOOK.event({title:'渡江受阻',who:null,text:`${c.name}水军战船 ${fmtN(navalNeed(c.id))} 横江而列，我军无舟楫可渡。需在临江之城建水寨、造战船随军，方可强渡。`});return 'blocked'}
  const D=cityDefenders(c.id);const dsrc=cityDefSrc(c.id);
  const res=await fightOrAuto({f:a.f,tr:{...a.troops},gens:a.gens.slice(),morale:a.morale,cptS:sideCptS([a.id])},{f:def,tr:D.tr,gens:D.gens,morale:c.mx*0.4+50},{naval:true},{kind:'naval',cid:c.id,title:navalTitle(c.id)});
  res.title=navalTitle(c.id);res.city=c.id;applyLoss([{kind:'army',id:a.id}],res.a);applyLoss(dsrc,res.d);if(S.armies[a.id])S.armies[a.id].morale=clamp(res.a.morale,20,100);

// 舟师船损过多，江上之兵落水
function drownCheck(a){if(!a||!S.armies[a.id]||!isWaterT(aTile(a)))return;const sh=sumT(shipTr(a.troops)),land=sumT(landTr(a.troops));const capN=sh*3;if(land<=capN)return;const lost=Math.round((land-capN)*0.6);const k=lost/land;for(const t of Object.keys(landTr(a.troops))){a.troops[t]=Math.floor(a.troops[t]*(1-k));if(a.troops[t]<=0)delete a.troops[t]}addLog(`${aLead(a)}军战船不足，落水溺亡 ${fmtN(lost)}。`);if(sumT(a.troops)<200)disbandArmy(a.id)}
// ---------- 伏兵 ----------

async function springAmbush(e,a){const zA=Math.max(0,...a.gens.map(id=>gs(id)[2])),zE=Math.max(0,...e.gens.map(id=>gs(id)[2]));a.mp=0;e.ambush=false;

  addLog(`${S.fac[e.f].name}军 ${aLead(e)} 伏击${S.fac[a.f].name}军！`);if(me&&e.f!==S.player)await HOOK.event({title:'中伏',who:e.gens[0],text:`${aLead(e)}伏兵四起，杀声震天，我军 ${aLead(a)} 部猝不及防！`});

// ---------- 合军 / 分兵 ----------
function canMerge(a,b){if(!a||!b||a.id===b.id||a.f!==b.f)return false;if(!a.gens.length&&b.gens.length)[a,b]=[b,a];if(a.siege&&b.siege&&a.siege!==b.siege)return false;const near=(inCity(a)&&inCity(b)&&a.at===b.at)||(!inCity(a)&&!inCity(b)&&tDist(aTile(a),aTile(b))<=1)||(tDist(aTile(a),aTile(b))<=1);if(!near)return false;return a.gens.length+b.gens.length<=3&&sumT(a.troops)+sumT(b.troops)<=armyCap(a)}

  if(!inCity(a)){const ctx=moveCtx(a.f,a.id,{real:true,sail});ctx.occ.set(aTile(a),a);const cand=nbrs(aTile(a),[]).filter(j=>stoppable(j,ctx));if(!cand.length)return null;cand.sort((x,y)=>(isWaterT(x)===sail?0:1)-(isWaterT(y)===sail?0:1));tile=cand[0]}
  const id='a'+(S.nextArmy++);const b={id,f:a.f,at:inCity(a)?a.at:null,x:tile%GW,y:(tile/GW)|0,siege:null,siegeT:0,gens:gid?[gid]:[],troops:{},morale:gid?a.morale:Math.min(a.morale,NOGEN_MOR),mp:a.mp,dest:null,goal:null,cpt:null};

// ---------- 郡界（以城为中心按行军难易划分） ----------
const RCOST=[Infinity,1,1.6,1.6,1.8,4,Infinity,1,1.2,1.8,6];
function buildRegions(){_reset();const h=new Heap();const reg=GR.reg;const nb=[];
  CITIES.forEach((c,k)=>{const i=GR.cityTile[c.id];_D[i]=0;_touched.push(i);reg[i]=k;h.push(0,i)});
  while(h.size()){const u=h.pop();if(_C[u])continue;_C[u]=1;nbrs(u,nb);for(const v of nb){if(_C[v])continue;const f=GR.fl[v];let c=(f&FL_FERRY)?1.5:(f&FL_FORD)?1:RCOST[GR.ter[v]];if(c===Infinity)continue;if(f&FL_ROAD)c*=0.8;if(GR.passZone[v]>=0&&GR.passZone[v]!==reg[u]&&GR.city[u]<0)c+=2;const diag=(u%GW!==v%GW)&&(((u/GW)|0)!==((v/GW)|0));if(diag)c*=1.41;const nd=_D[u]+c;if(nd<_D[v]&&nd<70){if(_D[v]===Infinity)_touched.push(v);_D[v]=nd;reg[v]=reg[u];h.push(nd,v)}}}

function tCost(i,sail){const c=GR.cost[i];if(!sail)return c;if(c===Infinity){const t=GR.ter[i];if(t===T_RIVER||t===T_LAKE)return 1;if(t===T_SEA)return 1.5;return c}if((GR.fl[i]&FL_RIV2)&&c>1.5)return 1.5;return c}
function stepCost(u,v,cav,sail){let c=tCost(v,sail);if(c===Infinity)return c;const ux=u%GW,uy=(u/GW)|0,vx=v%GW,vy=(v/GW)|0;

  if(sail&&GR.city[u]<0&&GR.city[v]<0&&isWaterT(u)!==isWaterT(v))c+=3; // 登船 / 登岸

function isCavArmy(a){const tot=sumT(a.troops);let cav=0;for(const k in a.troops)if(isCavT(k))cav+=a.troops[k];return tot>0&&cav>=tot*0.999}
const hostile=(f,o)=>f!==o&&attackStatus(f,o)==='ok';
const cityAtTile=i=>{const k=GR.city[i];return k>=0?S.cities[CITIES[k].id]:null};

function aCity(a){if(a.at)return a.at;const k=GR.reg[aTile(a)];if(k>=0)return CITIES[k].id;let best=null,bd=1e9;for(const c of Object.values(S.cities)){const d=tDist(GR.cityTile[c.id],aTile(a));if(d<bd){bd=d;best=c.id}}return best}

// 动态通行：他军所在格不可入；敌军、敌城周围一格为控制区（踏入即止）。opt.real＝按实情（执行时）；否则按所知（规划时）
function moveCtx(f,selfId,opt={}){const occ=new Map(),zoc=new Set(),blk=new Set(),allied=new Set();const nb=[];
  for(const a of Object.values(S.armies)){if(a.id===selfId||inCity(a))continue;if(!opt.real&&!knows(f,a))continue;const i=aTile(a);occ.set(i,a);if(a.f!==f)blk.add(i);if(hostile(f,a.f)){nbrs(i,nb);for(const j of nb)zoc.add(j)}}
  for(const c of Object.values(S.cities)){if(c.owner===f)continue;const i=GR.cityTile[c.id];if(friendly(f,c.owner)){allied.add(i);continue}blk.add(i);if(hostile(f,c.owner)){nbrs(i,nb);for(const j of nb)zoc.add(j)}}
  return{f,occ,zoc,blk,allied,sail:!!opt.sail}}
const stoppable=(i,ctx)=>tCost(i,ctx.sail)<Infinity&&!ctx.blk.has(i)&&!ctx.occ.has(i)&&!ctx.allied.has(i);

// 本回合可达（踏入控制区即止）
function reachOf(a,ctx){ctx=ctx||ctxFor(a);const cav=isCavArmy(a),sail=ctx.sail;const s=aTile(a);const dist=new Map(),prev=new Map();_reset();const h=new Heap();_D[s]=0;_touched.push(s);h.push(0,s);const nb=[];const mp=a.mp+1e-6;
  while(h.size()){const u=h.pop();if(_C[u])continue;_C[u]=1;dist.set(u,_D[u]);prev.set(u,_P[u]);if(u!==s&&ctx.zoc.has(u))continue;nbrs(u,nb);
    for(const v of nb){if(_C[v]||ctx.blk.has(v))continue;const c=stepCost(u,v,cav,sail);if(c===Infinity)continue;const nd=_D[u]+c;if(nd>mp)continue;if(nd<_D[v]){if(_D[v]===Infinity)_touched.push(v);_D[v]=nd;_P[v]=u;h.push(nd,v)}}}
  _reset();return{s,dist,prev,ctx}}
// 远程规划（控制区只加代价，不截停）
function planFrom(a,ctx,maxCost,zp=3){const cav=isCavArmy(a),sail=ctx.sail;const s=aTile(a);const dist=new Map(),prev=new Map();_reset();const h=new Heap();_D[s]=0;_touched.push(s);h.push(0,s);const nb=[];
  while(h.size()){const u=h.pop();if(_C[u])continue;_C[u]=1;dist.set(u,_D[u]);prev.set(u,_P[u]);nbrs(u,nb);
    for(const v of nb){if(_C[v]||ctx.blk.has(v))continue;let c=stepCost(u,v,cav,sail);if(c===Infinity)continue;if(ctx.zoc.has(v))c+=zp;const nd=_D[u]+c;if(nd>maxCost)continue;if(nd<_D[v]){if(_D[v]===Infinity)_touched.push(v);_D[v]=nd;_P[v]=u;h.push(nd,v)}}}

function tracePath(prev,t){const p=[];for(let x=t;x!==undefined&&x!==-1;x=prev.get(x))p.push(x);p.reverse();return p.slice(1)}
// A*：到某格，或到目标（城/军）旁可驻之格
function findPath(a,goalTile,adjacent,ctx,maxCost=600){ctx=ctx||ctxFor(a);const cav=isCavArmy(a),sail=ctx.sail;const s=aTile(a);const goals=new Set();
  if(adjacent){for(const j of nbrs(goalTile,[]))if(stoppable(j,ctx)||j===s)goals.add(j)}else goals.add(goalTile);if(!goals.size)return null;if(goals.has(s))return[];

  while(h.size()){const u=h.pop();if(_C[u])continue;_C[u]=1;if(goals.has(u)){hit=u;break}nbrs(u,nb);
    for(const v of nb){if(_C[v])continue;if(ctx.blk.has(v)&&!goals.has(v))continue;let c=stepCost(u,v,cav,sail);if(c===Infinity)continue;if(ctx.zoc.has(v)&&!goals.has(v))c+=3;const nd=_D[u]+c;if(nd>maxCost)continue;if(nd<_D[v]){if(_D[v]===Infinity)_touched.push(v);_D[v]=nd;_P[v]=u;h.push(nd+Math.max(0,octile(v,goalTile)-1),v)}}}

function takeMix(gar,n){const tot=sumT(landTr(gar));const tr={};if(tot<=0)return tr;let left=n;const ks=Object.keys(landTr(gar)).sort((a,b)=>gar[b]-gar[a]);

async function runEvents(){
  if(S.pendingEvents&&S.pendingEvents.length){for(const e of S.pendingEvents)await fireEvent(e);S.pendingEvents=[]}
  comingOfAge();if(S.month===0)yearlyGrowth();
  for(const e of EVENTS){if(!e.repeat&&EVX.done(e.id))continue;let ok=false;try{ok=e.when()}catch(err){ok=false}if(!ok)continue;EVX.mark(e.id);if(e.repeat&&e.id!=='huashang')S.flags.ev[e.id]=S.turn;await e.run();if(S.over)return}
  await titleCheck();
  // 随机天灾人事（只报本方）
  if(rnd()<0.12){const cs=Object.values(S.cities).filter(c=>isMajor(c.owner)&&!c.pass);if(cs.length){const c=pick(cs);const f=S.fac[c.owner];const k=rnd();const me=c.owner===S.player;
    if(k<0.3){const lost=Math.round(f.grain*0.12);f.grain-=lost;c.mx-=8;if(me)addLog(`${c.name}蝗灾，损粮 ${lost}，民心浮动。`)}
    else if(k<0.5){for(const t in c.gar)c.gar[t]=Math.floor(c.gar[t]*0.9);if(me)addLog(`${c.name}疫病流行，驻军折损一成。`)}
    else if(k<0.8){const g=Math.round(c.pop*12);f.grain+=g;if(me)addLog(`${c.name}风调雨顺，额外收粮 ${g}。`)}
    else{c.pop+=3;c.mx+=5;if(me)addLog(`流民涌入${c.name}，人口增加。`)}}}
}

// ================= 三国墨战 · AI =================
function hostileTo(f,other){return other!==f&&attackStatus(f,other)==='ok'}
function isFrontier(f,c){return nb(c.id).some(n=>{const o=S.cities[n].owner;return o!==f&&!friendly(f,o)&&attackStatus(f,o)!=='no'})||besiegers(c.id).some(b=>b.f!==f)}
// 威胁：围城之敌＋十四格内可来犯之敌军
function threatAt(f,c){const ci=GR.cityTile[c.id];let t=0;for(const x of Object.values(S.armies)){if(x.f===f||friendly(f,x.f))continue;if(x.siege===c.id){t+=armyPow(x);continue}if(!isMajor(x.f)||attackStatus(x.f,f)!=='ok')continue;const d=tDist(aTile(x),ci);if(d<=14)t+=armyPow(x)*(d<=6?0.9:0.55)}return t}
function genFree(g){return g.loc&&g.loc.t==='c'&&!g.captive}

async function aiTurn(f){const Fa=S.fac[f];if(!Fa.alive)return;
  if(Fa.major){aiDiplomacy(f);aiPeople(f);aiEconomy(f);await aiMilitary(f);aiSearch(f);await aiBribe(f);aiMarriage(f);aiSpy(f)}else aiMinor(f);
  await flushCaptives()}

function aiEconomy(f){const Fa=S.fac[f];const cs=citiesOf(f);const up=upkeep(f);const reserve=150+40*cs.length;
  cs.forEach(c=>{if(c.pass)return;if(c.mx<40)c.tax=0;else if(Fa.gold<300&&c.mx>62)c.tax=2;else c.tax=1;
    const here=gensInCity(c.id,f);if(here.length){const best=here.sort((a,b)=>gs(b)[3]-gs(a)[3])[0];if(!c.gov||!S.gens[c.gov]||S.gens[c.gov].loc?.id!==c.id)c.gov=best.id}
    if(c.mx<30&&Fa.grain>600)doRelief(c)});
  // 建设
  cs.slice().sort(()=>rnd()-0.5).forEach(c=>{if(c.pass||c.build)return;const fr=isFrontier(f,c);let k;
    if(fr&&c.portOK&&(c.b.port||0)<2&&nb(c.id).some(n=>isRiver(c.id,n)&&S.cities[n].owner!==f)&&rnd()<0.3)k='port';
    else if(fr){if(c.b.wall<2)k='wall';else if(c.b.barracks<2)k='barracks';else if(c.b.stable<1)k='stable';else if(c.b.wall<3&&c.cap)k='wall';else if(c.b.barracks<3)k='barracks';else k=c.b.market<=c.b.farm?'market':'farm'}
    else{k=c.b.market<=c.b.farm?'market':'farm';if(c.b[k]>=4)k=c.b.barracks<2?'barracks':(c.b.stable<2?'stable':'wall')}
    const lv=c.b[k]||0;if(lv>=5)return;if(Fa.gold-BUILD_COST[lv+1]>reserve)doBuild(c,k)});
  // 募兵
  const yearGr=cs.reduce((s,c)=>s+cityGrainYear(c),0);const maxT=yearGr/46*1000*0.92;if(facTroops(f)>=maxT||Fa.grain<up.gr*6)return;let room=maxT-facTroops(f);
  cs.slice().sort((a,b)=>threatAt(f,b)-threatAt(f,a)).forEach(c=>{if(c.pass&&sumT(c.gar)>4000)return;const fr=isFrontier(f,c);const target=fr?5000+c.pop*90:2500;let need=target-sumT(c.gar);
    const th=threatAt(f,c);if(th>cityDefPow(c.id)*0.8)need=Math.max(need,4000);
    let guard=6;while(need>0&&recruitCap(c)>0&&guard-->0){const opts=unitsFor(f,c);let t;const sp=opts.filter(t=>UNITS[t].f);
      const cav=opts.filter(t=>t==='qi'||(t==='zq'&&Fa.gold>900));const inf=['dao','qiang','qiang','gong','dao','zb','cq','nu','nu'].filter(t=>opts.includes(t)&&(UNITS[t].cost<=90||Fa.gold>700));
      const r=rnd();const ships=opts.filter(t=>isShipT(t)&&UNITS[t].cost<=Fa.gold/3);const riverFront=c.b.port>0&&nb(c.id).some(n=>isRiver(c.id,n)&&S.cities[n].owner!==f&&attackStatus(f,S.cities[n].owner)==='ok');
      if(ships.length&&riverFront&&r<0.3)t=pick(ships);else if(sp.length&&r<0.35)t=pick(sp);else if(cav.length&&r<0.52)t=pick(cav);else t=pick(inf.length?inf:opts);
      const n=Math.min(1000,need,recruitCap(c),Math.floor(room/100)*100);if(n<100)break;const cost=UNITS[t].cost*n/1000;if(Fa.gold-cost<reserve*0.5)break;if(!doRecruit(c,t,n))break;need-=n;room-=n}})}

async function aiMilitary(f){const Fa=S.fac[f];const ag=Math.min(1.6,(Fa.aggr||0.7)*DF().aggr);const thA=1.2+(1-ag)*0.6,thS=0.9+(1-ag)*0.4;
  // 编组
  const cs=citiesOf(f);const maxArmies=Math.ceil(cs.length/2)+1;
  for(const c of cs){if(armiesOf(f).length>=maxArmies)break;if(!isFrontier(f,c))continue;const tot=sumT(c.gar);if(tot<5500+(1-ag)*2500)continue;
    const gens=gensInCity(c.id,f).filter(genFree).filter(g=>!g.moved);if(!gens.length)continue;
    gens.sort((a,b)=>(gs(b)[0]+gs(b)[1])-(gs(a)[0]+gs(a)[1]));const pickG=[gens[0].id];const sub=gens.slice(1).sort((a,b)=>Math.max(gs(b)[1],gs(b)[2])-Math.max(gs(a)[1],gs(a)[2]));sub.slice(0,gens.length>3?2:1).forEach(g=>pickG.push(g.id));
    if(gens.length===1&&c.cap&&S.fac[f].leader===gens[0].id&&cs.length>1)continue;
    const keep=Math.max(2000,tot*0.3);const frac=(tot-keep)/tot;const tr={};let cap=3000+gs(gens[0])[0]*100+(hasT(gens[0],'统帅')?3000:0);
    for(const[t,n]of Object.entries(c.gar)){const m=Math.floor((isShipT(t)?n:n*frac)/100)*100;if(m>0)tr[t]=m}let s0=sumT(tr);if(s0>cap){const k=cap/s0;for(const t in tr)tr[t]=Math.floor(tr[t]*k/100)*100}
    if(sumT(tr)>=3000)formArmy(c.id,pickG,tr)}
  // 合并同城闲置军团
  for(const c of cs){const here=armiesAt(c.id).filter(x=>x.f===f);if(here.length<2)continue;here.sort((x,y)=>armyCap(y)-armyCap(x));const main=here[0];for(const o of here.slice(1)){if(!main.gens.length||(o.goal&&o.goal.kind==='reinf'&&o.goal.id!==c.id))continue;if(sumT(main.troops)+sumT(o.troops)<=armyCap(main)&&main.gens.length+o.gens.length<=3){for(const[t,n]of Object.entries(o.troops))main.troops[t]=(main.troops[t]||0)+n;moveCpts('a',o.id,{t:'a',id:main.id});o.gens.forEach(g=>{S.gens[g].loc={t:'a',id:main.id};main.gens.push(g)});main.mp=Math.min(main.mp,o.mp);delete S.armies[o.id]}}}
  // 偏师：驰援前线、袭取空城
  aiDetach(f);
  // 行动
  for(const a of armiesOf(f)){const x=S.armies[a.id];if(!x)continue;try{if(isNoGen(x))await aiDetachArmy(f,x,thA,thS);else await aiArmy(f,x,thA,thS)}catch(e){console.error('aiArmy',e)}}
}
// 行军路线上的水战关口（步军渡大江：十格内敌水寨；舟师行船：三格内敌水寨）是否打得过

async function aiArmy(f,a,thA,thS){

  const ctx=ctxFor(a);const sail=ctx.sail;const full=armyMP(a);const range=a.mp+full*2;const P=planFrom(a,ctx,range);const here=aTile(a);const my=armyPow(a);
  const nb0=[];const bestAdj=ti=>{let bd=Infinity,bt=-1;nbrs(ti,nb0);for(const j of nb0){const d=j===here?0:P.dist.get(j);if(d===undefined)continue;if(j!==here&&!stoppable(j,ctx))continue;if(d<bd){bd=d;bt=j}}return[bd,bt]};

    const ep=armyPow(e)+armiesNear(e.f,et,2,x=>x.id!==e.id&&!x.siege).reduce((s0,x)=>s0+armyPow(x),0);const mp0=my+armiesNear(f,t,2,x=>x.id!==a.id&&!x.siege).reduce((s0,x)=>s0+armyPow(x),0);const r=mp0/(ep+0.1);
    if(r<1.1)continue;let sc=45+Math.min(r,3)*10-months(d)*12;if(e.siege&&S.cities[e.siege]&&S.cities[e.siege].owner===f)sc+=35;if(a.goal&&a.goal.id===e.id)sc+=10;opts.push({kind:'field',id:e.id,t,d,score:sc})}

    const dp=cityDefPow(c.id);const r=my/(dp+0.1);const val=c.pop+(c.cap?25:0)+(c.pass?15:0)+(S.flags.emperor===c.id?60:0)+(isMajor(c.owner)?10:0)+(c.owner===S.player?8:0);
    const co=armiesNear(f,ci,3,x=>x.id!==a.id&&!x.siege);const r2=(my+co.reduce((s0,x)=>s0+armyPow(x),0))/(dp+0.1);

    if(a==='sk:huima')L.push(`${nm(k)}拨马便走，忽回身一枪！`);
    if(a==='sk:kuangzhan')L.push(`${nm(k)}刀势如风，连环斩出！`);
    if(a==='sk:wushuang')L.push(`${nm(k)}施展无双绝技，连环三击！`)}
  // 伤害
  const dealt={a:0,b:0};
  for(const k of['a','b']){const s=S2[k],o=S2[op(k)];let hits=dOut(eff[k],eff[op(k)]);if(act[op(k)]==='sk:nuhou')hits=hits.map(h=>h*0.5);
    for(const h of hits){let dmg=h*dPow(s,o);if(o.luoyi>0)dmg*=1.25;dmg=Math.round(dmg);o.hp=Math.max(0,o.hp-dmg);dealt[k]+=dmg}}
  // 描述交锋
  const desc=k=>{const e=eff[k],oe=eff[op(k)];if(e==='feint'&&MELEE.includes(oe))return `${nm(op(k))}纵马追击，被${nm(k)}回身一刀砍中！`;
    if(e==='heavy'&&GUARDS.includes(oe))return `${nm(k)}力劈而下，震开${nm(op(k))}的兵器！`;if(e==='heavy'&&oe==='quick')return '';
    if(e==='quick'&&oe==='heavy')return `${nm(k)}抢先一步，刺中${nm(op(k))}！`;if(GUARDS.includes(e)&&oe==='quick')return `${nm(k)}架住来招，顺势反击！`;return ''};
  for(const k of['a','b']){const t=desc(k);if(t)L.push(t)}
  if(eff.a==='heavy'&&eff.b==='heavy')L.push('两人各劈一刀，火星迸溅。');if(eff.a==='quick'&&eff.b==='quick')L.push('刀来枪往，各有小伤。');if(GUARDS.includes(eff.a)&&GUARDS.includes(eff.b))L.push('两将各守门户，相持不下。');
  if(dealt.a||dealt.b)L.push(`（${nm('a')} ${dealt.a?'伤敌 '+dealt.a:'未得手'}，${nm('b')} ${dealt.b?'伤敌 '+dealt.b:'未得手'}）`);
  // 气
  for(const k of['a','b']){const s=S2[k];s.qi=Math.min(6,s.qi+1+(dealt[k]>dealt[op(k)]?1:0));if(s.luoyi>0)s.luoyi--}
  D.lastAct={a:act.a,b:act.b,da:dealt.a,db:dealt.b};
  // 胜负
  if(D.a.hp<=0&&D.b.hp<=0){D.end={win:null,how:'draw'};L.push('两将同时负伤落马，各被救回本阵。')}
  else if(D.a.hp<=0||D.b.hp<=0){const w=D.a.hp<=0?'b':'a';D.end={win:w,how:D.spar?'spar':'down'};L.push(`${nm(op(w))}招架不住，翻身落马！`)}
  else if(D.r>=D.max){D.end={win:null,how:'draw'};L.push(`斗了${D.r*5}余合，不分胜负，各自收兵。`)}
  return L}
// 电脑出招
function duelAI(D,k){const me=D[k],op=D[k==='a'?'b':'a'];const z=me.g.z||50;
  if(!D.spar&&me.hp<26&&op.hp>40&&Math.random()<0.4)return 'flee';
  const avail=me.sk.filter(s=>me.qi>=DUEL_SK[s].cost);
  if(avail.length&&Math.random()<0.55){if(avail.includes('longdan')&&me.hp<50)return 'sk:longdan';if(avail.includes('zhenfen')&&me.hp<40)return 'sk:zhenfen';
    const h=op.hist;if(avail.includes('tuodao')&&h.heavy+h.quick>h.guard+1)return 'sk:tuodao';
    const off=avail.filter(s=>!['longdan','zhenfen','tuodao'].includes(s));if(off.length)return 'sk:'+off.sort((x,y)=>DUEL_SK[y].cost-DUEL_SK[x].cost)[0]}
  const h=op.hist;const tot=h.heavy+h.quick+h.guard;
  if(tot>=2&&Math.random()<0.2+z/220){const likely=Object.entries(h).sort((a,b)=>b[1]-a[1])[0][0];return{heavy:'quick',quick:'guard',guard:'heavy'}[likely]}
  const r=Math.random();return r<0.37?'heavy':r<0.7?'quick':'guard'}
// 胜者如何处置败将（电脑）
function duelFinish(D,o={}){const e=D.end;if(!e||!e.win)return{win:null,how:'draw',rounds:D.r,ha:D.a.hp,hb:D.b.hp};let how=e.how;
  if(how==='down'){const r=Math.random();how=r<0.42?'kill':(o.capture&&r<0.6)?'capture':'flee'}return{win:e.win,how,rounds:D.r,ha:D.a.hp,hb:D.b.hp}}
// 全自动对决（双方皆由将军自决）
function duelAuto(A,B,o={}){const D=duelNew(A,B,o);const seq=[];const lines=[];while(!D.end){const L=duelRound(D,duelAI(D,'a'),duelAI(D,'b'));lines.push(...L);seq.push([D.r,D.lastAct?(D.lastAct.da>=D.lastAct.db?'a':'b'):'a',D.lastAct&&D.lastAct.da>=D.lastAct.db?D.b.hp:D.a.hp,D.a.hp,D.b.hp])}const res=duelFinish(D,o);res.seq=seq;res.lines=lines;return res}

function duelLive(A,B,o={}){return new Promise(resolve=>{const D=duelNew(A,B,o);const me=o.me||'a',foe=me==='a'?'b':'a';let auto=false,busy=false;
  let el=document.getElementById('dx');if(!el){el=document.createElement('div');el.id='dx';document.body.appendChild(el)}
  const P=k=>D[k];const col=k=>(o.colors&&o.colors[k])||(k===me?'#a8321f':'#2b2621');
  const side=(k,cls)=>{const s=P(k);return `<div class="dxs ${cls}" id="dx_${k}"><div class="dxp"><img src="${portrait(s.g.g||s.g,110)}" style="border-color:${col(k)}"><div class="dxact" id="dxa_${k}"></div></div><div class="dxn">${esc(s.g.name)}</div><div class="dxw">武力 ${s.g.w}${(s.g.traits||[]).includes('勇将')?' · 勇将':''}</div><div class="dxhp"><i id="dxh_${k}"></i><b id="dxhn_${k}"></b></div><div class="dxqi" id="dxq_${k}"></div><div class="dxsk">${s.sk.map(x=>`<span title="${DUEL_SK[x].d}">${DUEL_SK[x].n}</span>`).join('')}</div></div>`};
  el.className='dx show';el.innerHTML=`<div class="dxbox"><div class="dxh"><span>${esc(o.title||'阵前单挑')}</span><small id="dxr"></small></div><div class="dxst">${side(me,'me')}<div class="dxvs">VS</div>${side(foe,'foe')}</div><div class="dxlog" id="dxlog"></div><div class="dxctl" id="dxctl"></div></div>`;
  const log=(t,cls)=>{const L=el.querySelector('#dxlog');const d=document.createElement('div');d.textContent=t;if(cls)d.className=cls;L.appendChild(d);L.scrollTop=L.scrollHeight};
  const upd=()=>{for(const k of['a','b']){const s=P(k);el.querySelector('#dxh_'+k).style.width=s.hp+'%';el.querySelector('#dxh_'+k).style.background=s.hp>50?'#3f6e4a':s.hp>25?'#b8862a':'#a8321f';el.querySelector('#dxhn_'+k).textContent=Math.round(s.hp);
      el.querySelector('#dxq_'+k).innerHTML='气 '+Array.from({length:6},(_,i)=>`<i class="${i<s.qi?'on':''}"></i>`).join('')+(s.luoyi>0?' <em>裸衣</em>':'')+(s.confuse>0?' <em>心乱</em>':'')}
    el.querySelector('#dxr').textContent=`第 ${Math.min(D.max,D.r+1)} 回合 / ${D.max}`};
  const ctl=()=>{const c=el.querySelector('#dxctl');if(D.end){return}const s=P(me);
    c.innerHTML=`<div class="dxb3">${Object.entries(DUEL_ACTS).map(([k,v])=>`<button data-dx="${k}" style="background:${v.c}">${v.n}<small>${v.h}</small></button>`).join('')}</div>
      <div class="dxb2">${s.sk.map(x=>`<button data-dx="sk:${x}" ${s.qi<DUEL_SK[x].cost?'disabled':''} title="${DUEL_SK[x].d}">${DUEL_SK[x].n}<small>气${DUEL_SK[x].cost} · ${DUEL_SK[x].d.slice(0,9)}</small></button>`).join('')}${o.spar?'':'<button data-dx="flee">退走<small>拨马回阵</small></button>'}<button data-dx="auto">托付<small>交由将军</small></button></div>`;
    c.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{const v=b.dataset.dx;if(v==='auto'){auto=true;step(duelAI(D,me));return}step(v)})};
  const shake=k=>{const img=el.querySelector('#dx_'+k+' img');if(!img)return;img.classList.remove('hit');void img.offsetWidth;img.classList.add('hit')};
  const step=async(myAct)=>{if(busy||D.end)return;busy=true;el.querySelector('#dxctl').innerHTML='<div class="dxwait">……</div>';const acts={};acts[me]=myAct;acts[foe]=duelAI(D,foe);
    el.querySelector('#dxa_'+me).textContent=actName(myAct);el.querySelector('#dxa_'+foe).textContent=actName(acts[foe]);el.querySelectorAll('.dxact').forEach(x=>x.classList.add('show'));
    await new Promise(r=>setTimeout(r,auto?260:650));const L=duelRound(D,acts.a,acts.b);const la=D.lastAct||{};
    if(la.da)shake('b');if(la.db)shake('a');log(`— 第 ${D.r} 回合 —`,'rd');L.forEach(t=>log(t));upd();
    await new Promise(r=>setTimeout(r,auto?280:520));el.querySelectorAll('.dxact').forEach(x=>x.classList.remove('show'));busy=false;
    if(D.end){end();return}if(auto)step(duelAI(D,me));else ctl()};
  const end=()=>{const e=D.end;const c=el.querySelector('#dxctl');const w=e.win;const iWon=w===me;const loser=w?P(w==='a'?'b':'a'):null;
    const done=how=>{el.className='dx';el.innerHTML='';const res={win:w,how,rounds:D.r,ha:D.a.hp,hb:D.b.hp};resolve(res)};
    if(!w){c.innerHTML=`<div class="dxres">不分胜负</div><button class="red" data-e="x">回阵</button>`;c.querySelector('[data-e]').onclick=()=>done('draw');return}
    if(e.fled){c.innerHTML=`<div class="dxres">${esc(loser.g.name)} 败走</div><button class="red" data-e="x">回阵</button>`;c.querySelector('[data-e]').onclick=()=>done('flee');return}
    if(o.spar){c.innerHTML=`<div class="dxres">${esc(P(w).g.name)} 胜</div><button class="red" data-e="x">收兵</button>`;c.querySelector('[data-e]').onclick=()=>done('spar');return}
    if(iWon){c.innerHTML=`<div class="dxres">${esc(loser.g.name)} 落马！</div><div class="dxb3"><button class="red" data-e="kill">斩于马下</button>${o.capture!==false?'<button data-e="capture">生擒</button>':''}<button data-e="flee">放其回阵</button></div>`;c.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>done(b.dataset.e));return}
    const r=duelFinish(D,o);c.innerHTML=`<div class="dxres">${esc(P(me).g.name)} ${r.how==='kill'?'被斩于马下……':r.how==='capture'?'被生擒……':'败走回阵'}</div><button class="red" data-e="x">知道了</button>`;c.querySelector('[data-e]').onclick=()=>done(r.how)};
  log(o.intro||`${A.name}与${B.name}两马相交！`);upd();if(o.me==='none'){auto=true;step(duelAI(D,me))}else ctl()})}

function calcReach(){UI.reach=null;UI.targets={};const selT=UI.sel&&UI.sel.t,selId=UI.sel&&UI.sel.id;const stale=P=>P&&(!UI.sel||P.aid!==selId||(!!P.agent)!==(selT==='agent'));if(stale(UI.hoverPlan))UI.hoverPlan=null;if(stale(UI.plan))UI.plan=null;if(!S||!UI.sel)return;
  if(selT==='agent'){const g=S.agents[selId];if(g&&g.f===S.player&&g.mp>0)UI.reach=agentReach(g);return}if(selT!=='army')return;const a=S.armies[UI.sel.id];if(!a||a.f!==S.player||a.mp<=0)return;const R=reachOf(a);UI.reach=R;
  const canStand=i=>i===R.s||(R.dist.has(i)&&stoppable(i,R.ctx));const near=ti=>nbrs(ti,[]).some(canStand);const s=R.s;const lim=a.mp+3;
  for(const c of Object.values(S.cities)){if(c.owner===a.f||attackStatus(a.f,c.owner)==='no')continue;const ci=GR.cityTile[c.id];if(tDist(ci,s)>lim)continue;if(near(ci))UI.targets['c:'+c.id]=1}
  for(const e of Object.values(S.armies)){if(e.f===a.f||inCity(e)||attackStatus(a.f,e.f)==='no'||!armySeen(e))continue;const ei=aTile(e);if(isWaterT(ei)&&!R.ctx.sail)continue;if(tDist(ei,s)>lim)continue;if(near(ei))UI.targets['a:'+e.id]=1}}
function refreshTop(){const F0=S.fac[S.player];const inc=facIncome(S.player);$('#tSeal').textContent=F0.ch;$('#tSeal').style.background=F0.color;$('#tName').textContent=F0.name+'军 · '+lordTitle(S.player)+(F0.emperor?' · 奉天子':'');$('#tDate').textContent=dateStr();

  const bes=cs.filter(c=>besiegers(c.id).length);if(bes.length)todo.push(`<span style="color:var(--seal)">告急：${bes.map(c=>`<a data-a="goto" data-id="${c.id}">${c.name}被围</a>`).join('、')}</span>`);

  return `<div class="ph">${seal(f,34)}<div><h3>${F0.name}军</h3><small>${dateStr()}${F0.emperor?' · 奉天子':''}${F0.claim?' · 称帝':''}</small></div></div>
  <div class="kv"><div>城池 <b>${cs.length}</b></div><div>武将 <b>${gensOf(f).length}</b></div><div>兵力 <b>${fmtN(facTroops(f))}</b></div><div>军团 <b>${as.length}</b></div>
  <div>金 <b>${Math.round(F0.gold)}</b> <span class="${inc.g>=0?'pos':'neg'}" style="filter:brightness(.6)">${sgn(inc.g)}/月</span></div><div>粮 <b>${Math.round(F0.grain)}</b> <span class="${inc.gr>=0?'pos':'neg'}" style="filter:brightness(.6)">${sgn(inc.gr)}/月</span></div></div>
  <div style="font-size:12px;color:var(--ink2);margin-top:4px">八月秋收约 ${Math.round(facIncome(f,HARVEST).ggr)}；兵马每月耗粮 ${Math.round(inc.ugr)}、军饷 ${Math.round(inc.ug)}</div>
  <div class="sec">当务之急</div><div class="todo">${todo.length?todo.map(t=>'· '+t).join('<br>'):'暂无要务，可结束回合。'}</div>
  <div class="sec">战报</div><div class="log">${S.log.slice(0,30).map(l=>`<div><b>${eraName(l.y)}${MONTHS[l.m]||''}</b> ${esc(l.t)}</div>`).join('')}</div>`}
function mxBar(v){const col=v>=60?'#3f6e4a':v>=35?'#b8862a':'#a8321f';return `<div class="bar"><i style="width:${v}%;background:${col}"></i></div>`}
function sideCity(c){const f=c.owner,mine=f===S.player,F0=S.fac[f];const gov=c.gov&&S.gens[c.gov];const gens=gensInCity(c.id).filter(g=>g.f===f);const r=rel(S.player,f);

  if(!c.pass)h+=`<div class="kv"><div>人口 <b>${c.pop.toFixed(1)}万</b></div><div>民心 <b>${Math.round(c.mx)}</b>${mxBar(c.mx)}</div><div>金 <b>${sgn(cityGold(c))}</b>/月</div><div>粮 <b>${sgn(cityGrain(c,0))}</b>/月 <small>秋收${sgn(cityGrain(c,HARVEST))}</small></div></div>`;
  if(c.loc&&c.loc.length)h+=`<div class="hint">本地兵源：${c.loc.map(t=>uName(t)).join('、')}（占据此地者皆可招募）</div>`;
  h+=`<div class="sec">建筑</div><div class="blds">${Object.keys(BUILDINGS).map(k=>`<span>${BUILDINGS[k].name} ${c.b[k]||0}</span>`).join('')}</div>`;
  if(c.build)h+=`<div class="hint">正在营建：${BUILDINGS[c.build.k].name} → ${(c.b[c.build.k]||0)+1}级（尚需 ${c.build.left} 月）</div>`;
  const bs=besiegers(c.id);if(bs.length)h+=`<div class="hint">⚔ 正被 ${bs.map(b=>S.fac[b.f].name+'军 '+aLead(b)).join('、')} 围困${mine?'，城中守军每月折损，民心下降！':''}</div>`;
  const seenC=mine||friendly(S.player,f)||visibleT(GR.cityTile[c.id]);if(!seenC)h+=`<div class="sec">驻军</div><div class="hint">城中虚实未明。派军团或细作抵近，方能探知守军与守将。</div>`;else h+=`<div class="sec">驻军 <small>${fmtN(sumT(c.gar))}</small></div><div class="chips">${uchips(c.gar,c.owner)}</div>`;
  if(gens.length&&seenC)h+=`<div class="sec">武将 <small>${gens.length} 人</small></div><div class="chips">${gens.map(g=>gchip(g,'统'+gs(g)[0]+' 武'+gs(g)[1])).join('')}</div>`;
  {const ks=cptsInCity(c.id,f);if(ks.length&&seenC)h+=`<div class="sec">军候 <small>行伍出身，可领偏师出城</small></div><div class="chips">${ks.sort((x,y)=>y.merit-x.merit).map(k=>kchip(k)).join('')}</div>`}
  const here=armiesAt(c.id);if(here.length&&seenC)h+=`<div class="sec">军团</div>${here.map(a=>armyRow(a)).join('')}`;

    <div class="acts"><button data-a="build" ${c.pass?'disabled':''}>建设</button><button data-a="recruit" ${recruitCap(c)<=0||bs.length?'disabled':''}>募兵</button><button data-a="form" ${sumT(c.gar)<100?'disabled':''}>编组军团</button>

    <button data-a="agent" ${agentsOf(f).length>=maxAgents(f)||S.fac[f].gold<AG_COST||c.pass?'disabled':''}>遣细作 金${AG_COST}</button><span style="grid-column:span 2;font-size:12px;color:var(--ink2);align-self:center">细作 ${agentsOf(f).length}/${maxAgents(f)}（每五城多一名）</span>
    ${bs.length?`<button class="red" data-a="sally" style="grid-column:span 3">出城迎击（驻军+城中军团）</button>`:''}</div>

  else{const ci=GR.cityTile[c.id];const adj=armiesOf(S.player).filter(a=>tDist(aTile(a),ci)<=Math.max(3,a.mp));const st=attackStatus(S.player,f);

function stName(st){return {war:'交战',peace:'中立',truce:'停战',ally:'同盟',self:'本军'}[st]||st}

   case 'merge':{if(!ar)break;const mc=armiesOf(ar.f).filter(b=>canMerge(ar,b));let bid=mc.length===1?mc[0].id:null;if(mc.length>1)bid=await pickModal('合军',mc.map(b=>({id:b.id,html:`<div class="grow"><b>${aLead(b)}军团</b><br><small>${fmtN(sumT(b.troops))} · ${b.gens.length}将</small></div>`,btn:'并入'})),'所选军团的兵马与武将并入本军（至多三将，兵力不超过主将上限）。');if(bid){const keep=mergeArmies(ar.id,bid);if(keep){UI.sel={t:'army',id:keep};toast('两军合为一军');refreshAll()}}break}
   case 'split':if(ar)splitModal(ar);break;
   case 'fort':{if(!ar)break;const k=el.dataset.k;if(k==='site'){townModal(ar);break}const ft=buildFort(ar,k);if(ft){toast(`${FORT_DEF[k].n}建成`);refreshAll()}break}
   case 'razeown':{const ft=UI.sel&&S.forts[UI.sel.id];if(ft&&ft.f===S.player){delete S.forts[ft.id];UI.sel=null;toast('已拆除');refreshAll()}break}
   case 'agent':{const g=recruitAgent(c.id);if(g){toast(`${g.name}已潜出${c.name}，下月可行动`);UI.sel={t:'agent',id:g.id};refreshAll()}else toast('金钱不足或细作已满');break}
   case 'spy':{const g=UI.sel&&UI.sel.t==='agent'&&S.agents[UI.sel.id];if(!g)break;const r=doAgentAct(g.id,el.dataset.act,{t:el.dataset.tt,id});if(!r)break;await modal(r.ok?'细作得手':'细作失手',`<p>${esc(r.msg)}。</p>`,null);if(!S.agents[g.id])UI.sel=null;refreshAll();await afterAction();break}
   case 'agentrecall':{const g=UI.sel&&S.agents[UI.sel.id];if(g){delete S.agents[g.id];UI.sel=null;toast('细作已召回');refreshAll()}break}
   case 'agenthalt':{const g=UI.sel&&S.agents[UI.sel.id];if(g){g.dest=null;refreshAll()}break}
   case 'gohome':{if(!ar)break;const P=makePlan(ar,{t:'city',id});if(P&&!P.bad){UI.plan=P;refreshAll()}else toast('无路可回');break}
   case 'gen':if(el.closest('#modal')){closeModal();setTimeout(()=>genModal(S.gens[id]),30)}else genModal(S.gens[id]);break;
   case 'tax':c.tax=+el.dataset.v;refreshAll();break;
   case 'bribe':{UI.busy=true;const g=S.gens[id];const r=await doBribe(S.player,id);UI.busy=false;toast(r===null?'金钱不足':r?`${g.name} 已归顺！`:`${g.name} 不为所动`);refreshAll();break}
   case 'build':buildModal(c);break;case 'recruit':recruitModal(c);break;case 'form':formModal(c);break;
   case 'search':searchModal(c);break;
   case 'relief':if(doRelief(c)){toast(`${c.name}开仓放粮，民心 +10`);refreshAll()}break;
   case 'gov':govModal(c);break;
   case 'sally':{const ci=GR.cityTile[c.id];const t=besiegers(c.id).find(b=>b.f!==S.player&&tDist(aTile(b),ci)<=1);if(!t)break;const mine=armiesAt(c.id).filter(x=>x.f===S.player);if(mine.length)await fieldPrompt(mine[0],t,c.id);else await fieldPrompt(null,t,c.id);break}
   case 'assault':{const cid=ar.siege;if(!cid)break;await attackPrompt(ar,cid);break}
   case 'unsiege':retreat(ar.id);toast('大军撤围，就地扎营');refreshAll();break;
   case 'fieldhere':{const ci=GR.cityTile[ar.at];const t=besiegers(ar.at).find(b=>b.f!==S.player&&tDist(aTile(b),ci)<=1);if(t)await fieldPrompt(ar,t);break}
   case 'take':troopModal(ar,'take');break;case 'drop':troopModal(ar,'drop');break;
   case 'disband':disbandArmy(ar.id);UI.sel={t:'city',id:ar.at};toast('军团解散，兵马归入驻军');refreshAll();break;
  }});

// ---------- 内政弹窗 ----------
function buildModal(c){const body=()=>`${c.build?`<div class="hint">正在营建 ${BUILDINGS[c.build.k].name}，尚需 ${c.build.left} 月。同一时间只能营建一处。</div>`:''}${Object.entries(BUILDINGS).map(([k,b])=>{const lv=c.b[k]||0;const cost=BUILD_COST[lv+1];return `<div class="lrow"><div class="grow"><b>${b.name}</b> <small>${lv} 级</small><br><small style="color:var(--ink2)">${b.desc}</small></div>${lv>=5?'<small>已满</small>':`<small>金 ${cost} · ${BUILD_TIME[lv+1]}月</small><button class="sm red" data-b="${k}" ${canBuild(c,k)?'':'disabled'}>营建</button>`}</div>`}).join('')}<div style="margin-top:8px;font-size:13px">现有金：${Math.round(S.fac[c.owner].gold)}</div>`;
  modal(`${c.name} · 建设`,body(),[{label:'关闭',value:0}],{onOpen:(m,close)=>{m.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(doBuild(c,b.dataset.b)){toast(`开始营建${BUILDINGS[b.dataset.b].name}`);close(1);refreshAll()}})}})}
function recruitModal(c){const f=c.owner;const opts=unitsSeen(f,c).map((t,i)=>[t,i]).sort((a,b)=>(unitLock(f,c,a[0]).length?1:0)-(unitLock(f,c,b[0]).length?1:0)||a[1]-b[1]).map(x=>x[0]);const amt={};opts.forEach(t=>amt[t]=Math.max(100,Math.min(1000,recruitCap(c))));
  const row=t=>{const u=UNITS[t];const why=unitLock(f,c,t);const ok=!why.length;const loc=c.loc&&c.loc.includes(t);return `<div class="lrow" style="${ok?'':'opacity:.62'}"><span class="chip"><span class="u">${u.ch}</span></span><div class="grow"><b>${uName(t,f)}</b>${u.f?` <small style="color:var(--seal)">${loc&&!u.f.includes(f)?'本地':'特色'}</small>`:loc?' <small style="color:var(--seal)">本地</small>':''}<br><small style="color:var(--ink2)">攻${u.atk} 防${u.def} · 千人 金${u.cost} · 耗粮${Math.round(u.up/3*10)/10}/月</small>${!ok?`<br><small style="color:var(--seal)">🔒 ${why.join('；')}</small>`:''}</div>${ok?`<div class="stepper"><button data-s="${t}" data-d="-100">−</button><b id="am_${t}">${amt[t]}</b><button data-s="${t}" data-d="100">+</button></div><button class="sm red" data-r="${t}">募</button>`:''}</div>`};
  const body=`<div style="font-size:13px" id="rinfo"></div><div class="hint" style="font-size:12px">${c.name}为<b>${cityLvName(c)}</b>（${c.prov||''}）。高级兵种须郡城、州治方可编练，各地另有特产之兵：如西凉铁骑出凉州、雍州，丹阳兵出扬州、徐州，藤甲兵出南中。本地兵源占据即可招募。</div>${opts.map(row).join('')}`;
  const info=m=>{m.querySelector('#rinfo').innerHTML=`本月尚可募 <b>${recruitCap(c)}</b> 人　现有金 <b>${Math.round(S.fac[f].gold)}</b>　民心 ${Math.round(c.mx)}（募兵会降低民心与人口）`};
  modal(`${c.name} · 募兵`,body,[{label:'完成',value:0,cls:'red'}],{onOpen:m=>{info(m);
    m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const t=b.dataset.s;amt[t]=clamp(amt[t]+(+b.dataset.d),100,Math.max(100,recruitCap(c)));m.querySelector('#am_'+t).textContent=amt[t]});
    m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const t=b.dataset.r;const n=Math.min(amt[t],recruitCap(c));if(doRecruit(c,t,n)){toast(`募得${uName(t,f)} ${n}`);info(m);refreshAll()}else toast('金钱或募兵额度不足')})}})}
function formModal(c){const f=c.owner;const gens=gensInCity(c.id,f).filter(g=>!g.captive).sort((a,b)=>gs(b)[0]-gs(a)[0]);const ks=cptsInCity(c.id,f).sort((a,b)=>b.s[0]-a.s[0]);const tr={};
  let lead=gens[0]?gens[0].id:'';let kid=ks[0]?ks[0].id:'';const subs=new Set();
  const cap=()=>{const L=S.gens[lead];if(!L)return NOGEN_CAP;return 3000+gs(L)[0]*100+(hasT(L,'统帅')?3000:0)+rankCapBonus(L)};
  Object.entries(c.gar).forEach(([t,n])=>tr[t]=Math.floor(n*0.7/100)*100);if(!lead){const k0=Math.min(1,NOGEN_CAP/Math.max(1,sumT(tr)));for(const t in tr)tr[t]=Math.floor(tr[t]*k0/100)*100}
  const body=`<div class="sec">主将 <small>决定兵力上限</small></div><select id="lead">${gens.map(g=>`<option value="${g.id}">${g.name}　统${gs(g)[0]} 武${gs(g)[1]} 智${gs(g)[2]}</option>`).join('')}<option value="">不派武将——偏师（军候领兵，至多 ${fmtN(NOGEN_CAP)}）</option></select>
   <div id="kbox" style="display:none"><div class="sec">领兵军候 <small>行伍出身</small></div><select id="kid">${ks.map(k=>`<option value="${k.id}">${k.name}　统${k.s[0]} 武${k.s[1]} 功${k.merit}</option>`).join('')}<option value="">无名军候</option></select><div class="hint">偏师士气较低、战力较弱，宜驰援、护送、平乱或袭取空城。表现优异的士卒会擢为军候，军候积功可升为武将。</div></div>
   <div id="subbox"><div class="sec">副将 <small>至多两名</small></div><div id="subs">${gens.map(g=>`<label class="lrow" data-g="${g.id}"><input type="checkbox" value="${g.id}"> ${g.name}　<small>武${gs(g)[1]} 智${gs(g)[2]}${g.traits.length?' · '+g.traits.join('、'):''}</small></label>`).join('')}</div></div>
   <div class="sec">兵马 <small id="fcap"></small></div>${Object.entries(c.gar).map(([t,n])=>`<div class="lrow"><span class="chip"><span class="u">${UNITS[t].ch}</span>${uName(t,f)}</span><small class="grow">驻 ${n}</small><div class="stepper"><button data-t="${t}" data-d="-500">−</button><b id="ft_${t}">${tr[t]}</b><button data-t="${t}" data-d="500">+</button></div></div>`).join('')}`;
  const upd=m=>{const tot=sumT(tr);m.querySelector('#fcap').innerHTML=`${tot} / 上限 ${cap()}${tot>cap()?' <span style="color:var(--seal)">超出上限</span>':''}`;m.querySelectorAll('#subs label').forEach(l=>{l.style.display=l.dataset.g===lead?'none':'flex'});m.querySelector('#kbox').style.display=lead?'none':'';m.querySelector('#subbox').style.display=lead?'':'none';for(const t in tr){const e=m.querySelector('#ft_'+t);if(e)e.textContent=tr[t]}};
  modal(`${c.name} · 编组军团`,body,[{label:'出征',cls:'red',onClick:m=>{const ids=lead?[lead,...[...subs].filter(x=>x!==lead).slice(0,2)]:[];const t2={};for(const[t,n]of Object.entries(tr))if(n>0)t2[t]=n;if(sumT(t2)<(lead?500:300)){toast('兵马太少');return false}if(sumT(t2)>cap()){toast(lead?'超出主将统兵上限':`偏师至多 ${fmtN(NOGEN_CAP)} 人`);return false}const a=formArmy(c.id,ids,t2,lead?null:(kid||null));if(a){a.mp=armyMP(a);UI.sel={t:'army',id:a.id};toast(`${aTitle(a)}编成`);refreshAll()}return 1}},{label:'取消',value:0}],
   {onOpen:m=>{m.querySelector('#lead').value=lead;upd(m);m.querySelector('#lead').onchange=e=>{lead=e.target.value;subs.delete(lead);if(!lead){const tot=sumT(tr);if(tot>NOGEN_CAP){const k0=NOGEN_CAP/tot;for(const t in tr)tr[t]=Math.floor(tr[t]*k0/100)*100}}upd(m)};const kk=m.querySelector('#kid');if(kk){kk.value=kid;kk.onchange=e=>{kid=e.target.value}};
     m.querySelectorAll('#subs input').forEach(i=>i.onchange=()=>{if(i.checked){if(subs.size>=2){i.checked=false;toast('副将至多两名');return}subs.add(i.value)}else subs.delete(i.value)});
     m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t;tr[t]=clamp(tr[t]+(+b.dataset.d),0,c.gar[t]);m.querySelector('#ft_'+t).textContent=tr[t];upd(m)})}})}
function splitModal(a){const subs=a.gens.slice(1);const ks=cptsAt('a',a.id);let gid=subs[0]||'';let kid='';const tr={};Object.keys(a.troops).forEach(t=>tr[t]=0);
  const body=`<div class="sec">领兵之将</div>${subs.map((id,i)=>`<label class="lrow"><input type="radio" name="sg" value="${id}" ${i?'':'checked'}> ${gName(id)}　<small>统${gs(id)[0]} 武${gs(id)[1]}</small></label>`).join('')}${ks.map(k=>`<label class="lrow"><input type="radio" name="sg" value="k:${k.id}"> 军候${k.name}　<small>偏师 · 统${k.s[0]} 武${k.s[1]}</small></label>`).join('')}<label class="lrow"><input type="radio" name="sg" value="" ${subs.length?'':'checked'}> 无名军候　<small>偏师，至多 ${fmtN(NOGEN_CAP)}</small></label><div class="sec">分出兵马 <small id="spinfo"></small></div>${Object.entries(a.troops).map(([t,n])=>`<div class="lrow"><span class="chip"><span class="u">${UNITS[t].ch}</span>${uName(t,a.f)}</span><small class="grow">军中 ${n}</small><div class="stepper"><button data-t="${t}" data-d="-500">−</button><b id="sp_${t}">0</b><button data-t="${t}" data-d="500">+</button></div></div>`).join('')}<div class="hint">分出的军团落在相邻一格（在城中则同驻城内）。只分出战船，即成一支舟师；带足战船的军团可载兵渡江、航海。</div>`;
  const upd=m=>{m.querySelector('#spinfo').textContent=`${sumT(tr)} 人${canSail({troops:tr})?' · 可航行':''}`};
  modal(`${aLead(a)}军团 · 分兵`,body,[{label:'分兵',cls:'red',onClick:m=>{const t2={};for(const[t,n]of Object.entries(tr))if(n>0)t2[t]=n;if(!gid&&sumT(t2)>NOGEN_CAP){toast(`偏师至多 ${fmtN(NOGEN_CAP)} 人`);return false}const b=splitArmy(a.id,gid||null,t2,kid||null);if(!b){toast('无法分兵（兵力过少或周围无处驻扎）');return false}UI.sel={t:'army',id:b.id};toast(`${aLead(b)}领兵 ${fmtN(sumT(t2))} 另立一军`);refreshAll();return 1}},{label:'取消',value:0}],
   {onOpen:m=>{upd(m);m.querySelectorAll('input[name=sg]').forEach(i=>i.onchange=()=>{const v=i.value;if(v.startsWith('k:')){gid='';kid=v.slice(2)}else{gid=v;kid=''}});m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t;tr[t]=clamp(tr[t]+(+b.dataset.d),0,a.troops[t]);m.querySelector('#sp_'+t).textContent=tr[t];upd(m)})}})}
function troopModal(a,mode){const c=S.cities[a.at];const src=mode==='take'?c.gar:a.troops;const tr={};Object.keys(src).forEach(t=>tr[t]=0);
  const body=`<div style="font-size:13px" id="tinfo"></div>${Object.entries(src).map(([t,n])=>`<div class="lrow"><span class="chip"><span class="u">${UNITS[t].ch}</span>${uName(t,a.f)}</span><small class="grow">${mode==='take'?'驻军':'军中'} ${n}</small><div class="stepper"><button data-t="${t}" data-d="-500">−</button><b id="tt_${t}">0</b><button data-t="${t}" data-d="500">+</button></div></div>`).join('')||'<p>无可调兵马。</p>'}`;
  const upd=m=>{m.querySelector('#tinfo').innerHTML=mode==='take'?`军团 ${sumT(a.troops)} + ${sumT(tr)} / 上限 ${armyCap(a)}`:`拨回 ${sumT(tr)} 人至 ${c.name}`};
  modal(mode==='take'?'补充兵员':'拨回驻军',body,[{label:'确定',cls:'red',onClick:()=>{const ok=mode==='take'?armyTake(a.id,tr):armyDrop(a.id,tr);if(!ok){toast('超出上限');return false}if(!S.armies[a.id])UI.sel={t:'city',id:c.id};refreshAll();return 1}},{label:'取消',value:0}],
   {onOpen:m=>{upd(m);m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t;tr[t]=clamp(tr[t]+(+b.dataset.d),0,src[t]);m.querySelector('#tt_'+t).textContent=tr[t];upd(m)})}})}
function govModal(c){const gens=gensInCity(c.id,c.owner).sort((a,b)=>gs(b)[3]-gs(a)[3]);modal(`${c.name} · 任命太守`,`<p style="font-size:13px">太守政治越高，城市金粮越多；魅力高者安民。</p>${gens.map(g=>`<div class="lrow">${gchip(g)}<small class="grow">政${gs(g)[3]} 魅${gs(g)[4]}${hasT(g,'治世')?' · 治世':''}</small><button class="sm ${c.gov===g.id?'ink':'red'}" data-gv="${g.id}">${c.gov===g.id?'现任':'任命'}</button></div>`).join('')}`,[{label:'关闭',value:0}],{onOpen:(m,close)=>{m.querySelectorAll('[data-gv]').forEach(b=>b.onclick=()=>{setGov(c,b.dataset.gv);toast(`${gName(b.dataset.gv)} 出任${c.name}太守`);close(1);refreshAll()})}})}
async function searchModal(c){const gens=gensInCity(c.id,c.owner).filter(g=>!g.captive).sort((a,b)=>(gs(b)[2]+gs(b)[4])-(gs(a)[2]+gs(a)[4]));if(!gens.length)return;
  const gid=await modal(`${c.name} · 搜索人才`,`<p style="font-size:13px">派一名武将走访乡里，智力与魅力越高越易寻得贤才；每城每月一次。</p>${gens.map(g=>`<div class="lrow">${gchip(g)}<small class="grow">智${gs(g)[2]} 魅${gs(g)[4]}${hasT(g,'伯乐')?' · 伯乐':''}</small><button class="sm red" data-sg="${g.id}">派遣</button></div>`).join('')}`,[{label:'取消',value:null}],{onOpen:(m,close)=>{m.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>close(b.dataset.sg))}});
  if(!gid)return;const r=doSearch(c.id,gid);const who=r.joined?S.gens[r.found]:null;
  await modal(r.joined?'觅得贤才':'搜索结果',who?`<div class="ev"><img src="${portrait(who,120)}"><div><p>${esc(r.msg)}</p><div class="statbars">${statBars(who)}</div></div></div>`:`<p>${esc(r.msg)}</p>`,[{label:'知道了',value:1,cls:'red'}]);refreshAll()}
function statBars(g){const n=['统率','武力','智力','政治','魅力'];const s=gs(g);const pk=g.pk||g.s;return n.map((t,i)=>`<span>${t}</span><div class="bar"><i style="width:${Math.min(100,s[i])}%;background:${s[i]>=90?'#a8321f':s[i]>=75?'#b8862a':'#5a4e40'}"></i>${pk[i]>g.s[i]?`<u style="left:${Math.min(100,pk[i])}%"></u>`:''}</div><b>${s[i]}</b>`).join('')}
// ---------- 菜单弹窗 ----------
function facModal(){const rows=Object.values(S.fac).filter(f=>f.alive&&(citiesOf(f.id).length||armiesOf(f.id).length)).sort((a,b)=>citiesOf(b.id).length-citiesOf(a.id).length);
  modal('天下形势',`<table class="t"><tr><th>势力</th><th>城</th><th>将</th><th>兵</th><th>关系</th></tr>${rows.map(f=>`<tr><td>${seal(f.id,20)} ${f.name}${f.emperor?' <small style="color:#b8862a">奉天子</small>':''}${f.claim?' <small style="color:var(--seal)">称帝</small>':''}</td><td>${citiesOf(f.id).length}</td><td>${gensOf(f.id).length}</td><td>${fmtN(facTroops(f.id))}</td><td>${f.id===S.player?'—':f.major?`<span class="badge b-${rel(S.player,f.id).st}">${stName(rel(S.player,f.id).st)}</span>`:f.bar?'化外':'豪强'}</td></tr>`).join('')}</table>`,null,{wide:true})}

  const body=()=>`<div style="font-size:13px;margin-bottom:6px">现有金 <b>${Math.round(S.fac[me].gold)}</b>${S.fac[me].emperor?'　（奉天子：招抚更易）':''}</div>${list.map(f=>{const r=rel(me,f.id);const tp=truceP(me,f.id),ap=allyP(me,f.id);
    return `<div class="lrow" style="flex-wrap:wrap">${seal(f.id,26)}<div class="grow"><b>${f.name}</b> ${f.major?`<span class="badge b-${r.st}">${stName(r.st)}${r.st==='truce'?' '+r.t+'月':''}</span>`:(f.bar?'<small>化外</small>':'<small>群雄</small>')}<br><small>城${citiesOf(f.id).length} 兵${fmtN(facTroops(f.id))}${f.major?' · 好感 '+Math.round(r.v):''}</small></div>
     <div class="row" style="flex-wrap:wrap;gap:4px">${f.major?`<button class="sm" data-dp="gift" data-f="${f.id}" ${S.fac[me].gold<150?'disabled':''}>赠礼150</button>${r.st==='war'?`<button class="sm" data-dp="truce" data-f="${f.id}">议和 ${Math.round(tp*100)}%</button>`:''}${r.st==='peace'||r.st==='truce'?`<button class="sm" data-dp="ally" data-f="${f.id}">结盟 ${Math.round(ap*100)}%</button>`:''}${r.st!=='war'&&womenOf(me).length&&!kinLocked(me,f.id)?`<button class="sm" data-dp="marry" data-f="${f.id}">联姻 ${Math.round(marryP(me,f.id)*100)}%</button>`:''}${kinLocked(me,f.id)?'<span class="badge b-ally">姻亲</span>':''}${r.st!=='war'?`<button class="sm red" data-dp="war" data-f="${f.id}">宣战</button>`:''}`
     :`<button class="sm red" data-dp="minor" data-f="${f.id}" ${S.fac[me].gold<recruitMinorCost(f.id)?'disabled':''}>招抚 金${recruitMinorCost(f.id)} · ${Math.round(recruitMinorP(me,f.id)*100)}%</button>`}</div></div>`}).join('')}`;
  modal('外交',body(),[{label:'关闭',value:0}],{wide:true,onOpen:(m)=>{const bind=()=>{m.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{const f=b.dataset.f,k=b.dataset.dp;let msg='';
      if(k==='gift'){const inc=doGift(me,f,150);msg=inc?`${S.fac[f].name}好感 +${inc}`:'金钱不足'}
      else if(k==='truce'){msg=doTruce(me,f)?`${S.fac[f].name}同意停战两年`:`${S.fac[f].name}拒绝议和`;rel(me,f).v-=3}
      else if(k==='marry'){const w=womenOf(me)[0];msg=w&&doMarryAlliance(me,f,w.id)?`以${w.name}与${S.fac[f].name}联姻，结为同盟！`:`${S.fac[f].name}婉拒了婚事`}
      else if(k==='ally'){msg=doAlly(me,f)?`与${S.fac[f].name}结为同盟！`:`${S.fac[f].name}婉拒结盟`;rel(me,f).v-=3}
      else if(k==='war'){declareWar(me,f);msg=`对${S.fac[f].name}宣战`}
      else if(k==='minor'){const r=doRecruitMinor(me,f);msg=r===null?'金钱不足':r?`${S.fac[f].name}举城归附！`:`${S.fac[f].name}拒绝招抚`}
      toast(msg);m.querySelector('.mc').innerHTML=body();bind();refreshAll()})};bind()}})}
async function saveModal(){const code=await exportSave();
  modal('存档',`<p style="font-size:13px">复制下方存档码保存到备忘录；下次粘贴到「读取」即可继续。也可下载为文件。</p><textarea id="sv_out" readonly>${code}</textarea><div class="row" style="margin:6px 0 12px"><button class="sm" id="sv_copy">复制存档码</button><button class="sm" id="sv_dl">下载存档文件</button></div>
   <div class="sec">读取</div><textarea id="sv_in" placeholder="粘贴存档码"></textarea><div class="row" style="margin-top:6px"><button class="sm red" id="sv_load">读取存档码</button><label class="sm" style="border:1px solid var(--ink2);border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;background:var(--paper3)">打开存档文件<input type="file" id="sv_file" accept=".txt,.mzsave,.json" style="display:none"></label></div>`,

function helpModal(){modal('玩法说明',`<p><b>目标：</b>扫平天下群雄。全国 145 处据点（136 城关 + 9 处化外之地）、十九路诸侯，据点与势力对齐柱子三国 1.9。其余诸侯尽数覆灭即一统天下。</p>
 <p><b>回合：</b>每回合一个月。你行动后点「结束回合」，诸侯依次行动，随后结算收入、粮草、建设与事件。八月秋收，粮草大增。</p>
 <p><b>舆图：</b>山岭、大江、湖海不可通行；平原、丘陵、山林、沼泽行军快慢不同，官道最快。秦岭、巴蜀群山只能走谷道栈道。细虚线为郡界，粗线为势力边界。黄河、长江、淮水只能从「渡」口过江。</p>
 <p><b>行军：</b>选中军团后，<span style="color:#2a6e3c">绿色区域</span>为本月可达之地，大军可停驻其中任何一处。点目标显示路线（圆点数字为第几个月的落脚处），<b>再点一次</b>即确认；远处目标会逐月自动续行。步兵每月行军力 12，全骑兵 16，良马 +3。官道每格 1，平原 2，丘陵、山林 3，沼泽 4。</p>
 <p><b>控制区：</b>敌军与敌城周围一格为控制区（<span style="color:#b8782a">橙色</span>），踏入即止步。<b>雄关</b>扼守谷道，关前关后只有一条路，不破关则过不去；隘口是城防较高的要塞。</p>
 <p><b>接敌：</b>点敌军即进军迎击，两格之内的友军自动来援，敌方亦然；败军向后退却。点敌城行至城下后可强攻或围城；围城使守军每月折损，久困则开城投降。野战地形取自交战之处（河畔即为桥头、渡口之战）。</p>
 <p><b>城池：</b>建设（农田、市集、城墙、兵营、马厩、水寨）、募兵、税率、任命太守、搜索人才、赈济。兵营与马厩等级决定可募的精锐兵种与每月募兵数。</p>
 <p><b>兵种：</b>通用兵种按地域冠名；各势力另有特色兵种（青州兵、虎豹骑、陷阵营、大戟士、白马义从、西凉铁骑、藤甲兵、象兵……），占领特定城池还可招募本地兵源。</p>
 <p><b>兵源与城级：</b>城分县城、郡城、州治（人口二十五万以上为郡城，州治或人口四十五万以上为州治，君主驻地为都城）。重骑兵、青州兵、丹阳兵等须郡城以上方可编练，虎豹骑、陷阵营、白毦兵、大戟士、解烦兵等须州治；许多兵种另限出产之州（西凉铁骑出凉、雍，丹阳兵出扬、徐，大戟士出河北，藤甲兵出南中……）。城中「本地兵源」占据即可招募。募兵界面会标明缺什么条件。</p>
 <p><b>卫队：</b>每位武将自带卫队，随官阶扩编（约一两百至千人，君主更多），驻于己城时每月自动补员（耗金）。名将各有亲军：曹纯虎豹骑、高顺陷阵营、陈到白毦兵、麴义先登、公孙瓒白马义从、孙权解烦兵……即时会战中卫队就是该将本部；卫队历战越多越精，折损后须回城补充。</p>
 <p><b>偏师：</b>「编组军团」时主将可选「不派武将」，由军候（或无名军候）领兵出城，至多三千人，士气上限较低、战力较弱，宜驰援、护送、平乱或袭取空城。分兵时也可分出偏师。</p>
 <p><b>行伍晋升：</b>即时会战中斩获最多的士卒战后擢为「军候」，出现在军中或城中，可领偏师；自动结算的战斗也会涌现勇士。军候随军征战积功（功勋满 180、历四战），即擢为都尉，列为武将（姓名随机，能力依战绩而定）。</p>
 <p><b>舟师：</b>临江之城可建「水寨」、造走舸 / 蒙冲 / 斗舰 / 楼船。军中战船足以载兵（每千战船载三千步骑）即可行船：沿长江、黄河、淮水、湖泊与近海航行，登船、登岸各耗行军力 3（经己方城池不耗）。只带战船的军团即是舰队，可「合军」载上步骑，抵岸后再「分兵」。步军从渡口过大江，十格内敌城有战船五百以上会出而截击；舟师驶近敌方水寨三格之内亦会遭遇拦截。江上相遇为水战，舟师攻岸上之敌为抢滩登陆。</p>
 <p><b>战争迷雾：</b>只能看见己方领地、城池周围五格、军团周围四格（骑兵五格）、细作周围六格之内的敌军；远处敌城兵力未明。菜单中可关闭迷雾。</p>
 <p><b>伏击：</b>军团在山林、丘陵、沼泽或栈道上，且尚余三成行军力时可「设伏」。伏兵不为敌军所见，敌军行至一格之内即遭伏击：伏兵先发制人、敌军士气大挫。敌将智谋高者可能识破；细作能看破三格内的伏兵。电脑也会设伏。</p>
 <p><b>营建：</b>军团行至野外，可就地「建瞭望塔」（金 80，视野七格、看破三格内伏兵）、「立营寨」（金 150，驻寨之军守御大增，寨旁两格内补给如在境内、士气恢复），或「筑新城」（金 600、粮 400，留步骑一千屯戍，须在己方疆域或荒野、距诸城五格以外，三个月筑成）。营建每月耗金少许；敌军踏入无人把守的营建即将其焚毁。新城与诸城无异，可募兵、营建、征税，会重新划分郡界并修官道连通邻城。</p>
 <p><b>细作：</b>在城中「遣细作」（金 120，每五城多一名）。细作不受控制区阻挡，可深入敌境侦察；行至敌城、敌军旁一格可「煽动民变」「纵火焚粮」「散布流言」「行刺」，每月一次，成功率看细作等级与对方守备（城墙、太守智力、敌将武力）。失手可能被擒；成功积累功绩可升为老练、精锐细作。诸侯也会暗遣细作扰乱你的城池。</p>
 <p><b>历史事件：</b>陶谦三让徐州、孙策以玺借兵、傕汜相攻、天子东归、袁术称帝等依时触发；诸将到了年纪会在本势力登场，在野贤才可搜索延揽。</p>
 <p><b>战斗：</b>兵种相克（枪克骑、骑克弓、弓善守城），主将统率影响全军，智将可能施计。败军之将可能被俘，可劝降、释放或斩首。</p>
 <p><b>单挑：</b>两军阵前遇敌将搦战，可「亲自单挑」：每回合出一招——猛攻破格挡、格挡反快攻、快攻抢猛攻；每回合攒「气」，胜一招多得一点，可施展武将绝技（拖刀计、回马枪、暗箭、怒喝、无双、龙胆、裸衣、狂斩、振奋……名将各有所长）。十二回合不分胜负则各自收兵；打落敌将可斩、可擒、可放；力不能支可「退走」。武将页面可「演武」与部将切磋（每月一次），历练武力。</p>
 <p><b>战场单挑与武将出阵：</b>亲自指挥的即时会战中，选中带将部队点「出阵」（Q），武将便单骑驰骋战场：点敌军冲杀，砍杀士卒、震慑敌阵，另有两个英雄技（横扫、突阵、虎吼、铁骨、百步穿杨、万夫莫敌）；血少时点「归队」（B）回本部。两将相近点「单挑」（G），二将就在战场上划圈实时对打，周围士卒让开，战事照常进行：快攻可打断敌将蓄力，猛攻破格挡，格挡起手瞬间为招架，闪避躲开一切；攒「气」施展绝技。可「托付」给将军自决，或「退走」。</p>
 <p><b>将技：</b>即时会战中，武将所领之部有专属将技：突击、奔袭、火计、乱敌、铁壁、箭雨（诸葛亮、周瑜善火计，关张吕布善突击，赵云马超善奔袭……）。选中部队点「将技」按钮（电脑按 T）施展，有冷却时间；敌将亦会施展。武将页面可查看其绝技与将技。</p>
 ${typeof MZB!=='undefined'?'<p><b>亲自指挥：</b>凡我军参与的攻城、守城、野战、水战，都可选择「亲自指挥」进入水墨即时会战。战中可「速决」交给众将推演，或「撤退」。标题页「会战演习」可单独练习。</p>':''}
 <p><b>人物：</b>武将立功得功勋，可「封官」，官职越高统兵越多、越忠诚，但每月要发俸禄。年轻武将逐年成长。忠诚低于 30 的武将可能出走、投敌；敌城页面可「策反」敌将。宝库中的宝物可赏赐武将，宗室女眷可赐婚或联姻（四年内不背盟）。据城 24 座受九锡为公，40 座称王，60 座可登基称帝。</p>
 <p><b>粮草：</b>兵马每月耗粮，出境在外耗粮更多。粮尽则士卒逃散。</p>
 <p><b>操作：</b>电脑：左键选择、再点确认、右键直接下令、悬停预览路线、滚轮缩放、拖动平移、回车结束回合、Esc 取消。手机：点选、再点确认、双指缩放、拖动平移，下方抽屉可上下展开。</p>`,null)}
async function endScreen(e){if(typeof SFX!=='undefined')SFX.play(e==='win'?'win':'lose');await modal(e==='win'?'天下归心':'兵败国亡',e==='win'?`<p>${dateStr()}，${S.fac[S.player].name}军扫平群雄，一统天下！</p><p>共历 ${S.turn} 个月，据城 ${citiesOf(S.player).length} 座。</p>`:`<p>${S.fac[S.player].name}军失去了最后的城池……</p>`,[{label:'返回标题',value:1,cls:'red'}],{stamp:e==='win'?'胜':'败'});show('title');S=null;buildTitle()}

HOOK.animPath=(aid,tiles,agent)=>{if(!agent&&typeof SFX!=='undefined'&&S&&S.armies[aid]&&S.armies[aid].f===S.player)SFX.play('march');if(agent){if(!UI.mapReady)return Promise.resolve();return animPath(aid,tiles,70,2200,true)}const a=S.armies[aid];if(!a||!UI.mapReady||document.getElementById('game').style.display!=='flex')return Promise.resolve();const mine=a.f===S.player;if(!mine&&!tiles.some(i=>{const[x,y]=tileCW(i);return onScreenW(x,y,40)&&visibleT(i)}))return Promise.resolve();if(!mine){animPath(aid,tiles,30,700);return new Promise(r=>setTimeout(r,90))}return animPath(aid,tiles,85)};
HOOK.busy=t=>{UI.busy=!!t;const b=$('#busy');if(t){b.textContent=t;b.style.display='block'}else b.style.display='none';if(!t)refreshAll()};
HOOK.log=t=>{};
HOOK.fight=async(A,D,o,meta)=>{if(typeof MZB==='undefined')return null;let mode=UI.fightMode;UI.fightMode=null;
  if(!mode){const me=S.player;const att=A.f===me;const foe=att?D:A;const c=meta.cid?S.cities[meta.cid]:null;const place=c?c.name:(meta.place||'');const L=foe.gens&&foe.gens[0]?S.gens[foe.gens[0]]:null;
    const gT=x=>{const n=(x.guards||[]).reduce((s0,y)=>s0+y.n,0);return n?`（另卫队 ${fmtN(n)}）`:''};const P=x=>sidePow(landTr(trPlusGuards(x.tr,x.guards||[])),x.gens);
    const r=(P(att?A:D)/(P(att?D:A)+0.1))*(meta.kind==='siege'?(att?1/(1+0.16*(c?c.b.wall:0)):1+0.16*(c?c.b.wall:0)):1);const[w,col]=winWord(r);
    const title=att?`${meta.title||'交战'}`:(meta.kind==='naval'?`${S.fac[A.f].name}水军来犯！`:`${S.fac[A.f].name}军来犯！`);
    const body=`<div class="ev">${L?`<img src="${portrait(L,120)}">`:''}<div><p>${att?`我军 ${fmtN(sumT(A.tr))}${gT(A)} 对 ${S.fac[D.f].name}军 ${fmtN(sumT(D.tr))}${gT(D)}`:`${S.fac[A.f].name}军${L?'（'+L.name+'）':''} ${fmtN(sumT(A.tr))}${gT(A)} ${meta.kind==='siege'?'强攻':'袭击'}${place}${meta.kind==='field'&&!c?'一带':''}，我军 ${fmtN(sumT(D.tr))}${gT(D)}${meta.kind==='siege'?'据城而守':''}。`}</p>${meta.kind==='field'&&meta.terr?`<p><small>战场地形：${({plain:'平原',hills:'丘陵',forest:'山林',river:'河畔'})[meta.terr]||''}${meta.reinA||meta.reinD?` · 援军 ${meta.reinA||0} : ${meta.reinD||0}`:''}</small></p>`:''}<p>胜算：<b style="color:${col}">${w}</b></p><p class="hint">亲自指挥将进入即时${meta.kind==='siege'?'攻城':meta.kind==='naval'?'水':'会'}战；自动结算则按兵力推演。${meta.kind==='naval'?'水战只计战船兵力，北军不习水战。':''}</p></div></div>`;
    mode=await modal(title,body,[{label:'亲自指挥',value:'manual',cls:'red'},{label:'自动结算',value:'auto'}])||'auto'}
  if(mode!=='manual')return null;

function mulberry(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

    for(let i=0;i<(spec.rf||0);i++){const x=rr(120,W-120),y=rr(100,H-100),r=rr(70,140);if(spec.clear&&spec.clear.some(c=>hyp(c.x-x,c.y-y)<c.r+r))continue;T.forests.push({x,y,r})}
  }else{

    for(let i=0;i<nh;i++)T.hills.push({x:rr(200,W-200),y:rr(150,H-150),r:rr(160,320),a:type==='hills'?rr(28,50):rr(12,26)});
    const nf={plain:4,hills:4,forest:11,river:4}[type]||4;
    for(let i=0;i<nf;i++){let x=rr(150,W-150),y=rr(120,H-120);if(Math.abs(x-W/2)<520&&type!=='forest'&&R()<0.6)x=x<W/2?x-500:x+500;
      x=Math.max(120,Math.min(W-120,x));const r=type==='forest'?rr(100,190):rr(80,150);T.forests.push({x,y,r});if(R()<0.6)T.forests.push({x:x+rr(-r,r),y:y+rr(-r,r),r:r*0.7})}

    for(const f of T.forests){const dx=x-f.x,dy=y-f.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<f.r*(0.8+0.35*nz2(x/60,y/60))){T.forest[i]=1;break}}

function tAt(T,arr,x,y){let gx=Math.floor(x/T.cs),gy=Math.floor(y/T.cs);if(gx<0||gy<0||gx>=T.gw||gy>=T.gh)return 0;return arr[gy*T.gw+gx]}

// 关隘谷道：中线与半宽
function mkValley(W,H,WX,nz){const gw=Math.ceil(W/TCS);const top=new Float32Array(gw),bot=new Float32Array(gw);
