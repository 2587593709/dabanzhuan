<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241d17">
<title>三国墨战 · 天下篇</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--paper:#efe4cb;--paper2:#e4d6b6;--paper3:#f6eedc;--ink:#2a2622;--ink2:#5a4e40;--seal:#a8321f;--gold:#c9a24a;--green:#3f6e4a;--desk:#1f1914;
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
button{font-family:var(--serif);font-size:14px;color:var(--ink);background:var(--paper3);border:1px solid var(--ink2);border-radius:6px;padding:7px 12px;cursor:pointer;line-height:1.2}
button:hover:not(:disabled){background:#fff8e8}button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.red{background:var(--seal);color:#f6eedc;border-color:#6a1a10}button.red:hover:not(:disabled){background:#bb3a24}
button.ink{background:var(--ink);color:#efe4cb;border-color:#000}
button.sm{padding:4px 8px;font-size:12.5px}
.screen{display:none;position:fixed;inset:0}
.seal{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--seal);color:#f6eedc;font-weight:700;border-radius:3px;font-size:18px;flex:none}
/* 标题 */
#title{overflow:auto;background:radial-gradient(ellipse at 50% 30%,#efe4cb 0%,#d9c9a4 70%,#b8a47c 100%)}
#title .wrap{max-width:1080px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;align-items:center}
#title h1{font-size:64px;letter-spacing:14px;margin:8px 0 0;font-weight:900;color:var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.08)}
#title .sub{letter-spacing:4px;color:var(--ink2);margin:6px 0 4px}
#title .stamp{display:inline-block;background:var(--seal);color:#f6eedc;padding:4px 10px;font-weight:700;letter-spacing:3px;border-radius:3px;margin:10px 0 18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;width:100%}
.fcard{background:rgba(246,238,220,.9);border:1px solid var(--ink2);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative}
.fcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.18);background:#fffaf0}
.fcard .top{display:flex;gap:10px;align-items:center}.fcard img{width:56px;height:70px;border-radius:4px}
.fcard h3{margin:0;font-size:20px}.fcard p{margin:0;font-size:13px;line-height:1.55;color:var(--ink2)}
.fcard .stats{font-size:12.5px;color:var(--ink)}.stars{color:var(--seal);letter-spacing:1px}
.tbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
/* 游戏 */
#game{display:none;flex-direction:column}
#top{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:#241d17;color:#efe4cb;border-bottom:2px solid #000;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:5}
#top .tinfo{display:flex;flex-direction:column;line-height:1.15}#top .tinfo b{font-size:15px}#top .tinfo span{font-size:12px;color:#cdbf9f}
#top .res{display:flex;gap:12px;font-size:13.5px;white-space:nowrap}#endBtn{white-space:nowrap}#top .res b{color:#f3d27a;font-weight:700}#top .res i{font-style:normal;font-size:11.5px;margin-left:2px}
.pos{color:#8fd08f}.neg{color:#ff8f7a}
#top .spacer{flex:1}#top nav{display:flex;gap:6px}#top nav button,#menuBtn{background:#3a3027;color:#efe4cb;border-color:#5a4a3a}
#menuBtn{display:none}
#main{flex:1;display:flex;min-height:0;position:relative}
#mapbox{flex:1;position:relative;min-width:0;overflow:hidden}
#map{display:block;touch-action:none;cursor:grab}
#zoomCtl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}#zoomCtl button{width:38px;height:38px;padding:0;font-size:18px;background:rgba(246,238,220,.92)}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4}
#toast div{background:rgba(42,38,34,.9);color:#f6eedc;padding:7px 14px;border-radius:6px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#busy{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(168,50,31,.95);color:#f6eedc;padding:8px 18px;border-radius:20px;font-size:14px;display:none;z-index:40;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#side{width:360px;flex:none;background:var(--paper);border-left:2px solid #000;display:flex;flex-direction:column;min-height:0;box-shadow:-3px 0 10px rgba(0,0,0,.25)}
#sideHandle{display:none}
#sideBody{flex:1;overflow:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ph h3{margin:0;font-size:19px}.ph small{color:var(--ink2);font-size:12.5px}.ph .x{margin-left:auto;padding:3px 9px}
.sec{margin:12px 0 6px;font-weight:700;font-size:14px;border-bottom:1px solid rgba(90,78,64,.35);padding-bottom:3px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-weight:400;color:var(--ink2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:13.5px}.kv b{font-weight:700}
.bar{height:7px;background:rgba(90,78,64,.2);border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper2);border:1px solid rgba(90,78,64,.4);border-radius:12px;padding:3px 8px;font-size:12.5px}
.chip .u{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;background:var(--ink);color:#efe4cb;border-radius:3px;font-size:11px;font-weight:700}
.gchip{display:inline-flex;align-items:center;gap:6px;background:var(--paper3);border:1px solid rgba(90,78,64,.45);border-radius:6px;padding:3px 7px 3px 3px;font-size:13px;cursor:pointer}
.gchip img{width:26px;height:32px;border-radius:3px}.gchip small{color:var(--ink2);font-size:11px}
.gchip:hover{background:#fff8e8}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.acts button{padding:8px 4px}
.seg{display:inline-flex;border:1px solid var(--ink2);border-radius:6px;overflow:hidden}.seg button{border:none;border-radius:0;padding:5px 12px;background:var(--paper3)}.seg button.on{background:var(--ink);color:#efe4cb}
.blds{display:flex;flex-wrap:wrap;gap:5px}.blds span{font-size:12px;background:var(--paper2);padding:2px 7px;border-radius:4px}
.log{font-size:12.5px;line-height:1.6;color:var(--ink2)}.log div{border-bottom:1px dotted rgba(90,78,64,.25);padding:2px 0}.log b{color:var(--ink);font-weight:400}
.todo{font-size:13px;line-height:1.7}.todo a{color:var(--seal);cursor:pointer;text-decoration:underline}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}
.armyrow{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid rgba(90,78,64,.3);border-radius:6px;margin-bottom:5px;cursor:pointer;background:var(--paper3)}
.armyrow:hover{background:#fff8e8}
.hint{font-size:12.5px;color:var(--ink2);background:rgba(168,50,31,.07);border-left:3px solid var(--seal);padding:6px 8px;margin-top:8px;line-height:1.5}
/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(10,8,6,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.mbox{background:var(--paper);width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative}
.mbox:before,.mbox:after{content:'';position:absolute;left:-8px;right:-8px;height:12px;background:linear-gradient(#6a4428,#3a2414);border-radius:6px}.mbox:before{top:-8px}.mbox:after{bottom:-8px}
.mbox .mh{padding:16px 18px 6px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
.mbox .mc{padding:4px 18px 10px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
.mbox .mf{padding:10px 18px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mbox .mf button{min-width:88px;padding:9px 14px}
.mbox.wide{max-width:760px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:5px 4px;border-bottom:1px solid rgba(90,78,64,.25);text-align:left;white-space:nowrap}table.t th{font-weight:700;color:var(--ink2);font-size:12px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(90,78,64,.22)}
.stepper{display:inline-flex;align-items:center;gap:4px}.stepper button{width:32px;height:30px;padding:0}.stepper b{min-width:54px;text-align:center}
.report .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.report .side{background:var(--paper3);border:1px solid rgba(90,78,64,.35);border-radius:6px;padding:8px;display:flex;gap:8px}
.report .side img{width:48px;height:60px;border-radius:3px}
.report .lines p{margin:4px 0;text-indent:2em}
.stampbig{position:absolute;right:22px;top:14px;border:3px solid var(--seal);color:var(--seal);font-weight:900;font-size:26px;padding:2px 10px;transform:rotate(-12deg);border-radius:6px;opacity:.85}
.ev{display:flex;gap:14px;align-items:flex-start}.ev img{width:120px;height:150px;border-radius:4px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.statbars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.statbars .bar{margin:0;height:9px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;color:#f6eedc}
.b-war{background:#a8321f}.b-peace{background:#7a7064}.b-truce{background:#b8862a}.b-ally{background:#3f6e4a}
textarea{width:100%;min-height:90px;font-family:monospace;font-size:11px;background:var(--paper3);border:1px solid var(--ink2);border-radius:4px;padding:6px}
select{font-family:var(--serif);font-size:14px;padding:6px;background:var(--paper3);border:1px solid var(--ink2);border-radius:4px}
/* 手机竖屏：底部抽屉 */
@media (max-width:899px){
  #top{height:auto;min-height:48px;padding:5px 8px;gap:8px;flex-wrap:nowrap}
  #top nav{display:none}#menuBtn{display:inline-block;padding:6px 10px}
  #top .res{gap:8px;font-size:12.5px}.hide-s{display:none}
  #top .tinfo b{display:none}#top .tinfo span{white-space:nowrap;font-size:12px;color:#efe4cb}#endBtn{padding:7px 10px;white-space:nowrap;font-size:13px}#top .res i{display:none}
  #side{position:absolute;left:0;right:0;bottom:0;width:auto;height:46vh;border-left:none;border-top:2px solid #000;border-radius:12px 12px 0 0;transition:height .2s;z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
  #side.collapsed{height:44px}
  #sideHandle{display:flex;height:22px;align-items:center;justify-content:center;flex:none;cursor:pointer}#sideHandle span{width:44px;height:5px;border-radius:3px;background:var(--ink2);opacity:.6}
  #side.collapsed #sideBody{overflow:hidden}
  #sideBody{padding:4px 12px 16px}
  #zoomCtl{bottom:auto;top:10px}
  .acts{grid-template-columns:repeat(3,1fr)}
  #title h1{font-size:46px;letter-spacing:8px}
  .mbox .mc{padding:4px 14px 10px}.ev img{width:90px;height:112px}
}
/* 手机横屏：右侧窄栏 */
@media (max-height:520px) and (orientation:landscape){
  #top{height:42px}#top nav{display:none}#menuBtn{display:inline-block}.hide-s{display:none}
  #side{position:static;width:300px;height:auto;border-radius:0;border-top:none;border-left:2px solid #000}#side.collapsed{height:auto}#sideHandle{display:none}
  .mbox{max-height:94vh}
}
/* ===== 全国篇 ===== */
#tmap{width:100%;max-width:760px;border:1px solid var(--ink2);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);margin:0 0 16px;display:block}
#mini2{position:absolute;right:10px;top:10px;border:1px solid rgba(42,38,34,.8);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.35);background:#e8dcc1;touch-action:none;cursor:pointer;opacity:.95}
.fgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fcard p{font-size:12.5px}
@media (max-width:899px){#mini2{right:auto;left:8px;top:8px}}
@media (max-height:520px) and (orientation:landscape){#mini2{right:auto;left:8px;top:8px}}
.fcard.hot{box-shadow:0 0 0 3px var(--seal),0 4px 14px rgba(0,0,0,.2);background:#fffaf0}
#tmap{cursor:pointer}
.statbars .bar{position:relative}.statbars .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:rgba(168,50,31,.55);text-decoration:none}
/* ===== 单挑（回合制） ===== */
#dx{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(12,9,6,.78);padding:10px;font-family:var(--serif)}
#dx.show{display:flex}
#dx .dxbox{width:min(640px,100%);max-height:100%;overflow:auto;background:linear-gradient(#f3e9d2,#e6d7b5);border:2px solid #2a2622;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#dx .dxh{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;letter-spacing:4px;border-bottom:1px solid rgba(42,38,34,.3);padding-bottom:4px}
#dx .dxh small{font-size:13px;letter-spacing:0;color:var(--ink2);font-weight:400}
#dx .dxst{display:flex;align-items:center;justify-content:space-between;gap:6px}
#dx .dxs{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
#dx .dxp{position:relative}
#dx .dxp img{width:92px;height:115px;border:3px solid;border-radius:6px;background:#d8c9a3;display:block;transition:transform .12s}
#dx .dxp img.hit{animation:dxhit .45s}
@keyframes dxhit{0%{transform:translateX(0);filter:none}20%{transform:translateX(-9px);filter:brightness(1.6) sepia(1) hue-rotate(-40deg)}45%{transform:translateX(7px)}70%{transform:translateX(-4px)}100%{transform:translateX(0);filter:none}}
#dx .dxact{position:absolute;left:50%;top:-8px;transform:translate(-50%,-10px) scale(.6);opacity:0;background:#2a2622;color:#f6eedc;font-weight:700;font-size:15px;padding:3px 10px;border-radius:14px;white-space:nowrap;transition:all .25s}
#dx .dxact.show{opacity:1;transform:translate(-50%,-14px) scale(1)}
#dx .dxn{font-size:18px;font-weight:700}
#dx .dxw{font-size:12px;color:var(--ink2)}
#dx .dxhp{position:relative;width:100%;max-width:190px;height:14px;background:rgba(42,38,34,.18);border-radius:7px;overflow:hidden}
#dx .dxhp i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .4s}
#dx .dxhp b{position:absolute;right:6px;top:-1px;font-size:11px;color:#1d1a16}
#dx .dxqi{font-size:12px;display:flex;align-items:center;gap:3px}
#dx .dxqi i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #6a4a20;background:transparent}
#dx .dxqi i.on{background:#c9a24a}
#dx .dxqi em{font-style:normal;color:var(--seal);font-size:11px}
#dx .dxsk{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#dx .dxsk span{font-size:11px;border:1px solid var(--ink2);border-radius:10px;padding:1px 6px;background:rgba(255,255,255,.35)}
#dx .dxvs{font-size:26px;font-weight:900;color:var(--seal);flex:none}
#dx .dxlog{height:128px;overflow:auto;background:rgba(255,255,255,.35);border:1px solid rgba(42,38,34,.25);border-radius:6px;padding:6px 8px;font-size:13.5px;line-height:1.55}
#dx .dxlog .rd{color:var(--ink2);font-size:12px;text-align:center}
#dx .dxctl{display:flex;flex-direction:column;gap:6px}
#dx .dxb3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#dx .dxb3 button{color:#f6eedc;font-size:18px;font-weight:700;padding:10px 4px;border-color:#000}
#dx .dxb3 button small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:2px}
#dx .dxb2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
#dx .dxb2 button{font-size:14.5px;padding:7px 4px}
#dx .dxb2 button small{display:block;font-size:10.5px;color:var(--ink2);margin-top:2px}
#dx .dxres{text-align:center;font-size:22px;font-weight:700;color:var(--seal);letter-spacing:2px}
#dx .dxwait{text-align:center;color:var(--ink2);padding:18px}
@media (max-height:520px){#dx .dxp img{width:62px;height:78px}#dx .dxlog{height:74px}#dx .dxb3 button{padding:6px 4px;font-size:15px}}

/* ===== 即时会战（M1 模块） ===== */
.mzb{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:#2b2621;box-sizing:border-box}.mzb *{box-sizing:border-box}
.mzb{--paper:#efe4ca;--paper2:#e4d6b4;--paper3:#f6eedb;--ink:#2b2621;--ink2:#5a4e40;--red:#a8321f;--gold:#b8862a;--blue:#4f6a8f;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
.mzb button{font-family:inherit;cursor:pointer;border:1px solid var(--ink2);background:var(--paper3);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:14px;touch-action:manipulation}
.mzb button:active{transform:translateY(1px)}
.mzb button.red{background:var(--red);color:#f6eedb;border-color:#6e1e12;font-weight:700}
.mzb button:disabled{opacity:.4;cursor:default}
.mzb .seal{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--red);color:#f6eedb;font-weight:900;border-radius:3px;font-size:13px;flex:none}
.mzb.screen{position:fixed;inset:0;display:none}
/* ---------- 菜单 ---------- */
#bmenu{overflow-y:auto;background:radial-gradient(ellipse at 30% 20%,#f3e9d2 0%,#e4d6b4 55%,#c9b68e 100%)}
#bmenu::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 90%,rgba(60,55,45,.18),transparent 40%),radial-gradient(circle at 10% 80%,rgba(80,95,80,.14),transparent 35%)}
.mzb .mwrap{position:relative;max-width:560px;margin:0 auto;padding:calc(28px + var(--sat)) 16px calc(30px + var(--sab))}
.mzb h1{font-size:54px;font-weight:900;letter-spacing:10px;text-align:center;margin:6px 0 0;text-shadow:2px 2px 0 rgba(168,50,31,.18)}
.mzb .sub{text-align:center;letter-spacing:6px;color:var(--ink2);margin:4px 0 20px}
.mzb .bcard{background:rgba(246,238,219,.88);border:1px solid rgba(43,38,33,.45);border-radius:8px;padding:14px;margin:12px 0;box-shadow:0 2px 0 rgba(43,38,33,.12)}
.mzb .bcard.slim{padding:10px 14px}
.mzb .ctitle{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mzb .ctitle small{font-size:12px;font-weight:400;color:var(--ink2);margin-left:auto}
.mzb .intro{font-size:14px;line-height:1.75;margin:6px 0 10px;color:#3a322a}
.mzb .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mzb .row button{flex:1;min-width:120px;padding:10px}
.mzb button.fac{display:flex;align-items:center;justify-content:center;gap:8px;border-color:var(--c);font-weight:700}
.mzb .opt{display:flex;align-items:center;gap:8px;margin:7px 0}
.mzb .opt label{width:34px;font-size:13px;color:var(--ink2);flex:none}
.mzb .seg{display:flex;flex-wrap:wrap;gap:5px}
.mzb .seg button{padding:5px 9px;font-size:13px}
.mzb .seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mzb .seg button .seal{width:16px;height:16px;font-size:10px;margin-right:4px}
.mzb .foot{text-align:center;font-size:12px;color:var(--ink2)}
/* ---------- 战场 ---------- */
#battle{background:#2a241d;touch-action:none}

 {id:'yshao',name:'袁绍',ch:'绍',color:'#c09a30',major:true,leader:'yuanshao',region:'河北',aggr:0.9,diff:1,desc:'雄踞冀州，带甲十万，谋臣如林。北有公孙瓒、西有黑山张燕，天下最强，然内有猜忌之患。特色：大戟士、先登死士。'},
 {id:'gsz',name:'公孙瓒',ch:'瓒',color:'#7f93ad',major:true,leader:'gongsunzan',region:'河北',aggr:0.9,diff:2,desc:'白马将军，据幽州、辽东与青州一角，与袁绍连年鏖战。赵云尚在帐下。特色：白马义从、燕云铁骑。'},
 {id:'kr',name:'孔融',ch:'孔',color:'#9a7a5a',major:true,leader:'kongrong',region:'中原',aggr:0.3,diff:5,desc:'北海相孔融，名士风流，兵弱将寡。夹在袁绍、公孙瓒与黄巾之间，唯以德服人。'},
 {id:'zyan',name:'张燕',ch:'燕',color:'#4a4a42',major:true,leader:'zhangyan',region:'河北',aggr:0.6,diff:4,desc:'黑山军帅，聚众百万，出没太行。据常山、上党与壶口关，与袁绍为死敌。特色：黑山贼、鲜卑弓骑。'},
 {id:'lj',name:'李傕',ch:'傕',color:'#7a3030',major:true,leader:'lijue',region:'雍凉',aggr:0.8,diff:3,desc:'董卓余党，劫持天子于长安，与郭汜争权。据关中、弘农、河东，名为汉臣，实为国贼。特色：御卫兵。'},
 {id:'mt',name:'马腾',ch:'马',color:'#8a5a2a',major:true,leader:'mateng',region:'雍凉',aggr:0.9,diff:2,desc:'伏波之后，与韩遂割据凉州、陇右。西凉铁骑精悍绝伦，马超、庞德骁勇冠世。特色：西凉铁骑、羌兵、羌骑兵。'},
 {id:'zx',name:'张绣',ch:'绣',color:'#6a7a3a',major:true,leader:'zhangxiu',region:'中原',aggr:0.7,diff:4,desc:'北地枪王，屯宛城，扼南阳要冲。贾诩为谋主，兵少而精。特色：羌骑兵。'},
 {id:'lbiao',name:'刘表',ch:'表',color:'#3a7a6a',major:true,leader:'liubiao',region:'荆州',aggr:0.4,diff:2,desc:'单骑入荆州，据荆襄九郡之北，带甲十余万。坐谈客耳，然荆州富庶，水军冠于天下。'},
 {id:'hx',name:'韩玄',ch:'玄',color:'#9a5a6a',major:true,leader:'hanxuan',region:'荆州',aggr:0.4,diff:3,desc:'据长沙，领荆南四郡与苍梧。帐下有老将黄忠、猛将魏延。特色：苍髯射手、交州义士。'},
 {id:'lz',name:'刘璋',ch:'璋',color:'#6a5aa0',major:true,leader:'liuzhang',region:'巴蜀',aggr:0.3,diff:2,desc:'新袭益州牧，据天府之国，城池二十。暗弱无断，北有张鲁、南有蛮夷。特色：重弩手。'},
 {id:'zl',name:'张鲁',ch:'鲁',color:'#b08a5a',major:true,leader:'zhanglu',region:'巴蜀',aggr:0.5,diff:3,desc:'五斗米道师君，据汉中，扼阳平、白水之险。北望关中，南窥巴蜀。特色：重弩手。'},
 {id:'mh',name:'孟获',ch:'孟',color:'#7a8a2a',major:true,leader:'menghuo',region:'南中',aggr:0.7,diff:3,desc:'南中蛮王，据建宁、云南、永昌。藤甲刀枪不入，象兵摧锋陷阵。特色：藤甲兵、象兵、南蛮兵。'},

(function finishCities(){
  const facOf=id=>FACTIONS.find(f=>f.id===id);const r100=v=>Math.max(0,Math.round(v/100)*100);
  const CAVF=['lb','mt','gsz','yshao','cao','zx','lj','wh','xn','xb','jh','qh'];
  for(const c of CITIES){const F=facOf(c.owner);const fl=c.fl;c.cap=fl.includes('cap');c.pass=fl.includes('pass')||fl.includes('ai');c.ai=fl.includes('ai');c.bar=fl.includes('bar');c.isle=fl.includes('isle');
    const lc=fl.find(x=>x.startsWith('loc='));c.loc=lc?lc.slice(4).split('/'):[];const pv=fl.find(x=>x.startsWith('prov='));c.prov=pv?pv.slice(5):'化外';
    const p=c.pop;const b={wall:c.wall,farm:0,market:0,barracks:0,stable:0};
    if(!c.pass){b.farm=p>=45?3:p>=25?2:1;b.market=c.bar?0:p>=50?3:p>=30?2:1;b.barracks=c.cap?(c.bar?1:3):p>=35?2:1;
      let st=(c.lat>=34||c.lon<=107)?1:0;if(c.cap)st++;if(CAVF.includes(c.owner))st++;if(c.lat<28&&!c.loc.includes('xiang'))st=Math.min(st,1);b.stable=clamp0(st,0,3)}
    c.b=b;
    // 驻军
    let tot,style;if(c.pass){tot=(c.ai?2500:3500)+(F&&F.major?1500:0);style=F&&F.major?GAR_STYLE[F.region]:GAR_STYLE['豪强']}
    else{tot=(p*75+c.wall*500)*(c.cap?1.6:1)*(F&&F.major?1:c.bar?1.25:0.75);style=F&&F.major?GAR_STYLE[F.region]:GAR_STYLE['豪强']}
    const g={};
    if(c.bar&&c.loc.length){const lu=c.loc[0];g[lu]=r100(tot*0.55);g.dao=r100(tot*0.25);g.gong=r100(tot*0.2);if(c.loc[1])g[c.loc[1]]=r100(tot*0.2)}
    else for(const[t,v]of Object.entries(style))g[t]=r100(tot*v);
    if(c.cap&&FAC_ELITE[c.owner])for(const[t,v]of Object.entries(FAC_ELITE[c.owner]))g[t]=(g[t]||0)+v;
    for(const t in g)if(!g[t])delete g[t];c.gar=g}
  function clamp0(v,a,b){return Math.max(a,Math.min(b,v))}
})();

function retreatField(aid,from,steps=3){const a=S.armies[aid];if(!a)return false;liftSiege(a);a.ambush=false;const ctx=ctxFor(a,{real:true});const s=aTile(a);

  for(const g of Object.values(s.gens)){g.pk=[...g.s];g.exp=[0,0,0,0,0];const at=Math.max(194,g.appear||194);const age=at-g.born;
    if(age<26){const f=Math.min(1,Math.max(0.7,0.7+(age-15)*0.028));g.s=g.pk.map(v=>Math.max(15,Math.round(v*f)))}
    const p=g.pk;const top=[...p].sort((a,b)=>b-a);g.merit=age<20?0:Math.max(0,Math.round((top[0]+top[1]-125)*7));g.rank=0;g.gift=0;g.kin=false}
  // 按功勋授初始官职（不超过杂号将军）
  for(const g of Object.values(s.gens)){if(g.f==='free'||g.role==='lord')continue;let r=0;for(let i=1;i<=5;i++)if(g.merit>=RANKS[i].m)r=i;g.rank=r}
  for(const f of Object.values(s.fac)){f.items=[];const n=Object.values(s.cities).filter(c=>c.owner===f.id).length;f.title=f.major&&n>=3?1:0;f.kingdom=''}
  s.family=FAMILY.map(w=>({...w,st:'avail',to:null}));}
// ---------- 爵位 ----------
function capProv(f){const c=facCap(f);return c?c.prov:'化外'}
function lordTitle(f){const F0=S.fac[f];if(!F0||!F0.major)return '';const t=F0.title||0;if(t===0)return '太守';if(t===1){const p=capProv(f);return p==='化外'?'塞外都护':p+'牧'}const k=F0.kingdom||COUNTRY[capProv(f)]||'汉';return t===4?k+'帝':k+TITLES[t]}
// ---------- 官职 ----------
function rankName(g){if(isLordG(g))return lordTitle(g.f);const r=g.rank||0;if(!r)return '';if(isCivil(g))return RANKS[r].c;if(r===6)return ZHENG[g.zheng||0]+'将军';return RANKS[r].w}
function rankCount(f,r){return gensOf(f).filter(g=>g.rank===r).length}
function promoteCost(g){return ((g.rank||0)+1)*80}
function canPromote(g){if(isLordG(g)||g.f==='free')return false;const n=(g.rank||0)+1;const R0=RANKS[n];if(!R0)return false;if((g.merit||0)<R0.m)return false;if(R0.max&&rankCount(g.f,n)>=R0.max)return false;if(R0.need&&(S.fac[g.f].title||0)<R0.need)return false;return S.fac[g.f].gold>=promoteCost(g)}
function promote(g){if(!canPromote(g))return false;S.fac[g.f].gold-=promoteCost(g);g.rank=(g.rank||0)+1;g.loy=Math.min(100,g.loy+10);
  if(g.rank===6&&!isCivil(g)){const used=gensOf(g.f).filter(x=>x.rank===6&&x.id!==g.id&&!isCivil(x)).map(x=>x.zheng||0);g.zheng=[0,1,2,3].find(i=>!used.includes(i))||0}
  if(g.f===S.player)addLog(`${g.name} 升任${rankName(g)}。`);return true}
function rankCapBonus(g){return g?(isLordG(g)?1500*Math.max(0,(S.fac[g.f].title||0)-1):RANKS[g.rank||0].cap):0}
function salary(f){return gensOf(f).reduce((s,g)=>s+(g.rank||0),0)} // 每月
// ---------- 功勋与成长 ----------
function addMerit(id,n){const g=S.gens[id];if(!g||g.dead)return;g.merit=(g.merit||0)+n}
const STAT_N=['统率','武力','智力','政治','魅力'];
function gainExp(id,i,n){const g=S.gens[id];if(!g||g.dead||!g.pk)return;g.exp[i]+=n;while(g.exp[i]>=100){g.exp[i]-=100;const capV=Math.min(100,g.pk[i]+4);if(g.s[i]<capV){g.s[i]++;if(g.f===S.player&&!g.pend)addLog(`${g.name} ${STAT_N[i]}提升至 ${g.s[i]}。`)}}}
function yearlyGrowth(){const mine=[];for(const g of Object.values(S.gens)){if(g.dead||g.pend||!g.pk)continue;const age=S.year-g.born;
  if(age<31){let tot=0;for(let i=0;i<5;i++){const gap=g.pk[i]-g.s[i];if(gap>0&&rnd()<0.9){const d=Math.max(1,Math.round(gap*0.2));g.s[i]+=d;tot+=d}}if(tot>=3&&g.f===S.player&&!g.captive)mine.push(g.name)}
  if(age>=60&&rnd()<0.45)g.s[1]=Math.max(15,g.s[1]-1);if(age>=66&&rnd()<0.3)g.s[0]=Math.max(15,g.s[0]-1)}
  if(mine.length)addLog(`诸将历练成长：${mine.slice(0,8).join('、')}${mine.length>8?'等':''}。`)}
function peopleAfterBattle(res){const win=res.win==='A'?res.a:res.d,lose=res.win==='A'?res.d:res.a;
  for(const s of [res.a,res.d]){const w=s===win;s.gens.forEach((id,k)=>{addMerit(id,w?22:8);gainExp(id,1,w?14:8);if(id===s.lead)gainExp(id,0,w?30:15)})}
  const d=res.ev&&res.ev.duel;if(d&&d.win){addMerit(d.win,d.killed?45:25);gainExp(d.win,1,40);if(d.lose)gainExp(d.lose,1,15)}
  (res.ev&&res.ev.plot||[]).forEach(id=>{addMerit(id,15);gainExp(id,2,35)});
  if(win.lead)gainExp(win.lead,4,10)}
// ---------- 宝物 ----------
function giveItem(f,item,gid){const F0=S.fac[f];const g=S.gens[gid];const i=F0.items.indexOf(item);if(i<0||!g||g.f!==f)return false;F0.items.splice(i,1);g.items.push(item);g.loy=Math.min(100,g.loy+(isLordG(g)?0:20));if(f===S.player)addLog(`赐 ${g.name}【${ITEMS[item].name}】。`);return true}
function takeItem(gid,item){const g=S.gens[gid];const i=g.items.indexOf(item);if(i<0)return false;g.items.splice(i,1);S.fac[g.f].items.push(item);if(!isLordG(g))g.loy=Math.max(0,g.loy-12);return true}
function itemsToTreasury(g,f){if(!g.items.length)return;const F0=S.fac[f];if(F0&&F0.alive){F0.items.push(...g.items);if(f===S.player)addLog(`${g.name} 的宝物收入宝库：${g.items.map(i=>ITEMS[i].name).join('、')}。`)}g.items=[]}
function lifeBonus(g){return g.items.reduce((s,i)=>s+((ITEMS[i]&&ITEMS[i].life)||0),0)}
// ---------- 忠诚 ----------
function loyTarget(g){const F0=S.fac[g.f];const L=leaderGen(g.f);const Lm=L?gs(L)[4]:50;
  let t=52+(Lm-60)*0.45+(g.rank||0)*4+(F0.emperor?4:0)+Math.max(0,(F0.title||0)-1)*3;
  if(g.kin)t+=35;if(hasT(g,'忠义'))t+=25;if(sameClan(g,L))t+=25;if(g.turn)t-=6;if(hasT(g,'枭雄'))t-=10;if(L&&hasT(L,'仁德'))t+=6;
  const nx=RANKS[(g.rank||0)+1];if(nx&&(g.merit||0)>=nx.m*1.4)t-=6;if(F0.unpaid)t-=10;t-=(F0.lostC||0)*3;
  return clamp(t,5,100)}
function loyaltyPhase(){
  for(const F0 of Object.values(S.fac)){if(!F0.alive||!F0.major)continue;const f=F0.id;
    // 俸禄
    const sal=salary(f);F0.unpaid=F0.gold<sal;
    for(const g of gensOf(f)){if(isLordG(g)){g.loy=100;continue}if(g.captive)continue;const t=loyTarget(g);g.loy=clamp(g.loy+(t-g.loy)*0.031+(t<g.loy?-0.13:0.13),0,100)}
    // 太守政绩
    for(const c of citiesOf(f)){const gv=c.gov&&S.gens[c.gov];if(gv&&!gv.dead&&gv.loc&&gv.loc.id===c.id&&gv.f===f){gainExp(gv.id,3,4);addMerit(gv.id,1)}}}
  // 城池得失（去年）
  if(S.month===0)for(const F0 of Object.values(S.fac)){const n=citiesOf(F0.id).length;F0.lostC=Math.max(0,(F0.lastN||n)-n);F0.lastN=n}
}
async function defectionPhase(){
  for(const g of Object.values(S.gens)){if(g.dead||g.pend||g.captive||g.f==='free'||g.kin||isLordG(g))continue;const F0=S.fac[g.f];if(!F0||!F0.major||!F0.alive)continue;
    if(g.loy>=32||rnd()>(32-g.loy)/480)continue;await defect(g)}}
function genCity(g){if(!g.loc)return null;if(g.loc.t==='c')return S.cities[g.loc.id];const a=S.armies[g.loc.id];return a?S.cities[aCity(a)]:null}
function defectTarget(g,c){const cands=[];for(const n of (c?nb(c.id):[])){const o=S.cities[n].owner;if(o===g.f||!isMajor(o)||!S.fac[o].alive)continue;if(rel(g.f,o).st!=='war')continue;const L=leaderGen(o);cands.push({f:o,sc:(L?gs(L)[4]:50)+facPow(o)/10+rnd()*20})}
  cands.sort((a,b)=>b.sc-a.sc);return cands[0]?cands[0].f:null}
async function defect(g,toF,viaBribe){const c=genCity(g);const old=g.f;const to=toF||defectTarget(g,c);
  const withCity=c&&c.owner===old&&c.gov===g.id&&g.loc&&g.loc.t==='c'&&!c.cap&&to&&nb(c.id).some(n=>S.cities[n].owner===to)&&(g.loy<20||viaBribe&&g.loy<30);
  let text;
  if(withCity){const others=gensInCity(c.id,old).filter(x=>x.id!==g.id&&!isLordG(x)&&x.loy<45);
    c.owner=to;evictArmies(c.id,old);c.gov=g.id;[g,...others].forEach(x=>{x.f=to;x.loc={t:'c',id:c.id};x.loy=58;x.turn=true});gensInCity(c.id,old).forEach(x=>{const h=nearestOwnCity(old,c.id);if(h&&h!==c.id)x.loc={t:'c',id:h};else freeGen(x,c.id)});
    text=`${g.name} 举${c.name}投降${S.fac[to].name}${others.length?'，'+others.map(x=>x.name).join('、')+'随之':''}！`;
    if(!citiesOf(old).length)eliminate(old)}
  else if(to){removeGenFromArmy(g.id);Object.values(S.cities).forEach(x=>{if(x.gov===g.id)x.gov=null});const h=nearestOwnCity(to,c?c.id:g.home)||(citiesOf(to)[0]||{}).id;if(!h)return;g.f=to;g.loc={t:'c',id:h};g.loy=58;g.turn=true;text=`${g.name} 背弃${S.fac[old].name}，投奔${S.fac[to].name}！`}
  else{removeGenFromArmy(g.id);Object.values(S.cities).forEach(x=>{if(x.gov===g.id)x.gov=null});freeGen(g,c?c.id:g.home);text=`${g.name} 心怀不满，挂印出走。`}
  addLog(text);if(old===S.player||to===S.player)await HOOK.event({title:old===S.player?'部将叛离':'敌将来投',who:g.id,text});return true}
// ---------- 策反 ----------
function bribeCost(g){return Math.round(160+gs(g).reduce((a,b)=>a+b,0)/2)}
function bribeP(f,g){if(isLordG(g)||g.kin)return 0;const L=leaderGen(f),TL=leaderGen(g.f);const Lm=L?gs(L)[4]:50,Tm=TL?gs(TL)[4]:50;
  let p=0.03+(65-g.loy)/85+(Lm-Tm)/250+(hasT(g,'枭雄')?0.08:0)-(hasT(g,'忠义')?0.6:0)-(sameClan(g,TL)?0.4:0)+(L&&hasT(L,'枭雄')?0.05:0);return clamp(p,0,0.85)}
async function doBribe(f,gid){const g=S.gens[gid];const cost=bribeCost(g);if(S.fac[f].gold<cost)return null;S.fac[f].gold-=cost;
  if(rnd()<bribeP(f,g)){await defect(g,f,true);return true}g.loy=Math.min(100,g.loy+5);const r=rel(f,g.f);r.v=Math.max(-100,r.v-8);if(f===S.player||g.f===S.player)addLog(`${S.fac[f].name}策反 ${g.name} 未果。`);return false}
// ---------- 联姻 ----------
function womanAge(w){return S.year-w.born}
function womenOf(f,all){return (S.family||[]).filter(w=>w.f===f&&w.st==='avail'&&womanAge(w)>=15&&(all||!w.res||S.year>=w.res))}
function marryP(a,b){const r=rel(a,b);if(r.st==='war'||a===b)return 0;let p=0.2+r.v/140+(commonEnemy(a,b)?0.15:0)+(facPow(a)>facPow(b)?0.1:-0.05);const L=leaderGen(a);if(L)p+=(gs(L)[4]-70)/200;return clamp(p,0.05,0.9)}
function doMarryAlliance(a,b,wid,force){const w=S.family.find(x=>x.id===wid);if(!w||w.f!==a||w.st!=='avail')return false;
  if(!force&&rnd()>marryP(a,b)){rel(a,b).v-=3;return false}w.st='wed';w.to=b;const r=rel(a,b);r.st='ally';r.v=Math.max(r.v,80);r.kin=S.turn+48;addLog(`${S.fac[a].name}以${w.name}与${S.fac[b].name}联姻，两家结为秦晋之好。`);return true}
function doGrantMarriage(f,wid,gid){const w=S.family.find(x=>x.id===wid);const g=S.gens[gid];if(!w||w.f!==f||w.st!=='avail'||!g||g.f!==f||isLordG(g))return false;w.st='wed';w.to=gid;g.kin=true;g.loy=Math.min(100,g.loy+30);addMerit(gid,20);if(f===S.player)addLog(`以${w.name}许配 ${g.name}，${g.name}感恩戴德。`);return true}
function kinLocked(a,b){const r=rel(a,b);return r.kin&&r.kin>S.turn}
// ---------- 爵位晋升（进位） ----------
async function titleCheck(){for(const F0 of Object.values(S.fac)){if(!F0.alive||!F0.major)continue;const f=F0.id;const n=citiesOf(f).length;const L=leaderGen(f);if(!L)continue;const t=F0.title||0;
  let nt=t;if(t<1&&n>=3)nt=1;if(t<2&&n>=24&&S.year>=196)nt=2;else if(t===2&&n>=40)nt=3;else if(t===3&&n>=60)nt=4;if(nt===t)continue;
  if(nt===4&&f===S.player){const ch=await HOOK.choice({title:'劝进',who:L.id,text:`群臣上表劝进：「${L.name}功盖寰宇，天命所归，请即皇帝位。」称帝后诸侯皆为敌国。`},['登基称帝','暂不称帝']);if(ch!==0){F0.noEmp=S.turn;continue}}
  if(nt===4&&F0.noEmp&&S.turn-F0.noEmp<24)continue;
  if(nt>=2&&!F0.kingdom)F0.kingdom=COUNTRY[capProv(f)]||'汉';F0.title=nt;const tn=lordTitle(f);
  if(nt===1){addLog(`${L.name} 领${tn}。`);continue}
  F0.gold+=nt*200;gensOf(f).forEach(g=>{if(!isLordG(g))g.loy=Math.min(100,g.loy+5)});
  if(nt===4){Object.values(S.fac).forEach(o=>{if(o.major&&o.alive&&o.id!==f){const r=rel(f,o.id);if(r.st!=='ally'){r.st='war'}r.v-=30}});F0.claim=true}
  const txt=nt===2?`${L.name}受九锡，进爵${tn}，建宗庙社稷，置百官。`:nt===3?`${L.name}进位${tn}，冕十二旒，乘金根车。`:`${L.name}即皇帝位，国号${F0.kingdom}。天下诸侯震动！`;
  addLog(txt);await HOOK.event({title:nt===2?'加九锡':nt===3?'进位称王':'登基称帝',who:L.id,text:txt})}}
// ---------- AI 用人 ----------
function aiPeople(f){const F0=S.fac[f];
  for(const g of gensOf(f).sort((a,b)=>(b.merit||0)-(a.merit||0)))while(canPromote(g)&&F0.gold>600)promote(g);
  const low=gensOf(f).filter(g=>!isLordG(g)&&!g.captive&&g.loy<60).sort((a,b)=>gs(b).reduce((x,y)=>x+y,0)-gs(a).reduce((x,y)=>x+y,0));
  for(const g of low){if(F0.items.length){giveItem(f,F0.items[0],g.id);continue}if(F0.gold>900&&g.loy<45)doReward(g.id)}
  if(low.length&&rnd()<0.07){const w=womenOf(f)[0];if(w&&low[0].loy<40)doGrantMarriage(f,w.id,low[0].id)}}
async function aiBribe(f){const F0=S.fac[f];if(F0.gold<700||rnd()>0.035*(F0.aggr||0.7))return;
  const targets=[];for(const c of citiesOf(f))for(const n of nb(c.id)){const o=S.cities[n].owner;if(!isMajor(o)||o===f||rel(f,o).st!=='war')continue;gensInCity(n,o).forEach(g=>{if(!isLordG(g)&&g.loy<55)targets.push(g)})}
  if(!targets.length)return;targets.sort((a,b)=>bribeP(f,b)-bribeP(f,a));const g=targets[0];if(bribeP(f,g)<0.18||bribeCost(g)>F0.gold-400)return;await doBribe(f,g.id)}
function aiMarriage(f){if(rnd()>0.02)return;const ws=womenOf(f);if(!ws.length)return;
  for(const o of Object.values(S.fac)){if(!o.major||!o.alive||o.id===f)continue;const r=rel(f,o.id);if(r.st==='war'||kinLocked(f,o.id))continue;if(!(r.st==='ally'||r.v>=50)||!commonEnemy(f,o.id))continue;
    if(o.id===S.player){S.pendingProps=(S.pendingProps||[]);S.pendingProps.push({type:'marry',from:f,w:ws[0].id});return}if(doMarryAlliance(f,o.id,ws[0].id))return}}

// ================= 历史事件（演义向，条件触发） =================
const EVX={
  ok:id=>{const g=S.gens[id];return !!(g&&!g.dead&&!g.pend)},
  inF:(id,f)=>{const g=S.gens[id];return !!(g&&!g.dead&&!g.pend&&!g.captive&&g.f===f)},
  fa:f=>!!(S.fac[f]&&S.fac[f].alive&&citiesOf(f).length),
  lord:(id)=>{const g=S.gens[id];return !!(g&&!g.dead&&S.fac[g.f]&&S.fac[g.f].leader===id&&S.fac[g.f].alive)},
  adj:(a,b)=>citiesOf(a).some(c=>nb(c.id).some(n=>S.cities[n].owner===b)),
  me:(...fs)=>fs.includes(S.player),
  done:id=>!!(S.flags.ev&&S.flags.ev[id]),
  mark:id=>{S.flags.ev=S.flags.ev||{};S.flags.ev[id]=S.turn},
};
async function evShow(title,who,text,fs,global){addLog(text.length>60?title+'：'+text.slice(0,58)+'…':text);if(global||!fs||fs.includes(S.player))await HOOK.event({title,who,text})}
async function evChoice(title,who,text,opts,f,aiPick){if(f===S.player)return await HOOK.choice({title,who,text},opts);return typeof aiPick==='function'?aiPick():(aiPick||0)}
function capOf(f){return facCap(f)}
function moveGen(g,f,cid){removeGenFromArmy(g.id);Object.values(S.cities).forEach(x=>{if(x.gov===g.id)x.gov=null});g.captive=null;S.captives=S.captives.filter(c=>c.id!==g.id);g.f=f;g.loc={t:'c',id:cid};g.pend=false}
function reviveFac(f,leader,cityIds,genIds){const F0=S.fac[f];F0.alive=true;F0.leader=leader;F0.gold=Math.max(F0.gold||0,400);F0.grain=Math.max(F0.grain||0,1200);
  for(const cid of cityIds){const c=S.cities[cid];const old=c.owner;c.owner=f;c.gov=null;evictArmies(cid,old);gensInCity(cid,old).forEach(x=>{if(genIds.includes(x.id))return;const h=nearestOwnCity(old,cid);if(h&&h!==cid)x.loc={t:'c',id:h};else freeGen(x,cid)})}
  S.fac[f].capital=cityIds[0];
  for(const id of genIds){const g=S.gens[id];if(!g||g.dead)continue;moveGen(g,f,cityIds.includes(genCity(g)&&genCity(g).id)?genCity(g).id:cityIds[0]);g.loy=id===leader?100:80}
  Object.values(S.fac).forEach(o=>{if(o.id!==f){const k=f<o.id?f+'|'+o.id:o.id+'|'+f;if(!S.rel[k])S.rel[k]={st:o.major?'peace':'war',v:0,t:0}}})}

// ================= 三国墨战 · AI =================
function hostileTo(f,other){return other!==f&&attackStatus(f,other)==='ok'}
function isFrontier(f,c){return nb(c.id).some(n=>{const o=S.cities[n].owner;return o!==f&&!friendly(f,o)&&attackStatus(f,o)!=='no'})||besiegers(c.id).some(b=>b.f!==f)}
// 威胁：围城之敌＋十四格内可来犯之敌军
function threatAt(f,c){const ci=GR.cityTile[c.id];let t=0;for(const x of Object.values(S.armies)){if(x.f===f||friendly(f,x.f))continue;if(x.siege===c.id){t+=armyPow(x);continue}if(!isMajor(x.f)||attackStatus(x.f,f)!=='ok')continue;const d=tDist(aTile(x),ci);if(d<=14)t+=armyPow(x)*(d<=6?0.9:0.55)}return t}
function genFree(g){return g.loc&&g.loc.t==='c'&&!g.captive}

async function aiTurn(f){const Fa=S.fac[f];if(!Fa.alive)return;
  if(Fa.major){aiDiplomacy(f);aiPeople(f);aiEconomy(f);await aiMilitary(f);aiSearch(f);await aiBribe(f);aiMarriage(f);aiSpy(f)}else aiMinor(f);
  await flushCaptives()}

function aiEconomy(f){const Fa=S.fac[f];const cs=citiesOf(f);const up=upkeep(f);const reserve=150+40*cs.length;
  cs.forEach(c=>{if(c.pass)return;if(c.mx<40)c.tax=0;else if(Fa.gold<300&&c.mx>62)c.tax=2;else c.tax=1;
    const here=gensInCity(c.id,f);if(here.length){const best=here.sort((a,b)=>gs(b)[3]-gs(a)[3])[0];if(!c.gov||!S.gens[c.gov]||S.gens[c.gov].loc?.id!==c.id)c.gov=best.id}
    if(c.mx<30&&Fa.grain>600)doRelief(c)});
  // 建设
  cs.slice().sort(()=>rnd()-0.5).forEach(c=>{if(c.pass||c.build)return;const fr=isFrontier(f,c);let k;
    if(fr&&c.portOK&&(c.b.port||0)<2&&nb(c.id).some(n=>isRiver(c.id,n)&&S.cities[n].owner!==f)&&rnd()<0.3)k='port';
    else if(fr){if(c.b.wall<2)k='wall';else if(c.b.barracks<2)k='barracks';else if(c.b.stable<1)k='stable';else if(c.b.wall<3&&c.cap)k='wall';else if(c.b.barracks<3)k='barracks';else k=c.b.market<=c.b.farm?'market':'farm'}
    else{k=c.b.market<=c.b.farm?'market':'farm';if(c.b[k]>=4)k=c.b.barracks<2?'barracks':(c.b.stable<2?'stable':'wall')}
    const lv=c.b[k]||0;if(lv>=5)return;if(Fa.gold-BUILD_COST[lv+1]>reserve)doBuild(c,k)});
  // 募兵
  const yearGr=cs.reduce((s,c)=>s+cityGrainYear(c),0);const maxT=yearGr/46*1000*0.92;if(facTroops(f)>=maxT||Fa.grain<up.gr*6)return;let room=maxT-facTroops(f);
  cs.slice().sort((a,b)=>threatAt(f,b)-threatAt(f,a)).forEach(c=>{if(c.pass&&sumT(c.gar)>4000)return;const fr=isFrontier(f,c);const target=fr?5000+c.pop*90:2500;let need=target-sumT(c.gar);
    const th=threatAt(f,c);if(th>cityDefPow(c.id)*0.8)need=Math.max(need,4000);
    let guard=6;while(need>0&&recruitCap(c)>0&&guard-->0){const opts=unitsFor(f,c);let t;const sp=opts.filter(t=>UNITS[t].f);
      const cav=opts.filter(t=>t==='qi'||(t==='zq'&&Fa.gold>900));const inf=['dao','qiang','qiang','gong','dao','zb','cq','nu','nu'].filter(t=>opts.includes(t)&&(UNITS[t].cost<=90||Fa.gold>700));
      const r=rnd();const ships=opts.filter(t=>isShipT(t)&&UNITS[t].cost<=Fa.gold/3);const riverFront=c.b.port>0&&nb(c.id).some(n=>isRiver(c.id,n)&&S.cities[n].owner!==f&&attackStatus(f,S.cities[n].owner)==='ok');
      if(ships.length&&riverFront&&r<0.3)t=pick(ships);else if(sp.length&&r<0.35)t=pick(sp);else if(cav.length&&r<0.52)t=pick(cav);else t=pick(inf.length?inf:opts);
      const n=Math.min(1000,need,recruitCap(c),Math.floor(room/100)*100);if(n<100)break;const cost=UNITS[t].cost*n/1000;if(Fa.gold-cost<reserve*0.5)break;if(!doRecruit(c,t,n))break;need-=n;room-=n}})}

async function aiMilitary(f){const Fa=S.fac[f];const ag=Fa.aggr||0.7;const thA=1.2+(1-ag)*0.6,thS=0.9+(1-ag)*0.4;
  // 编组
  const cs=citiesOf(f);const maxArmies=Math.ceil(cs.length/2)+1;
  for(const c of cs){if(armiesOf(f).length>=maxArmies)break;if(!isFrontier(f,c))continue;const tot=sumT(c.gar);if(tot<5500+(1-ag)*2500)continue;
    const gens=gensInCity(c.id,f).filter(genFree).filter(g=>!g.moved);if(!gens.length)continue;
    gens.sort((a,b)=>(gs(b)[0]+gs(b)[1])-(gs(a)[0]+gs(a)[1]));const pickG=[gens[0].id];const sub=gens.slice(1).sort((a,b)=>Math.max(gs(b)[1],gs(b)[2])-Math.max(gs(a)[1],gs(a)[2]));sub.slice(0,gens.length>3?2:1).forEach(g=>pickG.push(g.id));
    if(gens.length===1&&c.cap&&S.fac[f].leader===gens[0].id&&cs.length>1)continue;
    const keep=Math.max(2000,tot*0.3);const frac=(tot-keep)/tot;const tr={};let cap=3000+gs(gens[0])[0]*100+(hasT(gens[0],'统帅')?3000:0);
    for(const[t,n]of Object.entries(c.gar)){const m=Math.floor((isShipT(t)?n:n*frac)/100)*100;if(m>0)tr[t]=m}let s0=sumT(tr);if(s0>cap){const k=cap/s0;for(const t in tr)tr[t]=Math.floor(tr[t]*k/100)*100}
    if(sumT(tr)>=3000)formArmy(c.id,pickG,tr)}
  // 合并同城闲置军团
  for(const c of cs){const here=armiesAt(c.id).filter(x=>x.f===f);if(here.length<2)continue;here.sort((x,y)=>armyCap(y)-armyCap(x));const main=here[0];for(const o of here.slice(1)){if(sumT(main.troops)+sumT(o.troops)<=armyCap(main)&&main.gens.length+o.gens.length<=3){for(const[t,n]of Object.entries(o.troops))main.troops[t]=(main.troops[t]||0)+n;o.gens.forEach(g=>{S.gens[g].loc={t:'a',id:main.id};main.gens.push(g)});main.mp=Math.min(main.mp,o.mp);delete S.armies[o.id]}}}
  // 行动
  for(const a of armiesOf(f)){if(!S.armies[a.id])continue;try{await aiArmy(f,S.armies[a.id],thA,thS)}catch(e){console.error('aiArmy',e)}}
}
// 行军路线上的水战关口（步军渡大江：十格内敌水寨；舟师行船：三格内敌水寨）是否打得过
function pathNavalOK(a,path){const sail=canSail(a);const fleets=Object.values(S.cities).filter(c=>hostile(a.f,c.owner)&&navalNeed(c.id)>=500);if(!fleets.length)return true;const seen=new Set();
  for(let k=0;k<path.length;k++){const i=path[k];const prev=k?path[k-1]:aTile(a);let r=0;if(!sail&&(GR.fl[i]&FL_FORD)&&GR.ter[i]===T_RIVER&&!(GR.fl[prev]&FL_FORD))r=10;else if(sail&&isWaterT(i))r=3;if(!r)continue;
    for(const c of fleets){if(seen.has(c.id)||tDist(GR.cityTile[c.id],i)>r)continue;seen.add(c.id);if(sumT(shipTr(a.troops))<300||navalPow(a.troops,a.f)<navalPow(cityDefenders(c.id).tr,c.owner)*0.9)return false}}return true}
async function aiArmy(f,a,thA,thS){
  if(a.siege){const c=S.cities[a.siege];if(!c||friendly(f,c.owner)){liftSiege(a)}else{
    const allies=besiegers(c.id).filter(b=>b.f===f).map(b=>b.id);const tot=allies.reduce((s0,id)=>s0+armyPow(S.armies[id]),0);const r2=tot/(cityDefPow(c.id)+0.1);
    if(r2>=1.18&&allies[0]===a.id){await attackCity(allies,c.id,'assault');return}
    // 附近有强敌来援：解围迎战或撤退
    const foe=Object.values(S.armies).filter(e=>hostile(f,e.f)&&!inCity(e)&&tDist(aTile(e),aTile(a))<=1);if(foe.length&&armyPow(a)>=armyPow(foe[0])*1.1){await attackArmy([a.id],foe[0].id,null);return}
    if(r2>=0.45)return;liftSiege(a);a.goal=null}}
  if(a.mp<=0)return;
  // 城被围：出城迎击
  if(inCity(a)){const bs=besiegers(a.at).filter(b=>hostile(f,b.f)&&tDist(aTile(b),aTile(a))<=1);if(bs.length){const b=bs.sort((x,y)=>armyPow(x)-armyPow(y))[0];if(armyPow(a)+sidePow(S.cities[a.at].gar,[])*0.5>=armyPow(b)*0.95)await attackArmy([a.id],b.id,a.at);return}}
  if(sumT(a.troops)<1500&&inCity(a)&&S.cities[a.at].owner===f){disbandArmy(a.id);return}
  // 伏兵：敌近则守伏，久无敌至则撤伏
  if(a.ambush){const near=Object.values(S.armies).some(e=>hostile(f,e.f)&&!inCity(e)&&knows(f,e)&&tDist(aTile(e),aTile(a))<=12);if(near&&(a.ambT||0)<4)return;a.ambush=false}
  const ctx=ctxFor(a);const sail=ctx.sail;const full=armyMP(a);const range=a.mp+full*2;const P=planFrom(a,ctx,range);const here=aTile(a);const my=armyPow(a);
  const nb0=[];const bestAdj=ti=>{let bd=Infinity,bt=-1;nbrs(ti,nb0);for(const j of nb0){const d=j===here?0:P.dist.get(j);if(d===undefined)continue;if(j!==here&&!stoppable(j,ctx))continue;if(d<bd){bd=d;bt=j}}return[bd,bt]};
  const months=d=>d<=a.mp?0:Math.ceil((d-a.mp)/full);
  const opts=[];
  for(const e of Object.values(S.armies)){if(e.f===f||!hostile(f,e.f)||inCity(e)||!knows(f,e))continue;const et=aTile(e);if(isWaterT(et)&&!sail)continue;if(tDist(et,here)>range)continue;const[d,t]=bestAdj(et);if(t<0)continue;
    const ep=armyPow(e)+armiesNear(e.f,et,2,x=>x.id!==e.id&&!x.siege).reduce((s0,x)=>s0+armyPow(x),0);const mp0=my+armiesNear(f,t,2,x=>x.id!==a.id&&!x.siege).reduce((s0,x)=>s0+armyPow(x),0);const r=mp0/(ep+0.1);
    if(r<1.1)continue;let sc=45+Math.min(r,3)*10-months(d)*12;if(e.siege&&S.cities[e.siege]&&S.cities[e.siege].owner===f)sc+=35;if(a.goal&&a.goal.id===e.id)sc+=10;opts.push({kind:'field',id:e.id,t,d,score:sc})}
  for(const c of Object.values(S.cities)){if(c.owner===f||!hostile(f,c.owner))continue;const ci=GR.cityTile[c.id];if(tDist(ci,here)>range)continue;const[d,t]=bestAdj(ci);if(t<0)continue;
    const dp=cityDefPow(c.id);const r=my/(dp+0.1);const val=c.pop+(c.cap?25:0)+(c.pass?15:0)+(S.flags.emperor===c.id?60:0)+(isMajor(c.owner)?10:0)+(c.owner===S.player?8:0);
    const co=armiesNear(f,ci,3,x=>x.id!==a.id&&!x.siege);const r2=(my+co.reduce((s0,x)=>s0+armyPow(x),0))/(dp+0.1);
    let kind=null,sc=0;if(r>=thA){kind='assault';sc=val+r*8}else if(r2>=thA+0.05&&co.length){kind='assault';sc=val+r2*6}else if(r>=thS&&!c.pass){kind='siege';sc=val*0.6+r*5}
    if(!kind)continue;sc-=months(d)*12;if(a.goal&&a.goal.id===c.id)sc+=15;opts.push({kind,id:c.id,t,d,score:sc})}
  for(const ft of Object.values(S.forts||{})){if(ft.f===f||!hostile(f,ft.f))continue;if(tDist(ft.i,here)>range)continue;const d=ft.i===here?0:P.dist.get(ft.i);if(d===undefined||!stoppable(ft.i,ctx))continue;opts.push({kind:'raze',id:ft.id,t:ft.i,d,score:(ft.kind==='site'?32:ft.kind==='camp'?24:18)-months(d)*10})}
  opts.sort((x,y)=>y.score-x.score);
  for(const o of opts.slice(0,4)){const path=o.t===here?[]:tracePath(P.prev,o.t);if(!pathNavalOK(a,path))continue;
    a.goal={kind:o.kind,id:o.id};if(path.length){await marchArmy(a.id,path,{noQueue:true});if(!S.armies[a.id])return}
    if(o.kind==='raze')return;

    else{const c=S.cities[o.id];const ci=GR.cityTile[o.id];if(tDist(aTile(a),ci)<=1&&hostile(f,c.owner)){if(o.kind==='assault'){const co=armiesNear(f,ci,2,x=>x.id!==a.id&&!x.siege&&x.mp>0).map(x=>x.id);await attackCity([a.id,...co],o.id,'assault')}else await attackCity([a.id],o.id,'siege')}}
    return}
  // 无可攻之敌：若身处山林险要且敌军将至，设伏以待
  a.goal=null;if(!inCity(a)&&S.fac[f].gold>600&&rnd()<0.3&&canBuildFort(a,'camp').ok&&Object.values(S.armies).some(e=>hostile(f,e.f)&&!inCity(e)&&knows(f,e)&&tDist(aTile(e),here)<=8)){buildFort(a,'camp');return}
  if(canAmbush(a)&&rnd()<0.5){const foe=Object.values(S.armies).filter(e=>hostile(f,e.f)&&!inCity(e)&&knows(f,e)&&tDist(aTile(e),here)<=8);if(foe.length&&foe.some(e=>armyPow(e)>=my*0.7)){setAmbush(a);return}}
  // 否则择受威胁之己城驻守
  let best=null,bs=-1e9;
  for(const c of citiesOf(f)){const ci=GR.cityTile[c.id];const d=ci===here?0:P.dist.get(ci);if(d===undefined)continue;const fr=isFrontier(f,c);let sc=(fr?20:0)+Math.min(40,threatAt(f,c)/(cityDefPow(c.id)+1)*20)-months(d)*6-d/full;if(inCity(a)&&a.at===c.id)sc+=fr?6:0;if(sc>bs){bs=sc;best=c}}
  if(best){const ci=GR.cityTile[best.id];if(ci!==here){const path=tracePath(P.prev,ci);if(pathNavalOK(a,path))await marchArmy(a.id,path,{noQueue:true})}return}
  const home=nearestOwnCity(f,aCity(a));if(home){const p=findPath(a,GR.cityTile[home],false,ctx);if(p&&p.length&&pathNavalOK(a,p))await marchArmy(a.id,p,{noQueue:true})}
}
function distFront(f,id){const seen={[id]:0};let q=[id];let d=0;while(q.length&&d<8){const nq=[];for(const x of q){if(isFrontier(f,S.cities[x]))return d;for(const n of nb(x))if(seen[n]===undefined&&S.cities[n].owner===f){seen[n]=d+1;nq.push(n)}}q=nq;d++}return 9}

function aiDiplomacy(f){const me=facPow(f);const ag=S.fac[f].aggr||0.7;const hasT=citiesOf(f).some(c=>nb(c.id).some(n=>{const o=S.cities[n].owner;return o!==f&&attackStatus(f,o)==='ok'}));
  for(const o of Object.values(S.fac)){if(!o.alive||o.id===f)continue;const r=rel(f,o.id);const adj=citiesOf(f).some(c=>nb(c.id).some(n=>S.cities[n].owner===o.id));
    if(o.major){const them=facPow(o.id);

      else if(r.st==='peace'&&adj&&((me>them*1.7&&r.v<25&&rnd()<0.025*ag)||(!hasT&&me>them*1.05&&rnd()<0.07*ag))&&!(o.id===S.player&&S.turn<9)){declareWar(f,o.id)}
      else if(r.st==='ally'&&adj&&!hasT&&me>them*1.4&&S.turn>24&&rnd()<0.013&&!kinLocked(f,o.id)){declareWar(f,o.id)}
      else if(r.st==='peace'&&r.v>=55&&commonEnemy(f,o.id)&&rnd()<0.04){if(o.id===S.player){S.pendingProps=(S.pendingProps||[]);S.pendingProps.push({type:'ally',from:f})}else doAlly(f,o.id)}

  const has=Object.values(S.gens).some(x=>x.f==='free'&&!x.dead&&x.home===c.id&&x.appear<=S.year&&!x.loc);if(has||rnd()<0.05)doSearch(c.id,g.id)})}

function aiMinor(f){const Fa=S.fac[f];Fa.gold+=f==='rebel'?20:8;
  citiesOf(f).forEach(c=>{const target=Math.min(6000,c.pass?5000:c.pop*110);let need=target-sumT(c.gar);let guard=4;const pool=(c.loc&&c.loc.length?c.loc.filter(t=>unitAvail(f,c,t)):[]).concat(['dao','qiang','gong']);

async function aiMinorSally(f){for(const c of citiesOf(f)){const bs=besiegers(c.id).filter(b=>b.f!==f&&tDist(aTile(b),GR.cityTile[c.id])<=1);if(!bs.length)continue;const b=bs[0];const mine=sidePow(c.gar,gensInCity(c.id,f).map(g=>g.id));if(mine>=armyPow(b)*1.25)await attackArmy([],b.id,c.id)}}

  const majors=Object.values(S.fac).filter(x=>x.major&&x.alive&&x.id!==S.player).map(x=>x.id);

// ================= 细作（间谍）：侦察、煽动、焚粮、流言、行刺 =================
const AG_MP=16,AG_COST=120,AG_NAMES='甲乙丙丁戊己庚辛壬癸';
const AG_ACTS={
  incite:{n:'煽动民变',tgt:'city',desc:'城中民心大降，民心极低时或致民变'},
  burn:{n:'纵火焚粮',tgt:'city',desc:'焚其粮草，驻军折损，营建延误'},
  rumor:{n:'散布流言',tgt:'army',desc:'敌军士气大挫，下月行军力减半'},
  assassin:{n:'行刺',tgt:'both',desc:'刺杀敌将（主将或太守），失手多被擒'},
};
function agentsOf(f){return Object.values(S.agents||{}).filter(g=>g.f===f)}
function maxAgents(f){return Math.min(5,1+Math.floor(citiesOf(f).length/5))}
const agTile=g=>g.y*GW+g.x;
function recruitAgent(cid){const c=S.cities[cid];const f=c.owner;if(!S.agents)S.agents={};if(agentsOf(f).length>=maxAgents(f)||S.fac[f].gold<AG_COST)return null;S.fac[f].gold-=AG_COST;
  const n=S.nextAgent++;const i=GR.cityTile[cid];const g={id:'g'+n,f,x:i%GW,y:(i/GW)|0,mp:0,lv:1,xp:0,name:'细作·'+AG_NAMES[(n-1)%10]+(n>10?Math.ceil(n/10):'')};S.agents[g.id]=g;return g}
// 细作行动：不受控制区与军队阻挡，只是不能进入他人城池
function agentBlk(f,i){if(GR.cost[i]===Infinity)return true;const k=GR.city[i];if(k<0)return false;const o=S.cities[CITIES[k].id].owner;return o!==f&&!friendly(f,o)}
function agentReach(g){const s=agTile(g);const dist=new Map(),prev=new Map();_reset();const h=new Heap();_D[s]=0;_touched.push(s);h.push(0,s);const nb=[];const mp=g.mp+1e-6;
  while(h.size()){const u=h.pop();if(_C[u])continue;_C[u]=1;dist.set(u,_D[u]);prev.set(u,_P[u]);nbrs(u,nb);for(const v of nb){if(_C[v]||agentBlk(g.f,v))continue;const c=stepCost(u,v,false,false);if(c===Infinity)continue;const nd=_D[u]+c;if(nd>mp)continue;if(nd<_D[v]){if(_D[v]===Infinity)_touched.push(v);_D[v]=nd;_P[v]=u;h.push(nd,v)}}}
  _reset();return{s,dist,prev,agent:true}}
function agentPath(g,goal,adjacent){const s=agTile(g);const goals=new Set();if(adjacent){for(const j of nbrs(goal,[]))if(!agentBlk(g.f,j))goals.add(j)}else if(!agentBlk(g.f,goal))goals.add(goal);if(!goals.size)return null;if(goals.has(s))return[];
  _reset();const h=new Heap();_D[s]=0;_touched.push(s);h.push(0,s);const nb=[];let hit=-1;
  while(h.size()){const u=h.pop();if(_C[u])continue;_C[u]=1;if(goals.has(u)){hit=u;break}nbrs(u,nb);for(const v of nb){if(_C[v]||agentBlk(g.f,v))continue;const c=stepCost(u,v,false,false);if(c===Infinity)continue;const nd=_D[u]+c;if(nd>800)continue;if(nd<_D[v]){if(_D[v]===Infinity)_touched.push(v);_D[v]=nd;_P[v]=u;h.push(nd+Math.max(0,octile(v,goal)-1),v)}}}
  if(hit<0){_reset();return null}const p=[];for(let x=hit;x!==s;x=_P[x])p.push(x);p.reverse();_reset();return p}
function agentTurns(g,path){let mp=g.mp,turn=0,prev=agTile(g);const out=[];for(const i of path){const c=stepCost(prev,i,false,false);if(c===Infinity)break;if(c>mp+1e-6){turn++;mp=AG_MP;if(c>mp)break}mp-=c;out.push(turn);prev=i}return out}
async function marchAgent(id,path,opt={}){const g=S.agents[id];if(!g||!path||!path.length)return;let prev=agTile(g);const trail=[prev];let k=0;
  for(;k<path.length;k++){const i=path[k];if(agentBlk(g.f,i))break;const c=stepCost(prev,i,false,false);if(c===Infinity||c>g.mp+1e-6)break;g.mp-=c;prev=i;trail.push(i)}
  g.x=prev%GW;g.y=(prev/GW)|0;g.dest=(k<path.length&&!opt.noQueue)?path[path.length-1]:null;scoutAmbush(g);if(trail.length>1)await HOOK.animPath(id,trail,true)}
// 侦察：三格之内的伏兵现形
function scoutAmbush(g){for(const a of Object.values(S.armies)){if(a.ambush&&a.f!==g.f&&tDist(aTile(a),agTile(g))<=3){a.seen=a.seen||{};a.seen[g.f]=S.turn}}}
// 可行动之目标（一格之内）
function agentTargets(g){const i=agTile(g);const out=[];for(const c of Object.values(S.cities)){if(c.owner===g.f||friendly(g.f,c.owner))continue;if(tDist(GR.cityTile[c.id],i)<=1)out.push({t:'city',id:c.id})}
  for(const a of Object.values(S.armies)){if(a.f===g.f||friendly(g.f,a.f))continue;if(!knows(g.f,a)&&!(a.ambush&&tDist(aTile(a),i)<=3))continue;const at=inCity(a)?GR.cityTile[a.at]:aTile(a);if(tDist(at,i)<=1)out.push({t:'army',id:a.id})}return out}
function tgtGens(t){if(t.t==='army'){const a=S.armies[t.id];return a?[a.gens[0]]:[]}const c=S.cities[t.id];const gs0=gensInCity(c.id,c.owner).filter(x=>!isLordG(x));const gv=c.gov&&S.gens[c.gov];return gv&&gs0.includes(gv)?[gv.id]:gs0.slice(0,1).map(x=>x.id)}
function cityGuard(c){const gv=c.gov&&S.gens[c.gov];return (c.b.wall||0)*0.03+(gv&&!gv.dead?Math.max(0,gs(gv)[2]-50)/300:0)}
function agentChance(g,act,t,lv){lv=lv||g.lv;let p=0;
  if(act==='incite'){const c=S.cities[t.id];p=0.42+lv*0.08-cityGuard(c)+(c.mx<40?0.08:0)}
  else if(act==='burn'){const c=S.cities[t.id];p=0.38+lv*0.08-cityGuard(c)}
  else if(act==='rumor'){const a=S.armies[t.id];const L=a&&S.gens[a.gens[0]];p=0.48+lv*0.08-(L?Math.max(0,gs(L)[2]-50)/250:0)}
  else if(act==='assassin'){const gid=tgtGens(t)[0];if(!gid)return 0;const x=S.gens[gid];p=0.1+lv*0.06-Math.max(0,gs(x)[1]-50)/280-(isLordG(x)?0.08:0)-(t.t==='city'?cityGuard(S.cities[t.id]):0)}
  return clamp(p,0.03,0.9)}
function actOK(act,t){const A=AG_ACTS[act];return A.tgt==='both'||A.tgt===t.t}
// 行动效果（细作与电脑暗中行事共用）
function applySpy(act,t,f,lv){const tf=t.t==='city'?S.cities[t.id].owner:S.armies[t.id].f;let msg='';
  if(act==='incite'){const c=S.cities[t.id];const d=12+lv*4;c.mx=Math.max(0,c.mx-d);msg=`${c.name}流言四起，民心 -${d}`;
    if(c.mx<20&&S.fac[c.owner].capital!==c.id&&isMajor(c.owner)&&rnd()<0.3){const old=c.owner;c.owner='rebel';c.mx=50;for(const k in c.gar)c.gar[k]=Math.floor(c.gar[k]*0.5);c.gar.dao=(c.gar.dao||0)+Math.round(c.pop*50);gensInCity(c.id,old).forEach(x=>flee(x.id));evictArmies(c.id,old);msg+=`，乱民据城自立！`}}
  else if(act==='burn'){const c=S.cities[t.id];const F0=S.fac[c.owner];const lost=Math.min(800,Math.round(F0.grain*(0.08+lv*0.03)));F0.grain-=lost;for(const k in c.gar)c.gar[k]=Math.floor(c.gar[k]*0.94);if(c.build)c.build.left+=2;msg=`${c.name}粮仓火起，焚粮 ${lost}`}
  else if(act==='rumor'){const a=S.armies[t.id];const d=15+lv*5;a.morale=Math.max(10,a.morale-d);a.slow=1;msg=`${gName(a.gens[0])}军中流言纷纷，士气 -${d}`}
  else if(act==='assassin'){const gid=tgtGens(t)[0];const x=S.gens[gid];msg=`${x.name} 遇刺身亡`;killGen(gid,'遇刺身亡')}
  if(isMajor(tf)){const r=rel(f,tf);r.v=Math.max(-100,r.v-(r.st==='war'?3:10))}return msg}
function doAgentAct(id,act,t){const g=S.agents[id];if(!g||g.mp<=0||!actOK(act,t))return null;const p=agentChance(g,act,t);g.mp=0;const tf=t.t==='city'?S.cities[t.id].owner:S.armies[t.id].f;
  if(rnd()<p){const msg=applySpy(act,t,g.f,g.lv);g.xp++;const up=g.lv<3&&g.xp>=(g.lv===1?2:5);if(up)g.lv++;addLog(`${g.name}：${msg}。`);return{ok:true,msg:msg+(up?`（${g.name}升为${['','','老练','精锐'][g.lv]}细作）`:'')}}
  const caught=rnd()<(act==='assassin'?0.6:0.35);if(caught){delete S.agents[id];if(isMajor(tf)){const r=rel(g.f,tf);r.v=Math.max(-100,r.v-15)}}const msg=`${AG_ACTS[act].n}未成${caught?'，细作被擒':'，细作脱身'}`;addLog(`${g.name}：${msg}。`);return{ok:false,caught,msg}}
function agentUpkeep(){for(const g of Object.values(S.agents||{})){if(!S.fac[g.f]||!S.fac[g.f].alive){delete S.agents[g.id];continue}g.mp=AG_MP;S.fac[g.f].gold=Math.max(0,S.fac[g.f].gold-5);const k=GR.reg[agTile(g)];const o=k>=0?S.cities[CITIES[k].id].owner:null;
    if(o&&hostile(g.f,o)&&rnd()<0.03){delete S.agents[g.id];addLog(`${g.name}在${CITIES[k].name}境内行踪败露，为${S.fac[o].name}军所擒。`);continue}scoutAmbush(g)}}
async function continueAgents(f){for(const g of agentsOf(f)){if(!g.dest||g.mp<=0)continue;if(agTile(g)===g.dest){g.dest=null;continue}const p=agentPath(g,g.dest,false);if(!p||!p.length){g.dest=null;continue}await marchAgent(g.id,p);if(agTile(g)===g.dest)g.dest=null}}
// 电脑暗遣细作：扰敌前线城池
function aiSpy(f){const F0=S.fac[f];if(F0.gold<400||rnd()>0.08)return;const cands=[];for(const c of citiesOf(f))for(const n of nb(c.id)){const o=S.cities[n];if(o.owner!==f&&isMajor(o.owner)&&rel(f,o.owner).st==='war')cands.push(o)}if(!cands.length)return;

// ================= 野外营建：瞭望塔、营寨、筑新城 =================
const FORT_DEF={
  tower:{n:'瞭望塔',cost:80,up:2,vis:7,mp:0.3,desc:'视野七格，能看破三格内的伏兵'},
  camp:{n:'营寨',cost:150,up:5,vis:5,mp:0.6,desc:'驻寨之军守御大增；寨旁两格内补给如在境内、士气恢复'},

const TOWN_NAMES=['安平','永宁','定远','镇北','靖安','宁远','长宁','新安','怀远','宣威','平朔','威远','抚夷','广信','昭武','建威','安乐','永昌','临津','望江','清源','武安','兴平','太和'];
const fortAt=i=>Object.values(S.forts||{}).find(ft=>ft.i===i)||null;
const fortsOf=f=>Object.values(S.forts||{}).filter(ft=>ft.f===f);
function fortName(ft){return ft.kind==='site'?(ft.name+'（筑城中）'):(nearCityName(ft.i)+FORT_DEF[ft.kind].n)}
function fortLimit(f,kind){const n=citiesOf(f).length;return kind==='tower'?Math.min(8,3+Math.floor(n/4)):kind==='camp'?Math.min(6,2+Math.floor(n/5)):1}
// 能否在军团所在之格营建
function canBuildFort(a,kind){const D=FORT_DEF[kind];const f=a.f;const i=aTile(a);const F0=S.fac[f];
  if(inCity(a)||a.siege)return{why:'须在野外'};if(isWaterT(i)||GR.city[i]>=0||(GR.fl[i]&(FL_FORD|FL_FERRY)))return{why:'此处不宜营建'};
  if(fortAt(i))return{why:'此处已有营建'};if(Object.values(S.forts||{}).some(ft=>ft.i!==i&&tDist(ft.i,i)<=1))return{why:'紧邻他处营建'};
  if(a.mp<armyMP(a)*D.mp-1e-6)return{why:`需尚余${Math.round(D.mp*100)}%行军力`};
  if(fortsOf(f).filter(x=>x.kind===kind).length>=fortLimit(f,kind))return{why:`${D.n}已达上限`};
  if(F0.gold<(D.cost||0))return{why:'金钱不足'};if(D.grain&&F0.grain<D.grain)return{why:'粮草不足'};
  if(kind==='site'){if(GR.ter[i]===T_MTN||GR.ter[i]===T_MARSH||GR.ter[i]===T_PLAT)return{why:'山岭沼泽不能筑城'};if(GR.passZone[i]>=0)return{why:'关隘左近不能筑城'};

const actName=a=>a.startsWith('sk:')?DUEL_SK[a.slice(3)].n:a==='flee'?'退走':DUEL_ACTS[a]?DUEL_ACTS[a].n:a;
// 结算一回合；返回文字
function duelRound(D,actA,actB){D.r++;const S2={a:D.a,b:D.b};const act={a:actA,b:actB};const L=[];const eff={};const nm=k=>S2[k].g.name;const op=k=>k==='a'?'b':'a';
  for(const k of['a','b']){const s=S2[k];if(s.confuse>0){s.confuse--;act[k]=pick(['heavy','quick','guard']);L.push(`${nm(k)}心神大乱，胡乱${actName(act[k])}。`)}

  // 招式归类
  for(const k of['a','b']){const a=act[k];eff[k]=a==='flee'?'none':a.startsWith('sk:')?a.slice(3):a;if(eff[k]==='tuodao')eff[k]='feint';if(eff[k]==='luoyi')eff[k]='heavy';if(eff[k]==='nuhou')eff[k]='none'}
  for(const k of['a','b']){const s=S2[k],o=S2[op(k)];const a=act[k];
    if(a==='flee')L.push(`${nm(k)}欲走，被${nm(op(k))}缠住！`);

    if(a==='sk:luoyi'){s.luoyi=4;L.push(`${nm(k)}卸甲赤膊，挺刀直取${nm(op(k))}！`)}
    if(a==='sk:nuhou'){o.qi=0;o.confuse=1;o.hp=Math.max(0,o.hp-4);L.push(`${nm(k)}圆睁环眼，大喝一声，${nm(op(k))}心惊胆裂！`)}
    if(a==='sk:tuodao')L.push(`${nm(k)}佯作不敌，拖刀而走……`);
    if(a==='sk:anjian')L.push(`${nm(k)}取弓搭箭，觑定${nm(op(k))}一箭射去！`);
    if(a==='sk:huima')L.push(`${nm(k)}拨马便走，忽回身一枪！`);
    if(a==='sk:kuangzhan')L.push(`${nm(k)}刀势如风，连环斩出！`);

    if(e==='heavy'&&GUARDS.includes(oe))return `${nm(k)}力劈而下，震开${nm(op(k))}的兵器！`;if(e==='heavy'&&oe==='quick')return '';

// 电脑出招
function duelAI(D,k){const me=D[k],op=D[k==='a'?'b':'a'];const z=me.g.z||50;

function duelAuto(A,B,o={}){const D=duelNew(A,B,o);const seq=[];const lines=[];while(!D.end){const L=duelRound(D,duelAI(D,'a'),duelAI(D,'b'));lines.push(...L);seq.push([D.r,D.lastAct?(D.lastAct.da>=D.lastAct.db?'a':'b'):'a',D.lastAct&&D.lastAct.da>=D.lastAct.db?D.b.hp:D.a.hp,D.a.hp,D.b.hp])}const res=duelFinish(D,o);res.seq=seq;res.lines=lines;return res}

function makePlan(a,goal,quiet){if(!a||!goal)return null;if(goal.t==='agent')return null;const ctx=ctxFor(a);const s=aTile(a);let dest=null,adj=false,target=null;
  if(goal.t==='army'){const t=S.armies[goal.id];if(!t||t.f===a.f)return null;if(inCity(t))return makePlan(a,{t:'city',id:t.at},quiet);dest=aTile(t);adj=true;if(attackStatus(a.f,t.f)!=='no'&&(!isWaterT(dest)||ctx.sail))target=goal}

function makeAgentPlan(g,goal){if(!g||!goal)return null;let dest,adj=false;if(goal.t==='tile'){dest=goal.i;if(dest===agTile(g))return null;if(agentBlk(g.f,dest))return{bad:GR.cost[dest]===Infinity?'impassable':'blocked',goal,aid:g.id,agent:true}}

function helpModal(){modal('玩法说明',`<p><b>目标：</b>扫平天下群雄。全国 145 处据点（136 城关 + 9 处化外之地）、十九路诸侯，据点与势力对齐柱子三国 1.9。其余诸侯尽数覆灭即一统天下。</p>
 <p><b>回合：</b>每回合一个月。你行动后点「结束回合」，诸侯依次行动，随后结算收入、粮草、建设与事件。八月秋收，粮草大增。</p>
 <p><b>舆图：</b>山岭、大江、湖海不可通行；平原、丘陵、山林、沼泽行军快慢不同，官道最快。秦岭、巴蜀群山只能走谷道栈道。细虚线为郡界，粗线为势力边界。黄河、长江、淮水只能从「渡」口过江。</p>
 <p><b>行军：</b>选中军团后，<span style="color:#2a6e3c">绿色区域</span>为本月可达之地，大军可停驻其中任何一处。点目标显示路线（圆点数字为第几个月的落脚处），<b>再点一次</b>即确认；远处目标会逐月自动续行。步兵每月行军力 12，全骑兵 16，良马 +3。官道每格 1，平原 2，丘陵、山林 3，沼泽 4。</p>
 <p><b>控制区：</b>敌军与敌城周围一格为控制区（<span style="color:#b8782a">橙色</span>），踏入即止步。<b>雄关</b>扼守谷道，关前关后只有一条路，不破关则过不去；隘口是城防较高的要塞。</p>
 <p><b>接敌：</b>点敌军即进军迎击，两格之内的友军自动来援，敌方亦然；败军向后退却。点敌城行至城下后可强攻或围城；围城使守军每月折损，久困则开城投降。野战地形取自交战之处（河畔即为桥头、渡口之战）。</p>
 <p><b>城池：</b>建设（农田、市集、城墙、兵营、马厩、水寨）、募兵、税率、任命太守、搜索人才、赈济。兵营与马厩等级决定可募的精锐兵种与每月募兵数。</p>
 <p><b>兵种：</b>通用兵种按地域冠名；各势力另有特色兵种（青州兵、虎豹骑、陷阵营、大戟士、白马义从、西凉铁骑、藤甲兵、象兵……），占领特定城池还可招募本地兵源。</p>
 <p><b>舟师：</b>临江之城可建「水寨」、造走舸 / 蒙冲 / 斗舰 / 楼船。军中战船足以载兵（每千战船载三千步骑）即可行船：沿长江、黄河、淮水、湖泊与近海航行，登船、登岸各耗行军力 3（经己方城池不耗）。只带战船的军团即是舰队，可「合军」载上步骑，抵岸后再「分兵」。步军从渡口过大江，十格内敌城有战船五百以上会出而截击；舟师驶近敌方水寨三格之内亦会遭遇拦截。江上相遇为水战，舟师攻岸上之敌为抢滩登陆。</p>
 <p><b>战争迷雾：</b>只能看见己方领地、城池周围五格、军团周围四格（骑兵五格）、细作周围六格之内的敌军；远处敌城兵力未明。菜单中可关闭迷雾。</p>
 <p><b>伏击：</b>军团在山林、丘陵、沼泽或栈道上，且尚余三成行军力时可「设伏」。伏兵不为敌军所见，敌军行至一格之内即遭伏击：伏兵先发制人、敌军士气大挫。敌将智谋高者可能识破；细作能看破三格内的伏兵。电脑也会设伏。</p>
 <p><b>营建：</b>军团行至野外，可就地「建瞭望塔」（金 80，视野七格、看破三格内伏兵）、「立营寨」（金 150，驻寨之军守御大增，寨旁两格内补给如在境内、士气恢复），或「筑新城」（金 600、粮 400，留步骑一千屯戍，须在己方疆域或荒野、距诸城五格以外，三个月筑成）。营建每月耗金少许；敌军踏入无人把守的营建即将其焚毁。新城与诸城无异，可募兵、营建、征税，会重新划分郡界并修官道连通邻城。</p>
 <p><b>细作：</b>在城中「遣细作」（金 120，每五城多一名）。细作不受控制区阻挡，可深入敌境侦察；行至敌城、敌军旁一格可「煽动民变」「纵火焚粮」「散布流言」「行刺」，每月一次，成功率看细作等级与对方守备（城墙、太守智力、敌将武力）。失手可能被擒；成功积累功绩可升为老练、精锐细作。诸侯也会暗遣细作扰乱你的城池。</p>
 <p><b>历史事件：</b>陶谦三让徐州、孙策以玺借兵、傕汜相攻、天子东归、袁术称帝等依时触发；诸将到了年纪会在本势力登场，在野贤才可搜索延揽。</p>
 <p><b>战斗：</b>兵种相克（枪克骑、骑克弓、弓善守城），主将统率影响全军，智将可能施计。败军之将可能被俘，可劝降、释放或斩首。</p>
 <p><b>单挑：</b>两军阵前遇敌将搦战，可「亲自单挑」：每回合出一招——猛攻破格挡、格挡反快攻、快攻抢猛攻；每回合攒「气」，胜一招多得一点，可施展武将绝技（拖刀计、回马枪、暗箭、怒喝、无双、龙胆、裸衣、狂斩、振奋……名将各有所长）。十二回合不分胜负则各自收兵；打落敌将可斩、可擒、可放；力不能支可「退走」。武将页面可「演武」与部将切磋（每月一次），历练武力。</p>
 <p><b>战场单挑与武将出阵：</b>亲自指挥的即时会战中，选中带将部队点「出阵」（Q），武将便单骑驰骋战场：点敌军冲杀，砍杀士卒、震慑敌阵，另有两个英雄技（横扫、突阵、虎吼、铁骨、百步穿杨、万夫莫敌）；血少时点「归队」（B）回本部。两将相近点「单挑」（G），二将就在战场上划圈实时对打，周围士卒让开，战事照常进行：快攻可打断敌将蓄力，猛攻破格挡，格挡起手瞬间为招架，闪避躲开一切；攒「气」施展绝技。可「托付」给将军自决，或「退走」。</p>
 <p><b>将技：</b>即时会战中，武将所领之部有专属将技：突击、奔袭、火计、乱敌、铁壁、箭雨（诸葛亮、周瑜善火计，关张吕布善突击，赵云马超善奔袭……）。选中部队点「将技」按钮（电脑按 T）施展，有冷却时间；敌将亦会施展。武将页面可查看其绝技与将技。</p>
 ${typeof MZB!=='undefined'?'<p><b>亲自指挥：</b>凡我军参与的攻城、守城、野战、水战，都可选择「亲自指挥」进入水墨即时会战。战中可「速决」交给众将推演，或「撤退」。标题页「会战演习」可单独练习。</p>':''}
 <p><b>人物：</b>武将立功得功勋，可「封官」，官职越高统兵越多、越忠诚，但每月要发俸禄。年轻武将逐年成长。忠诚低于 30 的武将可能出走、投敌；敌城页面可「策反」敌将。宝库中的宝物可赏赐武将，宗室女眷可赐婚或联姻（四年内不背盟）。据城 24 座受九锡为公，40 座称王，60 座可登基称帝。</p>
 <p><b>粮草：</b>兵马每月耗粮，出境在外耗粮更多。粮尽则士卒逃散。</p>
 <p><b>操作：</b>电脑：左键选择、再点确认、右键直接下令、悬停预览路线、滚轮缩放、拖动平移、回车结束回合、Esc 取消。手机：点选、再点确认、双指缩放、拖动平移，下方抽屉可上下展开。</p>`,null)}
async function endScreen(e){await modal(e==='win'?'天下归心':'兵败国亡',e==='win'?`<p>${dateStr()}，${S.fac[S.player].name}军扫平群雄，一统天下！</p><p>共历 ${S.turn} 个月，据城 ${citiesOf(S.player).length} 座。</p>`:`<p>${S.fac[S.player].name}军失去了最后的城池……</p>`,[{label:'返回标题',value:1,cls:'red'}],{stamp:e==='win'?'胜':'败'});show('title');S=null;buildTitle()}

HOOK.fight=async(A,D,o,meta)=>{if(typeof MZB==='undefined')return null;let mode=UI.fightMode;UI.fightMode=null;
  if(!mode){const me=S.player;const att=A.f===me;const foe=att?D:A;const c=meta.cid?S.cities[meta.cid]:null;const place=c?c.name:(meta.place||'');const L=foe.gens&&foe.gens[0]?S.gens[foe.gens[0]]:null;
    const r=(A.f===me?1:-1)*0+ (sidePow(att?A.tr:D.tr,att?A.gens:D.gens)/(sidePow(att?D.tr:A.tr,att?D.gens:A.gens)+0.1))*(meta.kind==='siege'?(att?1/(1+0.16*(c?c.b.wall:0)):1+0.16*(c?c.b.wall:0)):1);const[w,col]=winWord(r);
    const title=att?`${meta.title||'交战'}`:(meta.kind==='naval'?`${S.fac[A.f].name}水军来犯！`:`${S.fac[A.f].name}军来犯！`);
    const body=`<div class="ev">${L?`<img src="${portrait(L,120)}">`:''}<div><p>${att?`我军 ${fmtN(sumT(A.tr))} 对 ${S.fac[D.f].name}军 ${fmtN(sumT(D.tr))}`:`${S.fac[A.f].name}军${L?'（'+L.name+'）':''} ${fmtN(sumT(A.tr))} ${meta.kind==='siege'?'强攻':'袭击'}${place}${meta.kind==='field'&&!c?'一带':''}，我军 ${fmtN(sumT(D.tr))}${meta.kind==='siege'?'据城而守':''}。`}</p>${meta.kind==='field'&&meta.terr?`<p><small>战场地形：${({plain:'平原',hills:'丘陵',forest:'山林',river:'河畔'})[meta.terr]||''}${meta.reinA||meta.reinD?` · 援军 ${meta.reinA||0} : ${meta.reinD||0}`:''}</small></p>`:''}<p>胜算：<b style="color:${col}">${w}</b></p><p class="hint">亲自指挥将进入即时${meta.kind==='siege'?'攻城':meta.kind==='naval'?'水':'会'}战；自动结算则按兵力推演。${meta.kind==='naval'?'水战只计战船兵力，北军不习水战。':''}</p></div></div>`;
    mode=await modal(title,body,[{label:'亲自指挥',value:'manual',cls:'red'},{label:'自动结算',value:'auto'}])||'auto'}
  if(mode!=='manual')return null;
  const busy=$('#busy');const bd=busy.style.display;busy.style.display='none';
  let res=null;try{res=await MZB.fight(A,D,o,meta)}catch(e){console.error(e);toast('战场出错，改为自动结算');res=null}
  busy.style.display=bd;show('game');if(UI.mapReady){mapResize();mapDraw()}refreshAll();return res};
HOOK.duel=async(ca,cd,side,meta)=>{const my=side==='a'?ca:cd,foe=side==='a'?cd:ca;const G=S.gens[my],F=S.gens[foe];const sk=g=>duelSkills(genDuelDesc(g.id)).map(k=>DUEL_SK[k].n).join('、');
  const v=await modal('阵前单挑',`<div class="ev"><img src="${portrait(F,120)}"><div><p>两军阵前，${S.fac[F.f].name}军 <b>${F.name}</b> 拍马而出，大叫：「${G.name}，敢与我决一死战否！」</p><p>${G.name} 武力 <b>${gs(G)[1]}</b>（${sk(G)}）<br>${F.name} 武力 <b>${gs(F)[1]}</b>（${sk(F)}）</p><p class="hint">亲自单挑：每回合出一招——猛攻破格挡、格挡反快攻、快攻抢猛攻；攒足「气」可施展绝技。避战则我军士气受挫。</p></div></div>`,[{label:'亲自单挑',value:'live',cls:'red'},{label:'交由将军',value:'auto'},{label:'避战',value:'no'}]);
  if(v==='no')return{declined:side};const A=genDuelDesc(ca),B=genDuelDesc(cd);
  if(v==='live')return await duelLive(A,B,{me:side,capture:true,colors:{a:S.fac[S.gens[ca].f].color,b:S.fac[S.gens[cd].f].color},title:(meta&&meta.title?meta.title+' · ':'')+'阵前单挑'});
  return duelAuto(A,B,{capture:true})};
HOOK.report=async r=>{const me=S.player;if(r.a.f!==me&&r.d.f!==me){return}const win=(r.win==='A'&&r.a.f===me)||(r.win==='D'&&r.d.f===me);
  const side=s=>{const L=s.lead?S.gens[s.lead]:null;return `<div class="side">${L?`<img src="${portrait(L,48)}">`:''}<div>${seal(s.f,20)} <b>${S.fac[s.f].name}军</b><br><small>${L?'主将 '+L.name:'无将'}<br>${fmtN(s.init)} → ${fmtN(sumT(s.tr))}　损 ${fmtN(sumT(s.loss))}</small></div></div>`};
  const fates=[];if(r.fate.killed.length)fates.push('阵亡：'+r.fate.killed.map(gName).join('、'));if(r.fate.captured.length)fates.push('被俘：'+r.fate.captured.map(gName).join('、'));
  await modal(`【${dateStr()}】${r.title||'交战'}`,`<div class="report"><div class="sides">${side(r.a)}${side(r.d)}</div><div class="lines">${r.rep.map(l=>`<p>${esc(l)}</p>`).join('')}</div>${fates.length?`<div class="hint">${fates.join('<br>')}</div>`:''}</div>`,[{label:'知道了',value:1,cls:'red'}],{stamp:win?'捷':'败'});refreshAll()};
HOOK.captives=async(list,f)=>{for(const c of list.slice()){const g=S.gens[c.id];const p=persuadeP(c.id,f);
  const flav=g.id==='lvbu'?'<p style="color:var(--seal)">白门楼下，吕布大呼：「明公所患，不过于布；今已服矣。令布将骑，明公将步，天下不足定也！」左右或言：「公不见丁建阳、董卓之事乎？」</p>':g.id==='guanyu'?'<p style="color:var(--seal)">关羽约三事：降汉不降曹；二嫂俸禄；但知兄长下落，便当辞去。</p>':'';
  const v=await modal(`俘获 ${g.name}`,`${flav}<div class="ev"><img src="${portrait(g,120)}"><div class="grow"><p>${seal(g.f,20)} ${S.fac[g.f]?S.fac[g.f].name+'军':''}　忠诚 ${g.loy}${g.traits.length?'　'+g.traits.join('、'):''}</p><div class="statbars">${statBars(g)}</div><p style="margin-top:8px">劝降成功率约 <b>${Math.round(p*100)}%</b>（失败则释放）</p></div></div>`,

function pickModal(title,rows,hint){return modal(title,`${hint?`<p class="hint">${hint}</p>`:''}${rows.length?rows.map((r,i)=>`<div class="lrow">${r.html}<button class="sm red" data-pk="${i}" ${r.dis?'disabled':''}>${r.btn||'选择'}</button></div>`).join(''):'<p>无可选。</p>'}`,[{label:'取消',value:null}],{onOpen:(m,close)=>m.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>close(rows[+b.dataset.pk].id))})}
function genModal(g){const mine=g.f===S.player;const F0=S.fac[g.f];const where=g.loc?(g.loc.t==='a'?(S.armies[g.loc.id]?'军团（'+armyWhere(S.armies[g.loc.id])+'）':'军中'):S.cities[g.loc.id].name):(g.captive?'被俘':'在野');
  const rk=rankName(g);const nx=RANKS[(g.rank||0)+1];const lord=isLordG(g);const young=g.pk&&g.pk.some((v,i)=>v>g.s[i]);
  const acts=[];if(mine&&!lord){acts.push(`<button data-g="promote" ${canPromote(g)?'':'disabled'}>封官${nx?' · 金'+promoteCost(g):''}</button>`);acts.push(`<button data-g="reward" ${F0.gold<100?'disabled':''}>赏金 100</button>`);
    acts.push(`<button data-g="item" ${F0.items.length?'':'disabled'}>赐宝物（${F0.items.length}）</button>`);acts.push(`<button data-g="wed" ${womenOf(g.f).length&&!g.kin?'':'disabled'}>赐婚</button>`)}
  if(mine&&!g.captive)acts.push(`<button data-g="spar" ${g.spar===S.turn?'disabled':''}>演武单挑${g.spar===S.turn?'（本月已演）':''}</button>`);
  const body=`<div class="ev"><img src="${portrait(g,120)}"><div class="grow"><p style="margin:0 0 6px">${seal(g.f,20)} ${F0?F0.name+'军':'在野'}　${age(g)} 岁${g.f!=='free'?`　忠诚 <b>${Math.round(g.loy)}</b>${loyArrow(g)}`:''}${g.kin?' <span class="badge b-ally">姻亲</span>':''}${g.turn?' <small>（降将）</small>':''}<br>
     <small>${rk?'<b>'+rk+'</b> · ':''}所在：${where}</small><br><small>功勋 ${Math.round(g.merit||0)}${nx&&!lord&&g.f!=='free'?`（晋${isCivil(g)?nx.c:(g.rank===5?'四征将军':nx.w)}需 ${nx.m}${nx.max?'，限 '+nx.max+' 人':''}${nx.need?'，需君主称公':''}）`:''}</small></p>
     <div class="statbars">${statBars(g)}</div>${young?'<div class="hint" style="margin-top:4px">浅色刻度为潜力：年轻武将逐年成长，征战、施计、治城亦可历练提升。</div>':''}</div></div>
   ${acts.length?`<div class="acts" style="grid-template-columns:repeat(2,1fr)">${acts.join('')}</div>`:''}
   ${(()=>{const D=genDuelDesc(g.id);const bk=battleSkill(D,false);return `<div class="sec">绝技</div><div style="font-size:13px">${duelSkills(D).map(k=>`<b>${DUEL_SK[k].n}</b>（单挑·气${DUEL_SK[k].cost}）：${DUEL_SK[k].d}`).join('<br>')}${bk?`<br><b>${BSK[bk].n}</b>（会战将技）：${BSK[bk].d}`:''}</div>`})()}
   ${g.traits.length?`<div class="sec">特性</div>${g.traits.map(t=>`<div style="font-size:13px"><b>${t}</b>：${TRAITS[t]||''}</div>`).join('')}`:''}
   ${g.items.length?`<div class="sec">宝物</div>${g.items.map(i=>`<div class="lrow" style="font-size:13px"><div class="grow">${itemLine(i)}</div>${mine&&!lord?`<button class="sm" data-take="${i}">收回</button>`:''}</div>`).join('')}`:''}
   ${mine&&g.loc&&g.loc.t==='c'?`<div class="sec">调任</div><div class="row"><select id="tr_to">${citiesOf(S.player).filter(c=>c.id!==g.loc.id).map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><button class="sm" id="tr_go" ${g.moved?'disabled':''}>调往</button></div>`:''}`;
  modal(`${g.name}`,body,[{label:'关闭',value:0}],{onOpen:(m,close)=>{const re=()=>{close(1);refreshAll();setTimeout(()=>genModal(g),30)};
    const b=m.querySelector('#tr_go');if(b)b.onclick=()=>{if(doTransfer(g.id,m.querySelector('#tr_to').value)){toast(`${g.name}调任完成`);close(1);refreshAll()}};
    m.querySelectorAll('[data-take]').forEach(x=>x.onclick=()=>{if(takeItem(g.id,x.dataset.take)){toast('宝物收回宝库，忠诚 -12');re()}});
    m.querySelectorAll('[data-g]').forEach(x=>x.onclick=async()=>{const k=x.dataset.g;
      if(k==='promote'){if(promote(g)){toast(`${g.name} 升任${rankName(g)}`);re()}}
      else if(k==='spar'){close(1);const pool=gensOf(g.f).filter(x=>x.id!==g.id&&!x.captive);const oid=await pickModal(`${g.name} 演武`,pool.sort((a,b)=>gs(b)[1]-gs(a)[1]).slice(0,30).map(x=>({id:x.id,html:`<div class="grow"><b>${x.name}</b> <small>武力 ${gs(x)[1]}</small></div>`,btn:'过招'})),'点到为止，不伤性命。胜者武力历练，败者亦有所得。');
        if(oid){g.spar=S.turn;const o2=S.gens[oid];const r=await duelLive(genDuelDesc(g.id),genDuelDesc(oid),{me:'a',spar:true,title:'校场演武'});const W=r.win==='a'?g:r.win==='b'?o2:null;

      else if(k==='reward'){if(doReward(g.id)){toast(`${g.name}忠诚 +10`);re()}}
      else if(k==='item'){close(1);const it=await pickModal(`赐 ${g.name} 宝物`,F0.items.map(i=>({id:i,html:`<div class="grow" style="font-size:13px">${itemLine(i)}</div>`,btn:'赐予'})),'赏赐宝物忠诚 +20，远胜金帛。');if(it&&giveItem(g.f,it,g.id))toast(`${g.name}拜谢，忠诚 +20`);refreshAll();setTimeout(()=>genModal(g),30)}
      else if(k==='wed'){close(1);const w=await pickModal(`为 ${g.name} 赐婚`,womenOf(g.f).map(w=>({id:w.id,html:`<div class="grow"><b>${w.name}</b> <small>${womanAge(w)} 岁</small></div>`,btn:'许配'})),'赐婚后结为姻亲：忠诚 +30，此后几乎不会叛离。');if(w&&doGrantMarriage(g.f,w,g.id))toast(`${g.name} 感恩戴德`);refreshAll();setTimeout(()=>genModal(g),30)}})}})}
function gensModal(){const list=gensOf(S.player).sort((a,b)=>(isLordG(b)-isLordG(a))||((b.rank||0)-(a.rank||0))||(gs(b).reduce((s,v)=>s+v,0)-gs(a).reduce((s,v)=>s+v,0)));
  const pend=Object.values(S.gens).filter(g=>g.pend&&g.f===S.player&&!g.dead).sort((a,b)=>a.appear-b.appear);
  modal(`麾下武将（${list.length}）`,`<div class="hint">点武将可封官、赏赐、赐宝物、赐婚。忠诚低于 30 者可能叛逃，任太守者甚至会举城投敌。俸禄每月 ${salary(S.player)} 金。</div>
   <div style="overflow-x:auto"><table class="t"><tr><th>武将</th><th>官职</th><th>统</th><th>武</th><th>智</th><th>政</th><th>魅</th><th>忠</th><th>功</th><th>所在</th></tr>${list.map(g=>{const s=gs(g);const w=g.loc?(g.loc.t==='a'?(S.armies[g.loc.id]?gName(S.armies[g.loc.id].gens[0])+'军':''):S.cities[g.loc.id].name):'';

   ${pend.length?`<div class="sec">尚未登场（年少）</div><div style="font-size:13px">${pend.map(g=>`${g.name}<small>（${g.appear}年）</small>`).join('、')}</div>`:''}`,null,{wide:true})}
function treasuryModal(){const f=S.player,F0=S.fac[f];const L=leaderGen(f);const n=citiesOf(f).length;const t=F0.title||0;
  const nextT=t<1?'据城 3 座可领州牧':t<2?`据城 24 座可受九锡进爵为公（现 ${n}）`:t<3?`据城 40 座可进位称王（现 ${n}）`:t<4?`据城 60 座可登基称帝（现 ${n}）`:'已登大宝';
  const fam=(S.family||[]).filter(w=>w.f===f);

    m.querySelectorAll('[data-wed]').forEach(b=>b.onclick=async()=>{const wid=b.dataset.wed;close(1);const gid=await pickModal('赐婚',gensOf(f).filter(g=>!isLordG(g)&&!g.kin).sort((a,b)=>a.loy-b.loy).map(g=>({id:g.id,html:`${gchip(g,'忠'+Math.round(g.loy))}<small class="grow">${rankName(g)||''}</small>`,btn:'许配'})),'结为姻亲后忠诚 +30，几乎不会叛离。');if(gid&&doGrantMarriage(f,wid,gid))toast(`${gName(gid)} 感恩戴德`);refreshAll();setTimeout(treasuryModal,30)});
