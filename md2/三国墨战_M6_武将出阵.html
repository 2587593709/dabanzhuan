function mulberry(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(seed){ // 平滑值噪声
  const R=mulberry(seed);const P=new Float32Array(64*64);for(let i=0;i<P.length;i++)P[i]=R();
  const g=(x,y)=>P[((y&63)<<6)|(x&63)];const sm=t=>t*t*(3-2*t);
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi);const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf}}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l;t=t<0?0:t>1?1:t;const x=ax+t*dx-px,y=ay+t*dy-py;return Math.sqrt(x*x+y*y)}
function distPoly(px,py,pts){let m=1e9;for(let i=0;i<pts.length-1;i++){const d=distSeg(px,py,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);if(d<m)m=d}return m}

const TCS=16; // 地形格
const clampT=(v,a,b)=>v<a?a:v>b?b:v;
function genTerrain(spec){
  const W=spec.W,H=spec.H,R=mulberry(spec.seed||7);const nz=vnoise((spec.seed||7)+11),nz2=vnoise((spec.seed||7)+23);
  const T={W,H,cs:TCS,gw:Math.ceil(W/TCS),gh:Math.ceil(H/TCS),hills:[],forests:[],trees:[],roads:[],river:null,camp:null,tents:[],fences:[],rocks:[]};
  const type=spec.type||'plain';
  const rr=(a,b)=>a+R()*(b-a);
  // ---- 山丘 ----
  if(type==='puyang'){
    T.hills.push({x:560,y:360,r:260,a:32},{x:900,y:1380,r:220,a:22},{x:2050,y:1300,r:260,a:26},{x:1950,y:300,r:200,a:18});
    T.forests.push({x:1080,y:1330,r:150},{x:1220,y:1420,r:120},{x:330,y:1420,r:140},{x:1900,y:260,r:130},{x:2120,y:420,r:90},{x:960,y:250,r:110});
    T.roads.push([[0,820],[400,810],[800,790],[1200,800],[1500,800],[1900,805],[2400,790]],[[1500,800],[1560,1100],[1500,1600]],[[800,790],[760,500],[700,0]]);
    T.camp={x:1520,y:800,rx:230,ry:250,side:1,gates:[Math.PI,0,Math.PI/2,-Math.PI/2]};
  }else if(type==='siege'){ // 城池：城墙在 WX，城内在东
    const WX=Math.round(W*0.625);const ng=spec.pass?1:(spec.gates||1);const gates=ng>=2?[Math.round(H*0.3),Math.round(H*0.7)]:[Math.round(H/2)];
    if(spec.pass)T.valley=mkValley(W,H,WX,nz);const V=T.valley;
    const nt=V?(spec.palisade?2:3):clamp(2+(spec.wall||2),3,7);const towers=[];
    if(V){const [a0,b0]=valleyAt(T,WX);if(nt===3)towers.push(Math.round(a0+45),Math.round(b0-45),Math.round(H/2-110<a0+80?a0+80:H/2-110));else towers.push(Math.round(a0+40),Math.round(b0-40))}
    else for(let i=0;i<nt;i++){let y=Math.round(H*(i+0.5)/nt);for(const g of gates)if(Math.abs(y-g)<70)y=g+(y<g?-78:78);towers.push(clamp(y,60,H-60))}
    if(spec.river){const rx=WX-560;const pts=[];for(let i=0;i<=10;i++)pts.push([rx+Math.sin(i*0.8+R()*1.5)*50,-40+i*(H+80)/10]);T.river={pts,w:66};T.bridge={x:rx,y:H/2,w:80}}
    // 城门两侧的门楼箭楼
    const plaza={x:WX+450,y:H/2};
    T.city={WX,gates,towers,plaza,houses:[],name:spec.cityName||'',palisade:!!spec.palisade,pass:!!spec.pass};
    if(!V)for(let i=0;i<3;i++)T.hills.push({x:rr(150,WX-500),y:rr(150,H-150),r:rr(140,260),a:rr(8,20)});
    for(let i=0;i<4;i++){const x=rr(120,WX-420),y=rr(100,H-100);const r=rr(70,120);if(Math.abs(y-H/2)<160&&x>WX-800)continue;if(V){const [a0,b0]=valleyAt(T,x);if(y<a0-40||y>b0+40)continue}if(T.river&&Math.abs(x-(WX-560))<140)continue;T.forests.push({x,y,r})}
    T.roads.push([[0,H/2+rr(-60,60)],[WX*0.5,H/2+rr(-40,40)],[WX-WT-4,gates[0]]]);if(gates[1])T.roads.push([[WX*0.55,H/2],[WX-240,gates[1]],[WX-WT-4,gates[1]]]);
    for(const g of gates)T.roads.push([[WX+WT,g],[plaza.x-120,g+(plaza.y-g)*0.5],[plaza.x,plaza.y]]);
    T.roads.push([[plaza.x,plaza.y],[W,plaza.y+20]]);
    // 房屋：街坊格局，避开主街与广场
    for(let x=WX+80;x<W-30;x+=78)for(let y=46;y<H-30;y+=68){const hx=x+rr(-10,10),hy=y+rr(-8,8);
      if(hyp(hx-plaza.x,hy-plaza.y)<170)continue;if(V){const [a0,b0]=valleyAt(T,hx);if(hy<a0+24||hy>b0-24)continue}let onRoad=false;for(const rd of T.roads)if(distPoly(hx,hy,rd)<42)onRoad=true;if(onRoad)continue;
      if(R()<0.3)continue;T.city.houses.push({x:hx,y:hy,w:rr(30,50),h:rr(22,32),k:R()})}
  }else if(type==='naval'){ // 水战：江面横贯，南北两岸
    const top=new Float32Array(Math.ceil(W/TCS)),bot=new Float32Array(Math.ceil(W/TCS));
    for(let gx=0;gx<top.length;gx++){const x=(gx+0.5)*TCS;top[gx]=(spec.shoreTop||200)+(nz(x/420,4)-0.5)*110;bot[gx]=H-(spec.shoreBot||190)+(nz(x/380,17)-0.5)*110}
    T.naval={top,bot};
    if(spec.camp){T.camp={x:spec.camp.x,y:spec.camp.y,rx:spec.camp.rx||420,ry:spec.camp.ry||110,side:spec.camp.side,gates:[Math.PI/2,-Math.PI/2,0,Math.PI]}}
    for(let i=0;i<5;i++){const x=rr(100,W-100);T.hills.push({x,y:rr(20,120),r:rr(140,240),a:rr(14,30)});T.hills.push({x:rr(100,W-100),y:H-rr(20,110),r:rr(140,240),a:rr(14,30)})}
  }else{
    const nh={plain:3,hills:7,forest:4,river:3}[type]||3;
    for(let i=0;i<nh;i++)T.hills.push({x:rr(200,W-200),y:rr(150,H-150),r:rr(160,320),a:type==='hills'?rr(28,50):rr(12,26)});
    const nf={plain:4,hills:4,forest:11,river:4}[type]||4;
    for(let i=0;i<nf;i++){let x=rr(150,W-150),y=rr(120,H-120);if(Math.abs(x-W/2)<520&&type!=='forest'&&R()<0.6)x=x<W/2?x-500:x+500;
      x=Math.max(120,Math.min(W-120,x));const r=type==='forest'?rr(100,190):rr(80,150);T.forests.push({x,y,r});if(R()<0.6)T.forests.push({x:x+rr(-r,r),y:y+rr(-r,r),r:r*0.7})}
    T.roads.push([[0,H*0.5+rr(-200,200)],[W*0.3,H*0.5+rr(-150,150)],[W*0.6,H*0.5+rr(-150,150)],[W,H*0.5+rr(-200,200)]]);
    if(type==='river'){const x0=W*0.5+rr(-80,80);const pts=[];for(let i=0;i<=10;i++){pts.push([x0+Math.sin(i*0.9+R()*2)*90,-40+i*(H+80)/10])}T.river={pts,w:70}}
  }
  // ---- 格 ----
  const N=T.gw*T.gh;T.h=new Float32Array(N);T.forest=new Uint8Array(N);T.water=new Uint8Array(N);T.fort=new Int8Array(N).fill(-1);T.road=new Uint8Array(N);
  for(let gy=0;gy<T.gh;gy++)for(let gx=0;gx<T.gw;gx++){const x=(gx+0.5)*TCS,y=(gy+0.5)*TCS,i=gy*T.gw+gx;
    let h=0;for(const k of T.hills){const dx=x-k.x,dy=y-k.y;h+=k.a*Math.exp(-(dx*dx+dy*dy)/(k.r*k.r))}h+=(nz(x/180,y/180)-0.5)*6;T.h[i]=h;
    for(const f of T.forests){const dx=x-f.x,dy=y-f.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<f.r*(0.8+0.35*nz2(x/60,y/60))){T.forest[i]=1;break}}
    if(T.river){if(distPoly(x,y,T.river.pts)<T.river.w/2){T.water[i]=1;T.forest[i]=0;if(T.bridge&&Math.abs(y-T.bridge.y)<T.bridge.w/2)T.water[i]=0}}
    if(T.valley){const a0=T.valley.top[gx],b0=T.valley.bot[gx];const out=Math.max(a0-y,y-b0);if(out>-30){h+=Math.min(95,Math.max(0,out+30)*0.55);if(out>0)T.forest[i]=0}}
    if(T.naval){const a0=T.naval.top[gx],b0=T.naval.bot[gx];if(y>a0&&y<b0){T.water[i]=1;T.forest[i]=0;h=Math.min(h,0)}}
    for(const rd of T.roads)if(distPoly(x,y,rd)<14){T.road[i]=1;T.forest[i]=0}
    if(T.camp){const c=T.camp;const e=((x-c.x)/c.rx)**2+((y-c.y)/c.ry)**2;if(e<1&&!T.water[i])T.fort[i]=c.side;if(e<1.1)T.forest[i]=0}
  }
  // ---- 树（渲染用） ----
  for(const f of T.forests){const n=Math.round(f.r*f.r/900);for(let i=0;i<n;i++){const a=R()*6.283,d=Math.sqrt(R())*f.r;const x=f.x+Math.cos(a)*d,y=f.y+Math.sin(a)*d;if(tAt(T,T.forest,x,y))T.trees.push({x,y,s:0.8+R()*0.6,k:R()})}}
  T.trees.sort((a,b)=>a.y-b.y);
  // ---- 营寨 ----
  if(T.camp){const c=T.camp;const n=150;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;if(T.naval&&tAt(T,T.water,c.x+Math.cos(a)*c.rx,c.y+Math.sin(a)*c.ry))continue;let gate=false;for(const g of c.gates){let d=Math.abs(((a-g+Math.PI*3)%(Math.PI*2))-Math.PI);if(d<0.09)gate=true}
      if(!gate)T.fences.push({x:c.x+Math.cos(a)*c.rx,y:c.y+Math.sin(a)*c.ry,a})}

  // ---- 燃料（火攻格 32） ----

function tAt(T,arr,x,y){let gx=Math.floor(x/T.cs),gy=Math.floor(y/T.cs);if(gx<0||gy<0||gx>=T.gw||gy>=T.gh)return 0;return arr[gy*T.gw+gx]}

// ---------------- 建立战场 ----------------

    const side={i,fac:sd.fac,F,leader:sd.leader||F.leader,name:sd.name||F.name+'军',color:sd.color||F.color,ch:sd.ch||F.ch,attack:!!sd.attack,deploy:sd.deploy,face:sd.face||0,ai:!!sd.ai,units:[],reinf:(sd.reinf||[]).map(r=>Object.assign({done:false},r)),cmd:null,boost:0,boostT:0,home:{x:Math.cos(sd.face||0)<0?1:-1},kills:0,morMod:sd.morMod||0,aiState:{}};

function mkUnit(side,d,x,y,ang){

    x,y,ang,ord:null,run:false,hold:false,st:'ok',shock:0,mor:70,fat:0,kills:0,losses:0,fled:0,recent:[],rallies:0,routT:0,rallyT:-99,
    engaged:0,eng:0,cx:x,cy:y,moving:false,lag:0,lagN:0,cd:{volley:0,rally:0,duel:0},fireLeft:T.range?2:0,fireArrows:0,volleyN:0,volleyT:0,
    fireTgt:null,isCmd:false,genSol:null,fleeX:0,fleeY:0,foeU:null,inFire:0,boost:0,aiT:0,aiRole:null,chargeT:0,

    jx:(rnd()-0.5)*2.4,jy:(rnd()-0.5)*2.4,face:1,ph:rnd()*6,atkT:9,chg:0,alive:true,rl:rnd()*T.rl||0,am:T.ammo||0,i:0,
    hp0:T.hp,rad:T.rad||(T.role==='cav'||T.mounted?6:3.4),cav:T.role==='cav'||!!T.mounted,fx:0,fy:0,lastHit:-9,MA:0,MD:0,cdB:0,tm:1,rx:0,ry:0,rf:0,spx:0,spy:0};

// 阵形槽位
function slotLocal(u,k){const n=u.n||1;const cols=Math.max(1,Math.min(u.cols,n));const rows=Math.ceil(n/cols);const r=Math.floor(k/cols),c=k%cols;

function uWidth(u){const n=u.n||1;const cols=Math.max(1,Math.min(u.cols,n));return (cols-1)*u.sp}
function slotWorld(u,k){const [d,l]=slotLocal(u,k);const fx=Math.cos(u.ang),fy=Math.sin(u.ang);return [u.x+fx*d-fy*l,u.y+fy*d+fx*l]}

// ---------------- 空间格 ----------------
function cellOf(x,y){let gx=((x-GOX)/GC)|0,gy=((y-GOY)/GC)|0;if(gx<0)gx=0;else if(gx>=B.gw)gx=B.gw-1;if(gy<0)gy=0;else if(gy>=B.gh)gy=B.gh-1;return gy*B.gw+gx}

  B.head.fill(-1);const head=B.head,next=B.next;
  for(const u of B.units){u._sx=0;u._sy=0;u._n=0}
  for(let i=0;i<all.length;i++){const s=all[i];s.i=i;const c=cellOf(s.x,s.y);next[i]=head[c];head[c]=i;const u=s.u;u._sx+=s.x;u._sy+=s.y;u._n++}

function nearestEnemy(s,R,pref){
  const side=s.u.side,x=s.x,y=s.y;const R2=R*R;const gx0=Math.max(0,((x-R-GOX)/GC)|0),gx1=Math.min(B.gw-1,((x+R-GOX)/GC)|0),gy0=Math.max(0,((y-R-GOY)/GC)|0),gy1=Math.min(B.gh-1,((y+R-GOY)/GC)|0);

  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){let j=head[gy*B.gw+gx];while(j>=0){const o=sol[j];if(o.alive&&o.u.side!==side&&!o.inDuel&&(!SG||canFight(s,o))){const dx=o.x-x,dy=o.y-y;let d2=dx*dx+dy*dy;if(pref&&o.u!==pref)d2*=1.7;if(o.u.st==='rout')d2*=1.3;if(d2<bd){bd=d2;best=o}}j=next[j]}}
  return best}
function anyEnemyNear(side,x,y,R){const R2=R*R;const gx0=Math.max(0,((x-R-GOX)/GC)|0),gx1=Math.min(B.gw-1,((x+R-GOX)/GC)|0),gy0=Math.max(0,((y-R-GOY)/GC)|0),gy1=Math.min(B.gh-1,((y+R-GOY)/GC)|0);
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){let j=B.head[gy*B.gw+gx];while(j>=0){const o=B.sol[j];if(o.u.side!==side&&o.u.st!=='rout'){const dx=o.x-x,dy=o.y-y;if(dx*dx+dy*dy<R2)return true}j=B.next[j]}}return false}
function solNear(x,y,R,out){let n=0;const R2=R*R;const gx0=Math.max(0,((x-R-GOX)/GC)|0),gx1=Math.min(B.gw-1,((x+R-GOX)/GC)|0),gy0=Math.max(0,((y-R-GOY)/GC)|0),gy1=Math.min(B.gh-1,((y+R-GOY)/GC)|0);
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){let j=B.head[gy*B.gw+gx];while(j>=0){const o=B.sol[j];const dx=o.x-x,dy=o.y-y;if(dx*dx+dy*dy<R2)out[n++]=o;j=B.next[j]}}return n}

// ---------------- 地形系数 ----------------
function shipMul(u){let m=1;if(u.chain)m*=0.12;const w=B.wind;m*=1+0.35*w.str*(Math.cos(u.ang)*w.x+Math.sin(u.ang)*w.y);return m}

function fatMul(u){return u.fat<50?1:u.fat<75?0.93:u.fat<90?0.84:0.72}
function uSpeed(u){const T=B.T;let v=(u.run?u.T.run:u.T.walk)*fatMul(u)*(u.spdT>B.t?1.4:1);if(u.T.naval)return v*shipMul(u);if(tAt(T,T.forest,u.x,u.y))v*=u.T.role==='cav'?0.5:0.75;if(tAt(T,T.water,u.x,u.y))v*=0.45;
  const f=fortAt(T,u.x,u.y);if(f>=0&&f!==u.side)v*=0.85;return v}

// ---------------- 命令 API ----------------
function activeU(u){return u&&u.st==='ok'}
function oMove(u,x,y,ang,width,run){if(!activeU(u))return;x=clamp(x,20,B.W-20);y=clamp(y,20,B.H-20);if(B.T.valley||B.T.naval){const v=valleyAt(B.T,x);y=clamp(y,v[0]+34,v[1]-34)}
  if(width!=null){u.cols=clamp(Math.round(width/u.sp)+1,Math.min(4,u.n),Math.max(4,u.T.cols*2))}
  const dx=x-u.x,dy=y-u.y,d=hyp(dx,dy);if(ang==null)ang=d>4?Math.atan2(dy,dx):u.ang;

  u.ord={k:'move',x,y,ang,march};u.run=!!run;u.chargeT=0;

function oStop(u){if(!activeU(u))return;u.ord=null;u.run=false;u.x=u.cx;u.y=u.cy}
function oHold(u,on){if(!activeU(u))return;u.hold=on==null?!u.hold:on;if(u.hold){if(u.ord&&u.ord.k==='move'){}else{u.ord=null;u.x=u.cx;u.y=u.cy}u.run=false}}
function oCharge(u){if(!activeU(u))return false;if(u.t==='ram'){if(SG&&!u.ramDead){const g=nearestGate(u.cy,false);if(g){u.ord={k:'move',x:SG.WX-WT-24,y:g.y,ang:0,march:false,ram:true};return true}}return false}let t=u.ord&&u.ord.k==='atk'?u.ord.tgt:null;
  if(!t){let bd=500;const fx=Math.cos(u.ang),fy=Math.sin(u.ang);for(const e of B.units){if(e.side===u.side||e.st!=='ok')continue;const dx=e.cx-u.cx,dy=e.cy-u.cy,d=hyp(dx,dy);const front=(dx*fx+dy*fy)/(d||1);const sc=d*(front>0.2?1:1.8);if(sc<bd){bd=sc;t=e}}}

// 将技
function gskTarget(u,r){let best=null,bd=r;for(const e of B.units){if(e.side===u.side||e.st==='dead'||e.st==='gone'||e.n<=0)continue;const d=hyp(e.cx-u.cx,e.cy-u.cy);if(d<bd){bd=d;best=e}}return best}
function gskOK(u){if(!u||!u.gsk||!u.genSol||!u.genSol.alive||u.st!=='ok'||u.cd.gsk>0)return false;const k=u.gsk;if(k==='huoji')return !!gskTarget(u,380);if(k==='hunluan')return !!gskTarget(u,420);if(k==='jianyu')return !!u.T.range;return true}
function oGsk(u){if(!gskOK(u))return false;const k=u.gsk;const K=typeof BSK!=='undefined'?BSK[k]:{n:k,cd:70};u.cd.gsk=K.cd;const nm=u.gs.name;let msg='';
  if(k==='tuji'){u.atkB=3.5;u.atkT=B.t+20;u.shock=0;u.boost=Math.max(u.boost,10);u.boostT=B.t+20;msg=`${nm}身先士卒，全军突击！`;addFx('ring',u.cx,u.cy,20)}
  else if(k==='benxi'){u.spdT=B.t+18;u.boost=Math.max(u.boost,5);u.boostT=B.t+18;msg=`${nm}率部奔袭，疾如风火！`;addFx('ring',u.cx,u.cy,14)}
  else if(k==='tiebi'){let n=0;for(const f of B.sides[u.side].units){if(f.st!=='ok')continue;if(hyp(f.cx-u.cx,f.cy-u.cy)<280){f.defB=3;f.defT=B.t+20;f.shock=Math.max(0,f.shock-10);n++}}msg=`${nm}坐镇指挥，诸军结阵如铁壁（${n} 部）！`;addFx('gold',u.cx,u.cy,12)}
  else if(k==='jianyu'){u.cd.volley=0;u.volleyT=B.t+28;u.fireLeft=Math.max(u.fireLeft,1);for(const s of u.sol)if(s.alive&&!s.gen)s.rl=rnd()*0.3;msg=`${nm}令弓弩手箭如雨下！`;addFx('ring',u.cx,u.cy,16)}
  else if(k==='huoji'){const t=gskTarget(u,380);if(!t)return false;const burn=(e,frac)=>{const sol=e.sol.filter(s=>s.alive&&!s.gen);const n=Math.max(1,Math.round(sol.length*frac));for(let i=0;i<n&&sol.length;i++){const j=Math.floor(rnd()*sol.length);const s=sol.splice(j,1)[0];hurt(s,999,null)}e.shock+=frac>0.05?26:10};
    burn(t,0.1);for(const e of B.units)if(e!==t&&e.side!==u.side&&e.st!=='dead'&&e.st!=='gone'&&hyp(e.cx-t.cx,e.cy-t.cy)<100)burn(e,0.04);msg=`${nm}施火计，${uName?uName(t):'敌部'}陷入火海！`;for(let i=0;i<7;i++)addFx('blaze',t.cx+(rnd()-0.5)*70,t.cy+(rnd()-0.5)*50,10+rnd()*12)}
  else if(k==='hunluan'){const t=gskTarget(u,420);if(!t)return false;t.shock+=32;t.ord=null;t.moving=false;t.aiT=B.t+8;t.stunT=B.t+8;msg=`${nm}伪传号令，敌部阵脚大乱！`;addFx('ring',t.cx,t.cy,18)}
  B.ev.push({k:'gsk',u,msg});return true}
function addFx(k,x,y,r){if(typeof addPart==='function'&&!B.headless)addPart({k,x,y,r,life:0,max:k==='blaze'?1.6:1.2,vx:0,vy:0})}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}

// 布阵阶段：限制在部署区
function placeDeploy(u,x,y,ang){const z=B.sides[u.side].deploy;if(z){x=clamp(x,z.x0,z.x1);y=clamp(y,z.y0,z.y1)}if(B.T.valley||B.T.naval){const v=valleyAt(B.T,x);y=clamp(y,v[0]+34,v[1]-34)}reslot(u,ang);placeUnit(u,x,y,ang)}
function groupMove(units,x,y,run){ // 保持相对位置平移；朝向为群体中心→目标
  units=units.filter(activeU);if(!units.length)return;let gx=0,gy=0;units.forEach(u=>{gx+=u.cx;gy+=u.cy});gx/=units.length;gy/=units.length;
  if(units.length===1){oMove(units[0],x,y,null,null,run);return}
  const ang=Math.atan2(y-gy,x-gx);const d=hyp(x-gx,y-gy);const a2=d>30?ang:units[0].ang;
  // 以群体朝向重排：保持横向相对位置
  const fx=Math.cos(a2),fy=Math.sin(a2);
  units.forEach(u=>{const ox=u.cx-gx,oy=u.cy-gy;const lat=ox*-fy+oy*fx,dep=ox*fx+oy*fy;oMove(u,x+fx*dep-fy*lat,y+fy*dep+fx*lat,a2,null,run)})}
function lineMove(units,x0,y0,x1,y1,run){ // 拖拽阵线：线太短时自动分成多排
  units=units.filter(activeU);if(!units.length)return;const L=hyp(x1-x0,y1-y0);if(L<20){groupMove(units,x1,y1,run);return}
  const lx=(x1-x0)/L,ly=(y1-y0)/L;let fx=-ly,fy=lx;
  const es=B.units.filter(e=>e.side!==units[0].side&&e.st==='ok');if(es.length){let ex=0,ey=0;es.forEach(e=>{ex+=e.cx;ey+=e.cy});ex/=es.length;ey/=es.length;if((ex-(x0+x1)/2)*fx+(ey-(y0+y1)/2)*fy<0){fx=-fx;fy=-fy}}
  const ang=Math.atan2(fy,fx);const gap=12;
  // 前排：近战；后排：远程；骑兵两翼（若有多排）
  const us=units.slice().sort((a,b)=>((a.cx-x0)*lx+(a.cy-y0)*ly)-((b.cx-x0)*lx+(b.cy-y0)*ly));
  const minW=u=>Math.max(u.sp*3,Math.min(u.T.cols,u.n)*u.sp*0.6);
  const rows=[[]];let acc=0;for(const u of us){const w=minW(u)+gap;if(acc+w>L+gap&&rows[rows.length-1].length){rows.push([]);acc=0}rows[rows.length-1].push(u);acc+=w}
  let back=0;rows.forEach((row,ri)=>{const tot=row.reduce((s,u)=>s+minW(u),0);const scale=Math.max(1,(L-gap*(row.length-1))/tot);let pos=(L-(tot*scale+gap*(row.length-1)))/2;let dmax=0;
    row.forEach(u=>{const w=minW(u)*scale;const c=pos+w/2;pos+=w+gap;const cols=clamp(Math.round(w/u.sp)+1,Math.min(3,u.n),Math.max(3,u.T.cols*2));const dep=(Math.ceil(u.n/cols)-1)*u.spy;dmax=Math.max(dmax,dep);
      const bx=x0+lx*c-fx*(back+dep/2),by=y0+ly*c-fy*(back+dep/2);oMove(u,bx,by,ang,Math.max(10,w-u.sp),run)});back+=dmax+26})}
// ---------------- 伤亡 ----------------
function kill(v,a,how){
  if(!v.alive)return;v.alive=false;const u=v.u;
  if(v.gen){genDown(u,how||'melee',a);return}
  const k=v.slot;const last=u.bySlot[u.n-1];if(last&&last!==v){u.bySlot[k]=last;last.slot=k}u.bySlot.length=u.n-1;u.n--;
  const idx=u.sol.indexOf(v);if(idx>=0)u.sol.splice(idx,1);
  if(how==='fled'){u.fled++}else{u.losses++;u.recent.push(B.t);if(a&&a.u){a.u.kills++;B.sides[a.u.side].kills++}B.ev.push({k:'dead',x:v.x,y:v.y,s:v,face:v.face})}
  B.dirty=true;if(u.n<=0){if(u.genSol&&u.genSol.alive){u.genSol.alive=false;genDown(u,'escape',null)}else endUnit(u)}}
function endUnit(u){u.st=u.losses>=u.fled?'dead':'gone';u.ord=null;B.ev.push({k:'unitEnd',u})}
function genDown(u,how,a){const g=u.gs;const lord=g.role==='lord';let killed;
  if(how==='duelKill')killed=true;else if(how==='duelFlee'||how==='duelCap'||how==='fled'||how==='escape')killed=false;else killed=rnd()<(lord?0.35:0.55);
  const gx=u.genSol?u.genSol.x:u.cx,gy=u.genSol?u.genSol.y:u.cy;
  if(how==='duelCap')u.genCaptured=true;
  else if(!killed&&u.isHero&&how==='melee'&&anyEnemyNear(u.side,gx,gy,34)&&rnd()<0.4)u.genCaptured=true;
  const idx=u.sol.indexOf(u.genSol);if(idx>=0)u.sol.splice(idx,1);
  u.genDead=killed?'killed':'wounded';B.dirty=true;
  const side=B.sides[u.side];const cmd=u.isCmd;
  if(how!=='fled'&&how!=='escape'){u.shock+=killed?30:20;for(const f of side.units)if(f!==u&&f.st==='ok'&&!f.isHero)f.shock+=cmd?(killed?15:8):(killed?4:1);
    for(const e of B.units)if(e.side!==u.side&&e.st==='ok'&&!e.isHero){e.shock=Math.max(0,e.shock-(cmd?12:4))}}
  if(cmd)side.cmdLost=true;
  if(a&&a.u&&killed){a.u.kills++;}
  B.log.push({t:B.t,k:killed?'genKill':u.genCaptured?'genCap':how==='fled'?'genFled':how==='escape'?'genEscape':'genWound',g:g.name,by:a&&a.gen?a.u.gs.name:(a&&a.u?a.u.label:''),side:u.side});
  B.gfate[g.id]={dead:u.genDead,cap:!!u.genCaptured};
  if(u.isHero){const p=u.parent;if(p){p.genDead=u.genDead;if(u.genCaptured)p.genCaptured=true;if(p.heroOut===u)p.heroOut=null}}
  B.ev.push({k:'gen',u,killed,by:a,how,cap:!!u.genCaptured,x:gx,y:gy,s:u.genSol});
  if(u.n<=0)endUnit(u)}

function strike(a,v){
  const ua=a.u,uv=v.u,Ta=ua.T,Tv=uv.T;
  let MA=a.gen?a.MA:Ta.MA+ua.bMA,MD=v.gen?v.MD:Tv.MD+uv.bMD;if(ua.atkT>B.t)MA+=ua.atkB||0;if(uv.defT>B.t)MD+=uv.defB||0;
  if(Ta.AC&&v.cav)MA+=Ta.AC;
  if(a.cav&&Tv.role==='ranged')MA+=2;
  if(Ta.AP)MD-=Math.min(Ta.AP,MD*0.4);
  // 侧背
  const fx=Math.cos(uv.ang),fy=Math.sin(uv.ang);let dx=a.x-v.x,dy=a.y-v.y;const d=hyp(dx,dy)||1;dx/=d;dy/=d;let qx=a.x-uv.cx,qy=a.y-uv.cy;const ql=hyp(qx,qy)||1;const dot=(fx*qx+fy*qy)/ql;
  const sc=100/uv.n0;
  if(uv.st==='rout')MD*=0.3;else if(dot<-0.3){MD*=0.5;uv.shock+=0.5*Math.min(sc,2)}else if(dot<0.3){MD*=0.78;uv.shock+=0.18*Math.min(sc,2)}
  // 地形
  const T=B.T;const dh=hAt(T,a.x,a.y)-hAt(T,v.x,v.y);MA+=clamp(dh*0.07,-2,2);
  if(tAt(T,T.water,v.x,v.y)&&!Tv.naval)MD-=3;if(tAt(T,T.water,a.x,a.y)&&!Ta.naval)MA-=1.5;
  if(uv.hold)MD+=2;if(fortAt(T,v.x,v.y)===uv.side)MD+=2;
  if(SG){const zv=zoneOf(v.x),za=zoneOf(a.x);if(uv.side===SG.def&&zv===1)MD+=3;if(ua.side===SG.def&&za===1)MA+=1;if(za===0&&zv===1)MA-=3}
  if(uv.mor<32)MD-=1;
  MA*=fatMul(ua);MD*=fatMul(uv);
  let p=0.3+0.03*(MA-MD),dmg=1;
  if(a.chg>0){a.chg=0;
    const braced=(Tv.AC||Tv.role==='spear')&&uv.st==='ok'&&(uv.hold||!uv.moving)&&dot>0.3;
    if(braced){p-=0.15;a.vx*=0.2;a.vy*=0.2;if(rnd()<0.55+(Tv.AC||4)*0.03)hurt(a,1,v);ua.shock+=0.6*(100/ua.n0)}
    else{p+=Ta.CB*0.024;if(Ta.CB>=15)dmg=2;v.x-=dx*7;v.y-=dy*7;v.cd+=0.7;uv.shock+=Ta.CB*0.03*Math.min(sc,2)*(dot<0.3?2:1)*(v.cav?0.5:1)}}
  p=clamp(p,0.04,0.85);
  a.atkT=0;
  if(rnd()<p)hurt(v,dmg,a)}
function hurt(v,dmg,a){if(!v.alive||v.inDuel)return;if(v.gen&&v.u.n>0)dmg*=0.55;if(v.u.isHero)dmg*=heroTaken(v.u);v.hp-=dmg;v.lastHit=B.t;if(v.hp<=0)kill(v,a)}

// ---------------- 溃逃 / 重整 ----------------
function routUnit(u){if(u.st!=='ok')return;u.st='rout';u.ord=null;u.hold=false;u.run=true;u.routT=0;u.fireTgt=null;B.ev.push({k:'rout',u});
  B.log.push({t:B.t,k:'rout',u:u.label,g:u.gs?u.gs.name:'',side:u.side});
  for(const f of B.units){if(f===u||f.st!=='ok')continue;const d=hyp(f.cx-u.cx,f.cy-u.cy);if(f.side===u.side){if(d<200)f.shock+=3}else if(d<420)f.shock=Math.max(0,f.shock-4)}
  for(const s of u.sol)s.foe=null}
function rallyUnit(u,forced){u.st='ok';u.shock*=0.35;u.rallies++;u.rallyT=B.t;u.run=false;u.ord=null;u.x=u.cx;u.y=u.cy;
  let bd=1e9,ang=u.ang;for(const e of B.units){if(e.side===u.side||e.st!=='ok')continue;const d=hyp(e.cx-u.cx,e.cy-u.cy);if(d<bd){bd=d;ang=Math.atan2(e.cy-u.cy,e.cx-u.cx)}}
  u.ang=ang;reslot(u,ang);B.ev.push({k:'rally',u,forced:!!forced})}

// ---------------- 远程 ----------------
function fireArrow(s,tu){
  const u=s.u;const ts=tu.sol[(rnd()*tu.sol.length)|0];if(!ts)return;
  const dx=ts.x-s.x,dy=ts.y-s.y,d=hyp(dx,dy);const fl=d/300+0.3;
  const sig=4+d*0.042;const g1=(rnd()+rnd()+rnd()-1.5)*sig*0.9,g2=(rnd()+rnd()+rnd()-1.5)*sig*0.9;
  const lead=0.7;let x1=ts.x+ts.vx*fl*lead+g1+B.wind.x*B.wind.str*d*0.03,y1=ts.y+ts.vy*fl*lead+g2+B.wind.y*B.wind.str*d*0.03;
  const fire=u.fireArrows>0;if(fire)u.fireArrows--;
  const vol=B.t<u.volleyT;
  B.arrows.push({x0:s.x,y0:s.y-8,x1,y1,t:0,T:fl,side:u.side,src:u,fire,vol,h:Math.min(90,d*0.22)});
  s.am--;s.atkT=0}
function landArrow(ar){
  const out=landArrow.buf||(landArrow.buf=[]);const n=solNear(ar.x1,ar.y1,5.5,out);let v=null,bd=1e9;
  for(let i=0;i<n;i++){const o=out[i];const d=hyp(o.x-ar.x1,o.y-ar.y1)-(o.cav?2:0);if(d<bd){bd=d;v=o}}
  let hit=false;if(v&&v.inDuel)v=null;
  if(ar.hero&&heroArrowLand(ar))return;
  if(v&&!(v.u.side===ar.side&&rnd()<0.55)){
    const uv=v.u,Tv=uv.T;let p=0.5;if(ar.vol)p*=1.35;
    const fx=Math.cos(uv.ang),fy=Math.sin(uv.ang);const dx=ar.x0-v.x,dy=ar.y0-v.y;const dd=hyp(dx,dy)||1;const front=(fx*dx+fy*dy)/dd>0;
    if(Tv.sh&&(front||uv.hold)&&uv.st!=='rout'&&!(ar.fire&&Tv.burn))p*=1-Tv.sh;
    const MD=v.gen?v.MD:Tv.MD+uv.bMD;p*=clamp(1-MD*0.045,0.42,1);
    if(tAt(B.T,B.T.forest,v.x,v.y))p*=0.6;if(v.gen)p*=0.45;
    if(SG){if(uv.side===SG.def&&zoneOf(v.x)===1)p*=0.45;if(uv.t==='ram'&&!uv.ramDead&&hyp(v.x-uv.x,v.y-uv.y)<24)p*=0.12}
    if(ar.fire&&Tv.naval&&rnd()<(uv.chain?0.45:0.16))igniteShip(v);
    if(rnd()<p){hurt(v,ar.fire&&Tv.burn?2:1,{u:ar.src,gen:false});uv.shock+=0.15*(100/uv.n0);hit=true;if(ar.fire)uv.shock+=0.9*(100/uv.n0)*(Tv.burn||1)}
  }
  if(SG&&ar.fire)for(const r of SG.rams){if(!r.ramDead&&r.st==='ok'&&r.side!==ar.side&&hyp(ar.x1-r.x,ar.y1-r.y)<22){damageRam(r,9);break}}
  if(ar.fire){const T=B.T;const gx=Math.floor(ar.x1/FCS),gy=Math.floor(ar.y1/FCS);if(gx>=0&&gy>=0&&gx<T.fgw&&gy<T.fgh){const ci=gy*T.fgw+gx;const f=B.fire.fuel[ci];if(f>0&&B.fire.st[ci]===0&&rnd()<(f>2?0.2:0.13))ignite(ci)}}
  if(!hit)B.ev.push({k:'stick',x:ar.x1,y:ar.y1,a:Math.atan2(ar.y1-ar.y0,ar.x1-ar.x0),fire:ar.fire})}

// ---------------- 火 ----------------
function ignite(ci){const F=B.fire;if(F.st[ci]!==0||F.fuel[ci]<=0)return;F.st[ci]=1;F.burn[ci]=F.fuel[ci]*7.5;F.list.push(ci);if(!B.fireAnnounced||B.t-B.fireAnnounced>20){B.fireAnnounced=B.t;const T=B.T;B.ev.push({k:'fire',x:(ci%T.fgw+0.5)*FCS,y:(Math.floor(ci/T.fgw)+0.5)*FCS})}}
function fireStep(dt){const F=B.fire,T=B.T;const W=T.fgw,H=T.fgh;const wx=B.wind.x,wy=B.wind.y,ws=B.wind.str;const cur=F.list;F.list=[];
  for(const ci of cur){if(F.st[ci]!==1)continue;F.burn[ci]-=dt;if(F.burn[ci]<=0){F.st[ci]=2;F.fuel[ci]=0;B.ev.push({k:'burnt',ci});continue}F.list.push(ci);
    const gx=ci%W,gy=(ci/W)|0;
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(!ox&&!oy)continue;const nx=gx+ox,ny=gy+oy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nj=ny*W+nx;if(F.st[nj]!==0||F.fuel[nj]<=0)continue;
      const l=(ox&&oy)?1.414:1;const dot=(ox*wx+oy*wy)/l;const wf=dot>0?1+3.2*ws*dot:Math.max(0.12,1+1.6*ws*dot);
      if(rnd()<0.018*wf*Math.min(1.5,F.fuel[nj])*dt*2/l)ignite(nj)}}}
function inFire(x,y){const T=B.T;const gx=Math.floor(x/FCS),gy=Math.floor(y/FCS);if(gx<0||gy<0||gx>=T.fgw||gy>=T.fgh)return false;return B.fire.st[gy*T.fgw+gx]===1}

// ---------------- 主步进 ----------------
function step(){
  if((B.phase!=='battle'&&B.phase!=='end')||B.duel||B.ask)return;
  B.t+=DT;B.tick++;const t=B.t,tick=B.tick;
  // 援军
  for(const sd of B.sides)for(const r of sd.reinf){if(!r.done&&t>=r.t){r.done=true;const ang=Math.atan2(r.to.y-r.from.y,r.to.x-r.from.x);const nu=[];
    for(const d of r.units){const u=mkUnit(sd,d,r.from.x+(d.dx||0),r.from.y+(d.dy||0),ang);u.x=r.from.x+(d.dx||0);oMove(u,r.to.x+(d.dx||0),r.to.y+(d.dy||0),ang,null,false);nu.push(u);
      if(!sd.cmd||sd.cmdLost){}if(u.gs&&u.gs.id===sd.leader){if(sd.cmd)sd.cmd.isCmd=false;sd.cmd=u;u.isCmd=true;sd.cmdLost=false}}
    sd.aiState.provoked=true;B.ev.push({k:'reinf',side:sd.i,msg:r.msg,units:nu});B.log.push({t,k:'reinf',side:sd.i,msg:r.msg})}}
  rebuild();
  // 单位层
  if(tick%5===0)for(const u of B.units){if(u.st==='dead'||u.st==='gone')continue;const ru=(uWidth(u)+uDepth(u))/2+14;let m=1e9;for(const e of B.units){if(e.side===u.side||e.st==='dead'||e.st==='gone')continue;const d=hyp(e.cx-u.cx,e.cy-u.cy)-ru-(uWidth(e)+uDepth(e))/2-14;if(d<m)m=d}u.farE=m}
  for(const u of B.units){if(u.st==='dead'||u.st==='gone')continue;prepSlots(u);u.engaged=u.eng;u.eng=0;u.inFireL=u.inFire;u.inFire=0;u.avgLag=u.lagN?u.lag/u.lagN:0;u.lag=0;u.lagN=0;
    for(const k in u.cd)if(u.cd[k]>0)u.cd[k]-=DT;
    if(u.st==='ok')unitStep(u);else if(u.st==='rout'){u.routT+=DT}}
  // 战场单挑
  fdStep();
  // 士兵层
  soldierStep(tick);
  if(SG)siegeTick();
  // 箭
  const na=[];for(const ar of B.arrows){ar.t+=DT;if(ar.t>=ar.T)landArrow(ar);else na.push(ar)}B.arrows=na;
  // 火
  if(tick%10===0&&B.fire.list.length)fireStep(0.5);
  if(B.T.naval&&tick%10===5)shipFireSpread();
  // 士气 / 体力
  if(tick%5===0)moraleStep(0.25);
  // AI
  if(typeof aiStep==='function')for(const sd of B.sides)if(sd.ai&&(tick+sd.i*10)%20===0)aiStep(sd);
  if(tick%20===0&&B.phase==='battle')checkEnd()}

function unitStep(u){if(u.isHero){heroTick(u);return}

function moraleStep(dt){

    if(u.genSol&&u.genSol.alive&&!eng&&u.gs&&typeof genHP==='function'){const mh=genHP(u.gs);if(u.genSol.hp<mh)u.genSol.hp=Math.min(mh,u.genSol.hp+mh*0.012*dt)}

    const lf=u.losses/u.n0;const lossPen=50*Math.pow(lf,1.1)+(lf>0.5?(lf-0.5)*80:0);const recPen=Math.min(20,u.recent.length*Math.min(2,100/u.n0)*0.45);

  if(s===3)return true; // 城墙与城内之间有马道
  const y=(a.y+b.y)/2;
  if(s===1){const g=gateAt(y);if(g&&g.broken)return true;return !!ladderAt(y,14)}
  const g=gateAt(y);return !!(g&&g.broken&&Math.abs(a.y-g.y)<g.hw&&Math.abs(b.y-g.y)<g.hw)}
// 通道选择
function bestPassage(u,y){const side=u.side;let best=null,bd=1e9;
  for(const g of SG.gates){if(!(g.broken||side===SG.def))continue;const d=Math.abs(g.y-y)*(g.broken?0.8:1);if(d<bd){bd=d;best={y:g.y,hw:g.hw*0.7,kind:'gate',ref:g}}}
  if(side===SG.att){for(const L of SG.ladders){if(!L.placed)continue;const d=Math.abs(L.y-y)*(L.owner===u?0.3:1)+60;if(d<bd){bd=d;best={y:L.y,hw:5,kind:'ladder',ref:L}}}}
  return best}
// 士兵路径修正：返回 [tx,ty]
const _rt=[0,0];
function siegeRoute(s,tx,ty){_rt[0]=tx;_rt[1]=ty;const zs=zoneOf(s.x),zt=zoneOf(tx);if(zs===zt)return _rt;
  if(zs+zt===3)return _rt; // 1↔2 自由
  const u=s.u;let P=u.pass&&u.passValid?u.pass:null;if(!P||(P.kind==='ladder'&&!P.ref.placed)||(P.kind==='gate'&&!(P.ref.broken||u.side===SG.def)))P=bestPassage(u,s.y);
  const WX=SG.WX;
  if(!P){ // 无路可走：贴墙等待（若本部有未架云梯，则去梯位）
    if(zs===0){const L=u.ladder&&!u.ladder.placed?u.ladder:null;if(L){_rt[0]=WX-WT-10;_rt[1]=L.y+((s.id%7)-3)*3}else{_rt[0]=Math.min(tx,WX-WT-8)}}
    else{_rt[0]=Math.max(tx,WX-WT+6)}return _rt}

  else{ // 城墙/城内 → 城外
    if(Math.abs(s.y-py)>3.5||s.x>WX+WT+10){_rt[0]=P.kind==='gate'?WX+WT+8:WX-WT+6;_rt[1]=py}else{_rt[0]=WX-WT-28;_rt[1]=py}}
  return _rt}
// 位置约束：非法穿墙则退回
function siegeEnforce(s){const z0=zoneOf(s.px),z1=zoneOf(s.x);if(z0===z1)return;const lo=Math.min(z0,z1);

  if(ok&&z0===0&&side===SG.att){const g=gateAt(s.y);if(!(g&&g.broken)){const L=ladderAt(s.y)||ladderAt(s.py);if(L){if(L.nextT>B.t)ok=false;else L.nextT=B.t+0.85}}}
  if(!ok){s.x=z0===0?SG.WX-WT-0.2:Math.max(s.px,SG.WX-WT+0.2);s.vx=0}}
// 单位层（返回 true 表示已处理，不走常规逻辑）
function siegeUnitStep(u){

  if(u.t==='ram'){if(u.ramDead)return false;const g=nearestGate(u.cy,false);u.run=false;
    if(!g){if(u.ord&&u.ord.k!=='move')u.ord=null;return false}
    const fx=SG.WX-WT-24,fy=g.y;const d=hyp(fx-u.x,fy-u.y);
    if(u.ord&&u.ord.k==='atk'){u.ord={k:'move',x:fx,y:fy,ang:0,march:false,ram:true}}
    if(u.ord&&u.ord.k==='move'&&(u.ord.ram||(u.ord.x>SG.WX-WT-120&&Math.abs(u.ord.y-g.y)<g.hw+60))){u.ord.x=fx;u.ord.y=fy;u.ord.ang=0;u.ord.ram=true}
    if(d<16&&!g.broken){u.ramming=g;u.ang=0;const crew=u.n/u.n0;if(crew>0.15){g.hp-=24*crew*DT;g.hitT=B.t;if(g.hp<=0)breakGate(g)}}else u.ramming=null;
    return false}
  // 需要穿墙时：确定通道
  const tg=u.ord?(u.ord.k==='move'?{x:u.ord.x,y:u.ord.y}:u.ord.tgt?{x:u.ord.tgt.cx,y:u.ord.tgt.cy}:null):null;
  u.passValid=false;

      let P=bestPassage(u,u.cy);
      if(u.side===SG.att&&(!P||P.kind==='gate'&&!P.ref.broken)&&u.ladders>0&&!u.ladder&&(u.T.role==='inf'||u.T.role==='spear')){assignLadder(u,tg.y)}
      if(u.side===SG.att&&u.ladder&&u.ladder.placed&&(!P||P.kind!=='gate'||Math.abs(P.y-u.cy)>Math.abs(u.ladder.y-u.cy)+80))P={y:u.ladder.y,hw:5,kind:'ladder',ref:u.ladder};
      if(P){u.pass=P;u.passValid=true}
      // 锚点不得越过无路之墙
      if(!P&&zu===0){const lim=SG.WX-WT-uDepth(u)/2-10;if(u.x>lim)u.x=lim}
      if(!P&&zu>=1&&u.side===SG.def){const lim=SG.WX-WT+uDepth(u)/2+4;if(u.x<lim)u.x=lim}}}
  return false}
function nearestGate(y,brokenOk){let best=null,bd=1e9;for(const g of SG.gates){if(g.broken&&!brokenOk)continue;const d=Math.abs(g.y-y);if(d<bd){bd=d;best=g}}return best}
function assignLadder(u,ty){ // 梯位：靠近目标 y，避开城门与已有梯
  let y=clamp(u.cy*0.6+ty*0.4,60,B.H-60);
  for(let k=0;k<8;k++){let bad=false;for(const g of SG.gates)if(Math.abs(y-g.y)<g.hw+40){y=g.y+(y<g.y?-1:1)*(g.hw+44);bad=true}
    for(const L of SG.ladders)if(Math.abs(y-L.y)<34){y+=y<L.y?-36:36;bad=true}y=clamp(y,50,B.H-50);if(!bad)break}
  const L={y,placed:false,prog:0,owner:u,side:u.side,nextT:0};SG.ladders.push(L);u.ladder=L;u.ladders--;return L}
function breakGate(g){if(g.broken)return;g.broken=true;g.hp=0;B.ev.push({k:'gateBroken',y:g.y});B.log.push({t:B.t,k:'gate',side:SG.att});
  for(const u of B.units){if(u.st!=='ok')continue;if(u.side===SG.def)u.shock+=10;else u.shock=Math.max(0,u.shock-10)}}
// 每 tick
function siegeTick(){
  const WX=SG.WX;
  // 云梯架设
  for(const L of SG.ladders){if(L.placed)continue;const u=L.owner;if(!u||u.st!=='ok'){L.dead=true;continue}
    let near=0;for(const s of u.sol){if(s.alive&&s.x>WX-WT-22&&s.x<WX-WT+1&&Math.abs(s.y-L.y)<16)near++;if(near>=3)break}
    if(near>=3){let dn=0;const buf=[];const nn=solNear(WX,L.y,34,buf);for(let i=0;i<nn;i++)if(buf[i].u.side===SG.def&&buf[i].alive)dn++;L.prog+=DT*(dn>4?0.35:1);if(L.prog>=3.2){L.placed=true;B.ev.push({k:'ladder',y:L.y,u});u.passValid=false}}}
  SG.ladders=SG.ladders.filter(L=>!L.dead||L.placed);
  // 箭楼
  if(SG.towerOn)for(const t of SG.towers){t.rl-=DT;if(t.rl>0)continue;t.rl=1.7+rnd()*0.6;
    let best=null,bd=330;for(const u of B.units){if(u.side!==SG.att||(u.st!=='ok'&&u.st!=='rout')||!u.sol.length)continue;const d=hyp(u.cx-t.x,u.cy-t.y);if(d<bd){bd=d;best=u}}
    if(best){const ts=best.sol[(rnd()*best.sol.length)|0];const d=hyp(ts.x-t.x,ts.y-t.y);const fl=d/320+0.25;const sig=3+d*0.035;
      B.arrows.push({x0:t.x,y0:t.y-26,x1:ts.x+ts.vx*fl*0.7+(rnd()+rnd()-1)*sig,y1:ts.y+ts.vy*fl*0.7+(rnd()+rnd()-1)*sig,t:0,T:fl,side:SG.def,src:B.towerU,fire:false,vol:false,h:Math.min(70,d*0.16),tower:true})}}
  // 冲车损毁（火）
  for(const u of SG.rams){if(u.ramDead||u.st==='dead'||u.st==='gone')continue;if(B.fire.list.length&&inFire(u.x,u.y))damageRam(u,6*DT)}
  // 夺城：中心广场
  if(B.tick%20===0&&B.phase==='battle'){const P=SG.plaza;let na=0,nd=0;const buf=[];const n=solNear(P.x,P.y,P.r,buf);for(let i=0;i<n;i++){const s=buf[i];if(!s.alive||s.u.st!=='ok')continue;if(s.u.side===SG.att)na++;else nd++}
    if(na>=5&&nd===0){P.prog+=1;if(!P.announced){P.announced=true;B.ev.push({k:'plaza',start:true})}}else if(nd>0&&na===0)P.prog=Math.max(0,P.prog-2);else if(nd>na*2)P.prog=Math.max(0,P.prog-0.5);
    if(P.prog>=P.need&&!B.result){P.cap=true;SG.towerOn=false;for(const u of B.units)if(u.side===SG.def&&u.st==='ok')u.shock+=40;finish(SG.att,'plaza')}}}
function siegeCheckEnd(){if(B.result)return false;if(SG.gates.some(g=>g.broken))return false;
  const att=B.sides[SG.att].units.filter(u=>u.st==='ok');const canEnter=att.some(u=>(u.T.role==='inf'||u.T.role==='spear')&&u.t!=='ram'||u.t==='ram'&&!u.ramDead);
  if(!canEnter&&!B.sides[SG.att].reinf.some(r=>!r.done)&&!att.some(u=>zoneOf(u.cx)>=1)){finish(SG.def,'noentry');return true}return false}
function damageRam(u,d){u.ramHP-=d;if(u.ramHP<=0&&!u.ramDead){u.ramDead=true;u.ramming=null;B.ev.push({k:'ramDead',u});u.shock+=30;u.T=Object.assign({},u.T,{role:'inf'})}}

// ================= 会战 AI =================
function aiRole(u){if(u.isHero)return 'hero';if(u.t==='guard')return 'gen';if(u.t==='ram')return 'ram';if(u.T.role==='ranged')return 'arch';if(u.T.role==='cav')return 'cav';return 'line'}
function cent(us){let x=0,y=0,n=0;for(const u of us){const w=u.n+1;x+=u.cx*w;y+=u.cy*w;n+=w}return n?{x:x/n,y:y/n}:null}
function aiMove(u,x,y,ang,run,width){const o=u.ord;if(o&&o.k==='move'&&hyp(o.x-x,o.y-y)<22&&!!u.run===!!run)return;if(!o&&hyp(u.x-x,u.y-y)<22&&Math.abs(angDiff(ang,u.ang))<0.3)return;oMove(u,x,y,ang,width,run)}
function aiAtk(u,e,run){const o=u.ord;if(o&&o.k==='atk'&&o.tgt===e&&(!run||u.run))return;oAttack(u,e,run)}
function frontOf(u,e){const fx=Math.cos(e.ang),fy=Math.sin(e.ang);const dx=u.cx-e.cx,dy=u.cy-e.cy,d=hyp(dx,dy)||1;return (fx*dx+fy*dy)/d}

function aiStep(sd){
  const st=sd.aiState;const my=sd.units.filter(u=>u.st==='ok');const enAll=B.units.filter(u=>u.side!==sd.i&&u.st==='ok');const en=enAll.filter(u=>!u.isHero);
  if(!my.length)return;

  if(B.phase==='battle'&&en.length){const combat=my.filter(u=>u.t!=='guard'&&u.t!=='ram'&&!u.isHero);const s0=sideStr();const r=(s0[sd.i]+1)/(s0[1-sd.i]+1);

  if(SG){aiSiege(sd,my,en);aiRallyCheck(sd,my,st);return}
  if(B.T.naval){aiNaval(sd,my,en,st);aiRallyCheck(sd,my,st);return}
  const ec=cent(en);const lineUs=my.filter(u=>aiRole(u)==='line');const mc=cent(lineUs.length?lineUs:my);
  let dx=ec.x-mc.x,dy=ec.y-mc.y,dist=hyp(dx,dy)||1;dx/=dist;dy/=dist;const lx=-dy,ly=dx;const face=Math.atan2(dy,dx);
  const str=sideStr();const ratio=(str[sd.i]+1)/(str[1-sd.i]+1);
  // 态势

    if(sd.attack||ratio>1.4)st.provoked=true;
    else for(const u of my){if(u.losses>u.n0*0.04||u.engaged>0){st.provoked=true;break}for(const e of en)if(hyp(e.cx-u.cx,e.cy-u.cy)<360){st.provoked=true;break}}

  // 战线中心

function aiRallyCheck(sd,my,st){
  if((st.rallyT||0)<B.t)for(const u of my)if(u.genSol&&u.genSol.alive&&u.cd.rally<=0){const near=sd.units.filter(f=>(f.st==='rout'&&f.losses/f.n0<0.55||f.st==='ok'&&f.mor<26)&&hyp(f.cx-u.cx,f.cy-u.cy)<320);if(near.length>=(u.isCmd?1:2)&&rnd()<0.6){oRally(u);st.rallyT=B.t+25;break}}}

function nearestEnemyUnit(u,en,filter){let best=null,bd=1e9;for(const e of en){if(filter&&!filter(e))continue;const d=hyp(e.cx-u.cx,e.cy-u.cy);if(d<bd){bd=d;best=e}}return [best,bd]}

function aiLine(u,en,adv,st,lx,ly,face,off){

function aiArch(u,en,adv,st,dx,dy,lx,ly,face,lineW){

function aiCav(u,en,adv,st,dx,dy,lx,ly,face,lineW,engagedAny,my){
  const o=u.ord;
  // 陷入枪阵：脱离
  if(u.engaged>0&&o&&o.k==='atk'&&(o.tgt.T.role==='spear'||o.tgt.T.AC)&&frontOf(u,o.tgt)>0.3&&o.tgt.mor>30){const bx=u.cx-(o.tgt.cx-u.cx),by=u.cy-(o.tgt.cy-u.cy);const l=hyp(bx-u.cx,by-u.cy)||1;
    oMove(u,u.cx+(bx-u.cx)/l*200,u.cy+(by-u.cy)/l*200,u.ang,null,true);u.aiT=B.t+4;return}
  // 循环冲锋
  if(u.engaged>0){u.engT=(u.engT||0)+1;if(u.engT>11&&o&&o.k==='atk'&&o.tgt.mor>35&&u.fat<85){const bx=u.cx-(o.tgt.cx-u.cx),by=u.cy-(o.tgt.cy-u.cy);const l=hyp(bx-u.cx,by-u.cy)||1;
      oMove(u,u.cx+(bx-u.cx)/l*190,u.cy+(by-u.cy)/l*190,u.ang,null,true);u.aiT=B.t+5;u.engT=0;return}return}else u.engT=0;
  if(o&&o.k==='atk'&&o.tgt.st==='ok'&&hyp(o.tgt.cx-u.cx,o.tgt.cy-u.cy)<120)return;
  // 等待时机
  const unguardedArch=en.find(e=>e.T.role==='ranged'&&!en.some(m=>m.T.role!=='ranged'&&hyp(m.cx-e.cx,m.cy-e.cy)<170)&&hyp(e.cx-u.cx,e.cy-u.cy)<800);
  const threat=en.find(e=>e.T.role==='cav'&&hyp(e.cx-u.cx,e.cy-u.cy)<320);

function processEvents(){
  const ev=B.ev;if(!ev.length)return;B.ev=[];
  for(const e of ev){switch(e.k){
    case 'dead':bakeDead(e.s,e.face);if(R.cam.z>0.4&&Math.random()<0.5)for(let i=0;i<3;i++)addPart({k:'ink',x:e.x,y:e.y-4,vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*30,r:0.8+Math.random()*1.2,life:0,max:0.8});break;
    case 'stick':bakeStick(e);break;
    case 'burnt':bakeBurnt(e.ci);break;
    case 'rout':{const mine=e.u.side===UI.view;addFeed(`${B.sides[e.u.side].ch}·${uName(e.u)} 溃逃！`,mine?'bad':'good');if(mine&&UI.sel.includes(e.u)){}break}
    case 'rally':if(e.u.side===UI.view)addFeed(`${uName(e.u)} 重整旗鼓`,'good');break;
    case 'gen':{const g=e.u.gs;const mine=e.u.side===UI.view;const by=e.by&&e.by.gen&&e.by.u&&e.by.u.gs?e.by.u.gs.name:null;
      if(e.how==='fled'||e.how==='duelKill'||e.how==='duelCap'||e.how==='duelFlee'){updCards();break}addFeed(e.killed?`${by?by+' 斩 ':''}${B.sides[e.u.side].ch}将 ${g.name} ${by?'':'阵亡'}！`:e.cap?`${B.sides[e.u.side].ch}将 ${g.name} 力竭被擒！`:e.how==='escape'?`${B.sides[e.u.side].ch}将 ${g.name} 部众尽没，单骑突围`:`${B.sides[e.u.side].ch}将 ${g.name} 负伤，退出战场`,(mine?'bad':'good')+' big');
      addPart({k:'ring',x:e.x,y:e.y,r:8,life:0,max:1.2});if(e.u.isCmd)showBanner(e.killed?`${g.name} 阵亡`:`${g.name} 负伤`,e.u.side===UI.view?'主将倒下，全军震动！':'敌军主将倒下！','',2600);break}
    case 'reinf':{const mine=e.side===UI.view;showBanner(mine?'援军已至':'敌援将至',e.msg,'',3200);addFeed(e.msg,(mine?'good':'bad')+' big');buildCards();break}
    case 'fire':addFeed('火起！火势顺'+WIND_NAMES[B.wind.from]+'风蔓延','big');break;
    case 'shipFire':{const mine=e.side===UI.view;if(!UI.shipFireN){UI.shipFireN=1;showBanner(mine?'战船起火':'敌船起火',mine?'火借风势，速速解锁散开！':'火借风势，敌船延烧！','',2600)}addFeed(mine?'我军战船起火！':'敌军战船起火！',(mine?'bad':'good')+' big');break}
    case 'unchain':if(e.u.side===UI.view)addFeed(`${uName(e.u)} 铁索已断，可以行动`,'good');break;
    case 'rallyCall':addFeed(`${e.u.gs.name}振臂高呼，三军奋勇！`,'good big');addPart({k:'gold',x:e.u.cx,y:e.u.cy,r:10,life:0,max:1.4});break;
    case 'duelRefuse':addFeed(e.player?`你避战不出，${B.sides[e.b.side].ch}军士气受挫`:`${e.b.gs.name} 避战不出，${B.sides[e.b.side].ch}军士气受挫`,e.b.side===UI.view?'bad':'good');break;
    case 'gsk':addFeed(e.msg,(e.u.side===UI.view?'good':'bad')+' big');break;
    case 'duelAsk':askDuel(e.a,e.b);break;
    case 'unitEnd':break;
    default:heroEvent(e);break;
    case 'gateBroken':{const mine=SG&&SG.att===UI.view;showBanner('城门已破',mine?'全军杀入城中！':'敌军破门而入，死守要道！','',2600);addFeed('城门被撞破！',(mine?'good':'bad')+' big');break}

    case 'ramDead':addFeed(e.u.side===UI.view?'我军冲车被焚毁！':'敌军冲车被焚毁！',e.u.side===UI.view?'bad':'good');break;
    case 'plaza':{const mine=SG&&SG.att===UI.view;addFeed(mine?'我军攻入城中要地，坚守片刻即可夺城！':'敌军冲入城中要地，速速夺回！',(mine?'good':'bad')+' big');break}
    case 'end':{const w=e.w;const t=UI.player<0?(w<0?'两军罢兵':B.sides[w].name+'胜'):w<0?'相持不下':w===UI.player?'大　捷':'兵　败';const sub=e.why==='time'?'时辰已尽，各自收兵':UI.player<0?'':w===UI.player?'敌军全线溃逃':w<0?'':'我军全线溃败';showBanner(t,sub,'',2400);setTimeout(showResult,2600);break}}}}

    // 两侧令旗

      ctx.strokeStyle='#3a2e22';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx,fy-30);ctx.stroke();ctx.fillStyle=B.sides[P.side].color;ctx.beginPath();ctx.moveTo(fx,fy-30);ctx.lineTo(fx-sg*13,fy-26);ctx.lineTo(fx,fy-20);ctx.closePath();ctx.fill()}
    ctx.restore()}}
function fdOf(s){const D=s.inDuel;if(!D)return null;return D.a.s===s?D.a:D.b.s===s?D.b:null}

  const P=fdOf(s);
  if(P){const a=P.act;
    if(a&&a.hits&&a.hi<a.hits.length){const hT=a.hits[a.hi];const pr=clamp(a.t/hT,0,1);const heavy=a.k==='heavy'||a.k==='huima';

    if(a&&a.k==='dodge'){const sp=sprite(solKind(s),B.sides[u.side].color,1,s.face<0,solLook(s));ctx.globalAlpha=0.22;ctx.drawImage(sp.c,x-sp.ox*sc-s.vx*0.25,y-sp.oy*sc-s.vy*0.25,sp.w*sc,sp.h*sc);ctx.globalAlpha=0.12;ctx.drawImage(sp.c,x-sp.ox*sc-s.vx*0.5,y-sp.oy*sc-s.vy*0.5,sp.w*sc,sp.h*sc);ctx.globalAlpha=1}}
  if(s.lastHit>B.t-0.15)ctx.globalAlpha=0.55;
  ctx.drawImage(spr.c,x-spr.ox*sc,y-spr.oy*sc,spr.w*sc,spr.h*sc);ctx.globalAlpha=1;
  if(P){const a=P.act;
    if(a&&(a.k==='guard'||(a.k==='zhenfen'&&a.t<0.35))){const f=s.face;const c=f>0?0:Math.PI;ctx.strokeStyle='rgba(60,110,175,.95)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y-20,20,c-1.05,c+1.05);ctx.stroke();ctx.strokeStyle='rgba(230,240,255,.8)';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y-20,20,c-0.9,c+0.9);ctx.stroke()}
    if(a&&a.k==='tuodao'){ctx.strokeStyle='rgba(120,60,160,.55)';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(x,y-20,22,0,7);ctx.stroke();ctx.setLineDash([])}
    if(P.buf.longdan>P.s.inDuel.t){ctx.strokeStyle='rgba(230,230,250,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-20,24+Math.sin(t*8)*1.5,0,7);ctx.stroke()}
    if(P.stun>0){ctx.fillStyle='#2b2621';for(let i=0;i<3;i++){const an=t*6+i*2.1;ctx.beginPath();ctx.arc(x+Math.cos(an)*8,y-60+Math.sin(an)*3,1.8,0,7);ctx.fill()}}}}

function drawHeroBars(ctx){const z=R.cam.z;const k=clamp(1/Math.sqrt(z),0.8,1.7);
  for(const u of B.units){if(!u.isHero||u.st!=='ok')continue;const s=u.genSol;if(!s||!s.alive||s.rf!==R.frameN)continue;const P=fdOf(s);if(!P&&z>=0.34)continue;
    const w=30*k,h=4*k,x=s.rx-w/2,y=s.ry-64-h;const f=P?clamp(P.hp/100,0,1):heroHpF(u);

function drawHeroParts(ctx,p,k){const z=R.cam.z;
  if(p.k==='spark'){ctx.strokeStyle=`rgba(255,236,170,${(0.95*k).toFixed(3)})`;ctx.lineWidth=1.6;const L=4+(1-k)*14*(p.r||1);for(let i=0;i<7;i++){const a=p.a0+i*0.9;const r0=2+(1-k)*6;ctx.beginPath();ctx.moveTo(p.x+Math.cos(a)*r0,p.y+Math.sin(a)*r0);ctx.lineTo(p.x+Math.cos(a)*(r0+L),p.y+Math.sin(a)*(r0+L));ctx.stroke()}return true}
  if(p.k==='num'){const sz=Math.round((p.sz||13)/Math.max(0.55,Math.min(1.4,z)));ctx.font=`900 ${sz}px "Noto Serif SC",serif`;ctx.textAlign='center';ctx.textBaseline='middle';const y=p.y-(1-k)*22;ctx.globalAlpha=Math.min(1,k*2);ctx.lineWidth=3;ctx.strokeStyle='rgba(246,238,219,.95)';ctx.strokeText(p.txt,p.x,y);ctx.fillStyle=p.col||'#2b2621';ctx.fillText(p.txt,p.x,y);ctx.globalAlpha=1;return true}
  if(p.k==='slash'){const a=p.a,r=p.r||18;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);ctx.globalAlpha=k;ctx.fillStyle='#1e1812';ctx.beginPath();ctx.moveTo(-r,-r*0.2);ctx.quadraticCurveTo(0,-r*0.95,r,-r*0.2);ctx.quadraticCurveTo(0,-r*0.55,-r,-r*0.2);ctx.fill();
    ctx.strokeStyle='rgba(255,250,235,.8)';ctx.lineWidth=0.9;ctx.beginPath();ctx.moveTo(-r*0.8,-r*0.3);ctx.quadraticCurveTo(0,-r*0.78,r*0.8,-r*0.3);ctx.stroke();ctx.restore();ctx.globalAlpha=1;return true}
  if(p.k==='sweep'){const r=10+(1-k)*30;ctx.strokeStyle=`rgba(30,24,18,${(0.85*k).toFixed(3)})`;ctx.lineWidth=6*k+1;ctx.beginPath();ctx.arc(p.x,p.y-8,r,p.a0,p.a0+Math.PI*1.6);ctx.stroke();return true}
  if(p.k==='roar'){for(let i=0;i<3;i++){const r=(1-k)*150*(0.4+i*0.3);ctx.strokeStyle=`rgba(168,50,31,${(0.6*k).toFixed(3)})`;ctx.lineWidth=3/z;ctx.beginPath();ctx.arc(p.x,p.y-10,r,0,7);ctx.stroke()}return true}
  if(p.k==='shield'){ctx.strokeStyle=`rgba(210,170,60,${(0.9*k).toFixed(3)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y-16,14+(1-k)*20,0,7);ctx.stroke();return true}
  if(p.k==='clang'){ctx.fillStyle=`rgba(255,250,220,${(0.8*k).toFixed(3)})`;ctx.beginPath();ctx.arc(p.x,p.y,3+(1-k)*14,0,7);ctx.fill();return true}
  return false}
function fdPartsFor(e){const x=e.x,y=e.y-20;const D=e.D;const P=D[e.pk];const O=P===D.a?D.b:D.a;const ang=Math.atan2(y-(O.s.y-20),x-O.s.x);

      num(String(Math.round(e.dmg)),mine?'#b0301e':'#2b2621',e.t==='hit'?13:17);if(e.t==='intr')num('断!','#6a2a90',14);if(e.t==='counter')num('反击!','#6a2a90',15);if(e.t==='break')num('破!','#b0301e',16);
      if(e.t!=='hit'&&UI.fd&&UI.fd.D===D)R.shakeT=0.22;if(UI.fd&&UI.fd.D===D)fdFlash(P);break}
    case 'block':addPart({k:'clang',x:x+(O.s.x>x?8:-8),y,life:0,max:0.25});addPart({k:'spark',x:x+(O.s.x>x?8:-8),y,a0:Math.random()*6,r:0.7,life:0,max:0.25});num('挡','#2b5a8a',12);break;
    case 'parry':addPart({k:'clang',x:x+(O.s.x>x?8:-8),y,life:0,max:0.35});addPart({k:'spark',x:x+(O.s.x>x?8:-8),y,a0:Math.random()*6,r:1.6,life:0,max:0.4});num('招架!','#2b5a8a',15);if(UI.fd&&UI.fd.D===D)R.shakeT=0.15;break;

let _fdFlashT=0;function fdFlash(P){const el=UI.fd&&UI.fd.el;if(!el)return;const me=fdMine(UI.fd.D,UI.player);const img=el.querySelector(P===me?'#fdpA img':'#fdpB img');if(!img)return;img.classList.remove('hit');void img.offsetWidth;img.classList.add('hit')}

function heroEvent(e){switch(e.k){
  case 'heroOut':{const mine=e.h.side===UI.view;addFeed(`${B.sides[e.h.side].ch}将 ${e.h.gs.name} 拍马出阵！`,(mine?'good':'bad'));addPart({k:'ring',x:e.h.cx,y:e.h.cy,r:6,life:0,max:0.8});buildCards();return true}
  case 'heroBack':{if(e.h.side===UI.view)addFeed(`${e.h.gs.name} 回归${e.u===e.h.parent?'本阵':e.u.label}`);if(UI.sel.includes(e.h)){setSel(UI.sel.filter(x=>x!==e.h).concat(e.u.side===UI.player?[e.u]:[]))}updCards();return true}
  case 'hsk':{addFeed(e.msg,(e.h.side===UI.view?'good':'bad')+' big');const s=e.h.genSol;if(s)addPart({k:'num',x:s.x,y:s.y-70,txt:HSK[e.k2].n,col:'#8a2a1a',sz:15,life:0,max:1.1});return true}
  case 'hfx':{if(e.t==='sweep'){addPart({k:'sweep',x:e.x,y:e.y,a0:Math.random()*6,life:0,max:0.45});addPart({k:'spark',x:e.x,y:e.y-10,a0:0,r:2,life:0,max:0.4})}
    else if(e.t==='roar')addPart({k:'roar',x:e.x,y:e.y,life:0,max:1});else if(e.t==='shield')addPart({k:'shield',x:e.x,y:e.y,life:0,max:0.9});else if(e.t==='wufu')addPart({k:'gold',x:e.x,y:e.y,r:8,life:0,max:1.2});else if(e.t==='dash')addPart({k:'ring',x:e.x,y:e.y,r:4,life:0,max:0.5});return true}
  case 'fdStart':{const D=e.D;const me=fdMine(D,UI.player);const nm=`${D.a.g.name} 与 ${D.b.g.name}`;
    if(me&&me.ctl==='me'){openFD(D);showBanner('阵前单挑',`${nm}两马相交！`,'',1800);if(UI.speed>1)UI.speed=1;UI.fdCam=D;fdZoom()}
    else{addFeed(`${nm} 阵前单挑！`,'big');UI.fdWatch.push(D);if(me)openFD(D)}
    return true}
  case 'fdFx':fdPartsFor(e);return true;

  case 'fdBegin':return true;
  case 'fdEnd':{const D=e.D,r=e.res;const W=r.win?D[r.win]:null,L=r.win?D[r.win==='a'?'b':'a']:null;const good=W?W.side===UI.view:null;
    const t=!W?'不分胜负':r.how==='kill'?'阵　斩':r.how==='capture'?'生　擒':r.how==='retreat'?'退　走':'败　走';

    const mineD=fdMine(D,UI.view);if(mineD||UI.fd&&UI.fd.D===D)showBanner(t,sub,'',2400);addFeed(sub,(W?(good?'good':'bad'):'')+' big');
    if(W&&(r.how==='kill'||r.how==='capture'))addPart({k:'ring',x:L.s.x,y:L.s.y,r:8,life:0,max:1.4});
    if(UI.fd&&UI.fd.D===D){fdResult(D,r,t);setTimeout(()=>{if(UI.fd&&UI.fd.D===D)closeFD()},2200)}
    UI.fdWatch=UI.fdWatch.filter(x=>x!==D);if(UI.fdCam===D)UI.fdCam=null;updCards();return true}}

function openFD(D){const el=fdEl();const me=fdMine(D,UI.player)||D.a;const foe=me===D.a?D.b:D.a;const ctlMe=me.side===UI.player;
  const img=g=>{try{return typeof portrait==='function'?portrait(g.g||g,72):''}catch(e){return ''}};

  el.innerHTML=`<div class="fdh">${side(me,'fdpA',false)}<div class="fdc"><div class="fdt">单挑</div><div class="fdtm"></div></div>${side(foe,'fdpB',true)}</div>
   ${ctlMe?`<div class="fdb">${['quick','heavy','guard','dodge'].map(k=>`<button class="fdk ${k}" data-a="${k}">${FD_ACT_TXT[k]}<small>${FD_HINT[k]}</small></button>`).join('')}${skb}</div>`:''}
   <div class="fdx">${ctlMe?`<button data-a="auto" class="fdauto">托付</button><button data-a="flee">退走</button>`:''}<button data-a="cam">镜头</button>${ctlMe?'':'<button data-a="close">关闭</button>'}</div><div class="fdres"></div>`;
  el.classList.add('show');fdMode();
  el.querySelectorAll('[data-a]').forEach(b=>{const fire=ev=>{ev.preventDefault();ev.stopPropagation();fdPress(b.dataset.a)};b.addEventListener('pointerdown',fire)});
  UI.fd={D,el,me,foe,ctlMe};fdMode();updFD()}
function fdMode(){const F=UI.fd;const el=$('#fduel');const on=!!(F&&F.ctlMe&&F.me.ctl==='me');$('#battle').classList.toggle('induel',on);if(el)el.classList.toggle('fdcompact',!on)}
function closeFD(){const el=$('#fduel');if(el){el.classList.remove('show');el.innerHTML=''}$('#battle').classList.remove('induel');UI.fd=null}

function fdActTxt(P,D){if(D.ph==='app')return '策马上前';if(P.stun>0)return '踉跄';const a=P.act;if(!a)return '';if(a.k==='heavy'&&a.hi<1)return '蓄力猛攻!';if(FD_ACT_TXT[a.k])return FD_ACT_TXT[a.k];return fdSkName(a.k)}
function updFD(force){const F=UI.fd;if(!F)return;const D=F.D,el=F.el;const t=D.ph==='fight'?Math.max(0,50-(D.t-D.t0)):50;
  const set=(id,P)=>{const box=el.querySelector('#'+id);if(!box)return;const i=box.querySelector('.fdhp i');const w=clamp(P.hp,0,100);i.style.width=w+'%';i.style.background=w>50?'#b8452c':w>25?'#c8862a':'#8a1e12';box.querySelector('.fdhp em').textContent=Math.max(0,Math.round(P.hp));
    const q=Math.floor(P.qi+1e-6);const qe=box.querySelector('.fdq');const qs='●'.repeat(q)+'○'.repeat(6-q);if(qe.textContent!==qs)qe.textContent=qs;
    const st=box.querySelector('.fds');const tx=fdActTxt(P,D);if(st.textContent!==tx)st.textContent=tx;st.className='fds'+(P.act&&(P.act.k==='heavy'||P.act.k==='huima')&&P.act.hi<1?' warn':P.stun>0?' stun':'')};
  set('fdpA',F.me);set('fdpB',F.foe);const tm=el.querySelector('.fdtm');const ts=D.ph==='fight'?Math.ceil(t)+'″':'';if(tm.textContent!==ts)tm.textContent=ts;
  if(F.ctlMe){const me=F.me;const busy=D.done||D.ph!=='fight';el.querySelectorAll('.fdk').forEach(b=>{const a=b.dataset.a;let dis=busy;if(a==='dodge')dis=dis||me.cdd>0;if(a==='sk0'||a==='sk1'){const k=me.sk[+a[2]];dis=dis||!k||me.qi<fdCost(k)-1e-6}b.classList.toggle('off',dis);b.classList.toggle('now',!!(me.act&&(me.act.k===a||(a[0]==='s'&&a[1]==='k'&&me.act.k===me.sk[+a[2]]))))});
    const au=el.querySelector('.fdauto');if(au){const on=me.ctl!=='me';if(au.classList.contains('on')!==on||force){au.classList.toggle('on',on);au.textContent=on?'亲自出招':'托付'}}}}
// 镜头：拉近并跟随
function fdZoom(){const D=UI.fdCam;if(!D)return;UI.fdZ=Math.max(R.cam.z,R.vw<R.vh?2.3:R.vh<500?1.6:2.2)}
function fdCamStep(dt){const D=UI.fdCam;if(!D)return;if(D.done){UI.fdCam=null;return}const k=Math.min(1,dt*4);
  UI.fdOffT=(UI.fdOffT||0)-dt;if(UI.fdOffT<=0){UI.fdOffT=0.4;const el=$('#fduel');let off=0;if(el&&el.classList.contains('show')){const r=el.getBoundingClientRect();off=Math.max(0,R.vh-r.top)/2}else{const bt=$('#bottom');if(bt){const r=bt.getBoundingClientRect();off=Math.max(0,R.vh-r.top)/2}}UI.fdOff=off}
  R.cam.x+=(D.cx-R.cam.x)*k;R.cam.y+=(D.cy-30+(UI.fdOff||0)/R.cam.z-R.cam.y)*k;if(UI.fdZ){R.cam.z+=(UI.fdZ-R.cam.z)*k;if(Math.abs(UI.fdZ-R.cam.z)<0.01)UI.fdZ=0}clampCam()}
// 观战小条（电脑之间的单挑）
function updWatch(){let el=$('#fdw');const L=UI.fdWatch.filter(D=>!D.done&&!(UI.fd&&UI.fd.D===D));
  if(!L.length){if(el)el.style.display='none';return}if(!el){el=document.createElement('div');el.id='fdw';$('#battle').appendChild(el);el.addEventListener('pointerdown',ev=>{const b=ev.target.closest('[data-d]');if(!b)return;ev.stopPropagation();const D=B.duels.find(x=>x.id===+b.dataset.d);if(D){UI.fdCam=D;fdZoom();openFD(D)}})}
  el.style.display='';const html=L.slice(0,2).map(D=>`<div class="fdwi" data-d="${D.id}"><b style="color:${B.sides[D.a.side].color}">${esc(D.a.g.name)}</b><span class="bar"><i style="width:${clamp(D.a.hp,0,100)}%"></i></span><em>单挑</em><span class="bar r"><i style="width:${clamp(D.b.hp,0,100)}%"></i></span><b style="color:${B.sides[D.b.side].color}">${esc(D.b.g.name)}</b><u>观战</u></div>`).join('');
  if(el._h!==html){el.innerHTML=html;el._h=html}}
function fdFrame(dt){fdCamStep(dt);if(UI.fd){if(UI.fd.D.done&&!B.duels.includes(UI.fd.D)){}updFD()}updWatch()}
function fdKey(e){const F=UI.fd;if(!F||!F.ctlMe||F.D.done)return false;const a=FD_KEYS[e.code];if(!a)return false;e.preventDefault();fdPress(a);return true}

// ================= 输入：鼠标 / 触屏 / 键盘 =================
const INP={pts:new Map(),down:null,drag:null,pinch:null,lp:null,last:{t:0,x:0,y:0,btn:''},keys:{}};
function initInput(){
  const cv=$('#cv');
  cv.addEventListener('pointerdown',pDown);window.addEventListener('pointermove',pMove);window.addEventListener('pointerup',pUp);window.addEventListener('pointercancel',pUp);
  cv.addEventListener('contextmenu',e=>e.preventDefault());cv.addEventListener('wheel',wheel,{passive:false});
  window.addEventListener('keydown',keyDown);window.addEventListener('keyup',e=>{INP.keys[e.code]=false});
  const mc=$('#mini');const mini=e=>{if(!B)return;const r=mc.getBoundingClientRect();R.cam.x=(e.clientX-r.left)/r.width*B.W;R.cam.y=(e.clientY-r.top)/r.height*B.H;clampCam()};
  mc.addEventListener('pointerdown',e=>{e.stopPropagation();mc.setPointerCapture(e.pointerId);mc._d=true;mini(e)});mc.addEventListener('pointermove',e=>{if(mc._d)mini(e)});mc.addEventListener('pointerup',()=>mc._d=false);
  $('#bPause').onclick=()=>{if(B&&B.phase==='deploy')return;UI.paused=!UI.paused;updHud()};
  $('#bSpeed').onclick=()=>{const L=[1,2,3,0.5];UI.speed=L[(L.indexOf(UI.speed)+1)%L.length];updHud()};
  $('#bAuto').onclick=()=>{if(!B||UI.player<0)return;UI.auto=!UI.auto;const sd=B.sides[UI.player];sd.ai=UI.auto;if(UI.auto){sd.aiState={provoked:B.phase!=='deploy'&&(B.t>20||sd.units.some(u=>u.engaged>0))};for(const u of sd.units)u.aiT=0}$('#bAuto').classList.toggle('on',UI.auto);addFeed(UI.auto?'已托管：AI 代为指挥我军':'已取消托管')};
  $('#bMenu').onclick=()=>{if(B)pauseMenu()};
  $('#bStart').onclick=beginBattle;$('#bAutoDeploy').onclick=autoDeployPlayer;
  $('#bAll').onclick=()=>{if(!B||UI.player<0)return;const all=B.sides[UI.player].units.filter(u=>u.st==='ok');setSel(UI.sel.length===all.length?[]:all)};
  const bm=$('#bMulti');if(bm)bm.onclick=()=>{UI.multi=!UI.multi;bm.classList.toggle('on',UI.multi)}}
function ptr(e){return {x:e.clientX,y:e.clientY}}
function pDown(e){if(!B||UI.modal||UI.duelOn)return;const cv=$('#cv');try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=ptr(e);INP.pts.set(e.pointerId,{x:p.x,y:p.y});if(e.pointerType==='touch')UI.touch=true;
  if(INP.pts.size===2){clearTimeout(INP.lp);INP.drag=null;const a=[...INP.pts.values()];const d=hyp(a[0].x-a[1].x,a[0].y-a[1].y);const mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;INP.pinch={d0:d,z0:R.cam.z,w:s2w(mx,my),mx,my};INP.down=null;INP.gestureMulti=true;return}
  if(INP.pts.size>2)return;INP.gestureMulti=false;
  const kind=e.pointerType==='mouse'?(e.button===2?'right':e.button===1?'pan':'left'):'touch';if(kind==='pan')UI.fdCam=null;
  INP.down={kind,x0:p.x,y0:p.y,x:p.x,y:p.y,t0:performance.now(),moved:false,shift:e.shiftKey||e.ctrlKey||e.metaKey,lp:false};
  if(kind==='touch'){clearTimeout(INP.lp);INP.lp=setTimeout(()=>{const d=INP.down;if(d&&!d.moved&&INP.pts.size===1){d.lp=true;if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
    INP.drag={k:UI.sel.length?'line':'box',x0:d.x0,y0:d.y0,x1:d.x,y1:d.y}}},380)}}
function pMove(e){if(!INP.pts.has(e.pointerId))return;const p=ptr(e);const prev=INP.pts.get(e.pointerId);INP.pts.set(e.pointerId,{x:p.x,y:p.y});
  if(INP.pinch&&INP.pts.size>=2){const a=[...INP.pts.values()];const d=hyp(a[0].x-a[1].x,a[0].y-a[1].y);const mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;const P=INP.pinch;
    R.cam.z=clamp(P.z0*d/(P.d0||1),0.2,3);R.cam.x=P.w[0]-(mx-R.vw/2)/R.cam.z;R.cam.y=P.w[1]-(my-R.vh/2)/R.cam.z;clampCam();return}
  const d=INP.down;if(!d)return;const dx=p.x-prev.x,dy=p.y-prev.y;d.x=p.x;d.y=p.y;
  if(!d.moved&&hyp(p.x-d.x0,p.y-d.y0)>(d.kind==='touch'?9:5)){d.moved=true;if(!d.lp)clearTimeout(INP.lp)}
  if(!d.moved)return;
  if(d.kind==='pan'||(d.kind==='touch'&&!d.lp)){UI.fdCam=null;R.cam.x-=dx/R.cam.z;R.cam.y-=dy/R.cam.z;clampCam();return}
  if(d.kind==='left'){if(!INP.drag)INP.drag={k:'box',x0:d.x0,y0:d.y0};INP.drag.x1=p.x;INP.drag.y1=p.y;return}
  if(d.kind==='right'){if(UI.sel.length){if(!INP.drag)INP.drag={k:'line',x0:d.x0,y0:d.y0};INP.drag.x1=p.x;INP.drag.y1=p.y}else{R.cam.x-=dx/R.cam.z;R.cam.y-=dy/R.cam.z;clampCam()}return}
  if(d.kind==='touch'&&d.lp&&INP.drag){INP.drag.x1=p.x;INP.drag.y1=p.y}}
function pUp(e){if(!INP.pts.has(e.pointerId))return;INP.pts.delete(e.pointerId);clearTimeout(INP.lp);
  if(INP.pinch){if(INP.pts.size<2)INP.pinch=null;INP.down=null;return}
  const d=INP.down;INP.down=null;if(!d||!B)return;const dr=INP.drag;INP.drag=null;
  if(INP.gestureMulti)return;
  if(dr&&dr.x1!=null){
    if(dr.k==='box'){const x0=Math.min(dr.x0,dr.x1),x1=Math.max(dr.x0,dr.x1),y0=Math.min(dr.y0,dr.y1),y1=Math.max(dr.y0,dr.y1);
      if(x1-x0>6||y1-y0>6){const got=B.units.filter(u=>u.side===UI.player&&u.st==='ok'&&(()=>{const [sx,sy]=w2s(u.cx,u.cy);return sx>=x0&&sx<=x1&&sy>=y0&&sy<=y1})());setSel(d.shift||UI.multi?[...new Set(UI.sel.concat(got))]:got)}}
    else if(dr.k==='line'&&UI.sel.length){const [a,b]=s2w(dr.x0,dr.y0),[c,f]=s2w(dr.x1,dr.y1);if(hyp(dr.x1-dr.x0,dr.y1-dr.y0)>14){lineMove(UI.sel,a,b,c,f,false);markDeployed()}else tap(d.x,d.y,d.kind==='touch'?'touch':'right',d.shift)}
    return}
  if(d.moved)return;
  tap(d.x0,d.y0,d.kind,d.shift)}
function hitUnit(sx,sy){for(let i=R.labels.length-1;i>=0;i--){const L=R.labels[i];if(sx>=L.x-3&&sx<=L.x+L.w+3&&sy>=L.y-3&&sy<=L.y+L.h+3)return L.u}
  if(B.phase==='deploy')rebuild();const [wx,wy]=s2w(sx,sy);
  {let hb=null,hd=1e9;const pad=Math.max(0,8/R.cam.z-6);for(const u of B.units){if(!u.isHero||u.st!=='ok'||!u.genSol)continue;const s=u.genSol;const dx=Math.abs(wx-s.x),dy=wy-s.y;if(dx<16+pad&&dy>-58-pad&&dy<6+pad){const d=dx+Math.abs(dy+24);if(d<hd){hd=d;hb=u}}}if(hb)return hb}const buf=[];const r=Math.max(9,16/R.cam.z);const n=solNear(wx,wy+6,r,buf);let best=null,bd=1e9;
  for(let i=0;i<n;i++){const s=buf[i];if(!s.alive)continue;const d=hyp(s.x-wx,s.y-6-wy);if(d<bd){bd=d;best=s}}
  const u=best&&best.u;return u&&(u.st==='ok'||u.st==='rout')?u:null}
function tap(sx,sy,kind,shift){if(UI.player<0){const u=hitUnit(sx,sy);if(u)unitInfo(u);return}
  const now=performance.now();const dbl=now-INP.last.t<340&&hyp(sx-INP.last.x,sy-INP.last.y)<28&&INP.last.btn===kind;INP.last={t:dbl?0:now,x:sx,y:sy,btn:kind};
  const u=hitUnit(sx,sy);const me=UI.player;const [wx,wy]=s2w(sx,sy);
  if(kind==='left'){
    if(u&&u.side===me){if(shift||UI.multi)toggleSel(u);else setSel([u]);return}
    if(u&&u.side!==me){if(UI.sel.length&&B.phase==='battle'){orderAttack(u,dbl)}else unitInfo(u);return}
    if(!UI.sel.length)return;if(B.phase==='deploy'){groupMove(UI.sel,wx,wy,false);markDeployed();return}setSel([]);return}
  if(kind==='right'){if(!UI.sel.length)return;if(u&&u.side!==me){if(B.phase==='battle')orderAttack(u,dbl);return}if(u&&u.side===me&&!dbl){toggleSel(u);return}groupMove(UI.sel,wx,wy,dbl);markDeployed();if(dbl&&B.phase==='battle')addFeed('跑步前进！');return}
  // touch
  if(u&&u.side===me){if(UI.multi)toggleSel(u);else if(UI.sel.length===1&&UI.sel[0]===u&&dbl){}else setSel([u]);return}
  if(u&&u.side!==me){if(UI.sel.length&&B.phase==='battle')orderAttack(u,dbl);else unitInfo(u);return}
  if(UI.sel.length){groupMove(UI.sel,wx,wy,dbl);markDeployed();addPart({k:'ring',x:wx,y:wy,r:4,life:0,max:0.5});if(dbl&&B.phase==='battle')addFeed('跑步前进！')}}
function markDeployed(){if(B.phase==='deploy')rebuild()}
function orderAttack(t,run){const us=UI.sel.filter(u=>u.st==='ok');us.forEach(u=>oAttack(u,t,run||u.run));addPart({k:'ring',x:t.cx,y:t.cy,r:6,life:0,max:0.6});
  const rng=us.filter(u=>u.T.range).length;if(us.length)addFeed(rng===us.length?`放箭：${uName(t)}`:`${run?'冲击':'进攻'}：${B.sides[t.side].ch}·${uName(t)}`)}
function unitInfo(u){const T=u.T;addFeed(`${B.sides[u.side].ch}·${u.gs?u.gs.name+' ':''}${u.label} ${u.n}人 · 士气${Math.round(u.mor)} · ${ROLE_NAME[T.role]} 攻${T.MA}防${T.MD}${u.gs?` · 武${u.gs.w}统${u.gs.t}`:''}`)}
function wheel(e){if(!B)return;e.preventDefault();const k=e.deltaY<0?1.12:1/1.12;const [wx,wy]=s2w(e.clientX,e.clientY);R.cam.z=clamp(R.cam.z*k,0.2,3);R.cam.x=wx-(e.clientX-R.vw/2)/R.cam.z;R.cam.y=wy-(e.clientY-R.vh/2)/R.cam.z;clampCam()}
function keyDown(e){if(!B||$('#battle').style.display==='none'||UI.modal)return;if(!e.ctrlKey&&!e.metaKey&&fdKey(e))return;INP.keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();if(B.phase==='battle'){UI.paused=!UI.paused;updHud()}return}
  if(e.code==='Escape'){setSel([]);return}
  if(e.code==='KeyA'&&(e.ctrlKey||e.metaKey)){e.preventDefault();setSel(B.sides[UI.player]?B.sides[UI.player].units.filter(u=>u.st==='ok'):[]);return}
  if(e.ctrlKey||e.metaKey)return;
  const m={KeyC:'charge',KeyV:'volley',KeyH:'hold',KeyF:'fire',KeyR:'rally',KeyG:'duel',KeyT:'gsk',KeyQ:'out',KeyB:'back',KeyZ:'hs0',KeyX:'hs1'};if(m[e.code]){useAbil(m[e.code]);return}
  if(e.code==='Equal'||e.code==='NumpadAdd'){R.cam.z=clamp(R.cam.z*1.15,0.2,3);clampCam()}if(e.code==='Minus'||e.code==='NumpadSubtract'){R.cam.z=clamp(R.cam.z/1.15,0.2,3);clampCam()}}
function keyPan(dt){const k=INP.keys;const v=600*dt/R.cam.z;let dx=0,dy=0;if(k.KeyW||k.ArrowUp)dy-=v;if(k.KeyS||k.ArrowDown)dy+=v;if(k.KeyA||k.ArrowLeft)dx-=v;if(k.KeyD||k.ArrowRight)dx+=v;if(dx||dy){R.cam.x+=dx;R.cam.y+=dy;clampCam()}}

// ================= 主循环 =================
UI.acc=0;UI.miniT=0;
function frame(now){requestAnimationFrame(frame);
  if(!B||$('#battle').style.display==='none'||!R.terr){UI.lastFrame=now;return}
  let dt=(now-(UI.lastFrame||now))/1000;UI.lastFrame=now;if(dt>0.25)dt=0.25;
  keyPan(dt);
  const run=(B.phase==='battle'||B.phase==='end')&&!UI.paused&&!UI.modal&&!UI.duelOn&&!B.duel&&!B.ask;
  if(run){UI.acc+=dt*UI.speed;let n=0;const cap=UI.fast?70:10;while(UI.acc>=DT&&n<cap){step();UI.acc-=DT;n++;if(UI.fast)B.ev=B.ev.filter(e=>e.k!=='dead'&&e.k!=='stick')}if(n>=cap)UI.acc=0}
  const alpha=run?clamp(UI.acc/DT,0,1):1;
  processEvents();spawnDust();fdFrame(dt);
  const r0=performance.now();render(alpha,run?dt*UI.speed:dt*0.25);
  // 自适应清晰度：渲染过慢时降低像素比
  UI.rAvg=(UI.rAvg||0)*0.95+(performance.now()-r0)*0.05;UI.rChk=(UI.rChk||0)+dt;if(UI.rChk>2){UI.rChk=0;if(UI.rAvg>22&&R.dprCap>1){R.dprCap=Math.max(1,R.dprCap-0.5);onResize()}}
  UI.miniT-=dt;if(UI.miniT<=0){UI.miniT=0.2;drawMini($('#mini'))}
  UI.hudT-=dt;if(UI.hudT<=0){UI.hudT=0.25;updHud()}
  if(UI.fast&&B.result){UI.fast=false;UI.speed=1}}
function onResize(){if(!B||!R.cv)return;resizeRender();const mc=$('#mini');mc.width=Math.round(mc.clientWidth*R.dpr);mc.height=Math.round(mc.clientHeight*R.dpr);clampCam()}
function boot(){UI.touch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
  if(!UI.touch)$('#bMulti').style.display='none';
  $('#bBackM2').onclick=()=>{$('#bmenu').style.display='none';const t=document.getElementById('title');if(t)t.style.display='block'};
  buildMenu();if(!EMBED)show('bmenu');initRender($('#cv'));initInput();window.addEventListener('resize',()=>setTimeout(onResize,60));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
  requestAnimationFrame(frame)}
boot();

return {fight:mzbFight,openMenu:mzbOpenMenu,_dbg:()=>({B,SG,UI,R}),_duel:(a,b)=>startDuel(a,b),_gsk:u=>oGsk(u),_gskOK:u=>gskOK(u),_api:()=>({oHeroOut,oHeroBack,oAttack,oMove,oHsk,hskOK,startDuel,oDuel,fdInput,setSel,useAbil,answerDuel,genOf,duelCandidates})};
})();
