<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241d17">
<title>三国墨战 · 天下篇</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--paper:#efe4cb;--paper2:#e4d6b6;--paper3:#f6eedc;--ink:#2a2622;--ink2:#5a4e40;--seal:#a8321f;--gold:#c9a24a;--green:#3f6e4a;--desk:#1f1914;
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
button{font-family:var(--serif);font-size:14px;color:var(--ink);background:var(--paper3);border:1px solid var(--ink2);border-radius:6px;padding:7px 12px;cursor:pointer;line-height:1.2}
button:hover:not(:disabled){background:#fff8e8}button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.red{background:var(--seal);color:#f6eedc;border-color:#6a1a10}button.red:hover:not(:disabled){background:#bb3a24}
button.ink{background:var(--ink);color:#efe4cb;border-color:#000}
button.sm{padding:4px 8px;font-size:12.5px}
.screen{display:none;position:fixed;inset:0}
.seal{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--seal);color:#f6eedc;font-weight:700;border-radius:3px;font-size:18px;flex:none}
/* 标题 */
#title{overflow:auto;background:radial-gradient(ellipse at 50% 30%,#efe4cb 0%,#d9c9a4 70%,#b8a47c 100%)}
#title .wrap{max-width:1080px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;align-items:center}
#title h1{font-size:64px;letter-spacing:14px;margin:8px 0 0;font-weight:900;color:var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.08)}
#title .sub{letter-spacing:4px;color:var(--ink2);margin:6px 0 4px}
#title .stamp{display:inline-block;background:var(--seal);color:#f6eedc;padding:4px 10px;font-weight:700;letter-spacing:3px;border-radius:3px;margin:10px 0 18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;width:100%}
.fcard{background:rgba(246,238,220,.9);border:1px solid var(--ink2);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative}
.fcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.18);background:#fffaf0}
.fcard .top{display:flex;gap:10px;align-items:center}.fcard img{width:56px;height:70px;border-radius:4px}
.fcard h3{margin:0;font-size:20px}.fcard p{margin:0;font-size:13px;line-height:1.55;color:var(--ink2)}
.fcard .stats{font-size:12.5px;color:var(--ink)}.stars{color:var(--seal);letter-spacing:1px}
.tbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
/* 游戏 */
#game{display:none;flex-direction:column}
#top{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:#241d17;color:#efe4cb;border-bottom:2px solid #000;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:5}
#top .tinfo{display:flex;flex-direction:column;line-height:1.15}#top .tinfo b{font-size:15px}#top .tinfo span{font-size:12px;color:#cdbf9f}
#top .res{display:flex;gap:12px;font-size:13.5px;white-space:nowrap}#endBtn{white-space:nowrap}#top .res b{color:#f3d27a;font-weight:700}#top .res i{font-style:normal;font-size:11.5px;margin-left:2px}
.pos{color:#8fd08f}.neg{color:#ff8f7a}
#top .spacer{flex:1}#top nav{display:flex;gap:6px}#top nav button,#menuBtn{background:#3a3027;color:#efe4cb;border-color:#5a4a3a}
#menuBtn{display:none}
#main{flex:1;display:flex;min-height:0;position:relative}
#mapbox{flex:1;position:relative;min-width:0;overflow:hidden}
#map{display:block;touch-action:none;cursor:grab}
#zoomCtl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}#zoomCtl button{width:38px;height:38px;padding:0;font-size:18px;background:rgba(246,238,220,.92)}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4}
#toast div{background:rgba(42,38,34,.9);color:#f6eedc;padding:7px 14px;border-radius:6px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#busy{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(168,50,31,.95);color:#f6eedc;padding:8px 18px;border-radius:20px;font-size:14px;display:none;z-index:40;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#side{width:360px;flex:none;background:var(--paper);border-left:2px solid #000;display:flex;flex-direction:column;min-height:0;box-shadow:-3px 0 10px rgba(0,0,0,.25)}
#sideHandle{display:none}
#sideBody{flex:1;overflow:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ph h3{margin:0;font-size:19px}.ph small{color:var(--ink2);font-size:12.5px}.ph .x{margin-left:auto;padding:3px 9px}
.sec{margin:12px 0 6px;font-weight:700;font-size:14px;border-bottom:1px solid rgba(90,78,64,.35);padding-bottom:3px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-weight:400;color:var(--ink2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:13.5px}.kv b{font-weight:700}
.bar{height:7px;background:rgba(90,78,64,.2);border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper2);border:1px solid rgba(90,78,64,.4);border-radius:12px;padding:3px 8px;font-size:12.5px}
.chip .u{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;background:var(--ink);color:#efe4cb;border-radius:3px;font-size:11px;font-weight:700}
.gchip{display:inline-flex;align-items:center;gap:6px;background:var(--paper3);border:1px solid rgba(90,78,64,.45);border-radius:6px;padding:3px 7px 3px 3px;font-size:13px;cursor:pointer}
.gchip img{width:26px;height:32px;border-radius:3px}.gchip small{color:var(--ink2);font-size:11px}
.gchip:hover{background:#fff8e8}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.acts button{padding:8px 4px}
.seg{display:inline-flex;border:1px solid var(--ink2);border-radius:6px;overflow:hidden}.seg button{border:none;border-radius:0;padding:5px 12px;background:var(--paper3)}.seg button.on{background:var(--ink);color:#efe4cb}
.blds{display:flex;flex-wrap:wrap;gap:5px}.blds span{font-size:12px;background:var(--paper2);padding:2px 7px;border-radius:4px}
.log{font-size:12.5px;line-height:1.6;color:var(--ink2)}.log div{border-bottom:1px dotted rgba(90,78,64,.25);padding:2px 0}.log b{color:var(--ink);font-weight:400}
.todo{font-size:13px;line-height:1.7}.todo a{color:var(--seal);cursor:pointer;text-decoration:underline}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}
.armyrow{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid rgba(90,78,64,.3);border-radius:6px;margin-bottom:5px;cursor:pointer;background:var(--paper3)}
.armyrow:hover{background:#fff8e8}
.hint{font-size:12.5px;color:var(--ink2);background:rgba(168,50,31,.07);border-left:3px solid var(--seal);padding:6px 8px;margin-top:8px;line-height:1.5}
/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(10,8,6,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.mbox{background:var(--paper);width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative}
.mbox:before,.mbox:after{content:'';position:absolute;left:-8px;right:-8px;height:12px;background:linear-gradient(#6a4428,#3a2414);border-radius:6px}.mbox:before{top:-8px}.mbox:after{bottom:-8px}
.mbox .mh{padding:16px 18px 6px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
.mbox .mc{padding:4px 18px 10px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
.mbox .mf{padding:10px 18px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mbox .mf button{min-width:88px;padding:9px 14px}
.mbox.wide{max-width:760px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:5px 4px;border-bottom:1px solid rgba(90,78,64,.25);text-align:left;white-space:nowrap}table.t th{font-weight:700;color:var(--ink2);font-size:12px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(90,78,64,.22)}
.stepper{display:inline-flex;align-items:center;gap:4px}.stepper button{width:32px;height:30px;padding:0}.stepper b{min-width:54px;text-align:center}
.report .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.report .side{background:var(--paper3);border:1px solid rgba(90,78,64,.35);border-radius:6px;padding:8px;display:flex;gap:8px}
.report .side img{width:48px;height:60px;border-radius:3px}
.report .lines p{margin:4px 0;text-indent:2em}
.stampbig{position:absolute;right:22px;top:14px;border:3px solid var(--seal);color:var(--seal);font-weight:900;font-size:26px;padding:2px 10px;transform:rotate(-12deg);border-radius:6px;opacity:.85}
.ev{display:flex;gap:14px;align-items:flex-start}.ev img{width:120px;height:150px;border-radius:4px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.statbars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.statbars .bar{margin:0;height:9px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;color:#f6eedc}
.b-war{background:#a8321f}.b-peace{background:#7a7064}.b-truce{background:#b8862a}.b-ally{background:#3f6e4a}
textarea{width:100%;min-height:90px;font-family:monospace;font-size:11px;background:var(--paper3);border:1px solid var(--ink2);border-radius:4px;padding:6px}
select{font-family:var(--serif);font-size:14px;padding:6px;background:var(--paper3);border:1px solid var(--ink2);border-radius:4px}
/* 手机竖屏：底部抽屉 */
@media (max-width:899px){
  #top{height:auto;min-height:48px;padding:5px 8px;gap:8px;flex-wrap:nowrap}
  #top nav{display:none}#menuBtn{display:inline-block;padding:6px 10px}
  #top .res{gap:8px;font-size:12.5px}.hide-s{display:none}
  #top .tinfo b{display:none}#top .tinfo span{white-space:nowrap;font-size:12px;color:#efe4cb}#endBtn{padding:7px 10px;white-space:nowrap;font-size:13px}#top .res i{display:none}
  #side{position:absolute;left:0;right:0;bottom:0;width:auto;height:46vh;border-left:none;border-top:2px solid #000;border-radius:12px 12px 0 0;transition:height .2s;z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
  #side.collapsed{height:44px}
  #sideHandle{display:flex;height:22px;align-items:center;justify-content:center;flex:none;cursor:pointer}#sideHandle span{width:44px;height:5px;border-radius:3px;background:var(--ink2);opacity:.6}
  #side.collapsed #sideBody{overflow:hidden}
  #sideBody{padding:4px 12px 16px}
  #zoomCtl{bottom:auto;top:10px}
  .acts{grid-template-columns:repeat(3,1fr)}
  #title h1{font-size:46px;letter-spacing:8px}
  .mbox .mc{padding:4px 14px 10px}.ev img{width:90px;height:112px}
}
/* 手机横屏：右侧窄栏 */
@media (max-height:520px) and (orientation:landscape){
  #top{height:42px}#top nav{display:none}#menuBtn{display:inline-block}.hide-s{display:none}
  #side{position:static;width:300px;height:auto;border-radius:0;border-top:none;border-left:2px solid #000}#side.collapsed{height:auto}#sideHandle{display:none}
  .mbox{max-height:94vh}
}
/* ===== 全国篇 ===== */
#tmap{width:100%;max-width:760px;border:1px solid var(--ink2);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);margin:0 0 16px;display:block}
#mini2{position:absolute;right:10px;top:10px;border:1px solid rgba(42,38,34,.8);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.35);background:#e8dcc1;touch-action:none;cursor:pointer;opacity:.95}
.fgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fcard p{font-size:12.5px}
@media (max-width:899px){#mini2{right:auto;left:8px;top:8px}}
@media (max-height:520px) and (orientation:landscape){#mini2{right:auto;left:8px;top:8px}}
.fcard.hot{box-shadow:0 0 0 3px var(--seal),0 4px 14px rgba(0,0,0,.2);background:#fffaf0}
#tmap{cursor:pointer}
.statbars .bar{position:relative}.statbars .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:rgba(168,50,31,.55);text-decoration:none}

/* ===== 即时会战（M1 模块） ===== */
.mzb{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:#2b2621;box-sizing:border-box}.mzb *{box-sizing:border-box}
.mzb{--paper:#efe4ca;--paper2:#e4d6b4;--paper3:#f6eedb;--ink:#2b2621;--ink2:#5a4e40;--red:#a8321f;--gold:#b8862a;--blue:#4f6a8f;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
.mzb button{font-family:inherit;cursor:pointer;border:1px solid var(--ink2);background:var(--paper3);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:14px;touch-action:manipulation}
.mzb button:active{transform:translateY(1px)}
.mzb button.red{background:var(--red);color:#f6eedb;border-color:#6e1e12;font-weight:700}
.mzb button:disabled{opacity:.4;cursor:default}
.mzb .seal{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--red);color:#f6eedb;font-weight:900;border-radius:3px;font-size:13px;flex:none}
.mzb.screen{position:fixed;inset:0;display:none}
/* ---------- 菜单 ---------- */
#bmenu{overflow-y:auto;background:radial-gradient(ellipse at 30% 20%,#f3e9d2 0%,#e4d6b4 55%,#c9b68e 100%)}
#bmenu::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 90%,rgba(60,55,45,.18),transparent 40%),radial-gradient(circle at 10% 80%,rgba(80,95,80,.14),transparent 35%)}
.mzb .mwrap{position:relative;max-width:560px;margin:0 auto;padding:calc(28px + var(--sat)) 16px calc(30px + var(--sab))}
.mzb h1{font-size:54px;font-weight:900;letter-spacing:10px;text-align:center;margin:6px 0 0;text-shadow:2px 2px 0 rgba(168,50,31,.18)}
.mzb .sub{text-align:center;letter-spacing:6px;color:var(--ink2);margin:4px 0 20px}
.mzb .bcard{background:rgba(246,238,219,.88);border:1px solid rgba(43,38,33,.45);border-radius:8px;padding:14px;margin:12px 0;box-shadow:0 2px 0 rgba(43,38,33,.12)}
.mzb .bcard.slim{padding:10px 14px}
.mzb .ctitle{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mzb .ctitle small{font-size:12px;font-weight:400;color:var(--ink2);margin-left:auto}
.mzb .intro{font-size:14px;line-height:1.75;margin:6px 0 10px;color:#3a322a}
.mzb .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mzb .row button{flex:1;min-width:120px;padding:10px}
.mzb button.fac{display:flex;align-items:center;justify-content:center;gap:8px;border-color:var(--c);font-weight:700}
.mzb .opt{display:flex;align-items:center;gap:8px;margin:7px 0}
.mzb .opt label{width:34px;font-size:13px;color:var(--ink2);flex:none}
.mzb .seg{display:flex;flex-wrap:wrap;gap:5px}
.mzb .seg button{padding:5px 9px;font-size:13px}
.mzb .seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mzb .seg button .seal{width:16px;height:16px;font-size:10px;margin-right:4px}
.mzb .foot{text-align:center;font-size:12px;color:var(--ink2)}
/* ---------- 战场 ---------- */
#battle{background:#2a241d;touch-action:none}
.mzb #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mzb #hTop{position:absolute;left:calc(8px + var(--sal));top:calc(8px + var(--sat));display:flex;gap:8px;align-items:center;background:rgba(244,236,214,.92);border:1px solid rgba(43,38,33,.5);border-radius:6px;padding:6px 10px 6px 6px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mzb #hTop .seal{width:40px;height:40px;font-size:26px;border-radius:4px}
.mzb .hrow{display:flex;align-items:center;gap:6px;font-size:14px}
.mzb .hrow b{font-weight:700;white-space:nowrap}
.mzb .bar2{display:flex;width:170px;height:7px;border:1px solid rgba(43,38,33,.4);background:#ccc}
.mzb .bar2 i{display:block;height:100%}
.mzb .hinfo{display:flex;gap:9px;font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap}
.mzb #hTitle{display:none;font-weight:700;color:var(--ink)}
.mzb #hMor{letter-spacing:-1px}
.mzb #plaque{position:absolute;right:calc(8px + var(--sar));top:calc(8px + var(--sat));background:rgba(244,236,214,.94);border:3px double rgba(43,38,33,.7);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mzb #plT{display:flex;flex-direction:column;align-items:center;font-size:34px;font-weight:900;line-height:1.12;white-space:nowrap}
.mzb .pseal{display:flex;flex-direction:column;align-items:center;background:var(--red);color:#f6eedb;font-size:12px;padding:5px 3px;border-radius:2px;font-weight:700;line-height:1.15}
.mzb #ctl{position:absolute;top:calc(8px + var(--sat));right:calc(76px + var(--sar));display:flex;gap:5px}
.mzb #ctl button{min-width:40px;height:34px;padding:0 9px;background:rgba(244,236,214,.94);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mzb #ctl button.on{background:var(--ink);color:var(--paper)}
.mzb #mini{position:absolute;right:calc(8px + var(--sar));bottom:calc(128px + var(--sab));width:200px;height:133px;border:2px solid rgba(43,38,33,.75);background:#e8dbb9;box-shadow:0 2px 6px rgba(0,0,0,.3);touch-action:none}
.mzb #feed{position:absolute;left:calc(8px + var(--sal));top:calc(76px + var(--sat));width:290px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.mzb #feed div{background:rgba(244,236,214,.9);border-left:4px solid var(--ink);padding:4px 9px;font-size:13px;border-radius:0 4px 4px 0;animation:mzbFin .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mzb #feed div.good{border-color:#3f6e4a}.mzb #feed div.bad{border-color:var(--red)}.mzb #feed div.big{font-weight:700;font-size:14px}
@keyframes mzbFin{from{opacity:0;transform:translateX(-10px)}}
.mzb #banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0;transition:opacity .5s}
.mzb #banner.show{opacity:1}
.mzb #banner .bt{font-size:40px;font-weight:900;letter-spacing:8px;color:#f6eedb;text-shadow:0 0 12px rgba(0,0,0,.8),2px 2px 0 var(--red)}
.mzb #banner .bs{font-size:16px;color:#f6eedb;text-shadow:0 0 8px rgba(0,0,0,.9);margin-top:6px;max-width:80vw}
.mzb #deployBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(124px + var(--sab));background:rgba(244,236,214,.95);border:1px solid rgba(43,38,33,.6);border-radius:8px;padding:8px 10px;display:none;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(0,0,0,.35);max-width:94vw}
.mzb .dtxt{font-size:13px}
.mzb .dbtns{display:flex;gap:6px;flex:none}
.mzb #bStart{font-size:16px;padding:8px 18px}
.mzb #bottom{position:absolute;left:0;right:0;bottom:0;padding:0 calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}

(function finishCities(){
  const facOf=id=>FACTIONS.find(f=>f.id===id);const r100=v=>Math.max(0,Math.round(v/100)*100);
  const CAVF=['lb','mt','gsz','yshao','cao','zx','lj','wh','xn','xb','jh','qh'];
  for(const c of CITIES){const F=facOf(c.owner);const fl=c.fl;c.cap=fl.includes('cap');c.pass=fl.includes('pass')||fl.includes('ai');c.ai=fl.includes('ai');c.bar=fl.includes('bar');c.isle=fl.includes('isle');
    const lc=fl.find(x=>x.startsWith('loc='));c.loc=lc?lc.slice(4).split('/'):[];const pv=fl.find(x=>x.startsWith('prov='));c.prov=pv?pv.slice(5):'化外';
    const p=c.pop;const b={wall:c.wall,farm:0,market:0,barracks:0,stable:0};
    if(!c.pass){b.farm=p>=45?3:p>=25?2:1;b.market=c.bar?0:p>=50?3:p>=30?2:1;b.barracks=c.cap?(c.bar?1:3):p>=35?2:1;
      let st=(c.lat>=34||c.lon<=107)?1:0;if(c.cap)st++;if(CAVF.includes(c.owner))st++;if(c.lat<28&&!c.loc.includes('xiang'))st=Math.min(st,1);b.stable=clamp0(st,0,3)}
    c.b=b;
    // 驻军
    let tot,style;if(c.pass){tot=(c.ai?2500:3500)+(F&&F.major?1500:0);style=F&&F.major?GAR_STYLE[F.region]:GAR_STYLE['豪强']}
    else{tot=(p*75+c.wall*500)*(c.cap?1.6:1)*(F&&F.major?1:c.bar?1.25:0.75);style=F&&F.major?GAR_STYLE[F.region]:GAR_STYLE['豪强']}
    const g={};
    if(c.bar&&c.loc.length){const lu=c.loc[0];g[lu]=r100(tot*0.55);g.dao=r100(tot*0.25);g.gong=r100(tot*0.2);if(c.loc[1])g[c.loc[1]]=r100(tot*0.2)}
    else for(const[t,v]of Object.entries(style))g[t]=r100(tot*v);
    if(c.cap&&FAC_ELITE[c.owner])for(const[t,v]of Object.entries(FAC_ELITE[c.owner]))g[t]=(g[t]||0)+v;
    for(const t in g)if(!g[t])delete g[t];c.gar=g}
  function clamp0(v,a,b){return Math.max(a,Math.min(b,v))}
})();

  REL_INIT.forEach(([a,b,st,v])=>{const k=a<b?a+'|'+b:b+'|'+a;s.rel[k]={st,v,t:0}});

function attackStatus(a,b){if(a===b)return 'no';if(!isMajor(b)||!isMajor(a))return 'ok';const r=rel(a,b);if(r.st==='war')return 'ok';if(r.st==='peace')return 'declare';return 'no'}

function gs(g){ // 有效五维（含宝物）
  if(typeof g==='string')g=S.gens[g];const s=[...g.s];g.items.forEach(i=>{const e=ITEMS[i]&&ITEMS[i].eff||{};if(e.t)s[0]+=e.t;if(e.w)s[1]+=e.w;if(e.z)s[2]+=e.z;if(e.p)s[3]+=e.p;if(e.m)s[4]+=e.m});return s.map(v=>Math.min(v,110))}
const hasT=(g,t)=>(typeof g==='string'?S.gens[g]:g).traits.includes(t);

function armyCap(a){const L=S.gens[a.gens[0]];if(!L)return 3000;return 3000+gs(L)[0]*100+(hasT(L,'统帅')?3000:0)+rankCapBonus(L)}
function armyMP(a){let mp=1;const t=a.troops;const tot=sumT(t);let cav=0;for(const k in t)if(isCavT(k))cav+=t[k];if(tot>0&&cav>=tot*0.999)mp++;if(a.gens.some(id=>{const g=S.gens[id];return g.items.some(i=>ITEMS[i]&&ITEMS[i].mp)}))mp++;return Math.min(mp,3)}
function unitPow(t){return (UNITS[t].atk+UNITS[t].def)/2}
function troopPow(tr){return Object.entries(tr).reduce((s,[t,n])=>s+n/1000*unitPow(t),0)}
function sidePow(tr,gens){const T=gens.length?Math.max(...gens.map(id=>gs(id)[0])):40;const W=gens.length?Math.max(...gens.map(id=>gs(id)[1])):40;return troopPow(tr)*(0.7+T/200)*(1+Math.max(0,W-70)/300)}
function cityDefenders(cid){const c=S.cities[cid];const tr={...c.gar};const gens=gensInCity(cid,c.owner).map(g=>g.id);armiesAt(cid).filter(a=>!a.siege&&a.f===c.owner).forEach(a=>{for(const[t,n]of Object.entries(a.troops))tr[t]=(tr[t]||0)+n;gens.push(...a.gens)});return{tr,gens}}
function cityDefPow(cid){const c=S.cities[cid];const d=cityDefenders(cid);return sidePow(landTr(d.tr),d.gens)*(1+0.16*c.b.wall)+ (c.pass?2:0)}

function unitAvail(f,c,t){const u=UNITS[t];if(!u)return false;const local=c.loc&&c.loc.includes(t);if(u.f&&!u.f.includes(f)&&!local)return false;if(local&&!(u.f&&u.f.includes(f)))return true;for(const[k,v]of Object.entries(u.req))if((c.b[k]||0)<v)return false;return true}
function unitsFor(f,c){return UNIT_ORDER.filter(t=>unitAvail(f,c,t))}

function govBonus(c){const g=c.gov&&S.gens[c.gov];if(!g||g.dead||!g.loc||g.loc.id!==c.id||g.f!==c.owner)return 1;const s=gs(g);return 1+(s[3]-50)/250+(hasT(g,'治世')?0.15:0)}

  citiesOf(f).forEach(c=>add(c.gar,1));armiesOf(f).forEach(a=>{const c=S.cities[a.at];add(a.troops,(c.owner===f&&!a.siege)?1:1.3)});if(S.fac[f].major)g+=salary(f);return{g,gr}}

function canBuild(c,k){const lv=c.b[k]||0;if(k==='port'&&(!c.portOK||lv>=3))return false;return !c.pass&&!c.build&&lv<5&&S.fac[c.owner].gold>=BUILD_COST[lv+1]}

function formArmy(cid,gids,troops){const c=S.cities[cid];if(!gids.length)return null;const tot=sumT(troops);if(tot<=0)return null;
  for(const[t,n]of Object.entries(troops)){if((c.gar[t]||0)<n)return null}
  const id='a'+(S.nextArmy++);const a={id,f:c.owner,at:cid,siege:false,siegeT:0,gens:[...gids],troops:{},morale:90,mp:0,from:cid};
  for(const[t,n]of Object.entries(troops)){if(n<=0)continue;c.gar[t]-=n;if(c.gar[t]<=0)delete c.gar[t];a.troops[t]=n}
  gids.forEach(g=>{S.gens[g].loc={t:'a',id};if(c.gov===g)c.gov=null});a.mp=armyMP(a);S.armies[id]=a;return a}
function disbandArmy(aid,toCity){const a=S.armies[aid];if(!a)return;const cid=toCity||a.at;const c=S.cities[cid];
  if(c&&c.owner===a.f){for(const[t,n]of Object.entries(a.troops))c.gar[t]=(c.gar[t]||0)+n;a.gens.forEach(g=>{S.gens[g].loc={t:'c',id:cid}})}
  else{a.gens.forEach(g=>{const gg=S.gens[g];const home=nearestOwnCity(a.f,a.at);if(home)gg.loc={t:'c',id:home};else freeGen(gg,a.at)})}
  delete S.armies[aid]}
function armyTake(aid,troops){const a=S.armies[aid];const c=S.cities[a.at];if(c.owner!==a.f)return false;let tot=sumT(a.troops)+sumT(troops);if(tot>armyCap(a))return false;
  for(const[t,n]of Object.entries(troops)){if((c.gar[t]||0)<n)return false}for(const[t,n]of Object.entries(troops)){if(n<=0)continue;c.gar[t]-=n;if(c.gar[t]<=0)delete c.gar[t];a.troops[t]=(a.troops[t]||0)+n}return true}
function armyDrop(aid,troops){const a=S.armies[aid];const c=S.cities[a.at];if(c.owner!==a.f)return false;for(const[t,n]of Object.entries(troops)){const m=Math.min(n,a.troops[t]||0);if(m<=0)continue;a.troops[t]-=m;if(a.troops[t]<=0)delete a.troops[t];c.gar[t]=(c.gar[t]||0)+m}if(sumT(a.troops)<=0)disbandArmy(aid);return true}
function freeGen(g,cid){g.f='free';g.loc=null;g.home=cid||g.home;g.appear=Math.min(g.appear||S.year,S.year);g.loy=0}
function nearestOwnCity(f,from){const seen={[from]:1};let q=[from];while(q.length){const nq=[];for(const id of q){if(S.cities[id].owner===f&&id!==from)return id;for(const n of nb(id))if(!seen[n]){seen[n]=1;nq.push(n)}}q=nq}const any=citiesOf(f)[0];return any?any.id:null}
function reachable(aid){ // 可到达节点：{id: 'move'|'attack'|'field'}
  const a=S.armies[aid];const out={};if(!a||a.mp<=0||a.siege)return out;
  const walk=(id,mp)=>{for(const n of nb(id)){const c=S.cities[n];if(friendly(a.f,c.owner)){const bs=besiegers(n).filter(b=>attackStatus(a.f,b.f)!=='no');if(bs.length&&c.owner===a.f){out[n]=out[n]||'move'}else if(!out[n])out[n]='move';if(mp>1&&!bs.length)walk(n,mp-1)}else{if(attackStatus(a.f,c.owner)!=='no'&&!out[n])out[n]='attack'}}};

  const here=besiegers(a.at).filter(b=>b.f!==a.f&&attackStatus(a.f,b.f)!=='no');if(here.length)out[a.at]='field';
  return out}
function moveArmy(aid,to){const a=S.armies[aid];const r=reachable(aid);if(r[to]!=='move')return false;const path=pathTo(a,to);a.mp-=path;a.from=a.at;a.at=to;return true}

// ---------- 战斗 ----------
function mkSide(f,tr,gens,morale){const G=gens.filter(id=>S.gens[id]&&!S.gens[id].dead);const st=G.map(gs);const best=(i)=>G.length?G.reduce((b,id,k)=>st[k][i]>gs(b)[i]?id:b,G[0]):null;
  const T=G.length?Math.max(...st.map(s=>s[0])):35,W=G.length?Math.max(...st.map(s=>s[1])):35,Z=G.length?Math.max(...st.map(s=>s[2])):35,M=G.length?Math.max(...st.map(s=>s[4])):35;
  return{f,tr:{...tr},gens:G,T,W,Z,M,lead:best(0),champ:best(1),sage:best(2),init:sumT(tr),morale:clamp((morale??80)+(M-60)/6+(G.some(id=>hasT(id,'统帅'))?6:0),30,100),loss:{},cav:G.some(id=>hasT(id,'骑将')),brave:G.some(id=>hasT(id,'勇将'))}}
const gName=id=>id?S.gens[id].name:'无名小将';
function share(tr,roles){const tot=sumT(tr)||1;let n=0;for(const[t,v]of Object.entries(tr))if(roles.includes(UNITS[t].role))n+=v;return n/tot}
function dealCas(side,cas){const tot=sumT(side.tr);if(tot<=0)return 0;cas=Math.min(cas,tot);let wsum=0;const w={};for(const[t,n]of Object.entries(side.tr)){w[t]=n*(UNITS[t].role==='ranged'?0.6:1);wsum+=w[t]}
  let dealt=0;for(const[t,n]of Object.entries(side.tr)){const c=Math.min(n,Math.round(cas*w[t]/wsum));side.tr[t]-=c;side.loss[t]=(side.loss[t]||0)+c;dealt+=c}return dealt}
function battle(A,D,o={}){ // A 进攻方 D 防守方
  const nv=!!o.naval;const a=mkSide(A.f,nv?shipTr(A.tr):landTr(A.tr),A.gens,A.morale),d=mkSide(D.f,nv?shipTr(D.tr):landTr(D.tr),D.gens,D.morale);const rep=[];const ev={duel:null,plot:[]};

  rep.push(`${facN(a.f)}${nv?'水':''}军${a.lead?'（主将 '+gName(a.lead)+'）':''} ${fmtN(a.init)} 对阵 ${facN(d.f)}军${d.lead?'（主将 '+gName(d.lead)+'）':''} ${fmtN(d.init)}${o.siege?'，据城而守（城防'+cnNum(wall).replace('元','一')+'级）':''}。`);
  if(o.river)rep.push('大军涉水而进，阵脚未稳。');
  // 单挑
  if(a.champ&&d.champ&&rnd()<0.3+(gs(a.champ)[1]+gs(d.champ)[1]-150)/160){
    const wa=gs(a.champ)[1]+(hasT(a.champ,'勇将')?4:0),wd=gs(d.champ)[1]+(hasT(d.champ,'勇将')?4:0);const sa=wa+R(0,26),sd=wd+R(0,26);const diff=sa-sd;
    const rounds=pick(['二十余合','三十合','五十余合','百合']);let line=`${gName(a.champ)} 与 ${gName(d.champ)} 阵前单挑，大战${rounds}，`;
    if(Math.abs(diff)<6){line+='不分胜负，各自收兵。';}else{const win=diff>0?a:d,lose=diff>0?d:a;const wg=diff>0?a.champ:d.champ,lg=diff>0?d.champ:a.champ;
      lose.morale-=12+Math.abs(diff)/2;win.morale=Math.min(100,win.morale+8);
      if(Math.abs(diff)>16&&rnd()<0.28){line+=`${gName(wg)} 斩 ${gName(lg)} 于马下！`;ev.duel={win:wg,lose:lg,killed:true};lose.gens=lose.gens.filter(x=>x!==lg);}
      else{line+=`${gName(lg)} 力怯败走，${facN(lose.f)}军士气大挫。`;ev.duel={win:wg,lose:lg,killed:false}}}
    rep.push(line);if(!ev.duel)ev.duel={draw:true,a:a.champ,d:d.champ}}
  // 计策
  for(const[s,e]of[[a,d],[d,a]]){if(!s.sage)continue;const z=gs(s.sage)[2];let p=(z-68)/60+(hasT(s.sage,'神算')?0.15:0);if(p<=0||rnd()>p)continue;
    const ez=e.sage?gs(e.sage)[2]:0;if(ez>z-8&&rnd()<(ez-60)/70+(e.sage&&hasT(e.sage,'神算')?0.2:0)){rep.push(`${gName(s.sage)} 欲施奇计，被 ${gName(e.sage)} 识破。`);continue}
    const kind=nv?pick(['借风纵火','诈降火船','连环之计']):o.siege&&s===a?pick(['掘地道','火攻城门','声东击西']):o.siege?pick(['夜袭敌营','火烧粮草']):pick(['火攻','伏兵','夜袭','诱敌深入']);const cas=dealCas(e,sumT(e.tr)*R(0.06,0.11));e.morale-=10;rep.push(`${gName(s.sage)} 献计「${kind}」，${facN(e.f)}军折损 ${fmtN(cas)}，阵脚大乱！`);ev.plot.push(s.sage)}
  // 交战

  const dmg=(s,e,isAtt)=>{let D0=0;for(const[t,n]of Object.entries(s.tr)){const u=UNITS[t];let m=1;if(u.role==='spear')m*=1+0.6*share(e.tr,['cav']);if(u.role==='cav'){m*=1+0.5*share(e.tr,['ranged']);if(s.cav)m*=1.15;if(o.siege&&isAtt)m*=0.6}if(u.role==='ranged'&&o.siege&&!isAtt)m*=1.35;if(nv)m*=navalBonus(s.f);D0+=n/1000*u.atk*m}

  let win;const ra=sumT(a.tr),rd=sumT(d.tr);
  if(routed==='A')win='D';else if(routed==='D')win='A';else if(o.siege)win=(ra*a.morale>rd*d.morale*(1.05+0.1*wall))?'A':'D';else win=(ra*a.morale>=rd*d.morale)?'A':'D';

  else if(win==='A')rep.push(o.siege?`${facN(a.f)}军攻破城池！守军${routed?'溃散':'力竭'}，${o.cityName||''}陷落。`:`${facN(d.f)}军${routed?'溃不成军':'不支败退'}，${facN(a.f)}军乘胜追击，斩获 ${fmtN(pur)}。`);
  else rep.push(o.siege?`${facN(d.f)}军凭城死守，${facN(a.f)}军久攻不下，${routed?'溃败而还':'只得退兵'}。`:`${facN(a.f)}军${routed?'溃败':'攻势受挫'}，${facN(d.f)}军追杀 ${fmtN(pur)}。`);

// 把战斗结果写回（sources: [{kind:'army',id}|{kind:'gar',id}]）
function applyLoss(sources,side){const tot={};sources.forEach(s=>{const tr=s.kind==='army'?S.armies[s.id].troops:S.cities[s.id].gar;for(const[t,n]of Object.entries(tr))tot[t]=(tot[t]||0)+n});
  sources.forEach(s=>{const tr=s.kind==='army'?S.armies[s.id].troops:S.cities[s.id].gar;for(const t of Object.keys(tr)){const l=side.loss[t]||0;if(!l)continue;const cut=Math.round(l*tr[t]/(tot[t]||1));tr[t]=Math.max(0,tr[t]-cut);if(tr[t]<=0)delete tr[t]}})}
function killGen(id,how){const g=S.gens[id];if(!g||g.dead)return;itemsToTreasury(g,g.f);g.dead=true;const f=g.f;const where=g.loc;g.loc=null;

async function attackCity(aids,cid,mode){if(!Array.isArray(aids))aids=[aids];aids=aids.filter(id=>S.armies[id]);if(!aids.length)return null;const a=S.armies[aids[0]];const c=S.cities[cid];const def=c.owner;

  const tr={},gens=[];let mor=0;aids.forEach(id=>{const x=S.armies[id];for(const[t,n]of Object.entries(x.troops))tr[t]=(tr[t]||0)+n;gens.push(...x.gens);mor+=x.morale});mor/=aids.length;
  const D=cityDefenders(cid);const dsrc=[{kind:'gar',id:cid},...armiesAt(cid).filter(x=>!x.siege&&x.f===def).map(x=>({kind:'army',id:x.id}))];

async function attackArmy(srcAids,targetAid,garrisonCity){const t=S.armies[targetAid];if(!t)return null;const f=srcAids.length?S.armies[srcAids[0]].f:S.cities[garrisonCity].owner;

}

function declareWar(a,b){const r=rel(a,b);const was=r.st;r.st='war';r.v=Math.max(-100,r.v-40);r.t=0;if(was==='ally'||was==='truce'){Object.values(S.fac).forEach(f=>{if(f.major&&f.id!==a&&f.id!==b){const k=rel(a,f.id);k.v-=15}});addLog(`${S.fac[a].name}背弃盟约，对${S.fac[b].name}宣战！`)}else addLog(`${S.fac[a].name}对${S.fac[b].name}宣战！`)}

function doGift(a,b,gold){if(S.fac[a].gold<gold)return false;S.fac[a].gold-=gold;const r=rel(a,b);const inc=Math.round(giftP(a,b,gold));r.v=Math.min(100,r.v+inc);return inc}

function commonEnemy(a,b){return Object.values(S.fac).some(f=>f.major&&f.alive&&f.id!==a&&f.id!==b&&rel(a,f.id).st==='war'&&rel(b,f.id).st==='war')}

  const adj=citiesOf(m).some(c=>nb(c.id).some(n=>S.cities[n].owner===a));if(!adj)p-=0.2;return clamp(p,0.02,0.8)}

async function upkeepPhase(){
  // 围城
  for(const a of Object.values(S.armies)){if(!a.siege)continue;const c=S.cities[a.at];if(!c||friendly(a.f,c.owner)||attackStatus(a.f,c.owner)==='no'){a.siege=false;continue}

  // 经济
  for(const f of Object.values(S.fac)){if(!f.alive)continue;const inc=facIncome(f.id);f.gold=Math.max(0,f.gold+inc.g);f.grain+=inc.gr;
    if(f.grain<0){f.grain=0;armiesOf(f.id).forEach(a=>{a.morale=Math.max(10,a.morale-15);for(const t in a.troops)a.troops[t]=Math.floor(a.troops[t]*0.93)});citiesOf(f.id).forEach(c=>{for(const t in c.gar)c.gar[t]=Math.floor(c.gar[t]*0.96);c.mx-=4});if(f.id===S.player)addLog('粮草断绝！士卒逃散，民心不稳。')}}
  loyaltyPhase();
  // 城市
  for(const c of Object.values(S.cities)){
    if(c.build){c.build.left--;if(c.build.left<=0){c.b[c.build.k]++;if(c.owner===S.player)addLog(`${c.name}的${BUILDINGS[c.build.k].name}升至${c.b[c.build.k]}级。`);c.build=null}}
    if(c.pass){c.recruited=0;c.searched=false;continue}
    const L=leaderGen(c.owner);const gv=c.gov&&S.gens[c.gov];let target=58+TAXM[c.tax]+(gv&&gv.loc&&gv.loc.id===c.id?(gs(gv)[4]-50)/5:0)+(L&&hasT(L,'仁德')?8:0)+(sumT(c.gar)>=3000?4:0)-(besiegers(c.id).length?20:0);
    c.mx=clamp(c.mx+(target-c.mx)*0.25,0,100);c.pop=Math.min(90,c.pop*(1+0.004*(c.mx-40)/20+0.0008*c.b.farm));

    if(c.mx<22&&isMajor(c.owner)&&!c.cap&&rnd()<0.15){const old=c.owner;addLog(`${c.name}民变！乱民据城自立。`);for(const t in c.gar)c.gar[t]=Math.floor(c.gar[t]*0.5);c.gar.dao=(c.gar.dao||0)+Math.round(c.pop*60);c.owner='rebel';c.mx=50;gensInCity(c.id,old).forEach(g=>flee(g.id));armiesAt(c.id).filter(a=>a.f===old&&!a.siege).forEach(a=>{const to=nearestOwnCity(old,c.id);if(to)a.at=to;else disbandArmy(a.id)})}}
  // 军团
  for(const a of Object.values(S.armies)){const c=S.cities[a.at];a.morale=Math.min(100,a.morale+(c&&c.owner===a.f?10:3));a.mp=armyMP(a)}
  Object.values(S.gens).forEach(g=>g.moved=false);
  // 外交计时

  // 寿终
  for(const g of Object.values(S.gens)){if(g.dead||g.f==='free'||g.f==='gone'||g.pend||g.captive)continue;if(S.year>g.die+lifeBonus(g)&&rnd()<0.2)killGen(g.id,'病逝')}

}

async function exportSave(){const json=JSON.stringify(S);try{if(typeof CompressionStream!=='undefined'){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const buf=await new Response(cs).arrayBuffer();let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return 'MZ1:'+btoa(bin)}}catch(e){}

  else if(code.startsWith('MZ0:'))json=decodeURIComponent(escape(atob(code.slice(4))));else if(code.startsWith('{'))json=code;else throw new Error('存档码格式不对');
  const s=JSON.parse(json);if(!s||!s.cities)throw new Error('不是三国墨战的存档');if(s.ver!==2)throw new Error('这是旧版（中原篇）的存档，全国篇无法读取');upgradeState(s);S=s;return S}

  for(const f of Object.values(s.fac)){if(!f.items)f.items=[];if(f.title==null)f.title=f.major?1:0;if(f.kingdom==null)f.kingdom=''}
  if(!s.family)s.family=FAMILY.map(w=>({...w,st:'avail',to:null}));
  for(const c of CITIES){const x=s.cities[c.id];if(!x)continue;if(x.portOK==null){x.portOK=!!c.portOK;x.moat=!!c.moat;if(x.b.port==null)x.b.port=c.b.port||0}}
  if(!s.fac.ytan){const F0=FACTIONS.find(f=>f.id==='ytan');s.fac.ytan={id:'ytan',name:F0.name,ch:F0.ch,color:F0.color,major:true,leader:F0.leader,gold:0,grain:0,alive:false,emperor:false,claim:false,region:F0.region,aggr:F0.aggr,bar:false,fixed:false,items:[],title:0}}
  s.flags.ev=s.flags.ev||{}}

function initPeople(s){
  for(const g of Object.values(s.gens)){g.pk=[...g.s];g.exp=[0,0,0,0,0];const at=Math.max(194,g.appear||194);const age=at-g.born;
    if(age<26){const f=Math.min(1,Math.max(0.7,0.7+(age-15)*0.028));g.s=g.pk.map(v=>Math.max(15,Math.round(v*f)))}
    const p=g.pk;const top=[...p].sort((a,b)=>b-a);g.merit=age<20?0:Math.max(0,Math.round((top[0]+top[1]-125)*7));g.rank=0;g.gift=0;g.kin=false}
  // 按功勋授初始官职（不超过杂号将军）
  for(const g of Object.values(s.gens)){if(g.f==='free'||g.role==='lord')continue;let r=0;for(let i=1;i<=5;i++)if(g.merit>=RANKS[i].m)r=i;g.rank=r}
  for(const f of Object.values(s.fac)){f.items=[];const n=Object.values(s.cities).filter(c=>c.owner===f.id).length;f.title=f.major&&n>=3?1:0;f.kingdom=''}
  s.family=FAMILY.map(w=>({...w,st:'avail',to:null}));}
// ---------- 爵位 ----------
function capProv(f){const c=facCap(f);return c?c.prov:'化外'}
function lordTitle(f){const F0=S.fac[f];if(!F0||!F0.major)return '';const t=F0.title||0;if(t===0)return '太守';if(t===1){const p=capProv(f);return p==='化外'?'塞外都护':p+'牧'}const k=F0.kingdom||COUNTRY[capProv(f)]||'汉';return t===4?k+'帝':k+TITLES[t]}
// ---------- 官职 ----------
function rankName(g){if(isLordG(g))return lordTitle(g.f);const r=g.rank||0;if(!r)return '';if(isCivil(g))return RANKS[r].c;if(r===6)return ZHENG[g.zheng||0]+'将军';return RANKS[r].w}
function rankCount(f,r){return gensOf(f).filter(g=>g.rank===r).length}
function promoteCost(g){return ((g.rank||0)+1)*80}
function canPromote(g){if(isLordG(g)||g.f==='free')return false;const n=(g.rank||0)+1;const R0=RANKS[n];if(!R0)return false;if((g.merit||0)<R0.m)return false;if(R0.max&&rankCount(g.f,n)>=R0.max)return false;if(R0.need&&(S.fac[g.f].title||0)<R0.need)return false;return S.fac[g.f].gold>=promoteCost(g)}
function promote(g){if(!canPromote(g))return false;S.fac[g.f].gold-=promoteCost(g);g.rank=(g.rank||0)+1;g.loy=Math.min(100,g.loy+10);
  if(g.rank===6&&!isCivil(g)){const used=gensOf(g.f).filter(x=>x.rank===6&&x.id!==g.id&&!isCivil(x)).map(x=>x.zheng||0);g.zheng=[0,1,2,3].find(i=>!used.includes(i))||0}
  if(g.f===S.player)addLog(`${g.name} 升任${rankName(g)}。`);return true}
function rankCapBonus(g){return g?(isLordG(g)?1500*Math.max(0,(S.fac[g.f].title||0)-1):RANKS[g.rank||0].cap):0}
function salary(f){return gensOf(f).reduce((s,g)=>s+(g.rank||0)*3,0)}
// ---------- 功勋与成长 ----------
function addMerit(id,n){const g=S.gens[id];if(!g||g.dead)return;g.merit=(g.merit||0)+n}
const STAT_N=['统率','武力','智力','政治','魅力'];
function gainExp(id,i,n){const g=S.gens[id];if(!g||g.dead||!g.pk)return;g.exp[i]+=n;while(g.exp[i]>=100){g.exp[i]-=100;const capV=Math.min(100,g.pk[i]+4);if(g.s[i]<capV){g.s[i]++;if(g.f===S.player&&!g.pend)addLog(`${g.name} ${STAT_N[i]}提升至 ${g.s[i]}。`)}}}
function yearlyGrowth(){const mine=[];for(const g of Object.values(S.gens)){if(g.dead||g.pend||!g.pk)continue;const age=S.year-g.born;
  if(age<31){let tot=0;for(let i=0;i<5;i++){const gap=g.pk[i]-g.s[i];if(gap>0&&rnd()<0.9){const d=Math.max(1,Math.round(gap*0.2));g.s[i]+=d;tot+=d}}if(tot>=3&&g.f===S.player&&!g.captive)mine.push(g.name)}
  if(age>=60&&rnd()<0.45)g.s[1]=Math.max(15,g.s[1]-1);if(age>=66&&rnd()<0.3)g.s[0]=Math.max(15,g.s[0]-1)}
  if(mine.length)addLog(`诸将历练成长：${mine.slice(0,8).join('、')}${mine.length>8?'等':''}。`)}
function peopleAfterBattle(res){const win=res.win==='A'?res.a:res.d,lose=res.win==='A'?res.d:res.a;
  for(const s of [res.a,res.d]){const w=s===win;s.gens.forEach((id,k)=>{addMerit(id,w?22:8);gainExp(id,1,w?14:8);if(id===s.lead)gainExp(id,0,w?30:15)})}
  const d=res.ev&&res.ev.duel;if(d&&d.win){addMerit(d.win,d.killed?45:25);gainExp(d.win,1,40);if(d.lose)gainExp(d.lose,1,15)}
  (res.ev&&res.ev.plot||[]).forEach(id=>{addMerit(id,15);gainExp(id,2,35)});
  if(win.lead)gainExp(win.lead,4,10)}
// ---------- 宝物 ----------
function giveItem(f,item,gid){const F0=S.fac[f];const g=S.gens[gid];const i=F0.items.indexOf(item);if(i<0||!g||g.f!==f)return false;F0.items.splice(i,1);g.items.push(item);g.loy=Math.min(100,g.loy+(isLordG(g)?0:20));if(f===S.player)addLog(`赐 ${g.name}【${ITEMS[item].name}】。`);return true}
function takeItem(gid,item){const g=S.gens[gid];const i=g.items.indexOf(item);if(i<0)return false;g.items.splice(i,1);S.fac[g.f].items.push(item);if(!isLordG(g))g.loy=Math.max(0,g.loy-12);return true}
function itemsToTreasury(g,f){if(!g.items.length)return;const F0=S.fac[f];if(F0&&F0.alive){F0.items.push(...g.items);if(f===S.player)addLog(`${g.name} 的宝物收入宝库：${g.items.map(i=>ITEMS[i].name).join('、')}。`)}g.items=[]}
function lifeBonus(g){return g.items.reduce((s,i)=>s+((ITEMS[i]&&ITEMS[i].life)||0),0)}
// ---------- 忠诚 ----------
function loyTarget(g){const F0=S.fac[g.f];const L=leaderGen(g.f);const Lm=L?gs(L)[4]:50;
  let t=52+(Lm-60)*0.45+(g.rank||0)*4+(F0.emperor?4:0)+Math.max(0,(F0.title||0)-1)*3;
  if(g.kin)t+=35;if(hasT(g,'忠义'))t+=25;if(sameClan(g,L))t+=25;if(g.turn)t-=6;if(hasT(g,'枭雄'))t-=10;if(L&&hasT(L,'仁德'))t+=6;
  const nx=RANKS[(g.rank||0)+1];if(nx&&(g.merit||0)>=nx.m*1.4)t-=6;if(F0.unpaid)t-=10;t-=(F0.lostC||0)*3;
  return clamp(t,5,100)}
function loyaltyPhase(){
  for(const F0 of Object.values(S.fac)){if(!F0.alive||!F0.major)continue;const f=F0.id;
    // 俸禄
    const sal=salary(f);F0.unpaid=F0.gold<sal;
    for(const g of gensOf(f)){if(isLordG(g)){g.loy=100;continue}if(g.captive)continue;const t=loyTarget(g);g.loy=clamp(g.loy+(t-g.loy)*0.09+(t<g.loy?-0.4:0.4),0,100)}
    // 太守政绩
    for(const c of citiesOf(f)){const gv=c.gov&&S.gens[c.gov];if(gv&&!gv.dead&&gv.loc&&gv.loc.id===c.id&&gv.f===f){gainExp(gv.id,3,12);addMerit(gv.id,3)}}}
  // 城池得失（去年）
  if(S.season===0)for(const F0 of Object.values(S.fac)){const n=citiesOf(F0.id).length;F0.lostC=Math.max(0,(F0.lastN||n)-n);F0.lastN=n}
}
async function defectionPhase(){
  for(const g of Object.values(S.gens)){if(g.dead||g.pend||g.captive||g.f==='free'||g.kin||isLordG(g))continue;const F0=S.fac[g.f];if(!F0||!F0.major||!F0.alive)continue;
    if(g.loy>=32||rnd()>(32-g.loy)/160)continue;await defect(g)}}
function genCity(g){if(!g.loc)return null;if(g.loc.t==='c')return S.cities[g.loc.id];const a=S.armies[g.loc.id];return a?S.cities[a.at]:null}
function defectTarget(g,c){const cands=[];for(const n of (c?nb(c.id):[])){const o=S.cities[n].owner;if(o===g.f||!isMajor(o)||!S.fac[o].alive)continue;if(rel(g.f,o).st!=='war')continue;const L=leaderGen(o);cands.push({f:o,sc:(L?gs(L)[4]:50)+facPow(o)/10+rnd()*20})}
  cands.sort((a,b)=>b.sc-a.sc);return cands[0]?cands[0].f:null}
async function defect(g,toF,viaBribe){const c=genCity(g);const old=g.f;const to=toF||defectTarget(g,c);
  const withCity=c&&c.owner===old&&c.gov===g.id&&g.loc&&g.loc.t==='c'&&!c.cap&&to&&nb(c.id).some(n=>S.cities[n].owner===to)&&(g.loy<20||viaBribe&&g.loy<30);
  let text;
  if(withCity){const others=gensInCity(c.id,old).filter(x=>x.id!==g.id&&!isLordG(x)&&x.loy<45);armiesAt(c.id).filter(a=>a.f===old&&!a.siege).forEach(a=>{const h=nearestOwnCity(old,c.id);if(h&&h!==c.id)a.at=h;else disbandArmy(a.id)});
    c.owner=to;c.gov=g.id;[g,...others].forEach(x=>{x.f=to;x.loc={t:'c',id:c.id};x.loy=58;x.turn=true});gensInCity(c.id,old).forEach(x=>{const h=nearestOwnCity(old,c.id);if(h&&h!==c.id)x.loc={t:'c',id:h};else freeGen(x,c.id)});
    text=`${g.name} 举${c.name}投降${S.fac[to].name}${others.length?'，'+others.map(x=>x.name).join('、')+'随之':''}！`;
    if(!citiesOf(old).length)eliminate(old)}
  else if(to){removeGenFromArmy(g.id);Object.values(S.cities).forEach(x=>{if(x.gov===g.id)x.gov=null});const h=nearestOwnCity(to,c?c.id:g.home)||(citiesOf(to)[0]||{}).id;if(!h)return;g.f=to;g.loc={t:'c',id:h};g.loy=58;g.turn=true;text=`${g.name} 背弃${S.fac[old].name}，投奔${S.fac[to].name}！`}
  else{removeGenFromArmy(g.id);Object.values(S.cities).forEach(x=>{if(x.gov===g.id)x.gov=null});freeGen(g,c?c.id:g.home);text=`${g.name} 心怀不满，挂印出走。`}
  addLog(text);if(old===S.player||to===S.player)await HOOK.event({title:old===S.player?'部将叛离':'敌将来投',who:g.id,text});return true}
// ---------- 策反 ----------
function bribeCost(g){return Math.round(160+gs(g).reduce((a,b)=>a+b,0)/2)}
function bribeP(f,g){if(isLordG(g)||g.kin)return 0;const L=leaderGen(f),TL=leaderGen(g.f);const Lm=L?gs(L)[4]:50,Tm=TL?gs(TL)[4]:50;
  let p=0.03+(65-g.loy)/85+(Lm-Tm)/250+(hasT(g,'枭雄')?0.08:0)-(hasT(g,'忠义')?0.6:0)-(sameClan(g,TL)?0.4:0)+(L&&hasT(L,'枭雄')?0.05:0);return clamp(p,0,0.85)}
async function doBribe(f,gid){const g=S.gens[gid];const cost=bribeCost(g);if(S.fac[f].gold<cost)return null;S.fac[f].gold-=cost;
  if(rnd()<bribeP(f,g)){await defect(g,f,true);return true}g.loy=Math.min(100,g.loy+5);const r=rel(f,g.f);r.v=Math.max(-100,r.v-8);if(f===S.player||g.f===S.player)addLog(`${S.fac[f].name}策反 ${g.name} 未果。`);return false}
// ---------- 联姻 ----------
function womanAge(w){return S.year-w.born}
function womenOf(f,all){return (S.family||[]).filter(w=>w.f===f&&w.st==='avail'&&womanAge(w)>=15&&(all||!w.res||S.year>=w.res))}
function marryP(a,b){const r=rel(a,b);if(r.st==='war'||a===b)return 0;let p=0.2+r.v/140+(commonEnemy(a,b)?0.15:0)+(facPow(a)>facPow(b)?0.1:-0.05);const L=leaderGen(a);if(L)p+=(gs(L)[4]-70)/200;return clamp(p,0.05,0.9)}
function doMarryAlliance(a,b,wid,force){const w=S.family.find(x=>x.id===wid);if(!w||w.f!==a||w.st!=='avail')return false;
  if(!force&&rnd()>marryP(a,b)){rel(a,b).v-=3;return false}w.st='wed';w.to=b;const r=rel(a,b);r.st='ally';r.v=Math.max(r.v,80);r.kin=S.turn+16;addLog(`${S.fac[a].name}以${w.name}与${S.fac[b].name}联姻，两家结为秦晋之好。`);return true}
function doGrantMarriage(f,wid,gid){const w=S.family.find(x=>x.id===wid);const g=S.gens[gid];if(!w||w.f!==f||w.st!=='avail'||!g||g.f!==f||isLordG(g))return false;w.st='wed';w.to=gid;g.kin=true;g.loy=Math.min(100,g.loy+30);addMerit(gid,20);if(f===S.player)addLog(`以${w.name}许配 ${g.name}，${g.name}感恩戴德。`);return true}
function kinLocked(a,b){const r=rel(a,b);return r.kin&&r.kin>S.turn}

async function titleCheck(){for(const F0 of Object.values(S.fac)){if(!F0.alive||!F0.major)continue;const f=F0.id;const n=citiesOf(f).length;const L=leaderGen(f);if(!L)continue;const t=F0.title||0;
  let nt=t;if(t<1&&n>=3)nt=1;if(t<2&&n>=24&&S.year>=196)nt=2;else if(t===2&&n>=40)nt=3;else if(t===3&&n>=60)nt=4;if(nt===t)continue;
  if(nt===4&&f===S.player){const ch=await HOOK.choice({title:'劝进',who:L.id,text:`群臣上表劝进：「${L.name}功盖寰宇，天命所归，请即皇帝位。」称帝后诸侯皆为敌国。`},['登基称帝','暂不称帝']);if(ch!==0){F0.noEmp=S.turn;continue}}
  if(nt===4&&F0.noEmp&&S.turn-F0.noEmp<8)continue;

  if(nt===1){addLog(`${L.name} 领${tn}。`);continue}

  if(nt===4){Object.values(S.fac).forEach(o=>{if(o.major&&o.alive&&o.id!==f){const r=rel(f,o.id);if(r.st!=='ally'){r.st='war'}r.v-=30}});F0.claim=true}
  const txt=nt===2?`${L.name}受九锡，进爵${tn}，建宗庙社稷，置百官。`:nt===3?`${L.name}进位${tn}，冕十二旒，乘金根车。`:`${L.name}即皇帝位，国号${F0.kingdom}。天下诸侯震动！`;
  addLog(txt);await HOOK.event({title:nt===2?'加九锡':nt===3?'进位称王':'登基称帝',who:L.id,text:txt})}}

function aiPeople(f){const F0=S.fac[f];
  for(const g of gensOf(f).sort((a,b)=>(b.merit||0)-(a.merit||0)))while(canPromote(g)&&F0.gold>600)promote(g);
  const low=gensOf(f).filter(g=>!isLordG(g)&&!g.captive&&g.loy<60).sort((a,b)=>gs(b).reduce((x,y)=>x+y,0)-gs(a).reduce((x,y)=>x+y,0));
  for(const g of low){if(F0.items.length){giveItem(f,F0.items[0],g.id);continue}if(F0.gold>900&&g.loy<45)doReward(g.id)}
  if(low.length&&rnd()<0.2){const w=womenOf(f)[0];if(w&&low[0].loy<40)doGrantMarriage(f,w.id,low[0].id)}}
async function aiBribe(f){const F0=S.fac[f];if(F0.gold<700||rnd()>0.1*(F0.aggr||0.7))return;
  const targets=[];for(const c of citiesOf(f))for(const n of nb(c.id)){const o=S.cities[n].owner;if(!isMajor(o)||o===f||rel(f,o).st!=='war')continue;gensInCity(n,o).forEach(g=>{if(!isLordG(g)&&g.loy<55)targets.push(g)})}
  if(!targets.length)return;targets.sort((a,b)=>bribeP(f,b)-bribeP(f,a));const g=targets[0];if(bribeP(f,g)<0.18||bribeCost(g)>F0.gold-400)return;await doBribe(f,g.id)}

    if(o.id===S.player){S.pendingProps=(S.pendingProps||[]);S.pendingProps.push({type:'marry',from:f,w:ws[0].id});return}if(doMarryAlliance(f,o.id,ws[0].id))return}}

// ================= 三国墨战 · AI =================
function hostileTo(f,other){return other!==f&&attackStatus(f,other)==='ok'}
function isFrontier(f,c){return nb(c.id).some(n=>{const o=S.cities[n].owner;return o!==f&&!friendly(f,o)&&attackStatus(f,o)!=='no'})||besiegers(c.id).some(b=>b.f!==f)}
function threatAt(f,c){let t=0;besiegers(c.id).forEach(b=>{if(b.f!==f)t+=armyPow(b)});nb(c.id).forEach(n=>{armiesAt(n).forEach(a=>{if(a.f!==f&&!friendly(f,a.f)&&isMajor(a.f)&&attackStatus(a.f,f)==='ok')t+=armyPow(a)*0.8})});return t}
function genFree(g){return g.loc&&g.loc.t==='c'&&!g.captive}

async function aiTurn(f){const Fa=S.fac[f];if(!Fa.alive)return;
  if(Fa.major){aiDiplomacy(f);aiPeople(f);aiEconomy(f);await aiMilitary(f);aiSearch(f);await aiBribe(f);aiMarriage(f)}else aiMinor(f);
  await flushCaptives()}

function aiEconomy(f){const Fa=S.fac[f];const cs=citiesOf(f);const up=upkeep(f);const reserve=150+40*cs.length;
  cs.forEach(c=>{if(c.pass)return;if(c.mx<40)c.tax=0;else if(Fa.gold<300&&c.mx>62)c.tax=2;else c.tax=1;
    const here=gensInCity(c.id,f);if(here.length){const best=here.sort((a,b)=>gs(b)[3]-gs(a)[3])[0];if(!c.gov||!S.gens[c.gov]||S.gens[c.gov].loc?.id!==c.id)c.gov=best.id}
    if(c.mx<30&&Fa.grain>600)doRelief(c)});
  // 建设
  cs.slice().sort(()=>rnd()-0.5).forEach(c=>{if(c.pass||c.build)return;const fr=isFrontier(f,c);let k;
    if(fr&&c.portOK&&(c.b.port||0)<2&&nb(c.id).some(n=>isRiver(c.id,n)&&S.cities[n].owner!==f)&&rnd()<0.3)k='port';
    else if(fr){if(c.b.wall<2)k='wall';else if(c.b.barracks<2)k='barracks';else if(c.b.stable<1)k='stable';else if(c.b.wall<3&&c.cap)k='wall';else if(c.b.barracks<3)k='barracks';else k=c.b.market<=c.b.farm?'market':'farm'}
    else{k=c.b.market<=c.b.farm?'market':'farm';if(c.b[k]>=4)k=c.b.barracks<2?'barracks':(c.b.stable<2?'stable':'wall')}
    const lv=c.b[k]||0;if(lv>=5)return;if(Fa.gold-BUILD_COST[lv+1]>reserve)doBuild(c,k)});
  // 募兵
  const yearGr=cs.reduce((s,c)=>s+cityGrain(c,0)*3+cityGrain(c,2),0);const maxT=yearGr/46*1000*0.92;if(facTroops(f)>=maxT||Fa.grain<up.gr*2)return;let room=maxT-facTroops(f);
  cs.slice().sort((a,b)=>threatAt(f,b)-threatAt(f,a)).forEach(c=>{if(c.pass&&sumT(c.gar)>4000)return;const fr=isFrontier(f,c);const target=fr?5000+c.pop*90:2500;let need=target-sumT(c.gar);
    const th=threatAt(f,c);if(th>cityDefPow(c.id)*0.8)need=Math.max(need,4000);
    let guard=6;while(need>0&&recruitCap(c)>0&&guard-->0){const opts=unitsFor(f,c);let t;const sp=opts.filter(t=>UNITS[t].f);
      const cav=opts.filter(t=>t==='qi'||(t==='zq'&&Fa.gold>900));const inf=['dao','qiang','qiang','gong','dao','zb','cq','nu','nu'].filter(t=>opts.includes(t)&&(UNITS[t].cost<=90||Fa.gold>700));
      const r=rnd();const ships=opts.filter(t=>isShipT(t)&&UNITS[t].cost<=Fa.gold/3);const riverFront=c.b.port>0&&nb(c.id).some(n=>isRiver(c.id,n)&&S.cities[n].owner!==f&&attackStatus(f,S.cities[n].owner)==='ok');
      if(ships.length&&riverFront&&r<0.3)t=pick(ships);else if(sp.length&&r<0.35)t=pick(sp);else if(cav.length&&r<0.52)t=pick(cav);else t=pick(inf.length?inf:opts);
      const n=Math.min(1000,need,recruitCap(c),Math.floor(room/100)*100);if(n<100)break;const cost=UNITS[t].cost*n/1000;if(Fa.gold-cost<reserve*0.5)break;if(!doRecruit(c,t,n))break;need-=n;room-=n}})}

async function aiMilitary(f){const Fa=S.fac[f];const ag=Fa.aggr||0.7;const thA=1.2+(1-ag)*0.6,thS=0.9+(1-ag)*0.4;
  // 编组
  const cs=citiesOf(f);const maxArmies=Math.ceil(cs.length/2)+1;
  for(const c of cs){if(armiesOf(f).length>=maxArmies)break;if(!isFrontier(f,c))continue;const tot=sumT(c.gar);if(tot<5500+(1-ag)*2500)continue;
    const gens=gensInCity(c.id,f).filter(genFree).filter(g=>!g.moved);if(!gens.length)continue;
    gens.sort((a,b)=>(gs(b)[0]+gs(b)[1])-(gs(a)[0]+gs(a)[1]));const pickG=[gens[0].id];const sub=gens.slice(1).sort((a,b)=>Math.max(gs(b)[1],gs(b)[2])-Math.max(gs(a)[1],gs(a)[2]));sub.slice(0,gens.length>3?2:1).forEach(g=>pickG.push(g.id));
    if(gens.length===1&&c.cap&&S.fac[f].leader===gens[0].id&&cs.length>1)continue;
    const keep=Math.max(2000,tot*0.3);const frac=(tot-keep)/tot;const tr={};let cap=3000+gs(gens[0])[0]*100+(hasT(gens[0],'统帅')?3000:0);
    for(const[t,n]of Object.entries(c.gar)){const m=Math.floor(n*frac/100)*100;if(m>0)tr[t]=m}let s=sumT(tr);if(s>cap){const k=cap/s;for(const t in tr)tr[t]=Math.floor(tr[t]*k/100)*100}
    if(sumT(tr)>=3000)formArmy(c.id,pickG,tr)}
  // 合并同城闲置军团
  for(const c of cs){const here=armiesAt(c.id).filter(x=>x.f===f&&!x.siege);if(here.length<2)continue;here.sort((x,y)=>armyCap(y)-armyCap(x));const main=here[0];for(const o of here.slice(1)){if(sumT(main.troops)+sumT(o.troops)<=armyCap(main)&&main.gens.length+o.gens.length<=3){for(const[t,n]of Object.entries(o.troops))main.troops[t]=(main.troops[t]||0)+n;o.gens.forEach(g=>{S.gens[g].loc={t:'a',id:main.id};main.gens.push(g)});main.mp=Math.min(main.mp,o.mp);delete S.armies[o.id]}}}
  // 行动
  for(const a of armiesOf(f)){if(!S.armies[a.id])continue;
    if(a.siege){const c=S.cities[a.at];if(!c||friendly(f,c.owner)){a.siege=false;continue}const ratio=armyPow(a)/(cityDefPow(c.id)+0.1);
      const allies=besiegers(c.id).filter(b=>b.f===f).map(b=>b.id);const tot=allies.reduce((s,id)=>s+armyPow(S.armies[id]),0);const r2=tot/(cityDefPow(c.id)+0.1);if(r2>=1.18&&allies[0]===a.id)await attackCity(allies,c.id,'assault');else if(r2<0.45){retreat(a.id)}continue}
    if(a.mp<=0)continue;
    // 本城被围：出击
    const here=besiegers(a.at).filter(b=>b.f!==f&&attackStatus(f,b.f)!=='no');
    if(here.length&&S.cities[a.at].owner===f){const b=here[0];if(armyPow(a)+sidePow(S.cities[a.at].gar,[])*0.5>=armyPow(b)*0.95){await attackArmy([a.id],b.id,a.at);continue}}
    if(sumT(a.troops)<1500&&S.cities[a.at].owner===f){disbandArmy(a.id);continue}
    const opts=[];const my=armyPow(a);
    for(const n of nb(a.at)){const c=S.cities[n];
      if(friendly(f,c.owner)){const bs=besiegers(n).filter(b=>b.f!==f&&attackStatus(f,b.f)==='ok');bs.forEach(b=>{const r=my/(armyPow(b)+0.1);if(r>=0.95)opts.push({kind:'field',id:b.id,score:50+r*10})});continue}
      const st=attackStatus(f,c.owner);if(st!=='ok')continue;
      if(isRiver(a.at,n)&&navalNeed(n)>=500&&(navalBlocked(f,a.troops,n)||navalPow(a.troops,f)<navalPow(cityDefenders(n).tr,c.owner)*0.9))continue;
      const dp=cityDefPow(n);const r=my/(dp+0.1);const val=c.pop+(c.cap?25:0)+(c.pass?15:0)+(S.flags.emperor===n?60:0)+(isMajor(c.owner)?10:0)+(c.owner===S.player?8:0);
      const co=nb(n).flatMap(m=>armiesAt(m)).filter(x=>x.f===f&&x.id!==a.id&&!x.siege&&x.mp>0);const coP=co.reduce((s,x)=>s+armyPow(x),0);const r2=(my+coP)/(dp+0.1);
      if(r>=thA)opts.push({kind:'assault',id:n,score:val+r*8});else if(r2>=thA+0.05&&co.length)opts.push({kind:'joint',id:n,with:co.map(x=>x.id),score:val+r2*6});else if(r>=thS&&!c.pass)opts.push({kind:'siege',id:n,score:val*0.6+r*5})}
    if(opts.length){opts.sort((x,y)=>y.score-x.score);const o=opts[0];
      if(o.kind==='field'){await attackArmy([a.id],o.id,null)}else if(o.kind==='joint'){await attackCity([a.id,...o.with],o.id,'assault')}else await attackCity(a.id,o.id,o.kind);continue}
    // 无目标：向前线/受威胁城市移动
    const cur=S.cities[a.at];let best=null,bs=-1;
    for(const n of nb(a.at)){const c=S.cities[n];if(c.owner!==f)continue;let sc=isFrontier(f,c)?20:0;sc+=threatAt(f,c)/(cityDefPow(n)+1)*20;if(!isFrontier(f,cur)&&sc===0)sc=distFront(f,n)<distFront(f,a.at)?5:0;if(sc>bs){bs=sc;best=n}}
    if(best&&bs>(isFrontier(f,cur)?25:0)){await HOOK.anim(a.id,a.at,best);a.from=a.at;a.at=best;a.mp--}}
}
function distFront(f,id){const seen={[id]:0};let q=[id];let d=0;while(q.length&&d<8){const nq=[];for(const x of q){if(isFrontier(f,S.cities[x]))return d;for(const n of nb(x))if(seen[n]===undefined&&S.cities[n].owner===f){seen[n]=d+1;nq.push(n)}}q=nq;d++}return 9}

function aiDiplomacy(f){const me=facPow(f);const ag=S.fac[f].aggr||0.7;const hasT=citiesOf(f).some(c=>nb(c.id).some(n=>{const o=S.cities[n].owner;return o!==f&&attackStatus(f,o)==='ok'}));
  for(const o of Object.values(S.fac)){if(!o.alive||o.id===f)continue;const r=rel(f,o.id);const adj=citiesOf(f).some(c=>nb(c.id).some(n=>S.cities[n].owner===o.id));
    if(o.major){const them=facPow(o.id);
      if(r.st==='war'&&adj&&me<them*0.65&&rnd()<0.18){if(o.id===S.player){S.pendingProps=(S.pendingProps||[]);S.pendingProps.push({type:'truce',from:f})}else if(rnd()<truceP(f,o.id)*1.2)doTruce(f,o.id,true)}
      else if(r.st==='peace'&&adj&&((me>them*1.7&&r.v<25&&rnd()<0.07*ag)||(!hasT&&me>them*1.05&&rnd()<0.2*ag))&&!(o.id===S.player&&S.turn<3)){declareWar(f,o.id)}
      else if(r.st==='ally'&&adj&&!hasT&&me>them*1.4&&S.turn>8&&rnd()<0.04&&!kinLocked(f,o.id)){declareWar(f,o.id)}
      else if(r.st==='peace'&&r.v>=55&&commonEnemy(f,o.id)&&rnd()<0.12){if(o.id===S.player){S.pendingProps=(S.pendingProps||[]);S.pendingProps.push({type:'ally',from:f})}else doAlly(f,o.id)}
      if(r.st==='ally'&&S.fac[f].gold>1800&&rnd()<0.05)doGift(f,o.id,100)}
    else if(adj&&o.id!=='rebel'&&o.id!=='hw'){const cost=recruitMinorCost(o.id);if(S.fac[f].gold>cost+700&&me>facPow(o.id)*2.2&&rnd()<0.12)doRecruitMinor(f,o.id)}}}

function aiSearch(f){citiesOf(f).forEach(c=>{if(c.searched)return;const g=gensInCity(c.id,f).filter(genFree).sort((a,b)=>(gs(b)[2]+gs(b)[4])-(gs(a)[2]+gs(a)[4]))[0];if(!g)return;
  const has=Object.values(S.gens).some(x=>x.f==='free'&&!x.dead&&x.home===c.id&&x.appear<=S.year&&!x.loc);if(has||rnd()<0.15)doSearch(c.id,g.id)})}

  m.innerHTML=`<div class="mbox ${opts.wide?'wide':''}">${opts.stamp?`<div class="stampbig">${opts.stamp}</div>`:''}<div class="mh">${title}</div><div class="mc">${body}</div><div class="mf">${(buttons||[{label:'知道了',value:true,cls:'red'}]).map((b,i)=>`<button data-mi="${i}" class="${b.cls||''}" ${b.disabled?'disabled':''}>${b.label}</button>`).join('')}</div></div>`;
  m.style.display='flex';const close=v=>{m.style.display='none';m.innerHTML='';UI.modalOpen=false;res(v)};
  m.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{const bt=buttons?buttons[+b.dataset.mi]:{value:true};if(bt.keep){bt.onClick&&bt.onClick(m);return}const v=bt.onClick?bt.onClick(m):bt.value;if(v===false)return;close(v===undefined?bt.value:v)});
  if(opts.onOpen)opts.onOpen(m,close);m.__close=close});modalQ=modalQ.then(run,run);return modalQ}

    for(const c of CITIES){const[x,y]=geo(c.lon,c.lat);const d=Math.hypot(x-wx,y-wy);if(d<bd){bd=d;best=c}}const F0=best&&FACTIONS.find(f=>f.id===best.owner);if(!F0||!F0.major)return;

  x.textAlign='center';x.font=`bold ${Math.max(10,Math.round(W/55))}px ${FONT}`;for(const c of Object.values(S.cities)){if(!c.cap||c.bar)continue;const F0=S.fac[c.owner];x.fillStyle='rgba(243,234,214,.85)';const t=F0.name;const tw=x.measureText(t).width;x.fillRect(c.x*k-tw/2-2,c.y*k+5,tw+4,Math.max(10,W/55)+3);x.fillStyle='#2a2622';x.fillText(t,c.x*k,c.y*k+5+Math.max(10,W/55))}}

  else{const adj=armiesOf(S.player).filter(a=>nb(a.at).includes(c.id)&&!a.siege);const st=attackStatus(S.player,f);

    h+=`<div class="hint">${st==='no'?`与${F0.name}${stName(r.st)}中，不可进攻。`:adj.length?`邻近有我军：${adj.map(a=>`<a data-a="goarmy" data-id="${a.id}" style="color:var(--seal);cursor:pointer;text-decoration:underline">${gName(a.gens[0])}</a>`).join('、')}，选中军团后点此城即可进攻。`:'需先派军团至相邻城池，方可进攻。'}${st==='declare'?`<br>注意：进攻将对${F0.name}宣战。`:''}</div>`}

function stName(st){return {war:'交战',peace:'中立',truce:'停战',ally:'同盟',self:'本军'}[st]||st}
function armyRow(a){const L=S.gens[a.gens[0]];return `<div class="armyrow" data-a="goarmy" data-id="${a.id}">${seal(a.f,22)}<img src="${portrait(L,40)}" style="width:24px;height:30px;border-radius:3px"><div class="grow"><b>${gName(a.gens[0])}</b>军团 <small>${a.gens.length}将</small><br><small>${fmtN(sumT(a.troops))} · 士气 ${Math.round(a.morale)}${a.siege?' · 围城'+a.siegeT+'季':''}${a.f===S.player&&a.mp<=0?' · 已行动':''}</small></div></div>`}

  let h=`<div class="ph">${seal(a.f,34)}<div><h3>${gName(a.gens[0])} 军团</h3><small>${S.fac[a.f].name}军 · ${a.siege?'围攻 '+c.name+'（第'+a.siegeT+'季）':'驻 '+c.name}${mine?(a.mp>0?' · 可行动 '+a.mp:' · 已行动'):''}</small></div><button class="x" data-a="close">×</button></div>

async function onTap(sx,sy,right){if(!S||UI.modalOpen||UI.busy)return;const h=hitTest(sx,sy);const sel=UI.sel;
  const selA=sel&&sel.t==='army'?S.armies[sel.id]:null;
  if(selA&&selA.f===S.player&&!selA.siege){const reach=reachable(selA.id);
    let node=null;if(h&&h.type==='city')node=h.id;if(h&&h.type==='army'){const t=S.armies[h.id];if(t.f!==S.player&&t.siege&&(reach[t.at]||t.at===selA.at)){await fieldPrompt(selA,t);return}if(t.f!==S.player&&!t.siege&&reach[t.at]==='attack')node=t.at}
    if(node&&reach[node]){if(reach[node]==='move'){const from=selA.at;await animArmy(selA.id,from,node,380);moveArmy(selA.id,node);refreshAll();return}
      if(reach[node]==='attack'){await attackPrompt(selA,node);return}if(reach[node]==='field'){const t=besiegers(node).find(b=>b.f!==S.player);if(t)await fieldPrompt(selA,t);return}}
    if(right)return}
  if(!h){UI.sel=null}else if(h.type==='army'){UI.sel=(sel&&sel.t==='army'&&sel.id===h.id)?null:{t:'army',id:h.id}}else{UI.sel=(sel&&sel.t==='city'&&sel.id===h.id)?null:{t:'city',id:h.id}}
  refreshAll();if(!UI.sel&&window.innerWidth<900)$('#side').classList.add('collapsed');
  if(UI.sel&&window.innerWidth<900){$('#side').classList.remove('collapsed');const o=UI.sel.t==='city'?S.cities[UI.sel.id]:S.cities[S.armies[UI.sel.id].at];const[px,py]=w2s(o.x,o.y);if(py>MAP.h*0.45){MAP.cam.y+=(py-MAP.h*0.28)/MAP.cam.z;clampCam();mapDraw()}}}
function winWord(r){return r>=1.3?['必胜','#3f6e4a']:r>=1.12?['大优','#3f6e4a']:r>=1.0?['略优','#6a7a3a']:r>=0.9?['均势','#b8862a']:r>=0.8?['劣势','#a8521f']:['危险','#a8321f']}
async function attackPrompt(a,cid){const c=S.cities[cid];const st=attackStatus(a.f,c.owner);const D=cityDefenders(cid);
  const co=nb(cid).flatMap(n=>armiesAt(n)).filter(x=>x.f===S.player&&x.id!==a.id&&!x.siege&&x.mp>0);
  const calc=(ids)=>{const p=ids.reduce((s,id)=>s+armyPow(S.armies[id]),0);return p/(cityDefPow(cid)+0.1)};
  const body=`<div class="row" style="gap:12px"><div class="grow">${seal(c.owner,22)} <b>${c.name}</b>（${S.fac[c.owner].name}）<br><small>守军 ${fmtN(sumT(D.tr))} · 城墙 ${c.b.wall} 级 · 守将 ${D.gens.map(gName).join('、')||'无'}</small></div></div>
   ${st==='declare'?`<div class="hint">你与${S.fac[c.owner].name}目前${stName(rel(a.f,c.owner).st)}，进攻即宣战，其他诸侯亦会侧目。</div>`:''}
   ${co.length?`<div class="sec">联合出击</div>${co.map(x=>`<label class="lrow"><input type="checkbox" class="co" value="${x.id}" checked> ${gName(x.gens[0])}军团 ${fmtN(sumT(x.troops))}（${S.cities[x.at].name}）</label>`).join('')}`:''}
   ${(()=>{const rv=[a.id,...co.map(x=>x.id)].some(id=>isRiver(S.armies[id].at,cid));const ds=navalNeed(cid);if(!rv||ds<500)return '';const my=sumT(shipTr(a.troops));return `<div class="hint" style="color:var(--seal)">渡江作战：${c.name}守军有战船 ${fmtN(ds)}，须先打赢水战。${my<300?'我军无战船，将为水军所阻！':'我军战船 '+fmtN(my)+'。'}</div>`})()}
   <div class="sec">胜算</div><div id="odds"></div><div class="hint">强攻：一战定胜负，城墙越高越难。围城：大军驻于城下，每季守军减员一成，数季后可能开城投降（围城期间可随时强攻）。</div>`;
  const upd=m=>{const ids=[a.id,...[...m.querySelectorAll('.co:checked')].map(i=>i.value)];const r=calc(ids);const[w,col]=winWord(r);m.querySelector('#odds').innerHTML=`<b style="color:${col};font-size:18px">${w}</b>　<small>我军战力 ${Math.round(ids.reduce((s,id)=>s+armyPow(S.armies[id]),0)*10)} ： 守军 ${Math.round(cityDefPow(cid)*10)}</small>`};
  let ids=[a.id];const pick=m=>{ids=[a.id,...[...m.querySelectorAll('.co:checked')].map(i=>i.value)]};const v=await modal(`进攻 ${c.name}`,body+(typeof MZB!=='undefined'?`<div class="hint">「亲自指挥」进入即时攻城战：冲车撞门、云梯登城，你来调兵遣将。</div>`:''),[...(typeof MZB!=='undefined'?[{label:'亲自指挥',value:'manual',cls:'red',onClick:m=>{pick(m);return 'manual'}}]:[]),{label:'强攻（自动）',value:'assault',cls:typeof MZB!=='undefined'?'':'red',onClick:m=>{pick(m);return 'assault'}},{label:'围城',value:'siege',onClick:m=>{pick(m);return 'siege'}},{label:'取消',value:null}],{onOpen:m=>{upd(m);m.querySelectorAll('.co').forEach(i=>i.onchange=()=>upd(m))}});
  if(!v)return;UI.fightMode=v==='manual'?'manual':'auto';UI.busy=true;await attackCity(ids,cid,v==='manual'?'assault':v);UI.fightMode=null;UI.busy=false;if(S.armies[a.id])UI.sel={t:'army',id:a.id};else UI.sel={t:'city',id:cid};refreshAll();await afterAction()}
async function fieldPrompt(a,t){const r=armyPow(a)/(armyPow(t)+0.1);const[w,col]=winWord(r);
  const v=await modal(`迎击 ${S.fac[t.f].name}军`,`<p>${gName(t.gens[0])} 率 ${fmtN(sumT(t.troops))} 围攻 ${S.cities[t.at].name}，士气 ${Math.round(t.morale)}。</p><p>胜算：<b style="color:${col}">${w}</b></p><p class="hint">野战无城墙之利，胜则解围。</p>`,[...(typeof MZB!=='undefined'?[{label:'亲自指挥',value:2,cls:'red'}]:[]),{label:'出击（自动）',value:1},{label:'取消',value:0}]);
  if(!v)return;UI.fightMode=v===2?'manual':'auto';UI.busy=true;await attackArmy([a.id],t.id,null);UI.fightMode=null;UI.busy=false;refreshAll();await afterAction()}
async function afterAction(){const e=checkEnd();if(e&&!S.over){S.over=e;await endScreen(e)}}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||!S)return;const a=el.dataset.a;const id=el.dataset.id;
  const c=UI.sel&&UI.sel.t==='city'?S.cities[UI.sel.id]:null;const ar=UI.sel&&UI.sel.t==='army'?S.armies[UI.sel.id]:null;
  switch(a){
   case 'close':UI.sel=null;refreshAll();if(window.innerWidth<900)$('#side').classList.add('collapsed');break;
   case 'goto':{const cc=S.cities[id];UI.sel={t:'city',id};mapFocus(cc.x,cc.y);refreshAll();break}
   case 'goarmy':{const x=S.armies[id];if(!x)break;UI.sel={t:'army',id};const cc=S.cities[x.at];mapFocus(cc.x,cc.y);refreshAll();break}
   case 'gen':if(el.closest('#modal')){closeModal();setTimeout(()=>genModal(S.gens[id]),30)}else genModal(S.gens[id]);break;
   case 'tax':c.tax=+el.dataset.v;refreshAll();break;
   case 'bribe':{UI.busy=true;const g=S.gens[id];const r=await doBribe(S.player,id);UI.busy=false;toast(r===null?'金钱不足':r?`${g.name} 已归顺！`:`${g.name} 不为所动`);refreshAll();break}
   case 'build':buildModal(c);break;case 'recruit':recruitModal(c);break;case 'form':formModal(c);break;
   case 'search':searchModal(c);break;
   case 'relief':if(doRelief(c)){toast(`${c.name}开仓放粮，民心 +10`);refreshAll()}break;
   case 'gov':govModal(c);break;
   case 'sally':{const t=besiegers(c.id).find(b=>b.f!==S.player);if(!t)break;const mine=armiesAt(c.id).filter(x=>x.f===S.player&&!x.siege).map(x=>x.id);UI.busy=true;await attackArmy(mine,t.id,c.id);UI.busy=false;refreshAll();await afterAction();break}
   case 'assault':{UI.busy=true;const al=besiegers(ar.at).filter(b=>b.f===S.player).map(b=>b.id);const cid=ar.at;await attackCity(al,cid,'assault');UI.busy=false;UI.sel=S.armies[ar.id]?{t:'army',id:ar.id}:{t:'city',id:cid};refreshAll();await afterAction();break}
   case 'unsiege':retreat(ar.id);toast('大军撤围');refreshAll();break;
   case 'fieldhere':{const t=besiegers(ar.at).find(b=>b.f!==S.player);if(t)await fieldPrompt(ar,t);break}
   case 'take':troopModal(ar,'take');break;case 'drop':troopModal(ar,'drop');break;
   case 'disband':disbandArmy(ar.id);UI.sel={t:'city',id:ar.at};toast('军团解散，兵马归入驻军');refreshAll();break;
  }});

function buildModal(c){const body=()=>`${c.build?`<div class="hint">正在营建 ${BUILDINGS[c.build.k].name}，尚需 ${c.build.left} 季。同一时间只能营建一处。</div>`:''}${Object.entries(BUILDINGS).map(([k,b])=>{const lv=c.b[k]||0;const cost=BUILD_COST[lv+1];return `<div class="lrow"><div class="grow"><b>${b.name}</b> <small>${lv} 级</small><br><small style="color:var(--ink2)">${b.desc}</small></div>${lv>=5?'<small>已满</small>':`<small>金 ${cost} · ${BUILD_TIME[lv+1]}季</small><button class="sm red" data-b="${k}" ${canBuild(c,k)?'':'disabled'}>营建</button>`}</div>`}).join('')}<div style="margin-top:8px;font-size:13px">现有金：${Math.round(S.fac[c.owner].gold)}</div>`;
  modal(`${c.name} · 建设`,body(),[{label:'关闭',value:0}],{onOpen:(m,close)=>{m.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(doBuild(c,b.dataset.b)){toast(`开始营建${BUILDINGS[b.dataset.b].name}`);close(1);refreshAll()}})}})}
function recruitModal(c){const f=c.owner;const opts=unitsSeen(f,c);const amt={};opts.forEach(t=>amt[t]=1000);
  const row=t=>{const u=UNITS[t];const ok=unitAvail(f,c,t);const reqs=Object.entries(u.req).map(([k,v])=>BUILDINGS[k].name+v+'级').join('、');return `<div class="lrow"><span class="chip"><span class="u">${u.ch}</span></span><div class="grow"><b>${uName(t,f)}</b>${u.f?` <small style="color:var(--seal)">${c.loc&&c.loc.includes(t)&&!u.f.includes(f)?'本地':'特色'}</small>`:''}<br><small style="color:var(--ink2)">攻${u.atk} 防${u.def} · 千人 金${u.cost} · 耗粮${u.up}/季${!ok?' · 需'+reqs:''}</small></div>${ok?`<div class="stepper"><button data-s="${t}" data-d="-500">−</button><b id="am_${t}">${amt[t]}</b><button data-s="${t}" data-d="500">+</button></div><button class="sm red" data-r="${t}">募</button>`:''}</div>`};
  const body=`<div style="font-size:13px" id="rinfo"></div>${opts.map(row).join('')}`;
  const info=m=>{m.querySelector('#rinfo').innerHTML=`本季尚可募 <b>${recruitCap(c)}</b> 人　现有金 <b>${Math.round(S.fac[f].gold)}</b>　民心 ${Math.round(c.mx)}（募兵会降低民心与人口）`};
  modal(`${c.name} · 募兵`,body,[{label:'完成',value:0,cls:'red'}],{onOpen:m=>{info(m);
    m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const t=b.dataset.s;amt[t]=clamp(amt[t]+(+b.dataset.d),500,Math.max(500,recruitCap(c)));m.querySelector('#am_'+t).textContent=amt[t]});
    m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const t=b.dataset.r;const n=Math.min(amt[t],recruitCap(c));if(doRecruit(c,t,n)){toast(`募得${uName(t,f)} ${n}`);info(m);refreshAll()}else toast('金钱或募兵额度不足')})}})}
function formModal(c){const f=c.owner;const gens=gensInCity(c.id,f).filter(g=>!g.captive).sort((a,b)=>gs(b)[0]-gs(a)[0]);const tr={};Object.entries(c.gar).forEach(([t,n])=>tr[t]=Math.floor(n*0.7/100)*100);
  let lead=gens[0]?gens[0].id:null;const subs=new Set();
  const cap=()=>{const L=S.gens[lead];return 3000+gs(L)[0]*100+(hasT(L,'统帅')?3000:0)};
  const body=`<div class="sec">主将 <small>决定兵力上限</small></div><select id="lead">${gens.map(g=>`<option value="${g.id}">${g.name}　统${gs(g)[0]} 武${gs(g)[1]} 智${gs(g)[2]}</option>`).join('')}</select>
   <div class="sec">副将 <small>至多两名</small></div><div id="subs">${gens.map(g=>`<label class="lrow" data-g="${g.id}"><input type="checkbox" value="${g.id}"> ${g.name}　<small>武${gs(g)[1]} 智${gs(g)[2]}${g.traits.length?' · '+g.traits.join('、'):''}</small></label>`).join('')}</div>
   <div class="sec">兵马 <small id="fcap"></small></div>${Object.entries(c.gar).map(([t,n])=>`<div class="lrow"><span class="chip"><span class="u">${UNITS[t].ch}</span>${uName(t,f)}</span><small class="grow">驻 ${n}</small><div class="stepper"><button data-t="${t}" data-d="-500">−</button><b id="ft_${t}">${tr[t]}</b><button data-t="${t}" data-d="500">+</button></div></div>`).join('')}`;
  const upd=m=>{const tot=sumT(tr);m.querySelector('#fcap').innerHTML=`${tot} / 上限 ${cap()}${tot>cap()?' <span style="color:var(--seal)">超出上限</span>':''}`;m.querySelectorAll('#subs label').forEach(l=>{l.style.display=l.dataset.g===lead?'none':'flex'})};
  modal(`${c.name} · 编组军团`,body,[{label:'出征',cls:'red',onClick:m=>{const ids=[lead,...[...subs].filter(x=>x!==lead).slice(0,2)];const t2={};for(const[t,n]of Object.entries(tr))if(n>0)t2[t]=n;if(sumT(t2)<500){toast('兵马太少');return false}if(sumT(t2)>cap()){toast('超出主将统兵上限');return false}const a=formArmy(c.id,ids,t2);if(a){a.mp=armyMP(a);UI.sel={t:'army',id:a.id};toast(`${gName(lead)}军团编成`);refreshAll()}return 1}},{label:'取消',value:0}],

     m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t;tr[t]=clamp(tr[t]+(+b.dataset.d),0,c.gar[t]);m.querySelector('#ft_'+t).textContent=tr[t];upd(m)})}})}

  const body=`<div style="font-size:13px" id="tinfo"></div>${Object.entries(src).map(([t,n])=>`<div class="lrow"><span class="chip"><span class="u">${UNITS[t].ch}</span>${uName(t,a.f)}</span><small class="grow">${mode==='take'?'驻军':'军中'} ${n}</small><div class="stepper"><button data-t="${t}" data-d="-500">−</button><b id="tt_${t}">0</b><button data-t="${t}" data-d="500">+</button></div></div>`).join('')||'<p>无可调兵马。</p>'}`;
  const upd=m=>{m.querySelector('#tinfo').innerHTML=mode==='take'?`军团 ${sumT(a.troops)} + ${sumT(tr)} / 上限 ${armyCap(a)}`:`拨回 ${sumT(tr)} 人至 ${c.name}`};

async function saveModal(){const code=await exportSave();
  modal('存档',`<p style="font-size:13px">复制下方存档码保存到备忘录；下次粘贴到「读取」即可继续。也可下载为文件。</p><textarea id="sv_out" readonly>${code}</textarea><div class="row" style="margin:6px 0 12px"><button class="sm" id="sv_copy">复制存档码</button><button class="sm" id="sv_dl">下载存档文件</button></div>
   <div class="sec">读取</div><textarea id="sv_in" placeholder="粘贴存档码"></textarea><div class="row" style="margin-top:6px"><button class="sm red" id="sv_load">读取存档码</button><label class="sm" style="border:1px solid var(--ink2);border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;background:var(--paper3)">打开存档文件<input type="file" id="sv_file" accept=".txt,.mzsave,.json" style="display:none"></label></div>`,
   [{label:'返回标题',value:'title'},{label:'关闭',value:0,cls:'red'}],{onOpen:(m,close)=>{

     const load=async txt=>{try{await importSave(txt);close(0);enterGame(false);toast('读档成功')}catch(e){toast('读档失败：'+e.message)}};

function helpModal(){modal('玩法说明',`<p><b>目标：</b>扫平天下群雄。全国 145 处据点（136 城关 + 9 处化外之地）、十九路诸侯，据点与势力对齐柱子三国 1.9。其余诸侯尽数覆灭即一统天下。</p>
 <p><b>地图：</b>缩小时城池显示为色块，只标治所；放大后显示城名与兵力。右上小地图可点按或拖动跳转。<b>关隘</b>（三角）与<b>隘口</b>城防极高、无法围城，只能强攻。<b>化外之地</b>（穹庐）可招本地胡骑、蛮兵。</p>
 <p><b>回合：</b>每回合一季。你行动后点「结束回合」，诸侯依次行动，随后结算收入、粮草、建设与事件。秋季大收粮。</p>
 <p><b>城池：</b>建设（农田、市集、城墙、兵营、马厩）、募兵、税率、任命太守、搜索人才、赈济。兵营与马厩等级决定可募的精锐兵种。</p>
 <p><b>军团：</b>在城中选主将（统率越高，带兵越多）与副将，编组出征。每季行动一次；全骑兵或主将有良马可行动两次。绿圈行军，红圈进攻。强攻一战定胜负；围城则每季削弱守军，可能迫降。</p>
 <p><b>兵种：</b>通用兵种按地域冠名（河北重步兵、江东枪兵等）；各势力另有特色兵种（青州兵、虎豹骑、陷阵营、大戟士、白马义从、西凉铁骑、藤甲兵、象兵……），占领特定城池还可招募本地兵源。</p>
 <p><b>历史事件：</b>陶谦三让徐州、孙策以玺借兵、傕汜相攻、天子东归、袁术称帝；诸将到了年纪会在本势力登场，在野贤才可搜索延揽。</p>
 <p><b>战斗：</b>兵种相克（枪克骑、骑克弓、弓善守城），主将统率影响全军，勇将可能阵前单挑，智将可能施计。败军之将可能被俘，可劝降、释放或斩首。</p>
 ${typeof MZB!=='undefined'?'<p><b>亲自指挥：</b>凡我军参与的攻城、守城、野战，都可选择「亲自指挥」进入水墨即时会战：兵力按比例化为战场部队，武将各领一部；攻城时有城墙、城门、箭楼、云梯、冲车。战后伤亡、俘获、城池得失写回大地图。战中可「速决」交给众将推演，或「撤退」。标题页「会战演习」可单独练习。</p>':''}
 <p><b>人物：</b>武将立功得功勋，可「封官」（都尉→校尉→中郎将→偏将军→杂号将军→四征将军→大将军；文臣走从事→丞相），官职越高统兵越多、越忠诚，但每季要发俸禄。年轻武将逐年成长，征战、施计、治城亦能历练属性。</p>
 <p><b>忠诚与叛逃：</b>君主魅力、官职、赏赐、宝物、姻亲都会影响忠诚；忠诚低于 30 的武将可能出走、投敌，任太守者甚至举城而降。敌城页面可「策反」敌将。</p>
 <p><b>宝物与女眷：</b>「宝库」存放缴获与搜得的宝物，可赏赐武将（忠诚 +20）；宗室女眷可「赐婚」笼络部将，或与他国「联姻」结盟（十六季内不背盟）。</p>
 <p><b>爵位：</b>据城 24 座受九锡为公，40 座称王，60 座可登基称帝。</p>
 <p><b>水战：</b>临江临海之城可建「水寨」、造走舸 / 蒙冲 / 斗舰 / 楼船。渡江进攻有水军驻守的城池，须先打赢水战；无战船则无法渡江。</p>
 <p><b>粮草：</b>兵马每季耗粮，出征在外耗粮更多。粮尽则士卒逃散。</p>
 <p><b>外交：</b>赠礼增好感；可议和、结盟、宣战；群雄可用金钱招抚。</p>
 <p><b>操作：</b>电脑：左键选择、右键下令、滚轮缩放、拖动平移、回车结束回合、Esc 取消。手机：点选、双指缩放、拖动平移，下方抽屉可上下展开。</p>`,null)}

    mode=await modal(title,body,[{label:'亲自指挥',value:'manual',cls:'red'},{label:'自动结算',value:'auto'}])||'auto'}

HOOK.report=async r=>{const me=S.player;if(r.a.f!==me&&r.d.f!==me){return}const win=(r.win==='A'&&r.a.f===me)||(r.win==='D'&&r.d.f===me);

function loyArrow(g){if(g.f==='free'||isLordG(g)||!S.fac[g.f]||!S.fac[g.f].major)return '';const t=loyTarget(g);return t>g.loy+2?' <span style="color:#3f6e4a">↑</span>':t<g.loy-2?' <span style="color:#a8321f">↓</span>':''}
function itemLine(i){const it=ITEMS[i];return `<b>${it.name}</b> <small>${Object.entries(it.eff).map(([k,v])=>({t:'统',w:'武',z:'智',p:'政',m:'魅'})[k]+'+'+v).join(' ')}${it.mp?' · 机动+1':''}${it.life?' · 延寿':''}${it.desc?' · '+it.desc:''}</small>`}

function genModal(g){const mine=g.f===S.player;const F0=S.fac[g.f];const where=g.loc?(g.loc.t==='a'?(S.armies[g.loc.id]?'军团（'+S.cities[S.armies[g.loc.id].at].name+'）':'军中'):S.cities[g.loc.id].name):(g.captive?'被俘':'在野');
  const rk=rankName(g);const nx=RANKS[(g.rank||0)+1];const lord=isLordG(g);const young=g.pk&&g.pk.some((v,i)=>v>g.s[i]);
  const acts=[];if(mine&&!lord){acts.push(`<button data-g="promote" ${canPromote(g)?'':'disabled'}>封官${nx?' · 金'+promoteCost(g):''}</button>`);acts.push(`<button data-g="reward" ${F0.gold<100?'disabled':''}>赏金 100</button>`);
    acts.push(`<button data-g="item" ${F0.items.length?'':'disabled'}>赐宝物（${F0.items.length}）</button>`);acts.push(`<button data-g="wed" ${womenOf(g.f).length&&!g.kin?'':'disabled'}>赐婚</button>`)}

     <small>${rk?'<b>'+rk+'</b> · ':''}所在：${where}</small><br><small>功勋 ${Math.round(g.merit||0)}${nx&&!lord&&g.f!=='free'?`（晋${isCivil(g)?nx.c:(g.rank===5?'四征将军':nx.w)}需 ${nx.m}${nx.max?'，限 '+nx.max+' 人':''}${nx.need?'，需君主称公':''}）`:''}</small></p>
     <div class="statbars">${statBars(g)}</div>${young?'<div class="hint" style="margin-top:4px">浅色刻度为潜力：年轻武将逐年成长，征战、施计、治城亦可历练提升。</div>':''}</div></div>

   ${g.items.length?`<div class="sec">宝物</div>${g.items.map(i=>`<div class="lrow" style="font-size:13px"><div class="grow">${itemLine(i)}</div>${mine&&!lord?`<button class="sm" data-take="${i}">收回</button>`:''}</div>`).join('')}`:''}

function gensModal(){const list=gensOf(S.player).sort((a,b)=>(isLordG(b)-isLordG(a))||((b.rank||0)-(a.rank||0))||(gs(b).reduce((s,v)=>s+v,0)-gs(a).reduce((s,v)=>s+v,0)));
