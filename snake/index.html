<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    touch-action: none;
  }
  h1 { margin-bottom: 8px; letter-spacing: 2px; }
  #info { margin-bottom: 16px; font-size: 15px; color: #9aa0b0; }
  #info b { color: #7ee787; font-size: 18px; }
  #wrap { position: relative; }
  canvas {
    background: #1b1e26;
    border-radius: 12px;
    display: block;
    max-width: 92vw;
    height: auto;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 17, 21, 0.82);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay .title { font-size: 26px; font-weight: bold; }
  #overlay .sub { font-size: 14px; color: #9aa0b0; line-height: 1.7; }
  button {
    padding: 10px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #7ee787;
    color: #0f1115;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #9af5a3; }
  #hint { margin-top: 16px; font-size: 13px; color: #6b7280; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<div id="info">得分 <b id="score">0</b>　最佳 <b id="best">0</b></div>
<div id="wrap">
  <canvas id="cv" width="480" height="480"></canvas>
  <div id="overlay">
    <div class="title" id="ovTitle">贪吃蛇</div>
    <div class="sub" id="ovSub">方向键 / WASD 控制，手机滑动屏幕<br>空格暂停，吃食物加分加速</div>
    <button id="btnStart">开始游戏</button>
  </div>
</div>
<div id="hint">键盘：方向键 / WASD 移动，空格暂停　·　触屏：滑动改变方向</div>

<script>
(function () {
  var COLS = 24, ROWS = 24, CELL = 20;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');
  var btnStart = document.getElementById('btnStart');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');

  var snake, dir, nextDir, food, score, best, timer, speed, running, paused;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 11, y: 12}, {x: 10, y: 12}, {x: 9, y: 12}];
    dir = {x: 1, y: 0};
    nextDir = null;
    score = 0;
    speed = 160;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    while (true) {
      var f = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
      var hit = false;
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === f.x && snake[i].y === f.y) { hit = true; break; }
      }
      if (!hit) { food = f; return; }
    }
  }

  function step() {
    if (nextDir) {
      // 禁止 180 度掉头
      if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;
      nextDir = null;
    }
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // 撞墙或撞自己
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      // 加速，下限 70ms
      if (speed > 70) {
        speed -= 4;
        clearInterval(timer);
        timer = setInterval(step, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    // 网格微点
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for (var gx = 0; gx < COLS; gx++) {
      for (var gy = 0; gy < ROWS; gy++) {
        ctx.fillRect(gx * CELL + CELL / 2 - 1, gy * CELL + CELL / 2 - 1, 2, 2);
      }
    }
    // 食物
    ctx.fillStyle = '#ff7b72';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    // 蛇身
    for (var i = snake.length - 1; i >= 0; i--) {
      var t = 1 - i / Math.max(snake.length, 10);
      var g = Math.round(120 + 60 * t);
      ctx.fillStyle = i === 0 ? '#9af5a3' : 'rgb(60,' + g + ',90)';
      var pad = i === 0 ? 1 : 2;
      roundRect(snake[i].x * CELL + pad, snake[i].y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
  }

  function gameOver() {
    clearInterval(timer);
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', String(best));
      bestEl.textContent = best;
    }
    ovTitle.textContent = '游戏结束';
    ovSub.innerHTML = '本局得分 <b style="color:#7ee787">' + score + '</b><br>最佳 ' + best;
    btnStart.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    overlay.classList.add('hidden');
    running = true;
    paused = false;
    draw();
    timer = setInterval(step, speed);
  }

  function pause(on) {
    if (!running) return;
    paused = on;
    if (on) {
      clearInterval(timer);
      ovTitle.textContent = '已暂停';
      ovSub.textContent = '按空格或点击按钮继续';
      btnStart.textContent = '继续';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      timer = setInterval(step, speed);
    }
  }

  btnStart.addEventListener('click', function () {
    if (paused) { pause(false); return; }
    start();
  });

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    var map = {
      arrowup: {x: 0, y: -1}, w: {x: 0, y: -1},
      arrowdown: {x: 0, y: 1}, s: {x: 0, y: 1},
      arrowleft: {x: -1, y: 0}, a: {x: -1, y: 0},
      arrowright: {x: 1, y: 0}, d: {x: 1, y: 0}
    };
    if (map[k]) {
      e.preventDefault();
      if (!running && !paused) start();
      nextDir = map[k];
    } else if (k === ' ') {
      e.preventDefault();
      if (!running) start();
      else pause(!paused);
    }
  });

  // 触屏滑动
  var tx = 0, ty = 0;
  document.addEventListener('touchstart', function (e) {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
  }, {passive: false});
  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!tx && !ty) return;
    var dx = e.touches[0].clientX - tx;
    var dy = e.touches[0].clientY - ty;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) nextDir = {x: dx > 0 ? 1 : -1, y: 0};
    else nextDir = {x: 0, y: dy > 0 ? 1 : -1};
    tx = 0; ty = 0;
  }, {passive: false});

  // 初始画面
  reset();
  draw();
})();
</script>
</body>
</html>
