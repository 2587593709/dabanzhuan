:root{--ink:#1d1a16;--paper:#efe6d2;--zhu:#b3261e;--gold:#e0bd68;--jade:#3e6b57;--font:'SGSerif','Kaiti SC','STKaiti','KaiTi','Songti SC','STSong','Noto Serif CJK SC',serif;--paperimg:none;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14100c;overflow:hidden;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#layer-hud,#layer-ui,#layer-dlg{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none}
#layer-hud>*,#layer-ui>*,#layer-dlg>*{pointer-events:auto}
button{font-family:var(--font);cursor:pointer}
.paper{background-color:var(--paper);background-image:var(--paperimg);background-size:256px}
#fader{position:fixed;top:0;right:0;bottom:0;left:0;background:#0d0a08;opacity:0;pointer-events:none;transition:opacity .45s;z-index:50}
#fader.on{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%) translateY(-200%);visibility:hidden;background:rgba(20,14,10,.88);color:#f3e6c8;padding:8px 18px;border:1px solid rgba(224,189,104,.5);border-radius:4px;font-size:15px;transition:transform .35s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
#fps{display:none;position:fixed;right:4px;bottom:2px;font:10px monospace;color:rgba(255,255,255,.35);z-index:70;pointer-events:none}

/* ===== 无双 HUD ===== */
.mhud{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;color:#f3e6c8;font-family:var(--font)}
.mhud *{pointer-events:none}
.mhud button,.mhud .say,.mhud .m-pausebox,.mhud .m-result,.mhud .m-pad .btns *{pointer-events:auto}
.m-top{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 0 calc(10px + var(--sal));display:flex;align-items:flex-start;gap:10px}
.m-hero{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 330px}
.m-seal{width:48px;height:48px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.m-bars{flex:1;min-width:0}
.m-name{font-size:17px;font-weight:bold;text-shadow:0 1px 3px #000;margin-bottom:3px;white-space:nowrap}
.m-adou i{font-style:normal;font-size:12px;margin-left:8px;padding:1px 6px;border-radius:9px;background:rgba(240,220,190,.2);border:1px solid rgba(240,220,190,.45)}
.m-adou i.cry{background:#b3261e;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.55}}
.bar{position:relative;height:13px;background:rgba(10,6,4,.6);border:1px solid rgba(240,220,180,.4);margin-bottom:4px;overflow:hidden;border-radius:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .15s}
.bar em{position:absolute;right:5px;top:-2px;font-size:11px;font-style:normal;color:#fff;text-shadow:0 0 3px #000}
.hp i{background:linear-gradient(#e2664a,#a82a1c)}
.mu{height:9px}.mu i{background:linear-gradient(#f7dc8a,#c18a2a)}.mu em{top:-4px;font-size:10px;opacity:.7}
.mu.full{box-shadow:0 0 10px #f0c060;border-color:#f0d080}.mu.full i{animation:mufull .6s infinite alternate}
@keyframes mufull{to{filter:brightness(1.4)}}
.m-obj{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.m-objt{background:rgba(15,10,6,.62);border:1px solid rgba(224,189,104,.35);padding:4px 14px;font-size:15px;border-radius:3px;text-align:center;max-width:100%}
.m-objt b{color:var(--gold);margin-right:4px}
.m-prog{display:flex;gap:5px;margin-top:5px}
.m-prog i{width:21px;height:21px;border-radius:50%;border:1.5px solid rgba(240,220,180,.55);font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.m-prog i.done{background:var(--zhu);border-color:#f0c0a0;color:#fff}
.m-stat{display:flex;gap:10px;align-items:flex-start;text-align:center}
.m-stat small{display:block;font-size:11px;opacity:.75}.m-stat b{font-size:22px;text-shadow:0 1px 4px #000}
.m-pause{width:38px;height:38px;border-radius:50%;border:1px solid rgba(240,220,180,.5);background:rgba(10,6,4,.55);color:#f3e6c8;font-size:12px}
.m-boss{position:absolute;left:50%;top:calc(86px + var(--sat));transform:translateX(-50%);width:min(460px,70vw);opacity:0;transition:opacity .3s;text-align:center}
.m-boss.show{opacity:1}
.m-boss .bn{font-size:17px;font-weight:bold;text-shadow:0 1px 4px #000;margin-bottom:2px}.m-boss .bn span{font-size:12px;opacity:.8;margin-right:6px;font-weight:normal}
.bb{height:10px}.bb i{background:linear-gradient(#d9573a,#7a1a10)}
.m-combo{position:absolute;right:calc(18px + var(--sar));top:34%;text-align:right;opacity:0;transition:opacity .3s}
.m-combo.show{opacity:1}.m-combo b{display:block;font-size:54px;line-height:1;color:#fff4dc;text-shadow:0 0 8px #b3261e,2px 3px 0 #1d1a16}
.m-combo span{font-size:16px;color:var(--gold);letter-spacing:4px}
.m-combo.pop b{animation:pop .18s}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.m-mini{position:absolute;left:calc(10px + var(--sal));bottom:calc(10px + var(--sab));width:220px;height:80px;border:1px solid rgba(30,20,10,.6);box-shadow:0 2px 6px rgba(0,0,0,.4);opacity:.9}
.banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%) scale(.8);text-align:center;opacity:0;transition:opacity .4s,transform .4s;filter:drop-shadow(0 0 12px rgba(255,240,210,.9)) drop-shadow(0 0 2px #fff)}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner .bt{max-width:86vw;max-height:24vh;width:auto;height:auto;display:block;margin:0 auto}
.bsub{font-size:18px;color:#2a1a10;background:rgba(240,228,200,.85);display:inline-block;padding:3px 14px;margin-top:-6px;border-radius:2px}
.bark{position:absolute;left:50%;bottom:calc(150px + var(--sab));transform:translateX(-50%) translateY(20px);max-width:min(620px,92vw);background:rgba(15,10,6,.8);border-left:4px solid var(--zhu);padding:8px 14px;font-size:16px;opacity:0;transition:all .3s;line-height:1.5}
.bark b{color:var(--gold);margin-right:8px}
.bark.show{opacity:1;transform:translateX(-50%) translateY(0)}
.say{position:absolute;left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);width:min(760px,94vw);min-height:110px;display:none;flex-direction:column;background:rgba(239,230,210,.96);background-image:var(--paperimg);color:var(--ink);border:2px solid #3a2a1c;box-shadow:0 6px 24px rgba(0,0,0,.6),inset 0 0 0 4px rgba(239,230,210,.9),inset 0 0 0 5px rgba(58,42,28,.5);padding:12px 18px 14px;cursor:pointer;z-index:5}
.say .who{font-size:18px;font-weight:bold;color:#5a1a10;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sealmini{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;color:#fff;font-size:16px;border-radius:3px}
.say .txt{font-size:18px;line-height:1.65}
.say.narr .txt{font-size:17px;color:#3a2e22}
.say .tap{position:absolute;right:12px;bottom:6px;font-size:12px;color:#8a2a20;animation:blink .7s infinite alternate}
.m-pad .keys{position:absolute;bottom:calc(8px + var(--sab));left:50%;transform:translateX(-50%);font-size:12px;opacity:.55;white-space:nowrap;text-shadow:0 1px 2px #000}
.joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(240,220,180,.35);background:rgba(0,0,0,.18);opacity:0;transition:opacity .15s}
.joy.on{opacity:1}
.knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(240,220,180,.45);border:2px solid rgba(255,245,220,.7)}
.btns{position:absolute;right:calc(14px + var(--sar));bottom:calc(18px + var(--sab));width:190px;height:170px}
.btns button{position:absolute;border-radius:50%;border:2px solid rgba(255,235,200,.65);color:#fff4e0;font-weight:bold;text-shadow:0 1px 2px #000;touch-action:none}
.b-atk{right:0;bottom:0;width:92px;height:92px;font-size:30px;background:radial-gradient(circle at 40% 35%,#d0503a,#7a1a10)}
.b-dash{right:98px;bottom:4px;width:64px;height:64px;font-size:22px;background:radial-gradient(circle at 40% 35%,#5a6f8a,#233247)}
.b-mu{right:14px;bottom:100px;width:66px;height:66px;font-size:16px;background:radial-gradient(circle at 40% 35%,#6a5a3a,#3a2e1c);opacity:.6}
.b-mu.ready{opacity:1;background:radial-gradient(circle at 40% 35%,#ffe29a,#c0801a);color:#3a1a08;text-shadow:none;box-shadow:0 0 16px #f0c060;animation:mufull .5s infinite alternate}
.btns button.down{transform:scale(.92);filter:brightness(1.3)}
.m-pausebox{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(10,6,4,.6);display:none;align-items:center;justify-content:center}
.m-pausebox.show{display:flex}
.pb{background:var(--paper);background-image:var(--paperimg);color:var(--ink);padding:18px 26px;border:2px solid #3a2a1c;min-width:240px;text-align:center}
.pb h3{margin:0 0 12px;font-size:24px;letter-spacing:8px}
.pb button,.rbtns button{display:block;width:100%;margin:8px 0;padding:10px;font-size:18px;background:#2a1f16;color:#f3e6c8;border:1px solid #6a4a2a}
.pb button:hover,.rbtns button:hover{background:var(--zhu)}
.pk{font-size:12px;opacity:.7;margin-top:8px}
.m-result{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(10,6,4,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s}
.m-result.show{opacity:1}
.rpaper{background:var(--paper);background-image:var(--paperimg);color:var(--ink);padding:14px 26px 18px;border:2px solid #3a2a1c;box-shadow:0 10px 40px rgba(0,0,0,.6);width:min(440px,92vw);text-align:center;position:relative}
.rt canvas{max-width:100%;height:auto}
.rsub{font-size:16px;color:#4a3a2a;margin:-4px 0 10px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0}
.rgrid small{display:block;font-size:12px;color:#7a6a5a}.rgrid b{font-size:24px}
.rgrade{position:absolute;right:-14px;top:-18px;transform:rotate(8deg)}.rgrade canvas{width:76px;height:76px}.rgrade span{display:none}
.mhud.portrait .m-hero{flex-basis:240px}
.mhud.portrait .m-obj{position:absolute;left:0;right:0;top:calc(62px + var(--sat))}
.mhud.portrait .m-boss{top:calc(128px + var(--sat))}
.mhud.portrait .m-mini{width:150px;height:55px;bottom:auto;top:calc(58px + var(--sat));left:auto;right:calc(10px + var(--sar));display:none}
.mhud.portrait .m-objt{font-size:13px}
@media (max-width:700px){.m-name{font-size:15px}.m-stat b{font-size:18px}.m-combo b{font-size:40px}.m-mini{width:150px;height:55px}.say .txt{font-size:16px}.bark{font-size:14px;bottom:calc(200px + var(--sab))}.m-objt{font-size:13px}}
@media (max-height:500px){.m-mini{display:none}.m-boss{top:calc(62px + var(--sat))}.m-prog i{width:17px;height:17px;font-size:9px}.bark{bottom:calc(120px + var(--sab))}.say{min-height:80px;padding:8px 14px}.say .txt{font-size:15px;line-height:1.5}}
/* ===== 赤壁 HUD ===== */
.chud{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;color:#efe4cc;font-family:var(--font)}
.chud button,.chud .m-pausebox,.chud .m-result{pointer-events:auto}
.c-top{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 0 calc(10px + var(--sal));display:flex;gap:14px;align-items:flex-start}
.c-title b{font-size:30px;letter-spacing:6px;color:#f0c8a8;text-shadow:0 0 12px rgba(255,120,40,.5);display:block;line-height:1.1}
.c-time{font-size:14px;opacity:.9;white-space:nowrap}
.c-susp{flex:0 1 220px;margin-top:6px}.c-susp small,.c-score small{font-size:12px;opacity:.75;display:block}
.sb{height:11px}.sb i{background:linear-gradient(#8aa0c0,#35507c)}.sb.hot i{background:linear-gradient(#f08a50,#b3261e);animation:mufull .4s infinite alternate}
.c-score{margin-left:auto;text-align:right;margin-top:2px}.c-score b{font-size:30px;color:#ffb070;text-shadow:0 0 10px rgba(255,100,20,.6)}.c-score em{font-style:normal;opacity:.7;margin-left:3px}
.c-wind{width:90px;height:90px;flex:none}
.c-hint{position:absolute;left:50%;top:calc(96px + var(--sat));transform:translateX(-50%);background:rgba(10,14,20,.75);border:1px solid rgba(224,189,104,.35);padding:6px 16px;font-size:14px;border-radius:3px;opacity:0;transition:opacity .4s;max-width:92vw;text-align:center}
.c-hint.show{opacity:1}
.c-bark{bottom:calc(128px + var(--sab))}
.c-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 calc(8px + var(--sar)) calc(8px + var(--sab)) calc(8px + var(--sal));display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center;background:linear-gradient(transparent,rgba(5,8,12,.75) 40%)}
.c-ships{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.cs{width:58px;height:54px;border:1px solid rgba(120,230,200,.4);background:rgba(20,40,40,.7);color:#dff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px;padding:2px}
.cs i{font-style:normal;font-size:16px;font-weight:bold}.cs span{font-size:10px;opacity:.85;white-space:nowrap}
.cs.sel{border-color:#ffe08a;box-shadow:0 0 10px #ffe08a;background:rgba(80,70,20,.8)}
.cs.sail{background:rgba(30,80,70,.85);border-color:#7fe6c8}
.cs.fire{background:rgba(140,50,10,.85);border-color:#ffb070}
.cs.gone{opacity:.35}
.c-btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.c-btns button{padding:10px 12px;font-size:15px;background:rgba(40,24,16,.9);color:#f3e6c8;border:1px solid #8a5a3a;border-radius:3px;min-width:64px}
.c-btns button:disabled{opacity:.35}
.c-btns button[data-a=fire]{background:rgba(150,40,15,.92);border-color:#f0a070}
.c-btns .c-p{min-width:44px}
.chud.portrait .c-top{flex-wrap:wrap}.chud.portrait .c-susp{flex-basis:130px}.chud.portrait .c-wind{width:70px;height:70px}

// ============ 通用界面：对话框、故事卡 ============
const UI = {
  modal({ title, brush, html = '', buttons = [{ t: '确定', v: true }], skip, cls = '' }) {
    return new Promise(res => {
      const m = el('div', 'modal ' + cls, '', $('#layer-dlg'));
      m.innerHTML = `<div class="mcard">${skip ? `<button class="mskip">${esc(skip)}</button>` : ''}${brush ? '<div class="mt"></div>' : title ? `<h2>${esc(title)}</h2>` : ''}<div class="mbody">${html}</div><div class="mbtns">${buttons.map((b, i) => `<button data-i="${i}" class="${b.cls || ''}">${esc(b.t)}</button>`).join('')}</div></div>`;
      if (brush) m.querySelector('.mt').appendChild(brushTitle(brush, 72, '#3a1a10'));
      const close = v => { AU.play('click'); m.classList.remove('show'); setTimeout(() => m.remove(), 300); res(v); };
      m.querySelectorAll('.mbtns button').forEach(b => b.onclick = () => close(buttons[+b.dataset.i].v));
      if (skip) m.querySelector('.mskip').onclick = () => close('__skip');
      requestAnimationFrame(() => m.classList.add('show')); AU.play('page');
    });
  },
  // 依次展示故事抉择卡，返回合并后的参数
  async story(cards, base = {}) {
    const out = Object.assign({}, base);
    for (const c of cards) {
      const btns = [{ t: c.a[0], v: 'a' }]; if (c.b) btns.push({ t: c.b[0], v: 'b', cls: 'alt' });
      const v = await UI.modal({ brush: c.t, html: `<p>${esc(c.d)}</p>`, buttons: btns, skip: '跳过谋划' });
      if (v === '__skip') { for (const cc of cards.slice(cards.indexOf(c))) Object.assign(out, cc.a[1]); return out; }
      const ch = c[v]; Object.assign(out, ch[1]);
      if (ch[2]) await UI.modal({ brush: c.t, html: `<div class="mres">${esc(ch[2])}</div>`, buttons: [{ t: '继续', v: 1 }] });
    }
    return out;
  },
};

    if (toFac === this.G.player) return false;

  // ---------- 月度结算 ----------
  economy() {
    const G = this.G, harvest = G.month === 8;
    for (const c of Object.values(G.cities)) {

      if (c.trade < c.maxTrade) needs.push(['trade', g.st[3] * (1.25 - c.trade / c.maxTrade)]);
      if (c.wall < 100) needs.push(['wall', g.st[0] * (front ? 1.1 : 0.4) * (1.1 - c.wall / 100)]);
      if (c.loyal < 85) needs.push(['loyal', g.st[4] * (1.3 - c.loyal / 100)]);

  // ---------- AI ----------
  aiTurn(fid) {

      if (this.gensIn(c.name, fid).length === 0) { const donor = CITY_ADJ[c.name].map(n => this.city(n)).find(o => o.owner === fid && this.gensIn(o.name, fid).length > 2); if (donor) { const g = this.gensIn(donor.name, fid).find(g => g.name !== f.ruler); if (g) g.city = c.name; } }

    for (const c of this.citiesOf(fid)) {
      const gs = this.idleIn(c.name, fid).sort((a, b) => (b.st[0] + b.st[1]) - (a.st[0] + a.st[1])); if (!gs.length || c.troops < 5000) continue;
      const army = gs.slice(0, 3), n = Math.round(c.troops * 0.75);

        const v = p * (o.pop / 300000 + 0.5) * (o.owner ? 1 : 1.4) * (o.owner === G.player ? [0.7, 1, 1.2][G.diff] : 1) * (o.owner && this.rel(fid, o.owner) > 30 ? 0.5 : 1);
        if (v > bv) { bv = v; bp = p; best = o; }

      if (best && bp >= thr && nAtk < maxAtk && Math.random() < 0.35 + aggr * 0.6) {

  }

  render(g) {

// ===== main.js =====
// ============ 应用外壳：画布、主循环、场景切换 ============
class App {
  constructor() {
    this.cv = $('#cv'); this.g = this.cv.getContext('2d', { alpha: false });
    this.scene = null; this.musou = new Musou(this); this.last = performance.now(); this.frames = 0; this.fpsT = 0;
    const pap = paperTexture(256, 256, 11); document.documentElement.style.setProperty('--paperimg', `url(${pap.toDataURL()})`);
    this.resize(); addEventListener('resize', () => this.resize());
    if (window.visualViewport) visualViewport.addEventListener('resize', () => this.resize());
    const unlock = () => { AU.init(); };
    addEventListener('pointerdown', unlock); addEventListener('keydown', unlock); addEventListener('touchstart', unlock, { passive: true });
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.scene && this.scene.togglePause && !this.scene.paused && this.scene === this.musou && !this.musou.over) this.musou.togglePause(); });
  }
  resize() {
    this.W = innerWidth; this.H = innerHeight; this.dpr = Math.min(devicePixelRatio || 1, Q.dprCap);
    this.cv.width = Math.round(this.W * this.dpr); this.cv.height = Math.round(this.H * this.dpr);

  }
  toast(t, ms = 2400) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(this._tt); this._tt = setTimeout(() => e.classList.remove('show'), ms); }
  fade(fn) { return new Promise(res => { const f = $('#fader'); f.classList.add('on'); setTimeout(() => { fn && fn(); setTimeout(() => { f.classList.remove('on'); res(); }, 80); }, 460); }); }
  setScene(s) { if (this.scene && this.scene.stop) this.scene.stop(); this.scene = s; }
  startMusou(levelFn, opts = {}, onEnd) {
    this._mArgs = [levelFn, opts, onEnd];
    return this.fade(() => { this.setScene(null); this.scene = this.musou; this.musou.start(levelFn(), opts); });
  }
  restartMusou() { const [a, b, c] = this._mArgs; this.startMusou(a, b, c); }
  endMusou(res) {
    const cb = this._mArgs[2];
    this.fade(() => { this.setScene(null); if (cb) cb(res); else Title.show(); });
  }
  startChibi(opts = {}) {
    this._cArgs = opts; this.chibi = this.chibi || new Chibi(this);
    return this.fade(() => { this.setScene(null); this.scene = this.chibi; this.chibi.start(opts); });
  }
  async chibiWithPrep(opts = {}) {
    const prep = await UI.story(CHIBI_PREP, { chains: 1, trust: 0.06, patrolK: 0.7 });
    return this.startChibi(Object.assign({}, opts, { prep }));
  }
  endChibi(res) { const cb = this._cArgs.onEnd; this.fade(() => { this.setScene(null); if (cb) cb(res); else Title.show(); }); }
  loop(now) {

    if (!window.__manual) this.step(dt, now);

  }
  step(dt, now = performance.now()) {
    if (Q.frame(dt, now)) this.resize();
    const s = this.scene;
    if (s) { if (window.__bot && s === this.musou) __bot(s, dt); if (window.__cbot && s === this.chibi) __cbot(s, dt); s.update(dt); if (!window.__norender) { s.render(this.g); if (s.updateHUD) s.updateHUD(); } }

    this.frames++; this.fpsT += dt; if (this.fpsT > 1) { $('#fps').textContent = Math.round(this.frames / this.fpsT) + ' fps · Q' + Q.level; this.frames = 0; this.fpsT = 0; }
  }
}
const app = new App();
window.__app = app;
window.__tick = (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++) app.step(dt); };
requestAnimationFrame(t => { app.last = t; app.loop(t); });
// 启动
(async function boot() {

})();
